<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clinical Mysteries: Diagnosis Unknown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060f0e; --panel: #0e1e1c; --panel-2: #123330; --line: #1c3a37;
    --teal: #2fd9c4; --teal-dim: #12524a; --text: #eaf5f2; --text-dim: #92b3ae;
    --amber: #f0b649; --amber-dim: #3d2f10; --red: #e2685a; --red-dim: #3a2220;
    --green: #58c98f; --green-dim: #123626;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; min-height: 100%; }
  .masthead { background: #030807; border-bottom: 1px solid var(--line); padding: 14px 20px 14px; padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
  .masthead-inner { max-width: 900px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .masthead-left { display: flex; align-items: center; gap: 12px; }
  .mark { flex-shrink: 0; }
  .wordmark-block { display: flex; flex-direction: column; }
  .wordmark { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 21px; letter-spacing: 0.01em; color: var(--text); line-height: 1.1; }
  .wordmark span { color: var(--teal); }
  .tagline { font-size: 11.5px; color: var(--text-dim); letter-spacing: 0.04em; margin-top: 2px; }
  .org-badge { font-size: 11px; color: var(--teal); letter-spacing: 0.04em; border: 1px solid var(--teal-dim); background: rgba(47,217,196,0.08); padding: 5px 10px; border-radius: 6px; font-weight: 600; }
  .masthead-right { display: flex; align-items: center; gap: 10px; }
  .fs-btn { background: none; border: 1px solid var(--line); color: var(--text-dim); font-family: "Inter", sans-serif; font-size: 11.5px; font-weight: 600; padding: 6px 11px; border-radius: 7px; cursor: pointer; }
  .fs-btn:hover { color: var(--text); border-color: var(--text-dim); }
  .intro-disclaimer { display: flex; align-items: flex-start; gap: 10px; background: var(--amber-dim); border: 1px solid rgba(240,182,73,0.4); border-radius: 10px; padding: 13px 15px; margin-bottom: 22px; font-size: 13px; color: var(--text); line-height: 1.5; }
  .intro-disclaimer .icon { font-size: 16px; flex-shrink: 0; }

  .case-bar { max-width: 900px; margin: 0 auto; padding: 16px 20px 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .case-id { font-size: 12px; color: var(--text-dim); letter-spacing: 0.03em; margin-bottom: 4px; }
  .case-name { font-family: "Space Grotesk", sans-serif; font-size: 26px; font-weight: 600; }
  .case-name .age { color: var(--text-dim); font-weight: 500; font-size: 18px; }
  .case-bar-right { display: flex; align-items: center; gap: 10px; }
  .reset-btn { background: none; border: 1px solid var(--line); color: var(--text-dim); font-family: "Inter", sans-serif; font-size: 12px; font-weight: 600; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
  .reset-btn:hover { color: var(--text); border-color: var(--text-dim); }
  .token-bank { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; }
  .token-count { font-family: "Space Grotesk", sans-serif; font-size: 22px; font-weight: 600; color: var(--teal); min-width: 2ch; text-align: right; }
  .token-label { font-size: 11px; color: var(--text-dim); letter-spacing: 0.03em; }
  .token-dots { display: flex; gap: 3px; margin-left: 4px; flex-wrap: wrap; max-width: 130px; }
  .token-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); transition: background 0.3s ease, transform 0.3s ease; }
  .token-dot.spent { background: #24413d; transform: scale(0.8); }

  .presenting { max-width: 900px; margin: 14px auto 0; padding: 0 20px; }
  .presenting p { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--teal); border-radius: 6px; padding: 14px 16px; font-size: 14.5px; line-height: 1.6; color: var(--text); margin: 0; }

  .tabs { max-width: 900px; margin: 18px auto 0; padding: 0 20px; display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); }
  .tab { background: none; border: none; color: var(--text-dim); font-family: "Inter", sans-serif; font-size: 13.5px; font-weight: 600; padding: 11px 14px; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 6px; transition: color 0.15s ease; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--teal); border-bottom-color: var(--teal); }
  .tab .lock { font-size: 10px; color: var(--amber); background: rgba(240,182,73,0.12); border: 1px solid rgba(240,182,73,0.35); border-radius: 4px; padding: 1px 5px; }
  .tab .paid-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); }
  .tab-diagnosis { color: var(--amber); font-weight: 700; }
  .tab-diagnosis:hover { color: var(--amber); filter: brightness(1.15); }
  .tab-diagnosis.active { color: var(--amber); border-bottom-color: var(--amber); }
  .tab-conditions { padding-left: 18px; border-left: 1px solid var(--line); }

  .panel { max-width: 900px; margin: 0 auto; padding: 20px 20px 60px; }
  .locked-state { background: var(--panel); border: 1px dashed var(--line); border-radius: 10px; padding: 40px 24px; text-align: center; }
  .locked-state .btn { margin-top: 14px; }
  .locked-state p { color: var(--text-dim); font-size: 13.5px; margin: 6px 0 0; }

  .btn { background: var(--teal); color: #04201c; border: none; font-family: "Inter", sans-serif; font-weight: 700; font-size: 13.5px; padding: 10px 18px; border-radius: 7px; cursor: pointer; transition: filter 0.15s ease, transform 0.1s ease; }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { background: #1e2f2d; color: #587570; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--line); font-weight: 600; }
  .btn.ghost:hover { color: var(--text); border-color: var(--text-dim); }
  .btn.amber { background: var(--amber); color: #2b1e05; }
  .btn.big { padding: 14px 26px; font-size: 14.5px; }

  .evidence-grid { display: flex; flex-direction: column; gap: 8px; }
  .evidence-row { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 13px 16px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .evidence-label { color: var(--text-dim); font-weight: 600; font-size: 12px; letter-spacing: 0.02em; margin-bottom: 3px; }
  .evidence-value { font-size: 14.5px; }
  .evidence-toggle { background: var(--panel-2); color: var(--teal); border: 1px solid var(--teal-dim); font-size: 12px; font-weight: 700; padding: 7px 13px; border-radius: 6px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .evidence-toggle:hover { background: var(--teal-dim); }
  .evidence-toggle.added { background: var(--green-dim); color: var(--green); border-color: var(--green); }

  .test-grid { display: flex; flex-direction: column; gap: 8px; }
  .test-row { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 13px 16px; }
  .test-row-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .test-name { font-weight: 600; font-size: 14px; }
  .test-order-btn { background: var(--panel-2); color: var(--teal); border: 1px solid var(--teal-dim); font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .test-order-btn:hover { background: var(--teal-dim); }
  .test-order-btn:disabled { color: #587570; border-color: #1e2f2d; cursor: not-allowed; background: none; }
  .test-result { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line); font-size: 13.5px; line-height: 1.55; color: var(--text); }
  .test-evidence-row { margin-top: 10px; display: flex; justify-content: flex-end; }
  .late-stage-row { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .late-stage-hint { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }

  .dx-banner { background: linear-gradient(135deg, rgba(240,182,73,0.12), rgba(240,182,73,0.02)); border: 1px solid rgba(240,182,73,0.4); border-radius: 10px; padding: 16px 18px; margin-bottom: 18px; }
  .dx-banner-title { font-family: "Space Grotesk", sans-serif; font-size: 18px; font-weight: 700; color: var(--amber); }
  .dx-banner-sub { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
  .dx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .dx-card { background: var(--panel); border: 1.5px solid var(--line); border-radius: 10px; padding: 14px 15px; cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease, opacity 0.15s ease; }
  .dx-card:hover:not(.ruled-out) { border-color: var(--amber); }
  .dx-card.selected { border-color: var(--amber); background: var(--amber-dim); }
  .dx-card.ruled-out { opacity: 0.42; cursor: default; }
  .dx-name { font-weight: 700; font-size: 14px; }
  .dx-card.ruled-out .dx-name { text-decoration: line-through; color: var(--text-dim); }
  .dx-status { font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; margin-top: 5px; }
  .dx-status.ruled { color: var(--red); }
  .dx-status.neutral { color: var(--text-dim); }
  .dx-reasons { margin-top: 6px; font-size: 11.5px; color: var(--text-dim); line-height: 1.5; }
  .diagnosis-footer { margin-top: 20px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .diagnosis-hint { font-size: 12.5px; color: var(--text-dim); }

  .req-checklist { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  .req-title { font-size: 12px; font-weight: 700; color: var(--text-dim); letter-spacing: 0.03em; margin-bottom: 10px; }
  .req-items { display: flex; flex-wrap: wrap; gap: 8px; }
  .req-item { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line); color: var(--text-dim); }
  .req-item.met { border-color: var(--green); color: var(--green); background: var(--green-dim); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(2,6,5,0.72); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px; max-width: 340px; width: 100%; }
  .modal h3 { font-family: "Space Grotesk", sans-serif; font-size: 17px; margin: 0 0 6px; }
  .modal p { font-size: 13.5px; color: var(--text-dim); margin: 0 0 18px; line-height: 1.5; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

  .feedback-panel { border-radius: 12px; padding: 24px; border: 1.5px solid; margin-top: 18px; }
  .feedback-panel.correct { background: var(--green-dim); border-color: var(--green); }
  .feedback-panel.incorrect { background: var(--red-dim); border-color: var(--red); }
  .feedback-verdict { font-family: "Space Grotesk", sans-serif; font-size: 20px; font-weight: 700; }
  .feedback-panel.correct .feedback-verdict { color: var(--green); }
  .feedback-panel.incorrect .feedback-verdict { color: var(--red); }
  .feedback-body { font-size: 14px; line-height: 1.6; margin-top: 10px; }
  .feedback-stats { margin-top: 16px; font-size: 12.5px; color: var(--text-dim); border-top: 1px solid rgba(255,255,255,0.08); padding-top: 12px; }
  .missed-clues { margin-top: 16px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 14px; }
  .missed-clues-title { font-size: 13px; font-weight: 700; color: var(--text); }
  .missed-clues-sub { font-size: 12.5px; color: var(--text-dim); margin-top: 4px; line-height: 1.5; }
  .missed-clues-row { margin-top: 10px; font-size: 13px; line-height: 1.5; }
  .missed-clues-cat { font-weight: 700; color: var(--teal); font-size: 11.5px; letter-spacing: 0.02em; text-transform: uppercase; }
  .missed-clues-items { color: var(--text); margin-top: 2px; }

  .treatment-section { margin-top: 22px; background: var(--panel); border: 1px solid var(--teal-dim); border-radius: 12px; padding: 22px; }
  .treatment-title { font-family: "Space Grotesk", sans-serif; font-size: 18px; font-weight: 700; color: var(--teal); }
  .treatment-sub { font-size: 13px; color: var(--text-dim); margin-top: 5px; line-height: 1.5; }
  .treatment-grid { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .treatment-option { background: var(--panel-2); border: 1.5px solid var(--line); border-radius: 9px; padding: 12px 14px; cursor: pointer; display: flex; align-items: flex-start; gap: 10px; font-size: 13.5px; line-height: 1.5; transition: border-color 0.15s ease; }
  .treatment-option:hover { border-color: var(--teal-dim); }
  .treatment-option.picked { border-color: var(--teal); background: rgba(47,217,196,0.08); }
  .treatment-option.right { border-color: var(--green); background: var(--green-dim); }
  .treatment-option.wrong { border-color: var(--red); background: var(--red-dim); }
  .treatment-checkbox { width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid var(--text-dim); flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; font-size: 11px; }
  .treatment-option.picked .treatment-checkbox { border-color: var(--teal); background: var(--teal); color: #04201c; }
  .treatment-option.right .treatment-checkbox { border-color: var(--green); background: var(--green); color: #04201c; }
  .treatment-option.wrong .treatment-checkbox { border-color: var(--red); background: var(--red); color: #2b0d0a; }
  .treatment-footer { margin-top: 18px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .treatment-msg { font-size: 13px; color: var(--text-dim); }
  .treatment-msg.success { color: var(--green); font-weight: 700; }
  .treatment-next { margin-top: 18px; }

  .complete-screen { text-align: center; padding: 60px 24px; background: var(--panel); border: 1px solid rgba(240,182,73,0.4); border-radius: 14px; }
  .complete-title { font-family: "Space Grotesk", sans-serif; font-size: 26px; font-weight: 700; color: var(--amber); }
  .complete-sub { color: var(--text-dim); margin-top: 10px; font-size: 14px; }

  .cond-grid { display: flex; flex-direction: column; gap: 14px; }
  .cond-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
  .cond-name { font-family: "Space Grotesk", sans-serif; font-size: 17px; font-weight: 700; color: var(--teal); margin-bottom: 10px; }
  .cond-row { margin-top: 10px; }
  .cond-row-label { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 4px; }
  .cond-row-value { font-size: 13.5px; line-height: 1.55; }
  .cond-list { margin: 0; padding-left: 18px; font-size: 13.5px; line-height: 1.6; }

  .intro-wrap { max-width: 760px; margin: 32px auto 60px; padding: 0 20px; }
  .intro-card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 36px 32px; }
  .intro-org { display: inline-block; font-size: 11.5px; color: var(--teal); letter-spacing: 0.06em; font-weight: 700; text-transform: uppercase; border: 1px solid var(--teal-dim); background: rgba(47,217,196,0.08); padding: 5px 12px; border-radius: 20px; margin-bottom: 16px; }
  .intro-title { font-family: "Space Grotesk", sans-serif; font-size: 30px; font-weight: 700; line-height: 1.15; }
  .intro-title span { color: var(--teal); }
  .intro-lede { margin-top: 12px; font-size: 15px; color: var(--text-dim); line-height: 1.6; }
  .intro-section-title { font-family: "Space Grotesk", sans-serif; font-size: 15px; font-weight: 700; color: var(--amber); margin: 26px 0 10px; }
  .intro-list { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.75; color: var(--text); }
  .intro-list li { margin-bottom: 4px; }
  .intro-cta { margin-top: 30px; text-align: center; }

  ::-webkit-scrollbar { height: 6px; }
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-inner">
    <div class="masthead-left">
      <svg class="mark" width="34" height="34" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="17" cy="17" r="12" stroke="#2fd9c4" stroke-width="2.4"/>
        <path d="M9 17 L13 17 L15 11 L18 23 L21 15 L23 17 L26 17" stroke="#2fd9c4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <line x1="26" y1="26" x2="35" y2="35" stroke="#2fd9c4" stroke-width="2.8" stroke-linecap="round"/>
      </svg>
      <div class="wordmark-block">
        <div class="wordmark">CLINICAL <span>MYSTERIES</span></div>
        <div class="tagline">Investigate. Analyze. Solve.</div>
      </div>
    </div>
    <div class="masthead-right">
      <button class="fs-btn" id="fsBtn" title="Toggle fullscreen">⛶ Fullscreen</button>
      <div class="org-badge">THE NURSING TEAM</div>
    </div>
  </div>
</div>

<div id="introScreen"></div>

<div id="gameScreen" style="display:none;">
  <div class="case-bar">
    <div>
      <div class="case-id" id="caseId">CASE 1 OF 8</div>
      <div class="case-name" id="caseName">— <span class="age"></span></div>
    </div>
    <div class="case-bar-right">
      <button class="reset-btn" id="resetBtn">↺ Reset Case</button>
      <div class="token-bank">
        <div>
          <div class="token-count" id="tokenCount">15</div>
          <div class="token-label">TOKENS LEFT</div>
        </div>
        <div class="token-dots" id="tokenDots"></div>
      </div>
    </div>
  </div>

  <div class="presenting"><p id="presentingText"></p></div>

  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">Pay 1 token?</h3>
    <p id="modalBody"></p>
    <div class="modal-actions">
      <button class="btn ghost" id="modalCancel">Cancel</button>
      <button class="btn" id="modalConfirm">Pay 1 Token</button>
    </div>
  </div>
</div>

<script>
const TOTAL_TOKENS = 15;

const diagnoses = [
  { id: 'lupus',    name: 'Systemic Lupus Erythematosus' },
  { id: 'gout',     name: 'Gout' },
  { id: 'raynauds', name: "Raynaud's Phenomenon" },
  { id: 'ra',       name: 'Rheumatoid Arthritis' },
  { id: 'fibro',    name: 'Fibromyalgia' },
  { id: 'sclero',   name: 'Scleroderma (Systemic Sclerosis)' },
  { id: 'itp',      name: 'Immune Thrombocytopenia (ITP)' },
  { id: 'lyme',     name: 'Lyme Disease' },
];
const ALL_OTHERS = (id) => diagnoses.map(d => d.id).filter(x => x !== id);
const DEFAULT_RESULT = "Within normal limits. No additional findings.";

const labsMenu = [
  { key: 'bmp', name: 'BMP (Basic Metabolic Panel)' }, { key: 'cbc', name: 'CBC' },
  { key: 'esr', name: 'ESR' }, { key: 'crp', name: 'CRP' }, { key: 'ana', name: 'ANA' },
  { key: 'antidsdna', name: 'Anti-dsDNA' }, { key: 'antismith', name: 'Anti-Smith' },
  { key: 'rf', name: 'RF (Rheumatoid Factor)' }, { key: 'anticcp', name: 'Anti-CCP' },
  { key: 'uricacid', name: 'Uric Acid' }, { key: 'lymesero', name: 'Lyme Serology' },
  { key: 'complement', name: 'Complement (C3/C4)' }, { key: 'sclabs', name: 'Anti-Scl-70 & Anticentromere' },
];
const diagnosticsMenu = [
  { key: 'jointasp', name: 'Joint Aspiration (Synovial Fluid Analysis)' },
  { key: 'nailfold', name: 'Nailfold Capillaroscopy' }, { key: 'ecg', name: 'ECG' },
  { key: 'csf', name: 'CSF Analysis' }, { key: 'painindex', name: 'Widespread Pain Index / Symptom Severity Scale' },
];
const imagingMenu = [
  { key: 'xray', name: 'X-ray' }, { key: 'us', name: 'Ultrasound' }, { key: 'mri', name: 'MRI' },
  { key: 'ct', name: 'CT' }, { key: 'biopsy', name: 'Kidney Biopsy' }, { key: 'echo', name: 'Echocardiogram' },
];

// ---------- Patients ----------
const PATIENTS = [
{
  id: 'maria', name: 'Maria', age: 29, correctDiagnosis: 'lupus',
  presenting: "Fatigue for several months. Reports joint pain in both hands and knees. Says the pain seems to \"move around.\" Recently developed a red rash across her cheeks after spending a day outside. She has also noticed her urine has become unusually foamy.",
  rationale: "The malar rash, photosensitivity, oral ulcers, polyarthralgia, and renal findings (proteinuria, RBC casts) are classic for SLE — and the family history of lupus adds further weight. The strongly positive ANA, positive anti-dsDNA and anti-Smith (highly specific for SLE), and low complement confirm active lupus — the kidney biopsy sealed it by showing immune-complex glomerulonephritis compatible with lupus nephritis.",
  historyItems: [

    opened: { history:false, exam:false },
    ordered: { labs:{}, diagnostics:{}, imaging:{} },
    evidence: { history:{}, exam:{}, labs:{}, diagnostics:{}, imaging:{} },

    selectedDx: null,

    treatmentChecked: false,
    treatmentSolved: false,
  };
}
let currentIndex = 0;

let appStage = 'intro';

function currentPatient() { return PATIENTS[currentIndex]; }

function evidenceCount(store) { return Object.values(S.evidence[store]).filter(Boolean).length; }

function isDefinitiveEntry(entry) {
  if (!entry) return false;
  const target = diagnoses.length - 1;
  if (entry.twoStage) return !!(entry.late && entry.late.ruleOut && entry.late.ruleOut.length === target);
  return !!(entry.ruleOut && entry.ruleOut.length === target);
}
function hasDefinitiveTest(dataObj) { return Object.values(dataObj).some(isDefinitiveEntry); }

function requirementsFor(p) {
  return {
    history: 2,
    exam: 2,
    labs: 2,
    diagnostics: hasDefinitiveTest(p.diagnostics) ? 1 : 0,
    imaging: hasDefinitiveTest(p.imaging) ? 1 : 0,
  };
}
function requirementsMet() {
  const reqs = requirementsFor(currentPatient());
  return Object.keys(reqs).every(store => evidenceCount(store) >= reqs[store]);
}

function computeDxState() {
  const p = currentPatient();
  const ruledOut = {}; const reasons = {};
  diagnoses.forEach(d => { ruledOut[d.id] = false; reasons[d.id] = []; });

  function applyEntry(entry, label) {
    if (!entry) return;
    if (entry.ruleOut) entry.ruleOut.forEach(id => { ruledOut[id] = true; reasons[id].push(label); });
  }

  p.historyItems.forEach(item => { if (S.evidence.history[item.key]) applyEntry(item, item.label); });
  p.vitalsItems.forEach(item => { if (S.evidence.exam[item.key]) applyEntry(item, item.label); });
  p.examItems.forEach(item => { if (S.evidence.exam[item.key]) applyEntry(item, item.label); });

  [
    { evidence: S.evidence.labs, data: p.labs, menu: labsMenu },
    { evidence: S.evidence.diagnostics, data: p.diagnostics, menu: diagnosticsMenu },
    { evidence: S.evidence.imaging, data: p.imaging, menu: imagingMenu },
  ].forEach(({evidence, data, menu}) => {
    Object.keys(evidence).forEach(key => {
      if (!evidence[key]) return;
      let baseKey = key, isLate = false;
      if (key.endsWith('_late')) { baseKey = key.slice(0, -5); isLate = true; }
      const rawEntry = data[baseKey];
      if (!rawEntry) return;
      const entry = rawEntry.twoStage ? (isLate ? rawEntry.late : rawEntry.early) : rawEntry;
      const menuName = menu.find(m => m.key === baseKey)?.name || baseKey;
      const label = isLate ? menuName + ' (repeat)' : menuName;
      applyEntry(entry, label);
    });
  });

  return { ruledOut, reasons };
}

  const items = document.createElement('div');
  items.className = 'req-items';
  Object.keys(reqs).forEach(store => {
    const need = reqs[store];
    if (need <= 0) return;
    const count = evidenceCount(store);
    const met = count >= need;
    const el = document.createElement('div');
    el.className = 'req-item' + (met ? ' met' : '');
    el.textContent = `${met ? '✓' : ''} ${labelMap[store]}: ${count}/${need}`;
    items.appendChild(el);
  });
  box.appendChild(items);
  return box;
}

  footer.className = 'treatment-footer';
  const msg = document.createElement('div');
  msg.className = 'treatment-msg' + (S.treatmentSolved ? ' success' : '');
  if (S.treatmentSolved) {
    msg.textContent = '✓ All correct selections made.';
  } else if (S.treatmentChecked) {
    const missed = options.filter((o,i) => o.correct && !S.treatmentPicked[i]).length;
    const wrongPicked = options.filter((o,i) => !o.correct && S.treatmentPicked[i]).length;
    msg.textContent = `Not quite — ${missed} correct option(s) still unchecked, ${wrongPicked} incorrect option(s) selected. Adjust and check again.`;
  } else {
    msg.textContent = 'Select your answers, then check your work.';
  }
  footer.appendChild(msg);
  if (!S.treatmentSolved) {
    const checkBtn = document.createElement('button');
    checkBtn.className = 'btn amber';
    checkBtn.textContent = 'Check My Selections';
    checkBtn.onclick = () => {
      S.treatmentChecked = true;
      const allCorrectPicked = options.every((o,i) => !o.correct || S.treatmentPicked[i]);
      const noIncorrectPicked = options.every((o,i) => o.correct || !S.treatmentPicked[i]);
      S.treatmentSolved = allCorrectPicked && noIncorrectPicked;
      renderAll();
    };
    footer.appendChild(checkBtn);
  }
  wrap.appendChild(footer);

  if (S.treatmentSolved) {
    const isLast = currentIndex === PATIENTS.length - 1;
    const nextWrap = document.createElement('div');
    nextWrap.className = 'treatment-next';
    const nextBtn = document.createElement('button');
    nextBtn.className = 'btn amber big';
    nextBtn.textContent = isLast ? 'Finish Case Files' : 'Next Patient →';
    nextBtn.onclick = () => {
      if (isLast) {
        const panel = document.getElementById('panel');
        const done = document.createElement('div');
        done.className = 'complete-screen';
        done.style.marginTop = '18px';
        done.innerHTML = `<div class="complete-title">Case Files Closed</div><div class="complete-sub">All 8 patients diagnosed and treated. Nice work, detective.</div>`;
        panel.appendChild(done);
        nextBtn.disabled = true;
        nextBtn.textContent = 'Case Complete';
      } else {
        currentIndex++; S = newPatientState(); renderAll();
      }
    };
    nextWrap.appendChild(nextBtn);
    wrap.appendChild(nextWrap);
  }

  return wrap;
}

function computeMissedClues(p) {
  const missed = { history: [], exam: [], labs: [], diagnostics: [], imaging: [] };
  const hasEffect = (entry) => entry && (((entry.support||[]).length) || ((entry.ruleOut||[]).length));

  p.historyItems.forEach(item => { if (hasEffect(item) && !S.evidence.history[item.key]) missed.history.push(item.label); });
  p.vitalsItems.concat(p.examItems).forEach(item => { if (hasEffect(item) && !S.evidence.exam[item.key]) missed.exam.push(item.label); });

  [
    { menu: labsMenu, data: p.labs, store: 'labs' },
    { menu: diagnosticsMenu, data: p.diagnostics, store: 'diagnostics' },
    { menu: imagingMenu, data: p.imaging, store: 'imaging' },
  ].forEach(({menu, data, store}) => {
    menu.forEach(item => {
      const entry = data[item.key];
      if (!entry) return;
      if (entry.twoStage) {
        if (hasEffect(entry.late) && !S.evidence[store][item.key + '_late']) missed[store].push(item.name + ' (repeat testing)');
      } else if (hasEffect(entry) && !S.evidence[store][item.key]) {
        missed[store].push(item.name);
      }
    });
  });
  return missed;
}

function renderDiagnosis() {
  const p = currentPatient();
  const panel = document.getElementById('panel');
  panel.innerHTML = '';
  const banner = document.createElement('div');
  banner.className = 'dx-banner';
  banner.innerHTML = `<div class="dx-banner-title">🔍 The Diagnosis</div><div class="dx-banner-sub">Based on everything currently in evidence, what's really going on with this patient?</div>`;
  panel.appendChild(banner);

  if (!S.submitted) panel.appendChild(renderReqChecklist());

  const { ruledOut, reasons } = computeDxState();
  const grid = document.createElement('div');
  grid.className = 'dx-grid';
  diagnoses.forEach(d => {
    const card = document.createElement('div');
    card.className = 'dx-card' + (ruledOut[d.id] ? ' ruled-out' : '') + (S.selectedDx === d.id ? ' selected' : '');
    let statusHTML = ruledOut[d.id]
      ? `<div class="dx-status ruled">RULED OUT</div><div class="dx-reasons">${reasons[d.id].join(', ')}</div>`
      : `<div class="dx-status neutral">Still possible</div>`;
    card.innerHTML = `<div class="dx-name">${d.name}</div>${statusHTML}`;
    if (!ruledOut[d.id] && !S.submitted) card.onclick = () => { S.selectedDx = d.id; renderAll(); };
    grid.appendChild(card);
  });
  panel.appendChild(grid);

  if (S.submitted) {
    const correct = S.selectedDx === p.correctDiagnosis;
    const fb = document.createElement('div');
    fb.className = 'feedback-panel ' + (correct ? 'correct' : 'incorrect');
    fb.innerHTML = `
      <div class="feedback-verdict">${correct ? '🎉 Good job — Correctly Diagnosed!' : 'Not Quite'}</div>
      <div class="feedback-body">${correct ? p.rationale : `You selected <strong>${diagnoses.find(x=>x.id===S.selectedDx).name}</strong>. The correct diagnosis was <strong>${diagnoses.find(x=>x.id===p.correctDiagnosis).name}</strong>. ${p.rationale}`}</div>
      <div class="feedback-stats">Tokens remaining at submission: ${S.tokens} / ${TOTAL_TOKENS}</div>`;
    if (correct) {
      const missed = computeMissedClues(p);
      const labelMap2 = { history: 'Patient History', exam: 'Vitals & Physical Assessment', labs: 'Labs', diagnostics: 'Diagnostics', imaging: 'Imaging' };
      const anyMissed = Object.values(missed).some(arr => arr.length);
      if (anyMissed) {
        const missedBox = document.createElement('div');
        missedBox.className = 'missed-clues';
        missedBox.innerHTML = `<div class="missed-clues-title">You got it right — here's what else was available</div><div class="missed-clues-sub">You didn't need these to reach the correct diagnosis, but each of the following also would have pointed toward or away from it. Worth knowing for next time:</div>`;
        Object.keys(missed).forEach(store => {
          if (!missed[store].length) return;
          const row = document.createElement('div');
          row.className = 'missed-clues-row';
          row.innerHTML = `<div class="missed-clues-cat">${labelMap2[store]}</div><div class="missed-clues-items">${missed[store].join(', ')}</div>`;
          missedBox.appendChild(row);
        });
        fb.appendChild(missedBox);
      }
    }
    panel.appendChild(fb);
    panel.appendChild(renderTreatmentSection(p));
  } else {
    const footer = document.createElement('div');
    footer.className = 'diagnosis-footer';
    footer.innerHTML = `<div class="diagnosis-hint">Select the diagnosis best supported by what's currently in evidence.</div>`;
    const btn = document.createElement('button');
    btn.className = 'btn amber';
    btn.textContent = 'Submit Diagnosis';
    btn.disabled = !S.selectedDx || !requirementsMet();
    btn.onclick = () => { S.submitted = true; renderAll(); };
    footer.appendChild(btn);
    panel.appendChild(footer);
  }
}

function renderConditions() {
  const panel = document.getElementById('panel');
  panel.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'cond-grid';
  CONDITIONS.forEach(c => {
    const card = document.createElement('div');
    card.className = 'cond-card';
    card.innerHTML = `
      <div class="cond-name">${c.name}</div>
      <div class="cond-row"><div class="cond-row-label">Pathophysiology</div><div class="cond-row-value">${c.path}</div></div>
      <div class="cond-row"><div class="cond-row-label">Risk Factors</div><ul class="cond-list">${c.risk.map(r=>`<li>${r}</li>`).join('')}</ul></div>
      <div class="cond-row"><div class="cond-row-label">Typical Presentation</div><ul class="cond-list">${c.presentation.map(r=>`<li>${r}</li>`).join('')}</ul></div>
      <div class="cond-row"><div class="cond-row-label">Vital Signs</div><div class="cond-row-value">${c.vitals}</div></div>
      <div class="cond-row"><div class="cond-row-label">Labs to Order &amp; Typical Results</div><ul class="cond-list">${c.labs.map(r=>`<li>${r}</li>`).join('')}</ul></div>
      <div class="cond-row"><div class="cond-row-label">Diagnostics &amp; Imaging to Order</div><ul class="cond-list">${c.diag.map(r=>`<li>${r}</li>`).join('')}</ul></div>
    `;
    grid.appendChild(card);
  });
  panel.appendChild(grid);
}

function renderPanel() {
  const p = currentPatient();
  const t = tabDefsFor(p).find(x => x.id === S.activeTab);
  if (t.kind === 'gate') renderGate(t);
  else if (t.kind === 'menu') renderMenu(t);
  else if (t.kind === 'diagnosis') renderDiagnosis();
  else if (t.kind === 'conditions') renderConditions();
}

function renderAll() {
  if (appStage === 'intro') { renderIntro(); return; }
  document.getElementById('introScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';
  renderHeader();
  renderTokenBank();
  renderTabs();
  renderPanel();
}

  const intro = document.getElementById('introScreen');
  intro.style.display = 'block';

    <div class="intro-wrap">

        <div class="intro-disclaimer"><span class="icon">🖥️</span><span><strong>Best viewed on a computer or tablet.</strong> This activity is designed for a larger screen — it will be hard to use on a small mobile phone display. Use "Begin Investigation" below to also enter fullscreen mode for the best experience.</span></div>
        <div class="intro-lede">Eight patients have come to the practice, each with a set of possible diagnoses that could explain what's happening to them. Your job: investigate, gather evidence, and land on the right diagnosis — for real, like a nurse actually would.</div>

        <div class="intro-section-title">How It Works</div>
        <ul class="intro-list">
          <li>You'll work through 8 patients, one at a time. Each patient gives you <strong>15 tokens</strong> to spend on their case.</li>
          <li><strong>Patient History</strong> and <strong>Vitals &amp; Physical Assessment</strong> each cost 1 token to unlock — once unlocked, you can review everything in that tab for free.</li>
          <li><strong>Labs, Diagnostics,</strong> and <strong>Imaging</strong> are free to open, but each individual test you order costs 1 token.</li>

        <ul class="intro-list">
          <li>Stuck on a condition? The <strong>📖 Conditions</strong> tab is a free reference covering pathophysiology, risk factors, presentation, and what to order for all 8 possible diagnoses — available anytime.</li>

          <button class="btn amber big" id="beginBtn">Begin Investigation →</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('beginBtn').onclick = () => { requestFullscreenSafely(); appStage = 'game'; renderAll(); };
}

function requestFullscreenSafely() {
  try {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (req) { req.call(el).catch(() => {}); }
  } catch (e) { /* fullscreen not available in this context — ignore */ }
}
function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) requestFullscreenSafely();
    else (document.exitFullscreen || (()=>{})).call(document);
  } catch (e) { /* ignore */ }
}
document.getElementById('fsBtn').onclick = toggleFullscreen;

function openModal(title, body, onConfirm) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').textContent = body;
  pendingAction = onConfirm;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); pendingAction = null; }
document.getElementById('modalCancel').onclick = closeModal;
document.getElementById('modalConfirm').onclick = () => { if (pendingAction) pendingAction(); closeModal(); };
document.getElementById('modalOverlay').addEventListener('click', (e) => { if (e.target.id === 'modalOverlay') closeModal(); });

document.getElementById('resetBtn').onclick = () => openModal(
  'Reset this case?',
  'This clears all purchased data, evidence, and your selected diagnosis for the current patient, and restores your 15 tokens.',
  () => { S = newPatientState(); renderAll(); }
);

renderAll();
</script>
