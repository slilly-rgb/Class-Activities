<style>
/* Layout: patient banner across the top, NCJMM stage rail, then chart (left) beside the active item (right); scoreboard docked at the bottom. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fb; --ink:#18202e; --muted:#5a6476; --line:#d7dde6;
  --accent:#b8314b; --accent-soft:#f8e3e8; --ok:#1d7349; --ok-soft:#e1f2e8; --bad:#b03a2e; --bad-soft:#f9e4e1;
  --warn:#9a5b00; --warn-soft:#fbefd9; --sel:#1f4f8f; --sel-soft:#e2ecf8; --grid:#f2c7cf;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141c; --surface:#171d28; --surface-2:#1d2431; --ink:#e7ebf2; --muted:#9aa4b6; --line:#2c3545;
  --accent:#ef6d86; --accent-soft:#3a1f28; --ok:#5ccb92; --ok-soft:#173226; --bad:#f08273; --bad-soft:#3a1f1c;
  --warn:#e8b45a; --warn-soft:#352812; --sel:#8db8f2; --sel-soft:#1d2d45; --grid:#4a2730; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141c; --surface:#171d28; --surface-2:#1d2431; --ink:#e7ebf2; --muted:#9aa4b6; --line:#2c3545;
  --accent:#ef6d86; --accent-soft:#3a1f28; --ok:#5ccb92; --ok-soft:#173226; --bad:#f08273; --bad-soft:#3a1f1c;
  --warn:#e8b45a; --warn-soft:#352812; --sel:#8db8f2; --sel-soft:#1d2d45; --grid:#4a2730; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sel);outline-offset:2px}

/* patient band */
.band{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:grid;grid-template-columns:auto 1fr auto;gap:8px 20px;align-items:center;padding:12px 16px}
.casename{font-family:var(--display);font-size:15px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:700}
.casename b{display:block;font-size:30px;letter-spacing:.02em;text-transform:none;color:var(--ink)}
.pt{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:15px;color:var(--muted);min-width:0}
.pt strong{color:var(--ink);font-family:var(--mono);font-size:15px}
.allergy{background:var(--accent);color:#fff;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:6px;white-space:nowrap}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--sel-soft);border-color:var(--sel);color:var(--sel);font-weight:700}

/* stage rail */
.rail{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.step .n{font-family:var(--display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.step .l{font-weight:700;font-size:15px;line-height:1.2}
.step .s{font-family:var(--mono);font-size:12px;color:var(--muted)}
.step[aria-current="step"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.step.done .s{color:var(--ok)}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .new{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
.chartbody{padding:14px 16px;max-height:68vh;overflow:auto}
.note{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin-bottom:16px}
.note.fresh{border-left-color:var(--accent)}
.note .when{font-family:var(--mono);font-size:13px;color:var(--muted)}
.note h3{font-size:19px;margin:2px 0 4px}
.note p{margin:0 0 6px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
th{font-family:var(--display);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.H{color:var(--bad);font-weight:700}.L{color:var(--sel);font-weight:700}
.flag{font-size:11px;margin-left:4px}
.ref{color:var(--muted);font-size:13px}
.orders li{margin-bottom:6px}
.empty{color:var(--muted);font-style:italic}

.item{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.ihead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.ihead h2{font-size:30px}
.tag{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:14px;color:var(--accent);font-weight:700}
.itype{font-family:var(--mono);font-size:13px;color:var(--muted)}
.prompt{font-size:19px;font-weight:700;margin:0;max-width:62ch}
.scenario{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:14px 16px;line-height:1.9}
.hl{border-radius:4px;padding:1px 3px;cursor:pointer;border-bottom:2px dotted var(--muted)}
.hl:hover{background:var(--sel-soft)}
.hl.on{background:var(--sel-soft);border-bottom:2px solid var(--sel);color:var(--sel);font-weight:700}
.hl.right{background:var(--ok-soft);color:var(--ok);border-bottom-color:var(--ok)}
.hl.wrong{background:var(--bad-soft);color:var(--bad);border-bottom-color:var(--bad);text-decoration:line-through}
.hl.missed{outline:2px dashed var(--ok);outline-offset:1px}

.matrix th:not(:first-child),.matrix td:not(:first-child){text-align:center;width:130px}
.matrix td:first-child{white-space:normal;min-width:220px}
.cell{width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);background:var(--surface);display:inline-grid;place-items:center}
.cell.on{border-color:var(--sel);background:var(--sel)}
.cell.on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--surface)}
tr.right td:first-child{color:var(--ok)} tr.wrong td:first-child{color:var(--bad)}
tr.right .cell.on{background:var(--ok);border-color:var(--ok)} tr.wrong .cell.on{background:var(--bad);border-color:var(--bad)}
.cell.key{box-shadow:0 0 0 3px var(--ok-soft),0 0 0 5px var(--ok)}

.cloze{font-size:19px;line-height:2.4;max-width:62ch}
.cloze select{font:inherit;font-size:16px;padding:4px 6px;border-radius:6px;border:2px solid var(--sel);background:var(--sel-soft);color:var(--ink);max-width:100%}
.cloze select.right{border-color:var(--ok);background:var(--ok-soft)} .cloze select.wrong{border-color:var(--bad);background:var(--bad-soft)}

.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--surface-2);border:2px solid var(--line);border-radius:8px;padding:10px 12px}
.opt .box{width:26px;height:26px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.on{border-color:var(--sel);background:var(--sel-soft)} .opt.on .box{background:var(--sel);border-color:var(--sel);color:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.first{font-size:12px;font-family:var(--display);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;white-space:nowrap}
.first.on{background:var(--accent);border-color:var(--accent);color:#fff}

.bowtie{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:center}
.bt-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.bt-col h3{font-size:16px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.bt-col.mid{border:2px solid var(--accent);border-radius:12px;padding:10px;background:var(--accent-soft)}
.tok{border:2px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;text-align:left;font-size:15px}
.tok.on{border-color:var(--sel);background:var(--sel-soft);font-weight:700}
.tok.right{border-color:var(--ok);background:var(--ok-soft)} .tok.wrong{border-color:var(--bad);background:var(--bad-soft)} .tok.missed{border-style:dashed;border-color:var(--ok)}

.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:8px;padding:10px 18px;font-weight:700;background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.score{font-family:var(--display);font-size:24px;font-weight:700}
.score small{font-size:15px;color:var(--muted);font-family:var(--body);font-weight:400}

.rat{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.rat h3{font-size:20px}
.rat ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:72ch}
.rat li b.ok{color:var(--ok)} .rat li b.no{color:var(--bad)}
.fac{background:var(--warn-soft);border:1px solid var(--warn);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fac h3{font-size:17px;color:var(--warn);text-transform:uppercase;letter-spacing:.08em}
.fac ul{margin:0;padding-left:20px}

/* scoreboard */
.board{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.board .in{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;overflow-x:auto}
.board .lbl{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-size:14px;white-space:nowrap}
.team{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 10px;white-space:nowrap}
.team input{width:76px;border:0;background:transparent;font:inherit;font-weight:700;color:var(--ink)}
.team .pts{font-family:var(--mono);font-weight:600;min-width:2.2ch;text-align:right;font-variant-numeric:tabular-nums}
.team button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:30px;height:30px;font-weight:700}
.board .max{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}

@media (max-width:1000px){.main{grid-template-columns:1fr}.rail{grid-template-columns:repeat(4,1fr)}.band{grid-template-columns:1fr}.tools{justify-content:flex-start}.chartbody{max-height:none}.bowtie{grid-template-columns:1fr}}
@media (max-width:520px){.rail{grid-template-columns:repeat(2,1fr)}.ihead h2{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- state ---------- */
const S = {stage:1, tab:"notes", fac:false, resp:{}, checked:{}, teams:[["Team 1",0],["Team 2",0],["Team 3",0],["Team 4",0],["Team 5",0]]};
try{const saved=JSON.parse(localStorage.getItem("ats-board")||"null"); if(saved&&Array.isArray(saved)) S.teams=saved;}catch(e){}
function saveBoard(){try{localStorage.setItem("ats-board",JSON.stringify(S.teams))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function stageOf(id){return STAGES.find(x=>x.id===id)}
function maxFor(id){const it=ITEMS[id];
  if(id===1) return it.text.filter(x=>x[2]===1).length;
  if(it.rows) return it.rows.length;
  if(it.blanks) return it.blanks.length;
  if(id===5) return it.need+1;
  if(id===7) return 5;}
function scoreFor(id){const it=ITEMS[id], r=S.resp[id]||{};
  if(id===1){let s=0; for(const x of it.text){ if(x[1] && r[x[1]]) s+= x[2]?1:-1;} return Math.max(0,s);}
  if(it.rows){return it.rows.reduce((a,row,i)=>a+(r[i]===row[1]?1:0),0);}
  if(it.blanks){return it.blanks.reduce((a,b,i)=>a+(Number(r[i])===b.a?1:0),0);}
  if(id===5){const sel=r.sel||[]; let s=sel.filter(i=>it.opts[i][1]===1).length; if(r.first===it.first) s+=1; return s;}
  if(id===7){let s=0; ["cond","act","mon"].forEach(k=>{const sel=r[k]||[]; sel.forEach(i=>{if(it[k].a.includes(i)) s++;});}); return s;}
}

/* ---------- render: rail ---------- */
function renderRail(){
  $("#rail").innerHTML = STAGES.map(st=>{
    const done=S.checked[st.id];
    const meta = done ? `${scoreFor(st.id)} / ${maxFor(st.id)} pts` : (st.id===7?"Optional":st.time);
    return `<button class="step${done?" done":""}" data-stage="${st.id}" ${S.stage===st.id?'aria-current="step"':""}>
      <span class="n">${st.id===7?"Stretch":"Stage "+st.id}</span><span class="l">${esc(st.step)}</span><span class="s">${meta}</span></button>`;
  }).join("");
}
/* ---------- render: chart ---------- */
const TABS=[["notes","Notes"],["vitals","Vital signs"],["labs","Labs"],["orders","Orders"]];
function visibleStage(){return S.stage===7?6:S.stage}
function hasNew(tab){const v=visibleStage();
  if(tab==="notes") return NOTES.some(n=>n.s===v);
  if(tab==="vitals") return VITALS.some(n=>n.s===v);
  if(tab==="labs") return LABS.some(n=>n.s===v);
  if(tab==="orders") return ORDERS.some(n=>n.s===v);}
function renderTabs(){
  $("#tabs").innerHTML = TABS.map(([k,l])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}${hasNew(k)&&S.stage!==7?'<span class="new" aria-label="new data"></span>':""}</button>`).join("");
}
function flagLab(key,val){const d=LAB_DEF[key]; if(d.hi!=null&&val>d.hi) return "H"; if(d.lo!=null&&val<d.lo) return "L"; return "";}
function renderChart(){
  const v=visibleStage(); let h="";
  if(S.tab==="notes"){
    const list=NOTES.filter(n=>n.s<=v).slice().reverse();
    h=list.map(n=>`<article class="note${n.s===v?" fresh":""}"><div class="when">${n.t}</div><h3>${esc(n.h)}</h3>${n.p.map(p=>`<p>${esc(p)}</p>`).join("")}</article>`).join("");
  } else if(S.tab==="vitals"){
    const list=VITALS.filter(n=>n.s<=v);
    h=`<div class="tbl"><table><thead><tr><th>Time</th><th>T °F</th><th>HR</th><th>BP</th><th>RR</th><th>SpO₂</th><th>Pain /10</th><th>R pedal</th><th>UO mL/hr</th></tr></thead><tbody>${
      list.map(r=>`<tr><td class="num">${r.t}</td><td class="num">${r.T}</td><td class="num${r.HR>100?" H":""}">${r.HR}</td><td class="num${/^(1[4-9]\d|9\d)\//.test(r.BP)?(parseInt(r.BP)>=140?" H":" L"):""}">${r.BP}</td><td class="num${r.RR>20?" H":""}">${r.RR}</td><td class="num${parseInt(r.O2)<90?" L":""}">${r.O2}</td><td class="num">${r.pain}</td><td class="num${r.ped==="1+"?" L":""}">${r.ped}</td><td class="num${r.uo==="20"?" L":""}">${r.uo}</td></tr>`).join("")
    }</tbody></table></div>`;
  } else if(S.tab==="labs"){
    const cols=LABS.filter(n=>n.s<=v);
    if(!cols.length){h=`<p class="empty">No results yet. Labs drawn at 0645 are pending.</p>`}
    else{
      const keys=Object.keys(LAB_DEF).filter(k=>cols.some(c=>c.v[k]!=null));
      h=`<div class="tbl"><table><thead><tr><th>Test</th>${cols.map(c=>`<th>${c.t}</th>`).join("")}<th>Reference</th></tr></thead><tbody>${
        keys.map(k=>`<tr><td>${LAB_DEF[k].n}</td>${cols.map(c=>{const x=c.v[k]; if(x==null) return `<td class="num ref">—</td>`; const f=flagLab(k,x); return `<td class="num ${f}">${x}${f?`<span class="flag">${f}</span>`:""}</td>`}).join("")}<td class="ref">${LAB_DEF[k].r} ${LAB_DEF[k].u}</td></tr>`).join("")
      }</tbody></table></div><p class="ref">Reference ranges vary by lab. Swap in your program's textbook values if they differ.</p>`;
    }
  } else {
    const list=ORDERS.filter(n=>n.s<=v);
    h=list.length?list.map(o=>`<article class="note"><h3>${esc(o.h)}</h3><ul class="orders">${o.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></article>`).join(""):`<p class="empty">ED standing orders only. Provider orders appear after Stage 4.</p>`;
  }
  $("#chart").innerHTML=h;
}

/* ---------- render: item ---------- */
function renderItem(){
  const st=stageOf(S.stage), it=ITEMS[S.stage], r=S.resp[S.stage]||(S.resp[S.stage]={}), done=!!S.checked[S.stage];
  let body="";
  if(st.type==="highlight"){
    body=`<div class="scenario">${it.text.map(x=>{
      if(!x[1]) return esc(x[0]);
      let c="hl"; if(r[x[1]]) c+=" on";
      if(done){ if(r[x[1]]&&x[2]) c+=" right"; else if(r[x[1]]&&!x[2]) c+=" wrong"; else if(!r[x[1]]&&x[2]) c+=" missed"; }
      return `<span class="${c}" role="button" tabindex="0" aria-pressed="${!!r[x[1]]}" data-hl="${x[1]}">${esc(x[0])}</span>`;}).join("")}</div>`;
  } else if(st.type==="matrix"){
    body=`<div class="tbl"><table class="matrix"><thead><tr><th>Finding</th>${it.cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${
      it.rows.map((row,i)=>{const cls=done?(r[i]===row[1]?"right":"wrong"):"";
        return `<tr class="${cls}"><td>${esc(row[0])}</td>${it.cols.map((c,j)=>`<td><button class="cell${r[i]===j?" on":""}${done&&row[1]===j&&r[i]!==j?" key":""}" data-row="${i}" data-col="${j}" aria-label="${esc(row[0])}: ${c}" aria-pressed="${r[i]===j}"></button></td>`).join("")}</tr>`}).join("")
    }</tbody></table></div>`;
  } else if(st.type==="cloze"){
    body=`<p class="cloze">${it.parts.map(p=>{
      if(typeof p==="string") return esc(p);
      const b=it.blanks[p], val=r[p]; const cls=done?(Number(val)===b.a?"right":"wrong"):"";
      return `<select id="blank${p}" class="${cls}" data-blank="${p}" aria-label="Blank ${p+1}"><option value="">Select…</option>${b.opts.map((o,i)=>`<option value="${i}" ${String(val)===String(i)?"selected":""}>${esc(o)}</option>`).join("")}</select>`;}).join("")}</p>`;
  } else if(st.type==="selectN"){
    const sel=r.sel||[];
    body=`<p class="itype">${sel.length} of ${it.need} selected</p><div class="opts">${it.opts.map((o,i)=>{
      let c="opt"; const on=sel.includes(i); if(on) c+=" on";
      if(done){ if(on&&o[1]) c+=" right"; else if(on&&!o[1]) c+=" wrong"; else if(!on&&o[1]) c+=" missed"; }
      const firstBtn = on?`<span class="first${r.first===i?" on":""}" role="button" tabindex="0" data-first="${i}">${r.first===i?"First":"Mark first"}</span>`:"<span></span>";
      return `<div class="${c}"><button class="box" data-opt="${i}" aria-pressed="${on}" aria-label="Select option ${i+1}">${on?"✓":""}</button><span data-opt="${i}" style="cursor:pointer">${esc(o[0])}</span>${firstBtn}</div>`;}).join("")}</div>`;
  } else if(st.type==="bowtie"){
    const col=(k,title,mid)=>{const sel=r[k]||[]; const need=it[k].a.length;
      return `<div class="bt-col${mid?" mid":""}"><h3>${title} · pick ${need}</h3>${it[k].opts.map((o,i)=>{
        let c="tok"; const on=sel.includes(i); if(on) c+=" on";
        if(done){ const key=it[k].a.includes(i); if(on&&key) c+=" right"; else if(on&&!key) c+=" wrong"; else if(!on&&key) c+=" missed"; }
        return `<button class="${c}" data-bt="${k}" data-i="${i}" aria-pressed="${on}">${esc(o)}</button>`;}).join("")}</div>`;};
    body=`<div class="bowtie">${col("act","Actions to take")}${col("cond","Condition",true)}${col("mon","Parameters to monitor")}</div>`;
  }

  let rat="";
  if(done){
    let li=[];
    if(st.type==="highlight") li=it.text.filter(x=>x[1]).map(x=>`<li><b class="${x[2]?"ok":"no"}">${x[2]?"Concern":"Not immediate"}:</b> ${esc(x[0])}. ${esc(it.why[x[1]])}</li>`);
    if(st.type==="matrix") li=it.rows.map(row=>`<li><b class="${row[1]===0?"no":"ok"}">${it.cols[row[1]]}:</b> ${esc(row[0])}. ${esc(row[2])}</li>`);
    if(st.type==="cloze") li=it.blanks.map((b,i)=>`<li><b class="ok">Blank ${i+1}: ${esc(b.opts[b.a])}.</b> ${esc(b.why)}</li>`);
    if(st.type==="selectN") li=it.opts.map((o,i)=>`<li><b class="${o[1]?"ok":"no"}">${o[1]?(i===it.first?"Do first":"Do now"):"Not now"}:</b> ${esc(o[0])}. ${esc(o[2])}</li>`);
    if(st.type==="bowtie") li=[["cond","Condition"],["act","Actions"],["mon","Monitor"]].map(([k,l])=>`<li><b class="ok">${l}: ${it[k].a.map(i=>esc(it[k].opts[i])).join("; ")}.</b> ${esc(it[k].why)}</li>`);
    rat=`<div class="rat"><h3>Rationales</h3><ul>${li.join("")}</ul></div>`;
  }
  const fac = S.fac?`<div class="fac"><h3>Debrief prompts · ${esc(st.step)}</h3><ul>${it.faculty.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>`:"";
  const next = S.stage<7?`<button class="btn ghost" id="nextBtn">${S.stage===6?"Stretch item":"Next stage"} →</button>`:"";
  const sc = done?`<span class="score">${scoreFor(S.stage)} / ${maxFor(S.stage)} <small>points${S.stage===1?" (+1 each concern, −1 each extra)":""}</small></span>`:"";
  $("#item").innerHTML=`
    <div class="ihead"><div><div class="tag">${S.stage===7?"Stretch":"Stage "+S.stage} · ${esc(st.step)}</div><h2>${S.stage===7?"Bowtie":"Day "+(S.stage===6?"2":"1")+" · "+st.time}</h2></div><span class="itype">${esc(st.label)}</span></div>
    <p class="prompt">${esc(it.prompt)}</p>
    ${body}
    <div class="actions"><button class="btn" id="checkBtn" ${done?"disabled":""}>Check answers</button><button class="btn ghost" id="resetBtn">Reset</button>${sc}${next}</div>
    ${rat}${fac}`;
}

/* ---------- render: board ---------- */
function renderBoard(){
  const total=[1,2,3,4,5,6].reduce((a,i)=>a+maxFor(i),0);
  $("#board").innerHTML=`<span class="lbl">Teams</span>${S.teams.map((t,i)=>`<div class="team"><input id="team${i}" value="${esc(t[0])}" aria-label="Team ${i+1} name"><span class="pts">${t[1]}</span><button data-team="${i}" data-d="-1" aria-label="Subtract a point">−</button><button data-team="${i}" data-d="1" aria-label="Add a point">+</button></div>`).join("")}<span class="max">Case max ${total} + bowtie 5</span>`;
}
function renderAll(){renderRail();renderTabs();renderChart();renderItem();}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-hl],[data-first],[data-opt]"); if(!t) return;
  const id=S.stage, it=ITEMS[id], r=S.resp[id]||(S.resp[id]={}), done=!!S.checked[id];
  if(t.dataset.stage){S.stage=+t.dataset.stage; renderAll(); return;}
  if(t.dataset.tab){S.tab=t.dataset.tab; renderTabs(); renderChart(); return;}
  if(t.id==="facBtn"){S.fac=!S.fac; t.setAttribute("aria-pressed",S.fac); renderItem(); return;}
  if(t.dataset.team){const i=+t.dataset.team; S.teams[i][1]=Math.max(0,S.teams[i][1]+ +t.dataset.d); saveBoard(); renderBoard(); return;}
  if(t.id==="checkBtn"){S.checked[id]=true; renderRail(); renderItem(); return;}
  if(t.id==="resetBtn"){S.resp[id]={}; S.checked[id]=false; renderRail(); renderItem(); return;}
  if(t.id==="nextBtn"){S.stage=Math.min(7,id+1); if(S.tab!=="notes"&&!hasNew(S.tab)) S.tab="notes"; renderAll(); window.scrollTo({top:0,behavior:"smooth"}); return;}
  if(done) return;
  if(t.dataset.hl){r[t.dataset.hl]=!r[t.dataset.hl]; renderItem(); return;}
  if(t.dataset.row!=null){r[+t.dataset.row]=+t.dataset.col; renderItem(); return;}
  if(t.dataset.first!=null){r.first=+t.dataset.first; renderItem(); return;}
  if(t.dataset.opt!=null){const i=+t.dataset.opt; r.sel=r.sel||[];
    if(r.sel.includes(i)){r.sel=r.sel.filter(x=>x!==i); if(r.first===i) r.first=undefined;}
    else if(r.sel.length<it.need) r.sel.push(i);
    renderItem(); return;}
  if(t.dataset.bt){const k=t.dataset.bt,i=+t.dataset.i,need=it[k].a.length; let sel=r[k]||[];
    if(sel.includes(i)) sel=sel.filter(x=>x!==i); else { if(sel.length>=need) sel=sel.slice(1); sel.push(i); }
    r[k]=sel; renderItem(); return;}
});
document.addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-hl],[data-first]")){e.preventDefault(); e.target.click();}
});
document.addEventListener("change",e=>{
  if(e.target.dataset.blank!=null){const r=S.resp[S.stage]||(S.resp[S.stage]={}); r[+e.target.dataset.blank]=e.target.value===""?undefined:+e.target.value;}
});
document.addEventListener("input",e=>{
  const m=e.target.id&&e.target.id.match(/^team(\d)$/); if(m){S.teams[+m[1]][0]=e.target.value; saveBoard();}
});

renderAll(); renderBoard();
</script>
