<title>Break the Machine: Respiratory</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: a one-screen classroom presenter — header with section tabs, a stage that shows one screen at a time, a control bar. Dark "machine room" for questions, cool chart-paper panels for answers. Single deliberate look for projection. */
:root {
  --night: #0F2128;
  --night-2: #16303A;
  --steel: #3F5E69;
  --steel-soft: #2A434C;
  --paper: #EEF3F1;
  --paper-card: #FAFCFB;
  --ink: #11232A;
  --ink-soft: #3B4F56;
  --mist: #BFD3D6;
  --spark: #F08A62;
  --spark-deep: #A93F1A;
  --ember: #E0603A;
  --dx: #7FD1C9;
  --rule: #D3DEDB;
  --f-display: 'Oswald', 'Arial Narrow', Arial, sans-serif;
  --f-body: 'Nunito Sans', 'Segoe UI', Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: #F2F5F4; font-family: var(--f-body); }
* { box-sizing: border-box; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--spark); outline-offset: 3px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }

/* Header */
.top { background: var(--night); border-bottom: 1px solid var(--steel-soft); padding-block: 12px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px; }
.top-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); text-transform: uppercase; letter-spacing: 0.04em; font-size: 1.15rem; font-weight: 600; color: #F2F5F4; white-space: nowrap; }
.brand span { color: var(--spark); }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.tab { background: transparent; border: 1px solid transparent; color: var(--mist); padding: 6px 12px; border-radius: 999px; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.02em; }
.tab:hover { border-color: var(--steel); color: #F2F5F4; }
.tab[aria-current="true"] { background: var(--spark); color: var(--ink); }
.progress { height: 4px; background: var(--steel-soft); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--spark); transition: width 0.3s ease; }

/* Stage */
.stage { overflow: auto; position: relative; }
.screen { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding-block: clamp(24px, 5vh, 64px); padding-left: max(16px, env(safe-area-inset-left, 0px), 5vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 5vw); animation: in 0.35s ease both; }
@keyframes in { from { opacity: 0.001; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen { animation: none; } .progress i { transition: none; } }
.inner { width: 100%; max-width: 1500px; margin-inline: auto; display: flex; flex-direction: column; gap: clamp(18px, 3vh, 40px); min-width: 0; }

.eyebrow { font-weight: 800; text-transform: uppercase; letter-spacing: 0.16em; font-size: clamp(0.8rem, 1.2vw, 1.15rem); color: var(--spark); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p, ul { margin: 0; }

/* Dark screens */
.s-dark { background: var(--night); }
.s-dx { background: #0C2A30; }
.s-dx .eyebrow, .s-dx .name { color: var(--dx); }
.q-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: clamp(24px, 5vw, 96px); align-items: center; }
.q-text { display: flex; flex-direction: column; gap: clamp(14px, 2.5vh, 32px); min-width: 0; }
.ask { font-family: var(--f-display); font-weight: 500; font-size: clamp(1.8rem, 4.2vw, 4.4rem); line-height: 1.1; color: #F2F5F4; }
.name { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; font-size: clamp(2.8rem, 9vw, 9.5rem); line-height: 0.98; color: var(--spark); overflow-wrap: anywhere; }
.sub { font-size: clamp(1rem, 2vw, 2rem); color: var(--mist); }
.airway { width: clamp(180px, 26vw, 420px); height: auto; max-width: 100%; display: block; }

/* Divider */
.s-divider { background: var(--ember); color: var(--ink); }
.s-divider .eyebrow { color: var(--ink); }
.div-title { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; font-size: clamp(3rem, 9vw, 9rem); line-height: 0.95; }
.lead { font-size: clamp(1.2rem, 2.6vw, 2.6rem); line-height: 1.3; max-width: 30ch; }

/* Paper screens */
.s-paper { background: var(--paper); color: var(--ink); }
.s-paper .eyebrow { color: var(--spark-deep); }
.p-title { font-family: var(--f-display); font-weight: 600; font-size: clamp(1.8rem, 4vw, 4.2rem); line-height: 1.08; color: var(--ink); max-width: 28ch; }
.p-big { font-family: var(--f-display); font-weight: 600; font-size: clamp(2.4rem, 6vw, 6rem); line-height: 1.02; color: var(--ink); }
.p-q { font-size: clamp(1.2rem, 2.4vw, 2.4rem); font-style: italic; color: #1F6E78; }
.grid { display: grid; gap: clamp(12px, 1.6vw, 24px); grid-template-columns: repeat(3, minmax(0, 1fr)); }
.card { background: var(--paper-card); border: 1px solid var(--rule); border-top: 6px solid #2F7F8A; border-radius: 10px; padding: clamp(16px, 2vw, 32px); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card h3 { font-weight: 800; font-size: clamp(1.05rem, 1.9vw, 1.9rem); line-height: 1.2; color: var(--ink); }
.card p, .card ul { font-size: clamp(0.95rem, 1.45vw, 1.5rem); line-height: 1.4; color: var(--ink-soft); }
.card ul { padding-left: 1.1em; display: grid; gap: 4px; }
.card.dark { background: var(--night); border-color: var(--night); border-top-color: var(--spark); }
.card.dark h3 { color: var(--spark); }
.card.dark p, .card.dark ul { color: #DCE7E8; }

.def-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: clamp(24px, 4vw, 72px); align-items: center; }
.def-text { display: flex; flex-direction: column; gap: clamp(14px, 2.4vh, 28px); min-width: 0; }
.definition { font-size: clamp(1.4rem, 3.1vw, 3.2rem); line-height: 1.3; color: var(--ink); max-width: 34ch; font-weight: 600; }
.why { font-size: clamp(1rem, 1.8vw, 1.8rem); color: var(--ink-soft); }
.chip { align-self: flex-start; background: var(--night); color: #F2F5F4; border-radius: 999px; padding: 8px 18px; font-weight: 700; font-size: clamp(0.85rem, 1.3vw, 1.3rem); }
.chip b { color: var(--spark); font-weight: 800; }
.mini { background: var(--night); border-radius: 16px; padding: 16px; }
.mini .airway { width: clamp(140px, 18vw, 300px); }

/* Cover */
.s-cover .name { color: #F2F5F4; font-size: clamp(3rem, 10vw, 10rem); }
.s-cover .ask { color: var(--spark); text-transform: uppercase; font-weight: 600; }
.start { align-self: flex-start; background: var(--spark); color: var(--ink); border: 0; border-radius: 999px; padding: 14px 28px; font-weight: 800; font-size: clamp(1rem, 1.6vw, 1.4rem); }
.start:hover { background: #F6A584; }
.parts { display: flex; flex-wrap: wrap; gap: 8px; }
.parts span { border: 1px solid var(--steel); color: var(--mist); border-radius: 999px; padding: 4px 12px; font-size: 0.9rem; }

/* Notes */
.notes { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 16px; max-width: min(520px, calc(100% - 32px)); background: #FFF6E5; color: #3A2A10; border-radius: 12px; padding: 14px 18px; font-size: 1rem; line-height: 1.45; box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
.notes strong { display: block; text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.75rem; margin-bottom: 4px; color: #8A5A10; }

/* Controls */
.bar { background: var(--night); border-top: 1px solid var(--steel-soft); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 10px; }
.btn { background: var(--night-2); border: 1px solid var(--steel); color: #F2F5F4; border-radius: 10px; padding: 10px 16px; font-weight: 700; font-size: 0.95rem; }
.btn:hover { border-color: var(--mist); }
.btn[aria-pressed="true"] { background: #FFF6E5; color: #3A2A10; border-color: #FFF6E5; }
.btn.next { background: var(--spark); color: var(--ink); border-color: var(--spark); margin-left: auto; min-width: 120px; }
.btn:disabled { opacity: 0.4; cursor: default; }
.count { color: var(--mist); font-variant-numeric: tabular-nums; font-size: 0.95rem; white-space: nowrap; }
.keys { color: var(--steel); font-size: 0.8rem; }

@media (max-width: 900px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .q-row, .def-row { grid-template-columns: minmax(0, 1fr); }
  .airway { width: min(220px, 60vw); }
  .tabs { margin-left: 0; }
  .keys { display: none; }
}
@media (max-width: 560px) {
  .btn.fs { display: none; }
  .btn { padding: 10px 12px; }
}
</style>

": "RBCs & Hemoglobin · What they do", "title": "The delivery trucks: oxygen out, carbon dioxide back", "cards": [{"h": "Carry oxygen", "dark": false, "paras": ["About 97% of O₂ in the blood rides on hemoglobin."]}, {"h": "Four seats", "dark": false, "paras": ["Each hemoglobin molecule binds up to four O₂ molecules."]}, {"h": "Drop off where needed", "dark": false, "paras": ["Release more O₂ in tissues that are warm, acidic and high in CO₂."]}, {"h": "Bring CO₂ back", "dark": false, "paras": ["Carry part of the CO₂ to the lungs; the rest travels as bicarbonate."]}, {"h": "Buffer acid", "dark": false, "paras": ["Hemoglobin binds hydrogen ions, helping keep pH stable."]}, {"h": "What SpO₂ measures", "dark": false, "paras": ["The percent of hemoglobin carrying O₂ — not how much Hgb there is."]}]}, {"id": "d-fail", "note": "For each part, ask for clinical manifestations, how the patient presents, and signs vs symptoms. Tie each back to the function they just described: if it can’t do X, you’ll see Y.", "type": "divider", "eyebrow": "Part 2", "title": "Break the machine", "lead": "Same eight stops. Now each one isn’t doing its job.<br/><b>What does that look like at the bedside?<\/b>"}, {"id": "bq-nose", "note": "Prompt: if the nose can’t filter, warm or humidify, what does the patient do instead — and what happens to the air going deeper?", "type": "question", "eyebrow": "When it breaks · 1 of 8", "ask": "What does it look like when this isn’t working?", "name": "The Nose", "sub": "Manifestations · presentation · signs & symptoms", "part": "nose", "tone": "core"}, {"id": "ba-nose", "note": "", "type": "answer", "eyebrow": "The Nose · When it breaks", "title": "Blocked or irritated: air bypasses the filter and dries the throat", "cards": [{"h": "What you’ll see", "dark": false, "items": ["Mouth breathing", "Rhinorrhea, clear or purulent", "Swollen, pale or red turbinates", "Epistaxis", "Nasal, congested voice"]}, {"h": "What they’ll tell you", "dark": false, "items": ["“ i", "tone": "core"}, {"id": "ba-bronchi", "note": "", "type": "answer", "eyebrow": "The Bronchi · When they break", "title": "Inflamed, infected or clogged with mucus", "cards": [{"h": "What you’ll see", "dark": false, "items": ["Productive cough", "Rhonchi that clear with coughing", "Wheezes", "Fever if infected", "Hemoptysis"]}, {"h": "What they’ll tell you", "dark": false, "items": ["Chest tightness or soreness", "Short of breath", "Coughing up sputum", "Tired from coughing"]}, {"h": "Where it shows up", "dark": true, "items": ["Acute bronchitis", "Chronic bronchitis (COPD)", "Bronchiectasis", "Aspiration (right side)", "Bronchogenic lung cancer"]}]}, {"id": "bq-bronchioles", "note": "Prompt: no cartilage, all smooth muscle — when it clamps down, which phase of breathing gets hard? Why is a quiet chest in an asthma attack frightening?", "type": "question", "eyebrow": "When it breaks · 6 of 8", "ask": "What does it look like when this isn’t working?", "name": "The Bronchioles", "sub": "Manifestations · presentation · signs & symptoms", "part": "bronchioles", "tone": "core"}, {"id": "ba-bronchioles", "note": "", "type": "answer", "eyebrow": "The Bronchioles · When they break", "title": "Clamped down: air gets in but can’t get out", "cards": [{"h": "What you’ll see", "dark": false, "items": ["Expiratory wheezes", "Prolonged expiration", "Accessory muscles, tripod position", "Pursed-lip breathing", "Barrel chest (chronic)", "Silent chest = ominous"]}, {"h": "What they’ll tell you", "dark": false, "items": ["Chest tightness", "“I can’t get the air out”", "Cough, worse at night", "Triggers: cold, exercise, allergens"]}, {"h": "Where it shows up", "dark": true, "items": ["Asthma", "COPD", "Bronchiolitis (RSV)", "Anaphylaxis bronchospasm", "Cystic fibrosis"]}]}, {"id": "bq-alveoli", "note": "Prompt: filled with fluid or pus, collapsed, destroyed, or thickened — each blocks diffusion. What happens to SpO₂ and mental status?", "type": "question", "eyebrow": "When it breaks · 7 of 8", "ask": "What does it look like when this isn’t working?", "name": "The Alveoli", "sub": "Manifestations · presentation · signs & symptoms", "part": "alveoli", "tone": "core"}, {"id": "ba-alveoli", "note": "", "type": "answer", "eyebrow": "The Alveoli · When they break", "title": "Filled, collapsed or destroyed: gas can’t cross", "cards": [{"h": "What you’ll see", "dark": false, "items": ["Low SpO₂, tachypnea", "Crackles or diminished sounds", "Dull to percussion", "Pink frothy sputum (edema)", "Restless, confused, cyanotic", "Fever (pneumonia)"]}, {"h": "What they’ll tell you", "dark": false, "items": ["Short of breath", "Exhausted", "Pleuritic chest pain", "Can’t lie flat"]}, {"h": "Where it shows up", "dark": true, "items": ["Pneumonia", "Atelectasis", "Pulmonary edema", "ARDS", "Emphysema", "Pulmonary fibrosis"]}]}, {"id": "bq-rbc", "note": "Prompt: the lungs can be perfect and the patient still hypoxic. Why might the pulse ox look fine here?", "type": "question", "eyebrow": "When it breaks · 8 of 8", "ask": "What does it look like when this isn’t working?", "name": "Red Blood Cells", "sub": "Manifestations · presentation · signs & symptoms", "part": "rbc", "tone": "core"}, {"id": "ba-rbc", "note": "", "type": "answer", "eyebrow": "RBCs & Hemoglobin · When they break", "title": "Not enough trucks, or trucks that can’t carry O₂", "cards": [{"h": "What you’ll see", "dark": false, "items": ["Pallor, pale mucous membranes", "Tachycardia", "Dyspnea on exertion", "Low Hgb and Hct", "SpO₂ may look normal"]}, {"h": "What they’ll tell you", "dark": false, "items": ["Fatigue, weakness", "Dizzy when standing", "Headache", "Always cold"]}, {"h": "Where it shows up", "dark": true, "items": ["Anemia, blood loss", "Sickle cell disease", "Carbon monoxide poisoning", "Methemoglobinemia", "Polycythemia (chronic hypoxia)"]}]}, {"id": "d-labs", "note": "Normal ranges on the answer slides are typical adult values; remind students to use their facility’s reference ranges." <rect x="270" y="118" width="38" height="178" rx="16" fill="${c("pharynx")}"/>
<rect x="262" y="290" width="54" height="58" rx="12" fill="${c("larynx")}"/>

<path d="M273 362H305M273 382H305M273 402H305M273 422H305M273 442H305M273 462H305M273 482H305" stroke="#0F2128" stroke-width="4"/>

let idx = 0, showNotes = false;
try { showNotes = localStorage.getItem("btm-notes") === "1"; } catch (e) {}

tabs.innerHTML = SECTIONS.map(sec => `<button class="tab" type="button" data-sec="${esc(sec)}">${esc(sec)}</button>`).join("");
tabs.addEventListener("click", e => { const b = e.target.closest("[data-sec]"); if (b) go(screens.findIndex(s => s.section === b.dataset.sec)); });

function show() {
  const s = screens[idx];
  stage.innerHTML = render(s) + (showNotes && s.note ? `<aside class="notes"><strong>Facilitator note</strong>${esc(s.note)}</aside>` : "");
  stage.scrollTop = 0;
  prog.style.width = `${(idx / (screens.length - 1)) * 100}%`;
  count.textContent = `${idx + 1} / ${screens.length}`;
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === screens.length - 1;
  notesBtn.setAttribute("aria-pressed", String(showNotes));
  tabs.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", String(t.dataset.sec === s.section)));
  const h = `#screen-${idx + 1}`;
  if (location.hash !== h) { try { history.replaceState(null, "", h); } catch (e) {} }
}
function go(i) { idx = Math.max(0, Math.min(screens.length - 1, i)); show(); }
prevBtn.onclick = () => go(idx - 1);
nextBtn.onclick = () => go(idx + 1);
stage.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) go(+b.dataset.go); });
notesBtn.onclick = () => { showNotes = !showNotes; try { localStorage.setItem("btm-notes", showNotes ? "1" : "0"); } catch (e) {} show(); };
document.getElementById("fsBtn").onclick = () => {
  try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
};
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea")) return;
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(idx + 1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(idx - 1); }
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(screens.length - 1);
  else if (e.key.toLowerCase() === "n") notesBtn.click();
  else if (e.key.toLowerCase() === "f") document.getElementById("fsBtn").click();
});
function fromHash() { const m = /^#screen-(\d+)$/.exec(location.hash); if (m) idx = Math.max(0, Math.min(screens.length - 1, +m[1] - 1)); }
window.addEventListener("hashchange", () => { fromHash(); show(); });
fromHash(); show();
</script>

</body></html>
