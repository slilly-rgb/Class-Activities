<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Diagnosis Unknown: Respiratory Casebook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: black case-file masthead; a ward board of four categories; each ward opens a shuffled case grid; each case is a tabbed evidence file with a diagnosis board. Single dark Clinical Mysteries theme by design. */
:root{
  color-scheme: dark;
  --bg:#070a0b; --panel:#0e1416; --panel2:#131c1e; --line:#203034;
  --fg:#dfe9e8; --muted:#8ea3a2; --teal:#1ec8b8; --teal-dim:#0f6b63; --teal-ink:#03211e;
  --red:#ef6a5f; --amber:#efb54a; --green:#53d48e; --blue:#62a8f0;
  --display:"Oxanium","Eurostile","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible+span,label:focus-within{outline:2px solid var(--teal);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.mast{background:#000;border-bottom:1px solid var(--line)}
.mast .wrap{display:flex;align-items:center;gap:14px;padding-block:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left}
.logo svg{width:44px;height:44px;flex:none}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:18px;color:var(--teal);line-height:1}
.tag{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.edition{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);padding:4px 10px;border-radius:3px}

.hero{padding-block:28px 10px}
.hero h1{font-size:clamp(28px,5vw,44px);font-weight:700;letter-spacing:.01em}
.hero h1 span{color:var(--teal)}
.hero p{max-width:66ch;color:var(--muted);margin:10px 0 0}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:18px 0 6px}
.rule{border-top:2px solid var(--teal-dim);padding-top:8px;font-size:13.5px;color:var(--muted)}
.rule b{display:block;color:var(--fg);font-family:var(--display);font-size:14px;letter-spacing:.04em;margin-bottom:2px}

/* wards */
.sect{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.wards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding-bottom:40px}
.ward{--c:var(--teal);background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:4px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0;transition:border-color .15s}
.ward:hover{border-color:var(--c)}
.ward .wk{font-family:var(--mono);font-size:12px;color:var(--c);display:flex;justify-content:space-between;gap:8px}
.ward .wn{font-family:var(--display);font-size:22px;font-weight:700}
.ward .ws{font-size:13px;color:var(--muted);margin-top:-6px}
.ward .wb{font-size:13.5px;opacity:.85}
.ward .wdx{display:flex;flex-wrap:wrap;gap:4px}
.ward .wdx span{font-size:11.5px;border:1px solid var(--line);border-radius:2px;padding:1px 6px;color:var(--muted)}
.bar{flex:1;min-width:80px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--teal))}
.wprog{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted)}

.progress{font-family:var(--mono);font-size:13px;color:var(--muted);margin:14px 0 10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;padding-bottom:16px}
.case{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .15s}
.case:hover{border-color:var(--teal-dim)}
.case .num{font-family:var(--mono);font-size:12px;color:var(--teal);display:flex;justify-content:space-between;gap:8px}
.case .nm{font-family:var(--display);font-size:18px;font-weight:700}
.case .meta{font-size:12.5px;color:var(--muted)}
.case .cc{font-size:13.5px;color:var(--fg);opacity:.85;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.case .sdx{font-size:12.5px;color:var(--green)}
.pill{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:2px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.solved{border-color:var(--green);color:var(--green)}
.pill.open{border-color:var(--amber);color:var(--amber)}
.dxgroup{margin:18px 0 6px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dxgroup h3{font-size:17px}
.dxgroup span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.diffbox{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-top:14px}
.diffbox .dl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.diffbox .dd{display:flex;flex-wrap:wrap;gap:6px}
.diffbox .dd span{font-size:13px;border:1px solid var(--line);border-radius:2px;padding:2px 8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:none}
.seg button{background:none;border:0;padding:8px 14px;font-family:var(--display);font-size:14px;letter-spacing:.03em;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-checked="true"]{background:var(--teal);color:var(--teal-ink);font-weight:700}
.modehint{font-size:13px;color:var(--muted);flex:1;min-width:220px;max-width:62ch}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.jump a{font-size:12.5px;color:var(--fg);text-decoration:none;border:1px solid var(--line);border-radius:2px;padding:3px 9px;background:var(--panel)}
.jump a:hover{border-color:var(--teal-dim);color:var(--teal)}
.focuslist{display:flex;flex-direction:column;gap:22px;margin-top:18px}
.fdx{scroll-margin-top:12px}
.fhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px}
.fhead h3{font-size:19px}
.fcount{font-family:var(--mono);font-size:12px;color:var(--muted)}
.fcount.done{color:var(--green)}
.fopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.fopt{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color .15s}
.fopt:hover{border-color:var(--teal)}
.fopt.isdone{border-color:rgba(83,212,142,.45)}
.fopt .fk{font-family:var(--mono);font-size:11.5px;color:var(--teal);display:flex;justify-content:space-between;gap:8px;align-items:center}
.fopt .fv{font-family:var(--display);font-size:16.5px;font-weight:700;line-height:1.25}
.fopt .fp{font-size:12.5px;color:var(--muted)}
.fvar{font-family:var(--display);font-size:15px;color:var(--fg);opacity:.8;margin-top:2px}
.toolrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 4px}
.toggle{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted);cursor:pointer}
.toggle input{accent-color:var(--teal);width:16px;height:16px}

.topbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:16px 6px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:7px 12px;font-size:13.5px}
.btn:hover{border-color:var(--teal-dim)}
.btn.primary{background:var(--teal);color:var(--teal-ink);border-color:var(--teal);font-weight:600}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none}
.spacer{flex:1}
.crumb{font-family:var(--mono);font-size:12px;color:var(--muted)}
.file{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.file .who{min-width:0}
.file h2{font-size:26px}
.file .meta{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:3px}
.file .cc{margin:10px 0 0;max-width:70ch}
.tokens{text-align:right}
.tokens .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tokens .count{font-family:var(--display);font-size:34px;font-weight:700;color:var(--teal);line-height:1;font-variant-numeric:tabular-nums}
.tokens .count.low{color:var(--amber)}
.tokens .count.out{color:var(--red)}
.pips{display:grid;grid-template-columns:repeat(5,10px);gap:4px;justify-content:end;margin-top:8px}
.pips i{width:10px;height:10px;border-radius:50%;border:1px solid var(--teal-dim)}
.pips i.on{background:var(--teal);border-color:var(--teal)}

.tabs{display:flex;gap:2px;margin-top:16px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font-family:var(--display);font-size:14px;letter-spacing:.03em;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--teal)}
.tab .lock{font-size:11px;opacity:.7}
.tab .badge{font-family:var(--mono);font-size:11px;background:var(--teal-dim);color:var(--fg);padding:0 6px;border-radius:8px}
.pane{padding-block:16px 40px}
.locked{border:1px dashed var(--line);border-radius:4px;padding:28px 18px;text-align:center;color:var(--muted)}
.locked p{margin:0 0 12px}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px;max-width:72ch}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.item.in{border-color:var(--teal);background:linear-gradient(90deg,rgba(30,200,184,.08),transparent 60%),var(--panel)}
.item .txt{min-width:0}
.item .tname{font-family:var(--display);font-size:14px;letter-spacing:.02em}
.item .res{font-family:var(--mono);font-size:13px;color:var(--fg);margin-top:4px}
.item .res.def{color:var(--amber)}
.ev{border:1px solid var(--line);background:var(--panel2);border-radius:3px;padding:6px 10px;font-size:12.5px;white-space:nowrap;color:var(--muted)}
.ev[aria-pressed="true"]{border-color:var(--teal);color:var(--teal);font-weight:600}
.order{border:1px solid var(--teal-dim);background:none;border-radius:3px;padding:6px 10px;font-size:12.5px;white-space:nowrap;color:var(--teal)}
.order:disabled{opacity:.35;cursor:not-allowed}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.vgrid .item{font-family:var(--mono);font-size:14px}

.dxhead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.dxhead h3{font-size:18px}
.dxhead .left{font-family:var(--mono);font-size:13px;color:var(--teal)}
.dxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.dx{position:relative;display:block;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px 10px 38px;cursor:pointer;min-width:0}
.dx input{position:absolute;left:12px;top:13px;accent-color:var(--teal)}
.dx .dn{font-weight:600}
.dx .why{font-size:12px;color:var(--red);margin-top:3px}
.dx.out{opacity:.55;cursor:not-allowed;background:var(--bg)}
.dx.out .dn{text-decoration:line-through;text-decoration-color:var(--red)}
.dx.sel{border-color:var(--teal)}
.submitrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}
.msg{font-size:14px}
.msg.bad{color:var(--red)} .msg.ok{color:var(--green)}
.reveal{margin-top:20px;border:1px solid var(--green);border-radius:4px;background:var(--panel);overflow:hidden}
.reveal .rh{background:rgba(83,212,142,.12);padding:14px 16px;border-bottom:1px solid var(--line)}
.reveal .rh .k{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--green)}
.reveal .rh h3{font-size:24px;margin-top:4px}
.reveal .rb{padding:6px 16px 16px;display:grid;gap:12px}
.reveal .blk{max-width:72ch}
.reveal .blk b{display:block;font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin:8px 0 2px}
.reveal .blk p{margin:0}
.reveal .stats{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--amber)}
.sata{border-top:1px solid var(--line);padding-top:6px}
.sata .sq{display:block;font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin:8px 0 2px}
.sata .sp{margin:0 0 10px;max-width:72ch}
.nopts{display:flex;flex-direction:column;gap:8px}
.nopt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:10px 12px;cursor:pointer}
.nopt input{margin-top:4px;accent-color:var(--teal);width:16px;height:16px}
.nopt.on{border-color:var(--teal)}
.nopt.res{cursor:default}
.nmark{font-weight:700;font-size:16px;width:16px;text-align:center}
.ntag{font-family:var(--mono);font-size:12px;margin-top:3px}
.nopt.res.hit{border-color:var(--green);background:linear-gradient(90deg,rgba(83,212,142,.14),transparent 70%),var(--panel2)}
.nopt.res.wrong{border-color:var(--red);background:linear-gradient(90deg,rgba(239,106,95,.16),transparent 70%),var(--panel2)}
.nopt.res.miss{border-color:var(--amber);border-style:dashed;background:linear-gradient(90deg,rgba(239,181,74,.14),transparent 70%),var(--panel2)}
.nopt.res.skip{opacity:.72}
.nopt.hit .nmark,.nopt.hit .ntag{color:var(--green)}
.nopt.wrong .nmark,.nopt.wrong .ntag{color:var(--red)}
.nopt.miss .nmark,.nopt.miss .ntag{color:var(--amber)}
.nopt.skip .nmark,.nopt.skip .ntag{color:var(--muted)}
.nfocus{margin-top:14px;border:1px solid var(--teal-dim);border-radius:4px;padding:10px 14px;background:var(--panel2);max-width:78ch}
.nfocus b{display:block;font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:2px}
.nfocus p{margin:0}
.nlegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-family:var(--mono);font-size:12px}
.nlegend .lg{display:inline-flex;align-items:center;gap:6px}
.nlegend .lg::before{content:"";width:10px;height:10px;border-radius:2px;border:1px solid currentColor}
.nlegend .hit{color:var(--green)} .nlegend .wrong{color:var(--red)} .nlegend .miss{color:var(--amber)} .nlegend .skip{color:var(--muted)}
.nrat{font-size:13.5px;color:var(--muted);margin-top:4px}
.nrat b{color:var(--fg)}
.nscore{margin-top:12px;font-size:14px}
.nscore.good{color:var(--green)}
@media (max-width:560px){
  .file{grid-template-columns:1fr}
  .tokens{text-align:left}.pips{justify-content:start}
  .item{grid-template-columns:1fr}
  .item .ev,.item .order{justify-self:start}
  .edition{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const CATS = [{"id":"upper","name":"Upper Airway","sub":"Noninfectious","color":"#1ec8b8","blurb":"Problems from the nose to the larynx: injuries, swelling, and collapse that block air before it reaches the lungs.","hint":"Ask where the obstruction is and what caused it: trauma, swelling, infection in the throat tissues, or collapse during sleep.","dx":[{"id":"epi","name":"Acute epiglottitis","normal":"The epiglottis is a flap of cartilage that closes over the larynx when you swallow, then opens so air can pass.","broke":"Infection makes the epiglottis and the tissue around it swell fast. A swollen epiglottis can seal off the airway opening within hours.","care":"Airway first. Keep the patient upright and calm, never put a tongue blade or swab in the throat, and keep intubation and surgical airway equipment at the bedside. IV antibiotics after the airway is secured.","nursing":[{"t":"Let the patient stay in the upright position they chose; don't make them lie down.","ok":true,"r":"Sitting up and leaning forward keeps the narrowed airway as open as possible. Lying flat can let the swollen epiglottis fall back over the airway."},{"t":"Keep intubation and emergency surgical airway (cricothyrotomy/tracheostomy) equipment at the bedside.","ok":true,"r":"Complete obstruction can happen suddenly, and a swollen epiglottis makes intubation hard."},{"t":"Look in the throat with a tongue blade and swab it for a culture.","ok":false,"r":"Anything placed in the throat can trigger laryngospasm and complete obstruction. The throat is examined only in a controlled setting with the airway team ready."},{"t":"Keep the patient calm and hold nonurgent procedures until the airway is secured.","ok":true,"r":"Crying or agitation increases oxygen demand and turbulent airflow and can tip a narrowed airway into complete obstruction."},{"t":"Give a sedative to ease anxiety.","ok":false,"r":"Sedation relaxes airway muscles and depresses breathing, which can cause sudden obstruction."},{"t":"Start IV antibiotics as ordered once the airway is secured.","ok":true,"r":"The cause is bacterial, so antibiotics treat it. Securing the airway comes first."},{"t":"Offer sips of cool water to soothe the throat.","ok":false,"r":"The patient can't swallow saliva, so oral fluids risk aspiration. Keep NPO and hydrate IV."},{"t":"Make sure household contacts are evaluated; preventive antibiotics may be ordered after Hib exposure.","ok":true,"r":"Close contacts of a patient with H. influenzae type b disease may need rifampin prophylaxis, especially if young children live in the home."}]},{"id":"facial","name":"Facial fracture / trauma","normal":"The facial bones frame the nasal passages and support the upper airway, eyes, and jaw.","broke":"Blunt force breaks the facial bones. Swelling, bleeding, loose teeth, and unstable bone fragments can block the upper airway, and fractures near the skull base can leak cerebrospinal fluid.","care":"Airway first: suction ready, head of bed up once the spine is cleared, ice for swelling. Watch for clear nasal drainage (possible CSF leak), check vision, and keep wire cutters at the bedside if the jaws are wired.","nursing":[{"t":"Assess airway patency first and keep suction ready.","ok":true,"r":"Swelling, bleeding, loose teeth, and broken bones can all block the airway."},{"t":"Elevate the head of the bed (once the spine is cleared) and apply ice packs.","ok":true,"r":"Elevation and cold reduce swelling and help blood and secretions drain."},{"t":"Check any clear fluid from the nose for glucose or a halo sign.","ok":true,"r":"Clear drainage may be cerebrospinal fluid from a skull-base fracture, which raises the risk of meningitis."},{"t":"Insert a nasogastric tube to decompress the stomach.","ok":false,"r":"With midface fractures, a nasal tube can pass through a fractured skull base. Use an orogastric tube if one is needed."},{"t":"Encourage the patient to blow their nose to clear out blood.","ok":false,"r":"Blowing the nose can force air into the orbit and soft tissues and spread infection through the fracture."},{"t":"If the jaws are wired shut, keep wire cutters at the bedside.","ok":true,"r":"If the patient vomits or the airway is threatened, the wires must be cut immediately."},{"t":"Have the patient lie flat to reduce bleeding.","ok":false,"r":"Lying flat increases facial swelling and lets blood drain into the throat, raising aspiration risk."},{"t":"Check vision, eye movements, and facial sensation often.","ok":true,"r":"Orbital fractures can trap eye muscles or cause bleeding behind the eye that threatens vision."}]},{"id":"laryn","name":"Laryngeal trauma","normal":"The larynx houses the vocal cords and is the narrowest part of the adult upper airway. Its cartilage framework holds it open.","broke":"A blow, a crush, or a breathing tube injures the larynx. Bleeding, swelling, torn lining, or fractured cartilage narrows the airway and changes the voice; air can leak into the neck tissues.","care":"Watch stridor and voice closely, keep a tracheostomy tray ready, keep NPO, and track any subcutaneous emphysema. The airway is secured by experts, often surgically.","nursing":[{"t":"Monitor continuously for worsening stridor, voice change, and respiratory distress.","ok":true,"r":"Bleeding and swelling in the larynx can close the airway quickly. Changes in stridor or voice are early warnings."},{"t":"Keep emergency airway equipment, including a tracheostomy tray, immediately available.","ok":true,"r":"Intubating through an injured larynx can make it worse, so a surgical airway may be needed."},{"t":"Keep the patient NPO.","ok":true,"r":"An injured larynx protects the airway poorly, so aspiration risk is high, and surgery may be needed."},{"t":"Mark the edges of any subcutaneous emphysema and check whether it spreads.","ok":true,"r":"Spreading air under the skin means air is still leaking from the airway."},{"t":"Keep the head of the bed elevated and give humidified oxygen as ordered.","ok":true,"r":"Upright positioning and humidity ease breathing and help limit swelling and drying of the injured lining."},{"t":"Encourage the patient to keep talking so you can track the voice.","ok":false,"r":"Voice rest protects injured vocal cords. Check the voice briefly on a schedule instead."},{"t":"If the patient worsens, attempt a quick blind nasotracheal intubation.","ok":false,"r":"A blind tube can create a false passage through torn tissue. The airway is secured under direct view or surgically."},{"t":"Offer oral fluids to soothe the throat.","ok":false,"r":"Swallowing is unsafe until the airway is evaluated; aspiration risk is high."}]},{"id":"pta","name":"Peritonsillar abscess","normal":"The tonsils sit in a pocket of loose tissue at the back of the mouth, on each side of the uvula.","broke":"A tonsil infection spreads into the space around the tonsil and forms a pocket of pus. The abscess pushes the tonsil and uvula toward the other side, spasms the jaw muscles (trismus), and can narrow the airway.","care":"Keep upright, monitor the airway, assist with needle aspiration or incision and drainage, give antibiotics and pain control, and keep the patient hydrated.","nursing":[{"t":"Position the patient upright so saliva can drain and the airway stays open.","ok":true,"r":"Pus, saliva, and swelling can obstruct the airway; upright positioning protects it."},{"t":"Have suction ready and assist with needle aspiration or incision and drainage.","ok":true,"r":"Draining the pus is the definitive treatment. Suction prevents aspiration of pus and blood."},{"t":"Give IV antibiotics and pain medication as ordered.","ok":true,"r":"Antibiotics treat the infection; pain control lets the patient swallow fluids."},{"t":"Monitor for stridor, drooling, and worsening trouble breathing.","ok":true,"r":"The swelling can spread and narrow the airway."},{"t":"Tell the patient they can stop antibiotics once the pain is gone.","ok":false,"r":"Stopping early risks the abscess coming back. Many abscesses follow an unfinished course of antibiotics."},{"t":"Offer an ice collar and cool fluids for comfort.","ok":true,"r":"Cold reduces swelling and pain and helps the patient keep up with fluids."},{"t":"Encourage a regular solid diet right away to keep up strength.","ok":false,"r":"Swallowing is painful and the jaw opens poorly. Start with cool liquids and soft foods."},{"t":"Lay the patient flat to rest after the drainage.","ok":false,"r":"Lying flat lets blood and pus drain toward the airway. Keep the head up."}]},{"id":"osa","name":"Obstructive sleep apnea","normal":"During sleep the throat muscles relax a little, but the airway stays open enough for steady breathing.","broke":"In sleep, the soft tissues of the throat collapse and block airflow over and over. Oxygen falls, the brain jolts the person partly awake to breathe, and sleep is broken all night.","care":"Teach nightly CPAP, side-lying sleep, weight loss when relevant, and avoiding alcohol and sedatives at night. In the hospital, be cautious with opioids and monitor oxygen and breathing.","nursing":[{"t":"Teach the patient to use CPAP every night and for naps.","ok":true,"r":"CPAP splints the airway open. It only works when used consistently."},{"t":"Encourage weight loss if the patient is overweight.","ok":true,"r":"Fat around the neck and throat narrows the airway; even modest weight loss lowers apnea events."},{"t":"Teach the patient to avoid alcohol and sedatives at bedtime.","ok":true,"r":"They relax throat muscles further and blunt the arousal that restarts breathing."},{"t":"Give a sleeping pill to improve sleep quality.","ok":false,"r":"Sedatives make the airway collapse more and can turn apneas dangerous."},{"t":"Teach the patient to sleep on their side.","ok":true,"r":"Lying on the back lets the tongue and soft palate fall back into the airway."},{"t":"Encourage sleeping flat on the back without a pillow.","ok":false,"r":"This position makes airway collapse worse."},{"t":"In the hospital, use extra caution with opioids and monitor SpO₂ continuously.","ok":true,"r":"Opioids worsen apnea and respiratory depression in patients with OSA."},{"t":"Tell the patient it's safe to drive long distances if they drink coffee.","ok":false,"r":"Untreated OSA causes dangerous sleepiness. Caffeine doesn't fix it."}]}],"tests":[{"id":"cbc","cat":"labs","name":"CBC with differential","el":false,"normal":{"t":"WBC 7.4 K/µL, Hgb 14.0 g/dL, Hct 42%, platelets 248 K/µL. Differential normal.","ro":[],"s":null}},{"id":"bmp","cat":"labs","name":"Basic metabolic panel","el":false,"normal":{"t":"Na 139, K 4.1, Cl 102, HCO₃ 25 mEq/L; BUN 14, Cr 0.9 mg/dL; glucose 96 mg/dL.","ro":[],"s":null}},{"id":"abg","cat":"labs","name":"Arterial blood gas (room air)","el":false,"normal":{"t":"pH 7.40, PaCO₂ 40 mmHg, PaO₂ 92 mmHg, HCO₃ 24 mEq/L, SaO₂ 97%.","ro":[],"s":null}},{"id":"strep","cat":"labs","name":"Rapid strep / throat culture","el":false,"normal":{"t":"Negative for group A streptococcus.","ro":[],"s":null}},{"id":"bcx","cat":"labs","name":"Blood cultures × 2","el":false,"normal":{"t":"No growth at 48 hours.","ro":[],"s":null}},{"id":"tsh","cat":"labs","name":"Thyroid-stimulating hormone (TSH)","el":false,"normal":{"t":"TSH 2.1 mIU/L (normal).","ro":[],"s":null}},{"id":"psg","cat":"diag","name":"Polysomnography (overnight sleep study)","el":true,"normal":{"t":"AHI 2 events/hr (normal \u003c 5). Lowest SpO₂ 93%.","ro":["osa"],"s":"Normal sleep study"}},{"id":"laryngo","cat":"diag","name":"Flexible laryngoscopy","el":false,"normal":{"t":"Normal epiglottis. Vocal cords move symmetrically. No edema, hematoma, or mucosal tear.","ro":["epi","laryn"],"s":"Normal laryngoscopy"}},{"id":"aspirate","cat":"diag","name":"Needle aspiration, peritonsillar space","el":false,"normal":{"t":"Not performed. No peritonsillar swelling to aspirate.","ro":["pta"],"s":"No peritonsillar collection"}},{"id":"ecg","cat":"diag","name":"12-lead ECG","el":false,"normal":{"t":"Sinus rhythm at the patient's current rate. Normal axis. No hypertrophy or ST changes.","ro":[],"s":null}},{"id":"cxr","cat":"img","name":"Chest X-ray","el":false,"normal":{"t":"Clear lungs. Normal heart size. No air in the neck or mediastinum.","ro":[],"s":null}},{"id":"latneck","cat":"img","name":"Lateral soft-tissue neck X-ray","el":false,"normal":{"t":"Normal epiglottis and prevertebral soft tissue.","ro":["epi"],"s":"Normal epiglottis on neck X-ray"}},{"id":"ctneck","cat":"img","name":"CT neck with contrast","el":false,"normal":{"t":"No abscess. No laryngeal fracture. Normal epiglottis and soft tissues.","ro":["epi","pta","laryn"],"s":"Normal CT neck"}},{"id":"ctface","cat":"img","name":"Maxillofacial CT","el":false,"normal":{"t":"No facial bone fractures.","ro":["facial"],"s":"No facial fractures on CT"}},{"id":"ctcspine","cat":"img","name":"CT cervical spine","el":false,"normal":{"t":"No cervical spine fracture or malalignment.","ro":[],"s":null}}],"cases":[{"id":"u-epi-1","dx":"epi","acute":true,"name":"Marcus Bell","age":42,"sex":"M","setting":"Emergency Department","summary":"Brought in by his wife with a severe sore throat that started this morning and has worsened fast. He is sitting bolt upright, leaning forward, and drooling. His voice sounds muffled.","history":[{"t":"Sore throat began about 8 hours ago. Now so painful he cannot swallow his own saliva.","ro":["osa"],"s":"Acute onset over hours","sup":true},{"t":"No chronic cough, sputum, or shortness of breath with activity before today.","ro":[],"s":null},{"t":"No history of asthma, wheezing, or inhaler use.","ro":[],"s":null},{"t":"Former smoker, quit 15 years ago (10 pack-years).","ro":[],"s":null},{"t":"Wife says he does not snore and sleeps well.","ro":["osa"],"s":"No snoring"},{"t":"Healthy childhood. No recurrent lung infections or digestive problems.","ro":[],"s":null},{"t":"Born overseas; childhood vaccination records (including Hib) are unavailable.","ro":[],"s":null,"sup":true},{"t":"Teaches high school chemistry. Several  124. Otherwise normal.","ro":[],"s":null}},"normal":"The epiglottis is a flap of cartilage that closes over the larynx when you swallow, then opens so air can pass.","broke":"Bacterial infection (classically H. influenzae type b) makes the epiglottis and surrounding tissue swell fast. A swollen epiglottis can seal the airway opening within hours.","clues":"Rapid onset, high fever, drooling, muffled voice, sniffing position, stridor, thumb sign on neck X-ray, no Hib vaccine record.","care":"Airway first. Keep him upright and calm, never put a tongue blade or swab in the throat, and have intubation and emergency surgical airway equipment at the bedside. IV antibiotics after the airway is secured.","nursing":[{"t":"Let him stay sitting upright in the position he chose; don't make him lie down.","ok":true,"r":"Sitting upright and leaning forward keeps the airway as open as possible. Lying flat can let the swollen epiglottis fall back and block the airway."},{"t":"Keep intubation and emergency surgical airway (cricothyrotomy/tracheostomy) equipment at the bedside.","ok":true,"r":"Complete obstruction can happen suddenly. A swollen epiglottis makes intubation hard, so a surgical airway may be needed."},{"t":"Use a tongue depressor to look at his throat and swab it for a culture.","ok":false,"r":"Putting anything in the throat can trigger laryngospasm and complete obstruction. The throat is examined only in a controlled setting with the airway team ready."},{"t":"Keep him calm and hold off on nonurgent procedures until the airway is secured.","ok":true,"r":"Agitation raises oxygen demand and turbulent airflow and can tip a narrowed airway into complete obstruction."},{"t":"Give a sedative to help him relax.","ok":false,"r":"Sedation depresses the drive to breathe and relaxes the airway muscles, which can cause sudden obstruction."},{"t":"Send him to radiology by himself for the neck X-ray.","ok":false,"r":"He should never be left without staff who can manage the airway. Use a portable X-ray or send him with airway-capable staff and equipment."},{"t":"Start IV antibiotics as ordered once the airway is secure.","ok":true,"r":"Epiglottitis is bacterial (classically H. influenzae type b), so IV antibiotics treat the cause. Securing the airway comes first."},{"t":"Encourage sips of water to soothe his throat.","ok":false,"r":"He can't swallow his own saliva, so oral fluids risk aspiration. Keep him NPO and hydrate with IV fluids."}],"variant":"Adult, no Hib vaccine record"},{"id":"u-epi-2","dx":"epi","acute":true,"name":"Lily Hartman","age":4,"sex":"F","setting":"Emergency Department","summary":"Her parents rushed her in after a fever spiked this afternoon. Within a few hours she stopped swallowing, started drooling, and now refuses to lie down.","history":[{"t":"Fever and sore throat started this afternoon; within 4 hours she stopped swallowing and began drooling.","ro":["osa"],"s":"Abrupt onset over hours","sup":true},{"t":"Her parents chose not to vaccinate; she has had no childhood immunizations.","ro":[],"s":null},{"t":"No falls, injuries, or blows to the face or neck.","ro":["facial","laryn"],"s":"No trauma"},{"t":"Her parents say she breathes quietly at night and never snores.","ro":["osa"],"s":"No snoring"},{"t":"Attends preschool; a classmate had hand-foot-and-mouth disease last week.","ro":[],"s":null},{"t":"No barking cough. She has barely coughed at all.","ro":[],"s":null},{"t":"Had a rash after amoxicillin last year.","ro":[],"s":null}],"vitals":[{"t":"Temp 104.0 °F (40.0 °C)","ro":[],"s":null},{"t":"HR 158 bpm","ro":[],"s":null},{"t":"RR 36/min","ro":[],"s":null},{"t":"BP 96/58 mmHg","ro":[],"s":null},{"t":"SpO₂ 92% on room air","ro":[],"s":null}],"physical":[{"t":"Sitting forward on her mother's lap in a tripod position, chin thrust out, drooling, refusing to lie down.","ro":[],"s":"Tripod position and drooling","sup":true},{"t":"Soft, low-pitched inspiratory stridor. Quiet, muffled voice; she won't talk.","ro":[],"s":"Stridor with muffled voice","sup":true},{"t":"Looks toxic and anxious. Skin flushed and hot.","ro":[],"s":null},{"t":"Face and neck without bruising, swelling, or deformity.","ro":["facial","laryn"],"s":"No facial or neck injury"},{"t":"The provider has deferred the mouth exam until she is in the OR with the airway team.","ro":[],"s":null},{"t":"Lungs: transmitted upper-airway sounds; no crackles.","ro":[],"s":null}],"tests":{"cbc":{"t":"WBC 24,100/µL with 84% neutrophils and bands (left shift).","ro":[],"s":null,"sup":true},"abg":{"t":"Deferred. An arterial stick would upset her and could trigger complete obstruction. She is on continuous pulse oximetry.","ro":[],"s":null},"bcx":{"t":"Preliminary: gram-negative coccobacilli, identified as Haemophilus influenzae type b.","ro":[],"s":null,"sup":true},"strep":{"t":"Not collected. Swabbing the throat could trigger laryngospasm.","ro":[],"s":null},"latneck":{"t":"Portable film taken upright on her mother's lap: swollen, rounded epiglottis ('thumb sign').","ro":[],"s":null,"sup":true},"laryngo":{"t":"Done in the OR with the airway team ready: cherry-red, swollen epiglottis. Larynx otherwise intact. No bulge above either tonsil.","ro":["laryn","pta"],"s":"Scope: no laryngeal injury, no peritonsillar bulge","sup":true},"ctneck":{"t":"Not done. Lying flat in a scanner could close her airway.","ro":[],"s":null},"aspirate":{"t":"Not performed. Manipulating the mouth of a child with this presentation risks complete obstruction.","ro":[],"s":null},"cxr":{"t":"Lungs clear. Normal heart size.","ro":[],"s":null}},"clues":"No vaccines (no Hib protection), abrupt onset, high fever, tripod position, drooling, stridor with a muffled voice, thumb sign, H. influenzae type b in the blood.","variant":"Unvaccinated preschooler"},{"id":"u-epi-3","dx":"epi","acute":true,"name":"Ruth Callahan","age":67,"sex":"F","setting":"Emergency Department","summary":"Seen at urgent care yesterday for a sore throat and told her throat 'looks fine.' Today the pain is unbearable, her voice is muffled, and she's spitting saliva into a cup.","history":[{"t":"Severe sore throat for 1 day. The pain feels far worse than what her provider saw in her throat.","ro":["osa"],"s":"Severe sore throat, out of proportion to the exam","sup":true},{"t":"Type 2 diabetes; last A1C 9.2%.","ro":[],"s":null},{"t":"At urgent care yesterday: throat 'looked normal,' rapid strep negative, sent home with lozenges.","ro":[],"s":null},{"t":"No injury to the face or neck.","ro":["facial","laryn"],"s":"No trauma"},{"t":"She sleeps well and wakes rested; her late husband never complained of snoring.","ro":["osa"],"s":"No snoring, wakes rested"},{"t":"Recently visited her grandchildren, who had colds.","ro":[],"s":null}],"vitals":[{"t":"Temp 101.8 °F (38.8 °C)","ro":[],"s":null},{"t":"HR 112 bpm","ro":[],"s":null},{"t":"RR 22/min","ro":[],"s":null},{"t":"BP 148/86 mmHg","ro":[],"s":null},{"t":"SpO₂ 95% on room air","ro":[],"s":null}],"physical":[{"t":"Tender anterior neck at the level of the hyoid; moving the larynx side to side causes sharp pain.","ro":[],"s":"Tender larynx and hyoid","sup":true},{"t":"Oropharynx only mildly red. Tonsils normal size. Uvula midline.","ro":["pta"],"s":"Uvula midline, no tonsillar bulge","sup":true},{"t":"Muffled voice. Spitting saliva into a cup instead of swallowing.","ro":[],"s":"Muffled voice and drooling","sup":true},{"t":"No stridor at rest. Prefers to sit leaning forward.","ro":[],"s":null},{"t":"Face symmetric. No bruising, swelling, or step-off.","ro":["facial"],"s":"Normal facial exam"},{"t":"Lungs clear.","ro":[],"s":null}],"tests":{"cbc":{"t":"WBC 17,600/µL with 88% neutrophils.","ro":[],"s":null,"sup":true},"bmp":{"t":"Na 136, K 4.4, HCO₃ 23 mEq/L; BUN 18, Cr 1.0 mg/dL; glucose 248 mg/dL.","ro":[],"s":null},"laryngo":{"t":"Swollen, red epiglottis and aryepiglottic folds narrowing the airway opening by about half. No mucosal tear or hematoma.","ro":["laryn"],"s":"Scope: no laryngeal injury","sup":true},"latne  (15 pack-years).","ro":[],"s":null},{"t":"No chronic cough or sputum.","ro":[],"s":null},{"t":"No sore throat, fever, or recent injury.","ro":["epi","pta","facial","laryn"],"s":"No sore throat, fever, or injury"},{"t":"No wheezing episodes or inhaler use.","ro":[],"s":null},{"t":"Healthy childhood.","ro":[],"s":null}],"vitals":[{"t":"Temp 98.2 °F (36.8 °C)","ro":[],"s":null},{"t":"HR 84 bpm","ro":[],"s":null},{"t":"RR 16/min","ro":[],"s":null},{"t":"BP 162/98 mmHg","ro":[],"s":null,"sup":true},{"t":"SpO₂ 95% on room air (awake)","ro":[],"s":null},{"t":"BMI 38. Neck circumference 18.5 in (47 cm).","ro":[],"s":null,"sup":true}],"physical":[{"t":"Crowded oropharynx, Mallampati class IV, large tongue. Tonsils symmetric, uvula midline.","ro":["pta"],"s":"Uvula midline, tonsils symmetric","sup":true},{"t":"Lungs clear. No crackles or wheezes.","ro":[],"s":null},{"t":"Mild ankle swelling, both legs.","ro":[],"s":null},{"t":"Face and neck without injury.","ro":["facial","laryn"],"s":"No injury"}],"tests":{"cbc":{"t":"Hgb 16.9 g/dL, Hct 51% (mildly elevated). WBC and platelets normal.","ro":[],"s":null},"psg":{"t":"AHI 42 events/hr (severe OSA, ≥ 30). Lowest SpO₂ 74%. Repeated airway collapse with arousals.","ro":[],"s":null}},"normal":"During sleep, the throat muscles relax but the airway stays open enough to breathe.","broke":"Extra soft tissue in the neck and a crowded throat, made worse by alcohol and sedatives, let the upper airway collapse during sleep. Oxygen drops, the brain jolts him awake, and the cycle repeats all night.","clues":"Loud snoring, witnessed apneas, daytime sleepiness, BMI 38, 18.5-inch neck, resistant hypertension, AHI 42 on sleep study.","care":"CPAP teaching and mask fitting, weight loss, avoiding alcohol and sedatives at night, and sleeping on his side. Driving safety matters. Before any surgery or sedation, flag the anesthesia team: OSA patients are at high risk of airway obstruction after opioids.","nursing":[{"t":"Teach nightly CPAP use and help him get a mask that fits.","ok":true,"r":"CPAP splints the airway open during sleep. Poor mask fit is a major reason people stop using it."},{"t":"Encourage weight loss.","ok":true,"r":"Fat around the neck and throat narrows the airway. Weight loss can reduce how severe the OSA is."},{"t":"Teach him to avoid alcohol and sedating sleep aids at bedtime.","ok":true,"r":"Alcohol and sedatives relax the throat muscles and blunt the brain's wake-up response to apnea."},{"t":"Flag his OSA to the anesthesia team before any surgery and monitor him closely when he gets opioids.","ok":true,"r":"Opioids and anesthesia relax the airway and depress breathing. OSA patients are at high risk of obstruction after surgery."},{"t":"Encourage him to sleep on his back with one flat pillow.","ok":false,"r":"Lying on the back lets the tongue and soft tissue fall back and block the airway. Side-lying is better."},{"t":"Tell him it's fine to drive as long as he drinks coffee first.","ok":false,"r":"He already fell asleep at a red light. He should avoid driving until his OSA is treated and his sleepiness improves."},{"t":"Use supplemental oxygen at night instead of CPAP.","ok":false,"r":"Oxygen doesn't keep the airway open, so the apneas and arousals continue."},{"t":"Give a prescription sleeping pill so he stays asleep through the night.","ok":false,"r":"Hypnotics relax the airway and delay arousal from apneas, which makes OSA more dangerous."}],"variant":"Drowsy driver, classic risk factors"},{"id":"u-osa-2","dx":"osa","acute":false,"name":"Denise Carter","age":54,"sex":"F","setting":"Sleep Clinic","summary":"Referred for blood pressure that stays high on three medications. She wakes with headaches, feels exhausted all day, and her husband is worried about how she breathes at night.","history":[{"t":"Her husband has watched her stop breathing for 'what feels like 30 seconds,' then gasp, several times a night.","ro":["epi","pta","facial","laryn"],"s":"Witnessed apneas with gasping","sup":true},{"t":"Wakes with headaches most mornings. Nodded off at a red light last week.","ro":[],"s":null},{"t":"Went through menopause 3 years ago; her snoring got much worse since.","ro":[],"s":null},{"t":"Takes 3 medications for blood pressure and it's still high.","ro":[],"s":null},{"t":"No sore throat, fever, or trouble swallowing.","ro":["epi","pta"],"s":"No sore throat or fever"},{"t":"No injuries to the face or neck.","ro":["facial","laryn"],"s":"No trauma"},{"t":"Drinks a glass of wine most nights to help her sleep.","ro":[],"s":null}],"vitals":[{"t":"Temp 98.2 °F (36.8 °C)","ro":[],"s":null},{"t":"HR 78 bpm","ro":[],"s":null},{"t":"RR 16/min","ro":[],"s":null},{"t":"BP 158/96 mmHg","ro":[],"s":null},{"t":"SpO₂ 95% on room air","ro":[],"s":null}],"physical":[{"t":"BMI 33. Neck circumference 16.5 in (42 cm).","ro":[],"s":"Large neck circumference","sup":true},{"t":"Crowded oropharynx: tongue base high, only the soft palate visible (Mallampati IV).","ro":[],"s":"Crowded oropharynx","sup":true},{"t":"Small, set-back lower jaw.","ro":[],"s":null},{"t":"Lungs clear; heart regular.","ro":[],"s":null},{"t":"Tonsils small; uvula midline.","ro":["pta"],"s":"Uvula midline, small tonsils"}],"tests":{"psg":{"t":"AHI 34 events/hr (severe). Lowest SpO₂ 78%. Events end with brief arousals.","ro":[],"s":null,"sup":true},"ecg":{"t":"Sinus rhythm. Left ventricular hypertrophy.","ro":[],"s":null},"tsh":{"t":"TSH 2.4 mIU/L (normal).","ro":[],"s":null}},"clues":"Witnessed apneas, morning headaches, drowsy driving, resistant hypertension, large neck, crowded airway, nightly alcohol, severe AHI on sleep study.","variant":"Woman with resistant hypertension"},{"id":"u-osa-3","dx":"osa","acute":false,"name":"Ethan Ruiz","age":6,"sex":"M","setting":"Pediatric Clinic","summary":"His teacher says he can't pay attention, and he has started wetting the bed again. His parents mention he snores every night and sometimes seems to stop breathing.","history":[{"t":"Loud snoring every night for over a year, with pauses and snorts; he sleeps with his neck stretched back.","ro":["epi","pta"],"s":"Nightly symptoms for over a year","sup":true},{"t":"His teacher reports trouble paying attention and frequent meltdowns.","ro":[],"s":null},{"t":"Started wetting the bed again this year.","ro":[],"s":null},{"t":"No injuries.","ro":["facial","laryn"],"s":"No trauma"},{"t":"Born at 39 weeks; no NICU stay.","ro":[],"s":null},{"t":"Breathes through his mouth; frequent colds in winter.","ro":[],"s":null},{"t":"No fever or sore throat now.","ro":["epi","pta"],"s":"No sore throat or fever"}],"vitals":[{"t":"Temp 98.4 °F (36.9 °C)","ro":[],"s":null},{"t":"HR 92 bpm","ro":[],"s":null},{"t":"RR 20/min","ro":[],"s":null},{"t":"BP 100/62 mmHg","ro":[],"s":null},{"t":"SpO₂ 98% on room air","ro":[],"s":null}],"physical":[{"t":"Both tonsils very large and nearly touching in the middle (4+), symmetric. Uvula midline.","ro":["pta"],"s":"Large symmetric tonsils, uvula midline","sup":true},{"t":"Open mouth with dark circles under his eyes.","ro":[],"s":null},{"t":"Height and weight at the 20th percentile.","ro":[],"s":null},{"t":"Lungs clear.","ro":[],"s":null},{"t":"Face normal; no tenderness or deformity.","ro":["facial"],"s":"Normal facial exam"}],"tests":{"psg":{"t":"Pediatric study: AHI 12 events/hr (severe for a child; normal \u003c 1). Lowest SpO₂ 84%.","ro":[],"s":null,"sup":true},"latneck":{"t":"Enlarged adenoids narrowing the airway behind the nose. Epiglottis normal.","ro":["epi"],"s":"Normal epiglottis on neck X-ray","sup":true},"strep":{"t":"Negative for group A streptococcus.","ro":[],"s":null},"tsh":{"t":"TSH 1.8 mIU/L (normal).","ro":[],"s":null}},"clues":"Nightly snoring with pauses, daytime behavior problems, bedwetting, mouth breathing, large tonsils and adenoids, abnormal pediatric sleep study.","care":"Children with OSA usually have big tonsils and adenoids, so the main treatment is surgery to remove them (adenotonsillectomy). After surgery, watch for bleeding and airway problems.","nursing":[{"t":"Prepare the family for adenotonsillectomy, the first-line treatment for most children with OSA.","ok":true,"r":"Removing enlarged tonsils and adenoids opens the airway and cures OSA in most children."},{"t":"After surgery, watch for frequent swallowing, which can signal bleeding.","ok":true,"r":"Blood trickling down the throat makes children swallow repeatedly."},{"t":"After surgery, give red or purple popsicles and let him use a straw.","ok":false,"r":"Red/purple colors can be mistaken for blood, and straws can dislodge clots. Offer light-colored cool fluids without a straw."},{"t":"Monitor oxygen saturation closely the night after surgery.","ok":true,"r":"Children with severe OSA can still have airway obstruction and low oxygen right after surgery."},{"t":"Tell the parents the behavior problems are unrelated to his sleep.","ok":false,"r":"Broken sleep in children often shows up as inattention, hyperactivity, and bedwetting rather than daytime sleepiness."},{"t":"Give a sedating antihistamine at bedtime to help him sleep.","ok":false,"r":"Sedatives relax the airway muscles and make obstruction worse."},{"t":"Teach the parents to watch for snoring or pauses returning.","ok":true,"r":"Symptoms that come back may mean the airway is narrowing again and needs re-evaluation."}],"variant":"Child with big tonsils and adenoids"}]},{"id":"lower","name":"Lower Respiratory","sub":"Noninfectious","color":"#62a8f0","blurb":"Chronic and structural problems of the airways, alveoli, interstitium, and pulmonary vessels.","hint":"Ask what is failing: airway smooth muscle, mucus clearance, alveolar walls, the interstitium, the pulmonary vessels, or cell growth.","dx":[{"id":"asthma","name":"Asthma / status asthmaticus","normal":"Airways stay open and calm. Smooth muscle around the bronchioles is relaxed, and the lining makes only a thin layer of mucus.","broke":"Triggers set off airway inflammation: the bronchioles swell, tighten (bronchospasm), and fill with thick mucus. Airflow out is blocked, so air gets trapped. It's reversible, but an attack that doesn't respond to bronchodilators (status asthmaticus) can exhaust the patient and cause respiratory failure.","care":"Rescue bronchodilator first, oxygen, and systemic steroids. Watch for a silent chest, drowsiness, or a rising PaCO₂: signs the patient is tiring. Long term, teach trigger avoidance, daily controller use, and inhaler technique.","nursing":[{"t":"Give a short-acting beta-agonist (albuterol) first for acute bronchospasm.","ok":true,"r":"Albuterol relaxes airway smooth muscle within minutes. It's the rescue drug."},{"t":"Sit the patient upright and give oxygen to keep SpO₂ at goal (usually ≥ 92%).","ok":true,"r":"Upright positioning helps the diaphragm; oxygen treats hypoxemia from mismatched ventilation."},{"t":"Give systemic corticosteroids as ordered.","ok":true,"r":"Steroids reduce the airway inflammation that drives the attack. They take hours to work, so they're given early."},{"t":"Watch for a 'silent chest,' drowsiness, or a rising PaCO₂.","ok":true,"r":"These mean the patient is too tired or too obstructed to move air: impending respiratory failure."},{"t":"Give a long-acting beta-agonist (salmeterol) for quick relief.","ok":false,"r":"Long-acting agents start too slowly for rescue and are never used alone in asthma."},{"t":"Give a sedative to calm the anxious patient.","ok":false,"r":"Sedation depresses breathing in a patient who is already struggling to ventilate."},{"t":"Teach trigger avoidance and correct inhaler and spacer technique.","ok":true,"r":"Avoiding triggers and using inhalers correctly prevents future attacks."},{"t":"Teach the patient to stop the daily controller inhaler once symptoms are gone.","ok":false,"r":"The controller treats the underlying inflammation; stopping it is a common reason attacks return."}]},{"id":"cb","name":"COPD: chronic bronchitis","normal":"Airway lining cells make a thin layer of mucus, and tiny hairs (cilia) sweep it up and out.","broke":"Years of smoke or other irritants enlarge the mucus glands and damage the cilia. Thick mucus clogs and narrows the airways, causing a daily productive cough, trapped air, low oxygen, and high CO₂. Chronic hypoxemia tightens the pulmonary vessels and strains the right heart.","care":"Titrate oxygen to SpO₂ 88–92%, help clear secretions, stop smoke exposure, keep vaccines up to date, and watch for right-sided heart failure and infections.","nursing":[{"t":"Give oxygen titrated to SpO₂ 88–92%.","ok":true,"r":"This prevents dangerous hypoxemia without pushing up CO₂ in a patient who retains it."},{"t":"Teach controlled (huff) coughing and encourage fluids to loosen mucus.","ok":true,"r":"Thick mucus is the core problem. Effective coughing and hydration help move it."},{"t":"Help the patient stop smoking or avoid the smoke exposure that caused the damage.","ok":true,"r":"Removing the irritant is the only thing that slows the decline in lung function."},{"t":"Watch for JVD, leg edema, and weight gain.","ok":true,"r":"Chronic hypoxemia can cause right-sided heart failure (cor pulmonale)."},{"t":"Give high-flow oxygen to bring SpO₂ to 100%.","ok":false,"r":"Too much oxygen can worsen CO₂ retention in some COPD patients."},{"t":"Restrict fluids so the secretions dry up.","ok":false,"r":"Dehydration makes mucus thicker and harder to clear."},{"t":"Keep pneumococcal and yearly flu vaccines up to date.","ok":true,"r":"Infections are the most common trigger of exacerbations."},{"t":"Keep the patient flat in bed to rest the lungs.","ok":false,"r":"Lying flat makes breathing harder and lets secretions pool. Keep the head of the bed up."}]},{"id":"emph","name":"COPD: emphysema","normal":"Millions of thin-walled alveoli give a huge surface for gas exchange, and elastic tissue helps them recoil to push air out.","broke":"Enzymes released during chronic inflammation (or a lack of the protective protein alpha-1 antitrypsin) destroy alveolar walls. Air spaces merge into large, floppy sacs that lose their recoil. Air gets trapped, the chest becomes barrel-shaped, and gas exchange (DLCO) falls.","care":"Teach pursed-lip breathing and the tripod position, titrate oxygen to 88–92%, support nutrition with small frequent meals, and pace activities. Sudden worse breathlessness can mean a ruptured bulla (pneumothorax).","nursing":[{"t":"Teach pursed-lip breathing.","ok":true,"r":"It keeps small airways open longer on exhalation, letting trapped air out."},{"t":"Encourage the tripod (leaning-forward) position during breathlessness.","ok":true,"r":"Leaning forward lets the accessory muscles and diaphragm work more efficiently."},{"t":"Offer small, frequent, high-calorie, high-protein meals.","ok":true,"r":"Breathing burns many calories, and a full stomach pushes on the diaphragm."},{"t":"Give oxygen titrated to SpO₂ 88–92%.","ok":true,"r":"Corrects hypoxemia without worsening CO₂ retention."},{"t":"Encourage three large meals a day to build weight.","ok":false,"r":"Large meals cause fullness that makes breathing harder."},{"t":"Encourage the patient to finish all activities quickly in the morning.","ok":false,"r":"Rushing causes exhaustion. Pacing activities with rest periods conserves energy."},{"t":"Refer to pulmonary rehabilitation.","ok":true,"r":"Rehab improves exercise tolerance, breathlessness, and quality of life."},{"t":"Teach that sudden chest pain with worse breathlessness can wait until the next appointment.","ok":false,"r":"Sudden chest pain and dyspnea may mean a bulla ruptured (pneumothorax). That's an emergency."}]},{"id":"cf","name":"Cystic fibrosis","normal":"The CFTR protein moves chloride (and with it water) across cell membranes, keeping mucus and digestive secretions thin and slippery.","broke":"Two faulty CFTR genes mean chloride can't move normally. Mucus in the lungs, pancreas, sinuses, and reproductive tract becomes thick and sticky. Lungs get plugged and chronically infected; pancreatic enzymes can't reach the gut, so fat isn't absorbed; sweat is very salty.","care":"Daily airway clearance, pancreatic enzymes with every meal and snack, a high-calorie, high-fat, extra-salt diet with fat-soluble vitamins, and strict infection control.","nursing":[{"t":"Do airway clearance (vest therapy or chest physiotherapy) before meals.","ok":true,"r":"Loosening and clearing mucus improves breathing; doing it before meals avoids vomiting."},{"t":"Give pancreatic enzymes with every meal and snack.","ok":true,"r":"Enzymes replace what the blocked pancreas can't deliver, so fat and protein can be absorbed."},{"t":"Encourage a high-calorie, high-protein, high-fat diet with extra salt.","ok":true,"r":"Malabsorption and the work of breathing raise needs; salty sweat causes sodium loss."},{"t":"Keep the patient at least 6 feet away from other patients with CF.","ok":true,"r":"People with CF can pass dangerous bacteria (like Pseudomonas and Burkholderia) to each other."},{"t":"Teach a low-fat diet to reduce greasy stools.","ok":false,"r":"Restricting fat worsens malnutrition. Enzymes, not diet restriction, fix greasy stools."},{"t":"Give the enzymes once a day at bedtime.","ok":false,"r":"Enzymes only work when taken with food."},{"t":"Give fat-soluble vitamins (A, D, E, K).","ok":true,"r":"Fat malabsorption causes deficiencies of these vitamins."},{"t":"Restrict salt intake.","ok":false,"r":"Patients with CF lose large amounts of salt in sweat and need extra."}]},{"id":"pah","name":"Pulmonary arterial hypertension","normal":"The pulmonary arteries are low-pressure, stretchy vessels. The right ventricle pumps blood through them easily.","broke":"The small pulmonary arteries thicken and narrow (from genes, drugs like stimulants, connective tissue disease, and other causes). Pressure in the pulmonary circuit climbs, the right ventricle thickens and then fails, and less blood reaches the left heart. That causes exertional breathlessness, fainting, and right-sided heart failure.","care":"Oxygen, energy conservation, monitoring for right heart failure, and never interrupting continuous prostacyclin infusions. Avoid fluid overloading and vasoconstricting decongestants.","nursing":[{"t":"Give oxygen to prevent hypoxemia.","ok":true,"r":"Low oxygen tightens pulmonary vessels and raises the pressure further."},{"t":"Never interrupt a continuous IV or subcutaneous prostacyclin (e.g., epoprostenol) infusion.","ok":true,"r":"These drugs have very short half-lives; a pause can cause rebound pulmonary hypertension and death."},{"t":"Teach energy conservation and to avoid heavy exertion and high altitudes.","ok":true,"r":"The right ventricle can't raise output much; overexertion can cause syncope."},{"t":"Monitor for edema, weight gain, and JVD.","ok":true,"r":"These are signs of right ventricular failure."},{"t":"Encourage heavy weightlifting to build stamina.","ok":false,"r":"Straining and heavy exertion can cause syncope or sudden death in PAH."},{"t":"Recommend over-the-counter decongestants for colds.","ok":false,"r":"Decongestants constrict vessels and can raise pulmonary pressure."},{"t":"Teach reliable contraception when taking endothelin receptor antagonists.","ok":true,"r":"Drugs like bosentan and ambrisentan cause birth defects, and pregnancy itself is very high risk with PAH."},{"t":"Give extra IV fluid boluses to raise blood pressure.","ok":false,"r":"A failing right ventricle can't handle large volumes; boluses can worsen failure."}]},{"id":"ipf","name":"Pulmonary fibrosis","normal":"The interstitium (the thin tissue between alveoli and capillaries) is delicate, so oxygen crosses easily and the lungs stretch freely.","broke":"Repeated injury (unknown cause, dust, drugs, or autoimmune disease) leads to scarring of the interstitium. The lungs get stiff and small (restrictive), and the thick walls slow oxygen transfer, especially with exercise. Scarring is permanent.","care":"Oxygen especially with activity, energy conservation, vaccines, removing any known cause, and watching for sudden worsening. Scarring doesn't reverse.","nursing":[{"t":"Give oxygen and check SpO₂ with activity, not just at rest.","ok":true,"r":"Oxygen often drops sharply with exertion because the scarred interstitium slows diffusion."},{"t":"Teach energy conservation and pacing.","ok":true,"r":"Stiff lungs make every breath work harder; pacing reduces breathlessness."},{"t":"Keep flu, pneumococcal, and COVID vaccines up to date.","ok":true,"r":"Infections can trigger sudden, sometimes fatal, worsening."},{"t":"Stop or avoid the cause when one is known (a drug, dust, or mold exposure).","ok":true,"r":"Removing the cause can stop scarring from progressing."},{"t":"Tell the patient the scarring will reverse once oxygen is started.","ok":false,"r":"Fibrosis is permanent. Treatment aims to slow progression and relieve symptoms."},{"t":"Use bronchodilators as the main treatment.","ok":false,"r":"The problem is stiff, scarred tissue, not narrowed airways."},{"t":"Report a sudden increase in breathlessness or a fall in SpO₂.","ok":true,"r":"Acute exacerbations of pulmonary fibrosis are serious and need prompt care."},{"t":"Tell a smoker that quitting won't matter at this stage.","ok":false,"r":"Quitting smoking still helps at any stage."}]},{"id":"lca","name":"Lung cancer","normal":"Airway and lung cells divide in a controlled way and repair damage from what we inhale.","broke":"Damage to the DNA of lung cells (smoke, radon, asbestos, secondhand smoke, or genetic mutations) causes uncontrolled growth. The tumor can block airways, bleed, cause effusions, compress the superior vena cava, spread to lymph nodes, and release hormone-like substances (hypercalcemia, SIADH).","care":"Watch for oncologic emergencies (SVC syndrome, hypercalcemia, SIADH, airway obstruction), manage symptoms and pain, support the patient through diagnosis and staging, involve palliative care early, and support smoking cessation.","nursing":[{"t":"Monitor for SVC syndrome, hypercalcemia, and SIADH.","ok":true,"r":"These complications of lung cancer can be life-threatening and need fast treatment."},{"t":"Manage pain and breathlessness; elevate the head of the bed.","ok":true,"r":"Symptom relief is a core part of lung cancer care at every stage."},{"t":"Support the patient through diagnosis and staging, and involve palliative care early.","ok":true,"r":"Early palliative care improves quality of life, mood, and sometimes survival."},{"t":"Offer smoking cessation help, even after diagnosis.","ok":true,"r":"Quitting improves healing, treatment response, and breathing."},{"t":"Tell a smoker that a cough lasting more than 3 weeks is normal for them.","ok":false,"r":"A new or changed cough in a smoker is a classic warning sign of lung cancer."},{"t":"Have the patient lie flat to ease breathing.","ok":false,"r":"Lying flat increases breathlessness, especially with effusions or SVC compression."},{"t":"After bronchoscopy or needle biopsy, watch for bleeding and signs of pneumothorax.","ok":true,"r":"Both are known complications of lung biopsy."},{"t":"Avoid talking about prognosis unless the family brings it up first.","ok":false,"r":"Patients deserve honest, compassionate information; ask what they want to know."}]}],"tests":[{"id":"cbc","cat":"labs","name":"CBC with differential","el":false,"normal":{"t":"WBC 7.4 K/µL, Hgb 14.0 g/dL, Hct 42%, platelets 248 K/µL. Differential normal.","ro":[],"s":null}},{"id":"bmp","cat":"labs","name":"Basic metabolic panel + calcium","el":false,"normal":{"t":"Na 139, K 4.1, Cl 102, HCO₃ 25 mEq/L; BUN 14, Cr 0.9 mg/dL; glucose 96 mg/dL; Ca 9.4 mg/dL.","ro":[],"s":null}},{"id":"abg","cat":"labs","name":"Arterial blood gas (room air)","el":false,"normal":{"t":"pH 7.40, PaCO₂ 40 mmHg, PaO₂ 92 mmHg, HCO₃ 24 mEq/L, SaO₂ 97%.","ro":[],"s":null}},{"id":"bnp","cat":"labs","name":"BNP","el":false,"normal":{"t":"42 pg/mL (normal \u003c 100).","ro":[],"s":null}},{"id":"bcx","cat":"labs","name":"Blood cultures × o the face or neck.","ro":[],"s":null},{"t":"No sore throat or trouble swallowing.","ro":[],"s":null},{"t":"Partner reports no snoring or pauses in breathing.","ro":[],"s":null}],"vitals":[{"t":"Temp 98.9 °F (37.2 °C)","ro":[],"s":null},{"t":"HR 132 bpm","ro":[],"s":null,"sup":true},{"t":"RR 34/min","ro":[],"s":null,"sup":true},{"t":"BP 148/90 mmHg","ro":[],"s":null},{"t":"SpO₂ 88% on room air","ro":[],"s":null,"sup":true},{"t":"Pulsus paradoxus 18 mmHg","ro":[],"s":null,"sup":true}],"physical":[{"t":"Tripod position. Using neck and intercostal accessory muscles. Speaking 2–3 words at a time.","ro":[],"s":null,"sup":true},{"t":"Diffuse expiratory and inspiratory wheezes. Prolonged expiration. Air movement is decreasing.","ro":["ipf","pah","lca"],"s":"Diffuse wheezing (lower airways)","sup":true},{"t":"Diaphoretic and anxious.","ro":[],"s":null},{"t":"Oropharynx normal, uvula midline. No stridor.","ro":[],"s":null},{"t":"No crackles.","ro":["ipf"],"s":"No crackles"}],"tests":{"cbc":{"t":"WBC 11,200/µL. Eosinophils 9% (elevated).","ro":[],"s":null},"abg":{"t":"pH 7.34, PaCO₂ 46 mmHg, PaO₂ 58 mmHg, HCO₃ 24 mEq/L.","ro":[],"s":null},"ige":{"t":"IgE 640 IU/mL (elevated). Eosinophils 9%.","ro":[],"s":null},"sputum":{"t":"Many eosinophils. Curschmann spirals and Charcot-Leyden crystals.","ro":[],"s":null},"peak":{"t":"PEF 28% of personal best. Rises only to 41% after continuous nebulized albuterol.","ro":[],"s":null},"ecg":{"t":"Sinus tachycardia 132. Otherwise normal.","ro":[],"s":null},"cxr":{"t":"Hyperinflated lungs with flattened diaphragms. No pneumothorax or infiltrate.","ro":[],"s":null},"ctchest":{"t":"Hyperinflation, bronchial wall thickening, scattered mucus plugs. No emphysema, bronchiectasis, fibrosis, or mass.","ro":["emph","ipf","cf","lca"],"s":"CT: no emphysema, bronchiectasis, or mass","sup":true}},"normal":"Healthy airways stay open, and the smooth muscle around the bronchi stays relaxed.","broke":"A trigger (a cold, a new cat, no controller steroid) set off airway inflammation, smooth-muscle spasm, and mucus plugging. Air gets in but can't get out. Status asthmaticus is an attack that does not respond to usual rescue treatment.","clues":"Lifelong episodic history, prior intubation, eosinophilia and high IgE, PEF under 40% with poor response, normal breathing between attacks.","care":"Her PaCO₂ of 46 is a danger sign. A tiring asthmatic's CO₂ should be low, so a 'normal' or rising CO₂ means she's failing. Fewer wheezes with less air movement (a quiet chest) is an emergency. Give oxygen, continuous bronchodilators, and IV steroids, and prepare for intubation.","nursing":[{"t":"Give oxygen to reach the ordered SpO₂ target.","ok":true,"r":"She is hypoxemic at 88%. Oxygen treats hypoxemia while the bronchodilators work."},{"t":"Give continuous or back-to-back nebulized albuterol with ipratropium as ordered.","ok":true,"r":"Short-acting bronchodilators relax airway smooth muscle quickly. Ipratropium adds more bronchodilation in severe attacks."},{"t":"Give systemic corticosteroids early, as ordered.","ok":true,"r":"Steroids reduce the airway inflammation driving the attack. They take hours to work, so they're started right away."},{"t":"Treat a rising PaCO₂ or fading wheezes as signs of respiratory failure, and prepare for intubation.","ok":true,"r":"As she tires, CO₂ rises. Less wheezing with less air movement means less air is getting through, not that she's improving."},{"t":"Give a sedative to ease her anxiety.","ok":false,"r":"Sedation depresses the drive to breathe in a patient who is already tiring and can bring on respiratory arrest."},{"t":"Have her use her inhaled corticosteroid (fluticasone) now as a rescue treatment.","ok":false,"r":"Inhaled corticosteroids are long-term controllers and don't relieve an acute attack. She needs bronchodilators and systemic steroids."},{"t":"Have her lie flat so she can rest.","ok":false,"r":"Sitting upright lets the diaphragm move better and reduces the work of breathing."},{"t":"Before discharge, teach controller adherence, trigger avoidance, and a written asthma action plan.","ok":true,"r":"Running out of her controller and a new cat helped trigger this attack. Education prevents the next one."}],"variant":"Severe attack, out of controller"},{"id":"l-asthma-2","dx":"asthma","acute":true,"name":"DeShawn Miller","age":19,"sex":"M","setting":"Emergency Department","summary":"Three back-to-back albuterol nebulizers haven't helped. An hour ago he was wheezing loudly; now he's quieter, speaking one or two words at a time, and getting drowsy.","history":[{"t":"Breathing problems since age 6. Between attacks he plays pickup basketball with no symptoms.","ro":["cb","emph","ipf","pah"],"s":"Episodic symptoms, normal between attacks","sup":true},{"t":"This attack: 2 days of worsening wheeze after a cold. Three back-to-back albuterol nebulizers haven't helped.","ro":[],"s":"Not responding to bronchodilators","sup":true},{"t":"Two ICU admissions in the past; he was intubated once at age 15.","ro":[],"s":null},{"t":"Ran out of his daily inhaled steroid 2 months ago.","ro":[],"s":null},{"t":"Vapes nicotine daily.","ro":[],"s":null},{"t":"Never smoked cigarettes. No weight loss or blood in his sputum.","ro":["lca"],"s":"No weight loss or hemoptysis"},{"t":"No recurrent pneumonias, sinus infections, or digestive problems as a child.","ro":["cf"],"s":"Healthy childhood"}],"vitals":[{"t":"Temp 99.0 °F (37.2 °C)","ro":[],"s":null},{"t":"HR 132 bpm","ro":[],"s":null},{"t":"RR 34/min","ro":[],"s":null},{"t":"BP 138/80 mmHg","ro":[],"s":null},{"t":"SpO₂ 88% on 4 L","ro":[],"s":null}],"physical":[{"t":"Faint breath sounds throughout. The loud wheezing he had on arrival is now almost silent ('silent chest').","ro":[],"s":"Silent chest after heavy wheezing","sup":true},{"t":"Speaks only 1–2 words per breath. Sitting forward, using his neck muscles.","ro":[],"s":null},{"t":"Pulsus paradoxus 22 mmHg.","ro":[],"s":null},{"t":"Getting drowsy and harder to keep awake true},"rhc":{"t":"mPAP 26 mmHg, PAWP 11 mmHg. Mild pulmonary hypertension due to chronic hypoxemic lung disease (Group 3), not PAH.","ro":["pah"],"s":"Cath: Group 3 PH, not PAH","sup":true},"bronch":{"t":"Red, swollen airway lining with thick mucus. Biopsy: goblet cell hyperplasia. No malignancy.","ro":["lca"],"s":"Benign bronchoscopy biopsy","sup":true},"cxr":{"t":"Increased bronchovascular markings. Mildly enlarged right heart border. No mass. Diaphragms normal.","ro":[],"s":null},"ctchest":{"t":"Bronchial wall thickening and mucus plugging. No significant emphysema. No fibrosis or mass.","ro":["emph","ipf","lca","cf"],"s":"CT: no emphysema, fibrosis, or mass","sup":true}},"normal":"Airways make a thin mucus layer that cilia sweep upward and out.","broke":"Years of smoke and grain dust inflamed the bronchi, multiplied the mucus glands, and paralyzed the cilia. Thick mucus plugs the airways, air gets trapped, oxygen drops, and the low oxygen squeezes the pulmonary arteries until the right heart strains (cor pulmonale).","clues":"Productive cough ≥ 3 months for ≥ 2 consecutive years, heavy smoking, cyanosis, polycythemia, high CO₂, FEV₁/FVC \u003c 0.70 with near-normal DLCO, edema and JVD.","care":"Give oxygen to the ordered target (often 88–92%), then reassess; the goal is adequate oxygenation, not a perfect SpO₂. Teach airway clearance, huff coughing, and smoking cessation. Watch fluid status and right-sided heart failure.","nursing":[{"t":"Give oxygen to the ordered target (often 88–92%) and watch his ABGs and level of consciousness.","ok":true,"r":"He needs oxygen for hypoxemia. A modest target limits CO₂ retention in a chronic retainer, and confusion or drowsiness can signal rising CO₂."},{"t":"Teach airway clearance: huff coughing, adequate fluids, and chest physiotherapy.","ok":true,"r":"Thick mucus plugs his airways. Clearing it improves airflow and lowers infection risk."},{"t":"Support smoking cessation.","ok":true,"r":"Quitting is the single most effective way to slow COPD progression."},{"t":"Monitor for right-sided heart failure: daily weights, edema, and JVD.","ok":true,"r":"Chronic hypoxemia has strained his right ventricle (cor pulmonale)."},{"t":"Give antibiotics as ordered for his purulent sputum.","ok":true,"r":"Increased purulent sputum during an exacerbation suggests bacterial infection, here H. influenzae."},{"t":"Withhold all oxygen because it will stop his drive to breathe.","ok":false,"r":"Never withhold oxygen from a hypoxemic patient. Titrate it to the target and monitor."},{"t":"Have him limit fluids so his secretions dry up.","ok":false,"r":"Dehydration makes mucus thicker and harder to clear. Follow any heart-failure fluid orders, but don't restrict fluids to treat secretions."}],"variant":"Long-time smoker, worse this winter"},{"id":"l-cb-2","dx":"cb","acute":false,"name":"Rosa Medina","age":62,"sex":"F","setting":"Pulmonary Clinic","summary":"Coughs up thick sputum every morning, and every winter it lasts for months. She has never smoked a cigarette, but she has cooked over a wood stove her whole adult life.","history":[{"t":"Cough with thick morning sputum most days, lasting 3–4 months each winter for the past 4 years.","ro":["ipf","pah"],"s":"Chronic productive cough ≥ 3 months for 2+ years","sup":true},{"t":"Lived in a rural home heated and cooked with a wood stove for 40 years.","ro":[],"s":null},{"t":"Never smoked cigarettes.","ro":[],"s":null},{"t":"No weight loss, night sweats, or blood in her sputum.","ro":["lca"],"s":"No weight loss or hemoptysis"},{"t":"No breathing problems as a child; symptoms began in her 50s.","ro":["cf"],"s":"No childhood lung disease"},{"t":"Works as a school cafeteria cook.","ro":[],"s":null}],"vitals":[{"t":"Temp 98.8 °F (37.1 °C)","ro":[],"s":null},{"t":"HR 96 bpm","ro":[],"s":null},{"t":"RR 22/min","ro":[],"s":null},{"t":"BP 136/84 mmHg","ro":[],"s":null},{"t":"SpO₂ 89% on room air","ro":[],"s":null}],"physical":[{"t":"Coarse crackles and rhonchi that shift a true,"r":"His pancreas can't release digestive enzymes, so he needs them each time he eats fat or protein."},{"t":"Plan a high-calorie, high-fat, high-salt diet with fat-soluble vitamins (A, D, E, K).","ok":true,"r":"Malabsorption and high energy needs cause weight loss, CF sweat loses extra salt, and fat-soluble vitamins are poorly absorbed."},{"t":"Use strict infection control and keep him away from other CF patients.","ok":true,"r":"CF patients can pass resistant organisms like Pseudomonas to each other."},{"t":"Refer him and his wife for genetic counseling and fertility options.","ok":true,"r":"CF is autosomal recessive, and most men with CF are infertile because the vas deferens is absent. Assisted reproduction may still be possible."},{"t":"Give the enzymes once a day in the morning.","ok":false,"r":"Enzymes only work on food eaten at the same time, so they go with every meal and snack."},{"t":"Put him on a low-fat diet to reduce the greasy stools.","ok":false,"r":"He needs extra fat and calories. Proper enzyme dosing, not cutting fat, fixes the greasy stools."},{"t":"Room him with another CF patient so they can support each other.","ok":false,"r":"Sharing a room spreads resistant bacteria between CF patients. They should be kept apart."}],"variant":"Young adult, repeat pneumonias"},{"id":"l-cf-2","dx":"cf","acute":false,"name":"Olivia Grant","age":2,"sex":"F","setting":"Pediatric Pulmonary Clinic","summary":"Her third pneumonia since she was 6 months old. She's small for her age, coughs every day, and her mother says her diapers 'smell terrible.'","history":[{"t":"Three pneumonias and a constant wet cough since she was 6 months old.","ro":[],"s":"Recurrent lung infections since infancy","sup":true},{"t":"Large, greasy, foul-smelling stools that float.","ro":[],"s":"Greasy, floating stools","sup":true},{"t":"Born at home; never had newborn screening.","ro":[],"s":null},{"t":"Her mother says she 'tastes salty' when she kisses her.","ro":[],"s":"Salty skin","sup ain). PAH drugs such as continuous IV epoprostenol must never be interrupted; a pause can be fatal. Teach energy conservation, oxygen use, and avoiding pregnancy and heavy exertion.","nursing":[{"t":"Never interrupt a continuous epoprostenol infusion; keep a backup pump and supplies on hand.","ok":true,"r":"Epoprostenol has a half-life of minutes. Stopping it can cause rebound pulmonary hypertension and death."},{"t":"Monitor for right-sided heart failure: daily weights, edema, and JVD.","ok":true,"r":"Her right ventricle is failing against high pulmonary pressures."},{"t":"Give oxygen to keep her SpO₂ at the ordered target.","ok":true,"r":"Low oxygen constricts the pulmonary arteries and raises pressure further."},{"t":"Teach her to avoid pregnancy and use reliable contraception.","ok":true,"r":"Pregnancy carries a very high death rate in PAH, and some PAH drugs cause birth defects."},{"t":"Teach energy conservation and avoiding heavy exertion, straining, and high altitude.","ok":true,"r":"These raise pulmonary pressure and oxygen demand and can cause fainting."},{"t":"Encourage vigorous exercise to build her endurance.","ok":false,"r":"Heavy exertion can cause syncope or sudden death in PAH. Only supervised, low-level rehab is advised."},{"t":"Flush the epoprostenol line with a saline bolus to check that it's working.","ok":false,"r":"Flushing pushes a bolus of drug in and can cause severe hypotension. The line is dedicated and never flushed."},{"t":"Suggest OTC decongestants for colds.","ok":false,"r":"Decongestants constrict blood vessels and can worsen pulmonary hypertension."}],"variant":"Young woman, diet drug and family history"},{"id":"l-pah-2","dx":"pah","acute":false,"name":"Cody Reyes","age":34,"sex":"M","setting":"Cardiology Clinic","summary":"Fainted twice while jogging this month. He's been short of breath with exertion for 8 months and thought he was just out of shape.","history":[{"t":"Fainted twice while jogging in the past month; short of breath w vation, pulmonary rehab, and teaching about antifibrotic drugs. Scarring can't be reversed, so goals-of-care conversations belong early.","nursing":[{"t":"Titrate oxygen for activity and check his SpO₂ while he walks.","ok":true,"r":"His SpO₂ drops from 90% to 82% with walking. His oxygen needs are higher with exertion than at rest."},{"t":"Teach energy conservation and refer him to pulmonary rehabilitation.","ok":true,"r":"Rehab improves exercise tolerance and breathlessness, even though it can't reverse the scarring."},{"t":"Teach about antifibrotic drugs (pirfenidone, nintedanib), including GI side effects and liver monitoring.","ok":true,"r":"Antifibrotics slow the decline in lung function. Side effects are common, and liver labs need monitoring."},{"t":"Start goals-of-care and palliative care conversations early.","ok":true,"r":"IPF is progressive and irreversible, so planning early respects his wishes."},{"t":"Help him manage his reflux (elevate the head of the bed, take medications as prescribed).","ok":true,"r":"GERD is linked with IPF. Microaspiration may contribute to lung injury."},{"t":"Tell him a bronchodilator inhaler will reverse the scarring.","ok":false,"r":"His problem is restriction and poor diffusion from scar tissue. Bronchodilators don't reverse fibrosis."},{"t":"Give oxygen only at rest because he's fine when sitting.","ok":false,"r":"He desaturates most during activity, which is when he needs oxygen most."},{"t":"Expect long-term high-dose steroids to cure the fibrosis.","ok":false,"r":"Steroids don't help IPF and can cause harm. The scarring is permanent."}],"variant":"Classic idiopathic, older adult"},{"id":"l-ipf-2","dx":"ipf","acute":false,"name":"Howard Benton","age":76,"sex":"M","setting":"Pulmonary Clinic","summary":"A dry cough and breathlessness have slowly worsened over 9 months. His cardiologist noticed his face has taken on a bluish-gray tint.","history":[{"t":"Dry cough and breathlessness slowly worsening for 9 months.","ro":["cb
