y fibrosis.","variant":"Drug-induced (amiodarone)"},{"id":"l-ipf-3","dx":"ipf","acute":false,"name":"Leonard Shaw","age":72,"sex":"M","setting":"Pulmonary Clinic","summary":"Retired shipyard pipefitter with 2 years of slowly increasing breathlessness and a dry cough. His fingertips have become rounded.","history":[{"t":"Progressive shortness of breath over 2 years with a dry cough.","ro":["cb","cf"],"s":"Dry, nonproductive cough","sup":true},{"t":"Worked 30 years as a pipefitter in a naval shipyard, cutting pipe insulation.","ro":[],"s":null},{"t":"Smoked a pack a day until age 50.","ro":[],"s":null},{"t":"No chest pain; appetite unchanged.","ro":[],"s":null},{"t":"No lung problems as a child.","ro":["cf"],"s":"No childhood lung disease"},{"t":"Has type 2 diabetes managed with metformin.","ro":[],"s":null}],"vitals":[{"t":"Temp 98.4 °F (36.9 °C)","ro":[],"s":null},{"t":"HR 90 bpm","ro":[],"s":null},{"t":"RR 24/min","ro":[],"s":null},{"t":"BP 134/82 mmHg","ro":[],"s":null},{"t":"SpO₂ 90% on room air","ro":[],"s":null}],"physical":[{"t":"Fine end-inspiratory crackles at both bases.","ro":["asthma","cb","cf"],"s":"Fine basilar crackles","sup":true},{"t":"Digital clubbing.","ro":["asthma","cb","emph"],"s":"Clubbing (not a feature of asthma or COPD)","sup":true},{"t":"Normal chest shape; no hyperresonance.","ro":["emph"],"s":"No hyperinflation"},{"t":"No JVD or edema.","ro":["pah"],"s":"No JVD or edema"}],"tests":{"pft":{"t":"FVC 62%, TLC 64%, FEV₁/FVC 0.84 (restrictive). DLCO 41%.","ro":["asthma","cb","emph"],"s":"Restrictive pattern","sup":true},"ctchest":{"t":"Calcified pleural plaques on both diaphragms. Fibrosis and honeycombing under the pleura at the bases. No mass.","ro":["emph","cf","lca"],"s":"CT: fibrosis with plaques, no mass","sup":true},"cyto":{"t":"No malignant cells identified.","ro":[],"s":null},"abg":{"t":"pH 7.45, PaCO₂ 34 mmHg, PaO₂ 58 mmHg, HCO₃ 24 mEq/L.","ro":[],"s":null},"cxr":{"t":"Reticular markings at both bases; calcified plaques along the diaphragm.","ro":[],"s":null}},"clues":"Decades of asbestos exposure, dry cough, basilar crackles, clubbing, restrictive PFTs with low DLCO, pleural plaques and basilar fibrosis: asbestosis.","variant":"Asbestosis (shipyard worker)"},{"id":"l-lca-1","dx":"lca","acute":false,"name":"Carol Pierce","age":66,"sex":"F","setting":"Primary Care","summary":"Has had a cough that \"just won't quit\" for three months. This week she noticed streaks of blood in her tissue.","history":[{"t":"New, persistent cough for 3 months. Blood-streaked sputum this week.","ro":[],"s":null,"sup":true},{"t":"Still smoking. 50 pack-years.","ro":[],"s":null,"sup":true},{"t":"Has had a mild morning 'smoker's cough' for years.","ro":[],"s":null},{"t":"Lost 18 lb in 4 months without trying. Very tired.","ro":[],"s":null,"sup":true},{"t":"Home tested high for radon 10 years ago; never fixed.","ro":[],"s":null,"sup":true},{"t":"Hoarse voice for 3 weeks.","ro":[],"s":null,"sup":true},{"t":"No injury.","ro":[],"s":null},{"t":"No fever or sore throat.","ro":[],"s":null},{"t":"No snoring or daytime sleepiness.","ro":[],"s":null},{"t":"Healthy childhood.","ro":["cf"],"s":"Healthy childhood"},{"t":"Never had wheezing attacks.","ro":["asthma"],"s":"No wheezing history"}],"vitals":[{"t":"Temp 99.1 °F (37.3 °C)","ro":[],"s":null},{"t":"HR 90 bpm","ro":[],"s":null},{"t":"RR 20/min","ro":[],"s":null},{"t":"BP 138/82 mmHg","ro":[],"s":null},{"t":"SpO₂ 94% on room air","ro":[],"s":null},{"t":"BMI 20 (was 23 four months ago)","ro":[],"s":null,"sup":true}],"physical":[{"t":"Diminished breath sounds and dullness to percussion over the left upper lobe. Localized wheeze in that one area.","ro":["asthma","ipf"],"s":"Localized wheeze and dullness, one lobe","sup":true},{"t":"Digital clubbing.","ro":[],"s":null,"sup":true},{"t":"Firm, nontender, 2 cm left supraclavicular lymph node.","ro":["asthma","ipf","cf"],"s":"Hard, fixed supraclavicular node","sup":true},{"t":"No crackles at the lung bases.","ro":["ipf"],"s":"No basilar crackles"},{"t":"Hoarse voice. No stridor.","ro":[],"s":null}],"tests":{"cbc":{"t":"Hgb 11.2 g/dL (mild anemia). WBC and platelets normal.","ro":[],"s":null},"bmp":{"t":"Calcium 11.8 mg/dL (elevated). Others normal.","ro":[],"s":null},"cyto":{"t":"Atypical cells suspicious for malignancy.","ro":[],"s":null},"pft":{"t":"FEV₁ 80%, FVC 84%, FEV₁/FVC 0.74. TLC 92%. DLCO 82%.","ro":["cb","emph","ipf","asthma"],"s":"FEV₁/FVC ≥ 0.70, no COPD or restriction"},"bronch":{"t":"Mass narrowing the left upper lobe bronchus. Biopsy: squamous cell carcinoma.","ro":[],"s":null},"cxr":{"t":"4 cm mass in the left upper lobe. Widened left hilum.","ro":[],"s":null},"cta":{"t":"No pulmonary embolism. Left upper lobe mass noted.","ro":[],"s":null},"ctchest":{"t":"4.2 cm spiculated mass in the left upper lobe. Enlarged left hilar and mediastinal lymph nodes. No significant emphysema or fibrosis.","ro":["emph","ipf","cf"],"s":"CT: no emphysema or fibrosis","sup":true},"pet":{"t":"Hypermetabolic left upper lobe mass with hilar, mediastinal, and left supraclavicular node uptake.","ro":[],"s":null}},"normal":"Airway lining cells divide in a controlled way and repair damage from what we inhale.","broke":"Decades of smoke (plus radon) damaged the DNA of airway cells until they grew out of control. The tumor narrows a bronchus (localized wheeze, dullness), bleeds (hemoptysis), invades the nerve to the left vocal cord (hoarseness), spreads to lymph nodes, and secretes a hormone-like protein that raises calcium.","clues":"Change in a long-standing smoker's cough, hemoptysis, weight loss, hoarseness, clubbing, supraclavicular node, hypercalcemia, spiculated mass, biopsy-proven squamous cell carcinoma.","care":"Monitor for complications: hypercalcemia (confusion, weakness), airway obstruction, and superior vena cava syndrome. Manage symptoms and pain, support her through diagnosis and staging, and offer smoking cessation; it still improves treatment outcomes.","nursing":[{"t":"Monitor for hypercalcemia: confusion, weakness, constipation, and frequent urination.","ok":true,"r":"Her calcium is 11.8 from a tumor-produced hormone. Severe hypercalcemia can cause arrhythmias and coma."},{"t":"Watch for superior vena cava syndrome: facial or neck swelling, dyspnea, and distended chest veins.","ok":true,"r":"Mediastinal tumor and lymph nodes can compress the SVC. It's an oncologic emergency."},{"t":"Offer smoking cessation support.","ok":true,"r":"Quitting still improves treatment response, surgical outcomes, and survival after a cancer diagnosis."},{"t":"Assess and manage pain, fatigue, dyspnea, and nutrition.","ok":true,"r":"Symptom management is central to her care. She has lost 18 lb and is fatigued."},{"t":"If she has heavy hemoptysis, position her with the affected (left) side down.","ok":true,"r":"Lying on the bleeding side keeps blood out of the good lung."},{"t":"Tell her quitting smoking won't make a difference now.","ok":false,"r":"False. Quitting improves outcomes even after diagnosis."},{"t":"Restrict fluids because her calcium is high.","ok":false,"r":"Hydration helps the kidneys excrete calcium. IV fluids are first-line treatment for hypercalcemia."},{"t":"Encourage calcium supplements to protect her bones during treatment.","ok":false,"r":"Extra calcium would make her hypercalcemia worse."}],"variant":"Smoker with high calcium (squamous)"},{"id":"l-lca-2","dx":"lca","acute":false,"name":"Diane Foster","age":48,"sex":"F","setting":"Primary Care","summary":"A dry cough for 3 months that won't go away. Now she's short of breath and has a dull ache in the right side of her chest. She has never smoked.","history":[{"t":"Dry cough for 3 months; now short of breath with a dull ache in the right chest.","ro":[],"s":"Persistent new cough with chest pain","sup":true},{"t":"Never smoked. Her ex-husband smoked indoors for 20 years.","ro":[],"s":null},{"t":"Lost 10 lb without trying.","ro":[],"s":"Unintentional weight loss","sup":true},{"t":"No childhood lung problems.","ro":["cf"],"s":"No childhood lung disease"},{"t":"No wheezing or allergies.","ro":["asthma"],"s":"No wheeze or atopy"},{"t":"Works as a librarian.","ro":[],"s":null}],"vitals":[{"t":"Temp 99.0 °F (37.2 °C)","ro":[],"s":null},{"t":"HR 102 bpm","ro":[],"s":null},{"t":"RR 22/min","ro":[],"s":null},{"t":"BP 126/80 mmHg","ro":[],"s":null},{"t":"SpO₂ 93% on room air","ro":[],"s":null}],"physical":[{"t":"Dullness to percussion and absent breath sounds over the lower right chest.","ro":["asthma","emph","ipf"],"s":"Localized dullness (right effusion)","sup":true},{"t":"Hard, enlarged right supraclavicular lymph node.","ro":["asthma","cb","emph","ipf","pah"],"s":"Hard supraclavicular node","sup":true},{"t":"Early clubbing of the fingers.","ro":[],"s":null},{"t":"No JVD.","ro":["pah"],"s":"No JVD"}],"tests":{"cxr":{"t":"Moderate right pleural effusion. Fullness at the right hilum.","ro":[],"s":null},"ctchest":{"t":"3.1 cm mass in the right lower lobe with a right pleural effusion and enlarged mediastinal lymph nodes. No emphysema or fibrosis.","ro":["emph","ipf","cf"],"s":"CT: mass without emphysema or fibrosis","sup":true},"cyto":{"t":"Atypical cells suspicious for adenocarcinoma.","ro":[],"s":null,"sup":true},"bronch":{"t":"Biopsy: adenocarcinoma, EGFR mutation positive.","ro":[],"s":null,"sup":true},"pet":{"t":"Uptake in the right lower lobe mass, mediastinal nodes, and pleura.","ro":[],"s":null,"sup":true},"pft":{"t":"FEV₁ 78%, FVC 74%, FEV₁/FVC 0.82. DLCO 80%.","ro":["cb","emph"],"s":"No obstruction"},"echo":{"t":"Normal LV and RV. PA systolic pressure 26 mmHg.","ro":["pah"],"s":"Normal echo / PA pressure"}},"clues":"Never-smoker with secondhand smoke exposure, persistent cough, weight loss, pleural effusion, hard supraclavicular node, mass on CT, adenocarcinoma with an EGFR mutation on biopsy.","variant":"Never-smoker with effusion (adenocarcinoma)"},{"id":"l-lca-3","dx":"lca","acute":true,"name":"Ray Gallagher","age":63,"sex":"M","setting":"Emergency Department","summary":"His face and neck have swollen over 2 weeks, and for the last 3 days his wife says he's been confused and sleepy. He still smokes two packs a day.","history":[{"t":"Face and neck have swollen over 2 weeks; worse when he bends over or first wakes up.","ro":[],"s":"Facial and neck swelling (SVC obstruction)","sup":true},{"t":"Smoked 2 packs a day for 45 years; still smoking.","ro":[],"s":null},{"t":"His wife says he's been confused and sleepy for 3 days.","ro":[],"s":null},{"t":"Lost 22 lb in 3 months.","ro":[],"s":"Unintentional weight loss","sup":true},{"t":"No childhood lung disease.","ro":["cf"],"s":"No childhood lung disease"},{"t":"Never diagnosed with asthma; no history of wheezing.","ro":["asthma"],"s":"No wheezing history"},{"t":"Cough is new over the past 2 months; no long history of daily sputum.","ro":["cb"],"s":"No chronic productive cough"},{"t":"Takes hydrochlorothiazide for blood pressure.","ro":[],"s":null}],"vitals":[{"t":"Temp 98.4 °F (36.9 °C)","ro":[],"s":null},{"t":"HR 98 bpm","ro":[],"s":null},{"t":"RR 22/min","ro":[],"s":null},{"t":"BP 148/90 mmHg","ro":[],"s":null},{"t":"SpO₂ 94% on room air","ro":[],"s":null}],"physical":[{"t":"Swollen, flushed face and neck with distended veins across the upper chest.","ro":[],"s":"SVC syndrome","sup":true},{"t":"Lethargic but arousable; oriented to person only.","ro":[],"s":null},{"t":"No crackles. Breath sounds slightly diminished in the right upper chest.","ro":["ipf","cf"],"s":"No crackles"},{"t":"Normal chest shape; percussion resonant.","ro":["emph"],"s":"No hyperinflation"}],"tests":{"bmp":{"t":"Na 118 mEq/L. Low serum osmolality with concentrated urine and high urine sodium (consistent with SIADH).","ro":[],"s":null,"sup":true},"ctchest":{"t":"Large right hilar and mediastinal mass compressing the superior vena cava. No emphysema or fibrosis.","ro":["emph","ipf","cf"],"s":"CT: central mass without emphysema or fibrosis","sup":true},"cyto":{"t":"Small cell carcinoma cells.","ro":[],"s":null,"sup":true},"cxr":{"t":"Widened mediastinum with a right hilar mass.","ro":[],"s":null},"cbc":{"t":"Hgb 12.6 g/dL. Otherwise normal.","ro":[],"s":null},"echo":{"t":"Normal LV and RV. PA systolic pressure 28 mmHg.","ro":["pah"],"s":"Normal echo / PA pressure"}},"clues":"Heavy current smoker, weight loss, superior vena cava syndrome, confusion from severe hyponatremia (SIADH), central mass, small cell carcinoma on cytology.","variant":"Small cell with SVC syndrome and SIADH"}]},{"id":"infectious","name":"Infectious","sub":"Upper & lower tract","color":"#efb54a","blurb":"Viral and bacterial infections from the sinuses and throat down to the alveoli.","hint":"Ask where the infection lives (sinuses, throat, larynx, small airways, alveoli) and which organism fits the exposures and timing. Pathogen tests confirm, but history and exam narrow the list first.","dx":[{"id":"pna","name":"Pneumonia","normal":"Alveoli are air-filled, and the airways' defenses (cough, cilia, immune cells) clear microbes before they settle in.","broke":"Bacteria, viruses, or aspirated material reach the alveoli and overwhelm local defenses. The alveoli fill with fluid, white cells, and debris (consolidation), so blood passing those alveoli can't pick up oxygen.","care":"Cultures, then antibiotics on time. Oxygen to goal, head of bed up, coughing, deep breathing, and early mobility. Watch older adults for confusion, the earliest sign.","nursing":[{"t":"Collect cultures, then give the first antibiotic dose as soon as ordered.","ok":true,"r":"Early antibiotics lower mortality; cultures drawn first guide later changes."},{"t":"Raise the head of the bed and give oxygen to keep SpO₂ at goal.","ok":true,"r":"Upright positioning improves lung expansion; oxygen treats shunting through consolidated alveoli."},{"t":"Encourage coughing, deep breathing, incentive spirometry, and early mobility.","ok":true,"r":"These open collapsed alveoli and move secretions out."},{"t":"Encourage 2–3 L of fluid a day unless restricted.","ok":true,"r":"Hydration thins secretions so they're easier to cough up."},{"t":"Hold antibiotics until culture results come back.","ok":false,"r":"Delaying antibiotics increases mortality. Cultures guide adjustments later."},{"t":"Keep the patient on strict bed rest to save energy.","ok":false,"r":"Immobility worsens atelectasis and secretion pooling."},{"t":"Watch older adults for new confusion.","ok":true,"r":"Confusion is often the first or only sign of pneumonia in older adults."},{"t":"Give a cough suppressant for a productive cough.","ok":false,"r":"Coughing clears infected secretions from the lungs."}]},{"id":"tb","name":"Tuberculosis","normal":"Immune cells in the lung wall off and kill inhaled microbes before they spread.","broke":"Mycobacterium tuberculosis is inhaled in droplet nuclei. The immune system walls it off (latent TB), but if immunity weakens, the bacteria reactivate, destroy lung tissue (often the upper lobes, forming cavities), and can spread through the blood (miliary TB).","care":"Airborne isolation in a negative-pressure room with N95 respirators, a 4-drug regimen taken for at least 6 months (often by directly observed therapy), liver monitoring, and contact tracing.","nursing":[{"t":"Place the patient in airborne isolation in a negative-pressure room; staff wear fitted N95 respirators.","ok":true,"r":"TB spreads through tiny airborne droplet nuclei that stay suspended in the air."},{"t":"Have the patient wear a surgical mask when leaving the room.","ok":true,"r":"A mask on the patient traps droplets at the source during transport."},{"t":"Teach that the medicines must be taken for at least 6 months, even after feeling better; directly observed therapy may be used.","ok":true,"r":"Stopping early leads to relapse and drug-resistant TB."},{"t":"Teach that rifampin turns urine, sweat, and tears orange and makes hormonal birth control less effective.","ok":true,"r":"Knowing this prevents alarm and unplanned pregnancy."},{"t":"Use droplet precautions with a regular surgical mask for staff.","ok":false,"r":"Surgical masks don't protect staff from airborne TB. Fitted N95s are required."},{"t":"Tell the patient they can stop the medicines once the cough is gone.","ok":false,"r":"Symptoms improve long before the bacteria are cleared."},{"t":"Monitor liver function and teach the patient to avoid alcohol.","ok":true,"r":"Isoniazid, rifampin, and pyrazinamide can damage the liver."},{"t":"Tell household contacts they only need screening if they get sick.","ok":false,"r":"Close contacts are screened right away; latent infection can be treated before it becomes active."}]},{"id":"croup","name":"Croup (laryngotracheobronchitis)","normal":"In young children the airway just below the vocal cords (the subglottis) is the narrowest part, so even a little swelling matters.","broke":"A virus (most often parainfluenza) inflames the larynx and trachea. Swelling below the vocal cords narrows the airway, causing a barking cough, hoarseness, and inspiratory stridor, usually worse at night.","care":"Keep the child calm, give dexamethasone, and use nebulized racemic epinephrine for stridor at rest, then watch for rebound. Teach parents the warning signs.","nursing":[{"t":"Keep the child calm, ideally in a parent's lap.","ok":true,"r":"Crying increases turbulent airflow and worsens the narrowing."},{"t":"Give dexamethasone; give nebulized racemic epinephrine for stridor at rest as ordered.","ok":true,"r":"Steroids reduce swelling over hours; epinephrine shrinks swelling within minutes."},{"t":"Observe for at least 2–4 hours after racemic epinephrine.","ok":true,"r":"Its effect wears off and stridor can return (rebound)."},{"t":"Give a codeine-containing cough suppressant.","ok":false,"r":"Opioids depress breathing in children and aren't used for croup."},{"t":"Lay the child flat and separate them from the parent for the exam.","ok":false,"r":"Separation causes crying and agitation that worsen the airway narrowing."},{"t":"Teach parents the warning signs: stridor at rest, retractions, drooling, or blue lips.","ok":true,"r":"These mean the airway is critically narrowed and need emergency care."},{"t":"Give antibiotics because most croup is bacterial.","ok":false,"r":"Croup is almost always viral."},{"t":"Keep the child well hydrated and monitor SpO₂.","ok":true,"r":"Fast breathing and poor intake cause dehydration; low SpO₂ is a late sign of severe obstruction."}]},{"id":"rsv","name":"RSV infection (bronchiolitis)","normal":"Bronchioles are tiny airways lined by cells with cilia that sweep mucus out. In infants they are very narrow.","broke":"Respiratory syncytial virus infects and kills the cells lining the bronchioles. Dead cells, mucus, and swelling plug the small airways, causing wheezing, crackles, air trapping, and low oxygen. Young infants may have apnea. Older adults can develop severe lower respiratory infection.","care":"Supportive care: nasal suctioning, oxygen, hydration, apnea monitoring in young infants, and contact precautions. Prevention with infant monoclonal antibody, maternal vaccine, or older-adult vaccine.","nursing":[{"t":"Suction the nose before feedings and sleep.","ok":true,"r":"Infants breathe mostly through the nose; clearing it improves breathing and feeding."},{"t":"Use contact (and droplet) precautions and strict hand hygiene.","ok":true,"r":"RSV spreads on hands and surfaces and survives for hours."},{"t":"Track hydration: wet diapers, feedings, and weight.","ok":true,"r":"Fast breathing and poor feeding quickly dehydrate infants."},{"t":"Give oxygen to keep SpO₂ at goal and use apnea monitoring for young infants.","ok":true,"r":"Young and premature infants can stop breathing with RSV."},{"t":"Give albuterol and steroids routinely.","ok":false,"r":"Guidelines don't recommend them for bronchiolitis; they don't change the course."},{"t":"Give antibiotics to clear the infection.","ok":false,"r":"RSV is a virus; antibiotics don't help."},{"t":"Teach about prevention: infant monoclonal antibody, the maternal vaccine, and vaccines for older adults.","ok":true,"r":"These sharply reduce severe RSV disease."},{"t":"Teach parents to put the baby to sleep on the belly to ease breathing.","ok":false,"r":"Infants should always sleep on their backs to reduce SIDS risk."}]},{"id":"flu","name":"Influenza","normal":"The airway lining and immune system clear viruses before they cause widespread illness.","broke":"Influenza A or B infects the lining of the respiratory tract and triggers a strong whole-body immune response: sudden fever, chills, muscle aches, headache, and cough. It can lead to pneumonia, dehydration, and worsening of chronic conditions, especially in older adults and pregnant patients.","care":"Antivirals (oseltamivir) as early as possible, especially for high-risk patients, droplet precautions, fluids and rest, no aspirin in children, annual vaccination, and watching for secondary bacterial pneumonia.","nursing":[{"t":"Give oseltamivir as ordered, ideally within 48 hours of symptom onset.","ok":true,"r":"Antivirals shorten illness and reduce complications; they're still given to hospitalized and high-risk patients after 48 hours."},{"t":"Place the patient on droplet precautions.","ok":true,"r":"Influenza spreads by large respiratory droplets."},{"t":"Encourage fluids and rest; give acetaminophen for fever and aches.","ok":true,"r":"Fever and poor intake cause dehydration."},{"t":"Encourage yearly flu vaccination for the patient and household.","ok":true,"r":"Vaccination is the best prevention."},{"t":"Give aspirin to a child for fever.","ok":false,"r":"Aspirin in children with viral illness can cause Reye syndrome."},{"t":"Withhold antivirals from a hospitalized patient because it's past 48 hours.","ok":false,"r":"Hospitalized and high-risk patients benefit from antivirals at any point."},{"t":"Watch for a return of fever and a worsening productive cough.","ok":true,"r":"These suggest secondary bacterial pneumonia."},{"t":"Tell the patient they can return to work while still feverish if they feel okay.","ok":false,"r":"Patients should stay home until fever-free for 24 hours without medicine."}]},{"id":"covid","name":"COVID-19","normal":"ACE2 receptors on airway and other cells help regulate blood pressure and inflammation.","broke":"SARS-CoV-2 enters cells through ACE2 receptors in the nose, airways, alveoli, and blood vessels. Most patients have a cold- or flu-like illness, sometimes with loss of smell and GI symptoms. In severe cases, inflammation damages the alveoli (bilateral ground-glass pneumonia) and can cause very low oxygen, sometimes before the patient feels short of breath.","care":"Isolation, SpO₂ monitoring (low oxygen can be silent), awake proning if ordered, antivirals for high-risk patients early in illness (checking drug interactions), steroids and other therapies for hypoxemic patients, and vaccination.","nursing":[{"t":"Use the facility's COVID-19 isolation precautions, including a fitted respirator and eye protection.","ok":true,"r":"SARS-CoV-2 spreads by respiratory particles that can stay in the air."},{"t":"Monitor SpO₂ closely, even if the patient says they feel fine.","ok":true,"r":"COVID-19 can cause 'silent hypoxemia,' with very low oxygen before obvious distress."},{"t":"Help hypoxemic patients lie prone (on the belly) if ordered.","ok":true,"r":"Proning improves ventilation to the back of the lungs and raises oxygenation."},{"t":"For high-risk outpatients, give the antiviral early in illness and check drug interactions.","ok":true,"r":"Antivirals reduce progression when started early; nirmatrelvir/ritonavir interacts with many drugs."},{"t":"Give antibiotics to treat the virus.","ok":false,"r":"Antibiotics don't treat viruses. They're used only for a confirmed bacterial co-infection."},{"t":"Stop pulse oximetry once the patient says breathing feels normal.","ok":false,"r":"The feeling of breathlessness doesn't reliably match oxygen levels in COVID-19."},{"t":"Encourage staying up to date on COVID-19 vaccines.","ok":true,"r":"Vaccination reduces severe illness, hospitalization, and death."},{"t":"Tell the patient isolation can end as soon as their sense of smell returns.","ok":false,"r":"Loss of smell can last weeks and isn't a guide for ending isolation."}]},{"id":"strep","name":"Streptococcal pharyngitis","normal":"The pharynx and tonsils trap microbes entering the mouth and nose.","broke":"Group A Streptococcus infects the pharynx and tonsils: sudden sore throat, fever, tonsillar exudate, tender front neck nodes, and usually no cough. Untreated, it can lead to rheumatic fever, kidney inflammation (glomerulonephritis), or a peritonsillar abscess. Some strains cause scarlet fever.","care":"Confirm with a rapid test or culture, give the full antibiotic course (penicillin or amoxicillin, or an alternative if allergic), and teach about contagiousness and complications.","nursing":[{"t":"Teach the patient to take the full course of antibiotics (usually 10 days of penicillin or amoxicillin).","ok":true,"r":"Finishing the course prevents rheumatic fever and relapse."},{"t":"Teach that they're contagious until 12 hours on antibiotics and fever-free; replace the toothbrush.","ok":true,"r":"This limits spread to classmates and family."},{"t":"Encourage cool fluids and soft foods; give acetaminophen or ibuprofen for pain.","ok":true,"r":"Comfort helps the patient stay hydrated."},{"t":"Teach to report joint pain, chest pain, or dark, cola-colored urine in the following weeks.","ok":true,"r":"These may signal rheumatic fever or glomerulonephritis."},{"t":"Tell the patient to stop antibiotics once the throat feels better.","ok":false,"r":"Stopping early raises the risk of rheumatic fever."},{"t":"Give amoxicillin to a patient who had hives with amoxicillin.","ok":false,"r":"A non-penicillin alternative is used for a true allergy."},{"t":"Have household members with symptoms get tested.","ok":true,"r":"Group A strep spreads easily within families."},{"t":"Give aspirin for a child's throat pain.","ok":false,"r":"Aspirin in children can cause Reye syndrome."}]},{"id":"tonsil","name":"Tonsillitis (non-strep)","normal":"The tonsils are lymphoid tissue that sample and fight microbes entering the throat.","broke":"The tonsils become infected and inflamed, most often by viruses such as adenovirus or Epstein-Barr virus (mononucleosis). They swell, redden, and may have exudate. When group A strep is the cause, it's treated as strep pharyngitis. Repeated episodes may lead to tonsillectomy.","care":"Comfort and hydration. Antibiotics only for a bacterial cause. With mononucleosis, avoid contact sports while the spleen is enlarged. After tonsillectomy, watch for bleeding.","nursing":[{"t":"Encourage cool liquids, warm saltwater gargles, and pain medicine for comfort.","ok":true,"r":"Comfort measures help the patient keep drinking."},{"t":"Explain that antibiotics aren't needed when the cause is viral and the strep test is negative.","ok":true,"r":"Antibiotics don't treat viruses and cause side effects and resistance."},{"t":"After a tonsillectomy, watch for frequent swallowing, especially 5–10 days after surgery.","ok":true,"r":"Frequent swallowing can signal bleeding; late bleeding often happens when the scab falls off."},{"t":"If the cause is mononucleosis, teach to avoid contact sports for at least 3–4 weeks.","ok":true,"r":"An enlarged spleen can rupture with a blow to the abdomen."},{"t":"Give amoxicillin for every sore throat to be safe.","ok":false,"r":"Most tonsillitis is viral; amoxicillin causes a rash in mononucleosis."},{"t":"After a tonsillectomy, give red popsicles and let the patient use a straw.","ok":false,"r":"Red colors can be mistaken for blood and straws can dislodge clots."},{"t":"Monitor hydration.","ok":true,"r":"Painful swallowing causes poor intake and dehydration."},{"t":"Encourage vigorous gargling and coughing after a tonsillectomy.","ok":false,"r":"These can dislodge clots and cause bleeding."}]},{"id":"pert","name":"Pertussis (whooping cough)","normal":"Cilia in the airways sweep mucus and microbes out without causing violent coughing.","broke":"Bordetella pertussis attaches to airway cilia and releases toxins that paralyze them. Mucus builds up and causes coughing fits: many coughs in a row, then a gasping 'whoop,' often with vomiting. Infants may have apnea instead. The toxin also raises the lymphocyte count. Immunity from vaccine wanes over time.","care":"Droplet precautions until 5 days of antibiotics, azithromycin for the patient and close contacts, apnea monitoring and supportive care for infants, and Tdap for adolescents, adults, and every pregnancy.","nursing":[{"t":"Use droplet precautions until the patient has had 5 days of antibiotics.","ok":true,"r":"Pertussis spreads easily by droplets."},{"t":"Give azithromycin as ordered, and make sure close contacts get preventive antibiotics.","ok":true,"r":"Treatment shortens contagiousness; prophylaxis protects contacts, especially infants."},{"t":"For infants, monitor for apnea and low SpO₂, suction as needed, and give small, frequent feedings.","ok":true,"r":"Young infants can stop breathing during coughing spells."},{"t":"Encourage Tdap for adolescents and adults and during every pregnancy.","ok":true,"r":"Vaccine immunity wanes; vaccinating pregnant people protects newborns."},{"t":"Give a cough suppressant to stop the coughing fits.","ok":false,"r":"Cough suppressants don't work for pertussis coughs."},{"t":"Tell the patient they're now immune for life after having pertussis.","ok":false,"r":"Immunity after infection also wanes over time."},{"t":"Keep the environment calm and quiet.","ok":true,"r":"Stimulation can trigger coughing fits."},{"t":"Let the patient return to school or work once the cough improves, even without antibiotics.","ok":false,"r":"Patients stay contagious for about 3 weeks after the cough starts if untreated."}]},{"id":"sinus","name":"Rhinosinusitis","normal":"The sinuses are air-filled spaces lined with mucus-making cells; small openings let mucus drain into the nose.","broke":"Swelling of the nasal and sinus lining (from a virus, allergy, polyps, or a dental infection) blocks the sinus openings. Mucus gets trapped, pressure builds, and bacteria may grow. Symptoms: congestion, thick drainage, facial pain or pressure, and reduced smell. Most acute cases are viral; bacterial infection is suspected with symptoms over 10 days, 'double worsening,' or severe illness.","care":"Saline irrigation, humidity, fluids, and short-term decongestants. Antibiotics only for suspected bacterial infection. Teach warning signs of spread to the eye or brain.","nursing":[{"t":"Teach saline nasal irrigation.","ok":true,"r":"Irrigation thins mucus and helps the sinuses drain."},{"t":"Encourage fluids, humidified air, and warm compresses over the sinuses.","ok":true,"r":"These loosen secretions and ease pressure."},{"t":"Explain that antibiotics are used only when a bacterial infection is suspected.","ok":true,"r":"Most sinusitis is viral; unnecessary antibiotics cause harm."},{"t":"Teach to seek care right away for eye swelling, vision changes, severe headache, or a stiff neck.","ok":true,"r":"These can mean the infection has spread to the orbit or brain."},{"t":"Use a decongestant nasal spray for 2 weeks or more.","ok":false,"r":"Using decongestant sprays longer than 3 days causes rebound congestion."},{"t":"Tell the patient every sinus infection needs antibiotics.","ok":false,"r":"Most cases resolve without antibiotics."},{"t":"Use distilled, sterile, or boiled-and-cooled water for irrigation.","ok":true,"r":"Tap water can rarely carry dangerous amoebas."},{"t":"Tell a smoker that smoking doesn't affect sinus healing.","ok":false,"r":"Smoke damages the sinus lining and cilia and slows recovery."}]}],"tests":[{"id":"cbc","cat":"labs","name":"CBC with differential","el":false,"normal":{"t":"WBC 7.6 K/µL, Hgb 13.9 g/dL, platel [{"t":"Pale, grape-like polyps in both nasal passages.","ro":[],"s":"Nasal polyps","sup":true},{"t":"Breathes through his mouth; nasal-sounding voice.","ro":[],"s":null},{"t":"Lungs clear in all fields.","ro":["pna","tb"],"s":"Clear lung exam"}],"tests":{"nasend":{"t":"Polyps in both nasal passages; thick mucus from the sinus openings.","ro":[],"s":null,"sup":true},"ctsinus":{"t":"Maxillary and ethmoid sinuses filled in on both sides.","ro":[],"s":null,"sup":true},"covid":{"t":"SARS-CoV-2 not detected.","ro":["covid"],"s":"Negative COVID-19 PCR"}},"clues":"Six months of congestion, facial fullness, gradual loss of smell (not sudden), nasal polyps, asthma with aspirin sensitivity: chronic rhinosinusitis with nasal polyps.","variant":"Chronic with nasal polyps"},{"id":"i-sinus-3","dx":"sinus","acute":false,"name":"Monica Pruitt","age":45,"sex":"F","setting":"Primary Care","summary":"Left cheek pain and foul-smelling drainage from her left nostril for 2 weeks. She had a root canal on a left upper molar a month ago, and the tooth still aches.","history":[{"t":"Left cheek pain and foul-smelling drainage from the left nostril for 2 weeks.","ro":[],"s":"One-sided facial pain with foul drainage","sup":true},{"t":"Had a root canal on a left upper molar a month ago; the tooth still aches.","ro":[],"s":null},{"t":"Smokes ½ pack a day.","ro":[],"s":null},{"t":"No barking cough; no coughing fits with a whoop.","ro":["croup","pert"],"s":"No barking or paroxysmal cough"},{"t":"No sore throat.","ro":["strep","tonsil"],"s":"No sore throat"}],"vitals":[{"t":"Temp 100.4 °F (38.0 °C)","ro":[],"s":null},{"t":"HR 86 bpm","ro":[],"s":null},{"t":"RR 16/min","ro":[],"s":null},{"t":"BP 126/80 mmHg","ro":[],"s":null},{"t":"SpO₂ 98% on room air","ro":[],"s":null}],"physical":[{"t":"Tender over the left maxillary sinus; foul breath; pus in the left nasal passage.","ro":[],"s":"Left maxillary tenderness with pus","sup":true},{"t":"Tapping the left upper molar is painful.","ro":[],"s":null},{"t":"Lungs clear in all fields.","ro":["pna","tb"],"s":"Clear lung exam"}],"tests":{"ctsinus":{"t":"Left maxillary sinus filled in; a tooth root projects into the sinus floor.","ro":[],"s":null,"sup":true},"nasend":{"t":"Pus draining from the left middle meatus.","ro":[],"s":null,"sup":true},"cbc":{"t":"WBC 11,600/µL.","ro":[],"s":null}},"clues":"One-sided maxillary pain, foul drainage, recent dental work on an upper molar, tooth root in the sinus floor on CT: odontogenic (dental) sinusitis.","variant":"Dental source"}]},{"id":"critical","name":"Critical Emergencies","sub":"Respiratory crises","color":"#ef6a5f","blurb":"Life-threatening problems with the pleura, chest wall, pulmonary circulation, and gas exchange.","hint":"Ask where the failure is: the pump (drive, nerves, muscles), the chest wall, the pleural space (air or blood), the alveoli (fluid from the heart or from leaky capillaries), or the pulmonary blood flow.","dx":[{"id":"pe","name":"Pulmonary embolism","normal":"Blood flows freely from the right ventricle through the pulmonary arteries to every ventilated alveolus.","broke":"A clot (usually from a deep leg vein) breaks loose and lodges in the pulmonary arteries. Ventilated alveoli lose their blood supply (dead space), oxygen falls, and the patient breathes fast and blows off CO₂. A large clot makes the right ventricle fail and can cause shock.","care":"Oxygen, anticoagulation with bleeding precautions, and preparation for thrombolysis or clot removal if the patient is unstable. Prevention: early mobility, SCDs, and prescribed anticoagulants.","nursing":[{"t":"Raise the head of the bed and give oxygen.","ok":true,"r":"Treats hypoxemia from dead space and shunting."},{"t":"Start anticoagulation (such as heparin) as ordered and monitor the lab values that guide it.","ok":true,"r":"Anticoagulants stop the clot from growing and new clots from forming while the body breaks it down."},{"t":"Use bleeding precautions: soft toothbrush, electric razor, watch for bleeding.","ok":true,"r":"Anticoagulants and thrombolytics raise bleeding risk."},{"t":"Massage the swollen calf to improve circulation.","ok":false,"r":"Massage can dislodge more clot."},{"t":"Give aspirin as the main treatment.","ok":false,"r":"Aspirin isn't enough to treat an established PE."},{"t":"Prepare for thrombolytics or clot removal if the patient becomes hypotensive.","ok":true,"r":"A massive PE causing shock needs the clot broken up or removed quickly."},{"t":"Teach prevention: walking, SCDs, hydration, avoiding long periods of sitting, and taking anticoagulants exactly as prescribed.","ok":true,"r":"These lower the risk of new clots."},{"t":"Tell the patient to stop the anticoagulant once the chest pain goes away.","ok":false,"r":"Treatment lasts at least 3 months; stopping early risks another clot."}]},{"id":"fat","name":"Fat embolism syndrome","normal":"Fat stays locked inside bone marrow and fat cells.","broke":"After a long-bone or pelvic fracture (or orthopedic surgery), fat droplets enter the bloodstream and lodge in the lungs, brain, and skin. They block small vessels and trigger inflammation. The classic triad appears 12–72 hours later: low oxygen, confusion, and a petechial rash (chest, armpits, eyes, mouth).","care":"Oxygen and ventilatory support, early stabilization of fractures, minimal movement of the fractured limb, neuro checks, and supportive care. There is no specific antidote.","nursing":[{"t":"Give oxygen and prepare for ventilatory support if needed.","ok":true,"r":"Treatment is supportive; hypoxemia is the main threat."},{"t":"Keep the fractured limb immobilized and handle it as little as possible.","ok":true,"r":"Movement of unstable fractures can release more fat into the blood."},{"t":"Do frequent neuro checks.","ok":true,"r":"Fat emboli to the brain cause confusion, drowsiness, and sometimes seizures."},{"t":"Monitor fluid balance and platelets.","ok":true,"r":"Fat embolism can lower platelets; careful fluids support perfusion without overloading the lungs."},{"t":"Give heparin as the main treatment for the fat emboli.","ok":false,"r":"Anticoagulants don't dissolve fat and raise bleeding risk in trauma patients."},{"t":"Move the fractured leg often to prevent stiffness.","ok":false,"r":"Movement of an unstable fracture can release more fat."},{"t":"Check for petechiae on the chest, armpits, eyes, and mouth.","ok":true,"r":"The rash is a key sign and often comes and goes."},{"t":"Delay fracture fixation as long as possible.","ok":false,"r":"Early fixation lowers the risk of fat embolism."}]},{"id":"flail","name":"Flail chest","normal":"The rib cage moves as one unit: out with inspiration, in with expiration.","broke":"Two or more neighboring ribs break in two or more places, so a segment of chest wall floats free. It moves in when the patient breathes in and out when they breathe out (paradoxical movement). The bruised lung underneath (contusion) and the pain from breathing make ventilation fail.","care":"Aggressive pain control so the patient can breathe deeply, oxygen, pulmonary hygiene, and close monitoring for respiratory failure, pneumothorax, and hemothorax. Severe cases need intubation and positive-pressure ventilation.","nursing":[{"t":"Give aggressive pain control (such as an epidural or nerve block) as ordered.","ok":true,"r":"Pain keeps patients from taking deep breaths and coughing, which leads to atelectasis and pneumonia."},{"t":"Give oxygen and encourage deep breathing and incentive spirometry.","ok":true,"r":"Keeps alveoli open under the bruised lung."},{"t":"Monitor for respiratory failure and prepare for intubation.","ok":true,"r":"Positive-pressure ventilation stabilizes the flail segment from the inside."},{"t":"Watch for pneumothorax and hemothorax.","ok":true,"r":"Broken rib ends can tear the lung or blood vessels."},{"t":"Tape or sandbag the flail segment tightly.","ok":false,"r":"Binding the chest restricts breathing and is no longer recommended."},{"t":"Withhold opioids to preserve the drive to breathe.","ok":false,"r":"Undertreated pain causes shallow breathing; pain control is a priority."},{"t":"Keep the head of the bed elevated and reposition regularly.","ok":true,"r":"Improves lung expansion and helps move secretions."},{"t":"Give large IV fluid boluses freely.","ok":false,"r":"Too much fluid worsens fluid leak into the bruised lung."}]},{"id":"ards","name":"ARDS","normal":"A thin, intact barrier between capillaries and alveoli keeps fluid in the vessels and air in the alveoli. Surfactant keeps alveoli open.","broke":"A major insult (sepsis, aspiration, drowning, pancreatitis, trauma) triggers widespread inflammation that damages the alveolar-capillary barrier. Protein-rich fluid floods the alveoli and surfactant is lost, so alveoli collapse. The lungs become stiff and 'white,' and oxygen stays low even on 100% oxygen. The heart isn't the cause.","care":"Low tidal volume ventilation with PEEP, prone positioning, conservative fluids, and treating the underlying cause. Watch for barotrauma.","nursing":[{"t":"Support lung-protective ventilation: low tidal volumes (about 6 mL/kg of ideal body weight) and PEEP.","ok":true,"r":"Small breaths avoid overstretching injured lungs; PEEP keeps alveoli open."},{"t":"Help with prone positioning as ordered.","ok":true,"r":"Proning improves oxygenation and survival in moderate to severe ARDS."},{"t":"Treat the underlying cause (e.g., antibiotics for sepsis).","ok":true,"r":"ARDS keeps going until the trigger is controlled."},{"t":"Follow a conservative fluid strategy once the patient is stable.","ok":true,"r":"Extra fluid leaks into injured lungs."},{"t":"Use large tidal volumes (10–12 mL/kg) to open the lungs.","ok":false,"r":"Large breaths injure the lungs further."},{"t":"Treat it mainly with high-dose diuretics, since it's heart failure.","ok":false,"r":"ARDS is noncardiogenic. The leak is from damaged capillaries, not a failing heart."},{"t":"Watch for pneumothorax with high PEEP.","ok":true,"r":"High airway pressures can rupture alveoli (barotrauma)."},{"t":"Expect 100% oxygen alone to fix the low oxygen.","ok":false,"r":"Hypoxemia in ARDS is refractory: fluid-filled and collapsed alveoli can't take in oxygen, so PEEP and other measures are needed."}]},{"id":"arf","name":"Acute respiratory failure (hypercapnic)","normal":"The brain sets the breathing rate, nerves and muscles move the chest, and the lungs exchange gas, keeping PaCO₂ near 40 mmHg.","broke":"The 'pump' fails: the drive to breathe is suppressed (opioids, CO₂ narcosis), the nerves or muscles are too weak (Guillain-Barré, myasthenia), or the work of breathing outlasts the muscles (COPD). Ventilation drops, CO₂ builds up, and pH falls (PaCO₂ > 50 mmHg with pH \u003c 7.30).","care":"Support ventilation (BiPAP or intubation), treat the cause (naloxone, careful oxygen titration, immunotherapy), and follow ABGs, mental status, and in neuromuscular disease, vital capacity and NIF.","nursing":[{"t":"Support ventilation with BiPAP or prepare for intubation as ordered.","ok":true,"r":"The problem is not enough air movement; ventilation must be supported."},{"t":"Treat the cause (for example, naloxone for opioid overdose).","ok":true,"r":"Reversing the cause can restore breathing quickly."},{"t":"Check mental status, breathing rate and depth, and ABGs often.","ok":true,"r":"Rising CO₂ causes drowsiness and confusion; worsening needs fast action."},{"t":"Keep the airway open: head of bed up, jaw thrust or airway adjunct as needed.","ok":true,"r":"A drowsy patient can obstruct their own airway."},{"t":"Give a sedative for restlessness.","ok":false,"r":"Restlessness may be from hypoxemia or hypercapnia; sedation worsens failure."},{"t":"Turn oxygen up high in a CO₂-retaining COPD patient without monitoring.","ok":false,"r":"Excess oxygen can worsen CO₂ retention in some COPD patients. Titrate to 88–92%."},{"t":"For neuromuscular weakness, track vital capacity and NIF and report falling values.","ok":true,"r":"These fall before the ABG worsens and signal the need for intubation."},{"t":"Rely on SpO₂ alone to judge how well the patient is ventilating.","ok":false,"r":"SpO₂ can look fine on oxygen while CO₂ climbs. Use ABGs or capnography."}]},{"id":"ptx","name":"Pneumothorax (simple)","normal":"Negative pressure in the pleural space holds the lung against the chest wall.","broke":"Air enters the pleural space (a ruptured bleb, a procedure, or trauma). The negative pressure is lost and part of the lung collapses: sudden chest pain, shortness of breath, decreased breath sounds, and hyperresonance on that side. There is no shift of the mediastinum.","care":"Oxygen, monitoring for tension, and a chest tube or needle aspiration for larger or symptomatic collapses. Keep the drainage system below the chest and upright.","nursing":[{"t":"Give oxygen and raise the head of the bed.","ok":true,"r":"Improves oxygenation and helps reabsorb small pneumothoraces."},{"t":"Assist with chest tube insertion and keep the drainage system below the level of the chest.","ok":true,"r":"Keeping it low prevents backflow into the pleural space."},{"t":"Monitor for tracheal shift, hypotension, JVD, and worsening distress.","ok":true,"r":"These signs mean the pneumothorax has become a tension pneumothorax."},{"t":"Check for tidaling in the water-seal chamber and expect some bubbling with air leaks.","ok":true,"r":"Tidaling shows the system connects to the pleural space; bubbling shows air is still leaving."},{"t":"Clamp the chest tube when moving the patient.","ok":false,"r":"Clamping can cause a tension pneumothorax."},{"t":"Strip or milk the chest tube routinely.","ok":false,"r":"Stripping creates very negative pressure that can damage tissue."},{"t":"Teach to avoid flying, scuba diving, and smoking until cleared.","ok":true,"r":"Pressure changes and smoking raise the risk of another collapse."},{"t":"Place the drainage system on the bed above the chest.","ok":false,"r":"Fluid and air can flow back into the chest."}]},{"id":"htx","name":"Hemothorax","normal":"The pleural space holds only a few milliliters of fluid.","broke":"Blood collects in the pleural space from injured chest wall or lung vessels (trauma, procedures, anticoagulants). It compresses the lung and can cause shock. The affected side is dull to percussion with decreased breath sounds.","care":"Large-bore IV access and blood products, chest tube drainage with careful output measurement, and preparation for surgery if bleeding continues.","nursing":[{"t":"Start two large-bore IVs and prepare blood products.","ok":true,"r":"Bleeding into the chest can cause hypovolemic shock."},{"t":"Assist with chest tube placement and measure the output carefully.","ok":true,"r":"Output shows how much blood has been lost and whether bleeding continues."},{"t":"Report an initial output over 1,500 mL or about 200 mL/hr for 2–4 hours.","ok":true,"r":"These amounts usually mean the patient needs surgery (thoracotomy)."},{"t":"Monitor hemoglobin and vital signs for shock.","ok":true,"r":"Falling Hgb, rising HR, and falling BP signal ongoing bleeding."},{"t":"Clamp the chest tube if the output is high.","ok":false,"r":"Clamping traps blood and air in the chest."},{"t":"Expect bright red output of 300 mL/hr to be normal for the first day.","ok":false,"r":"That rate means active bleeding and needs urgent reporting."},{"t":"Prepare for autotransfusion or surgery if bleeding continues.","ok":true,"r":"The patient's own blood can be returned, and ongoing bleeding needs surgical repair."},{"t":"Delay chest tube placement until lab results are back.","ok":false,"r":"Draining the blood is urgent; labs shouldn't delay it."}]},{"id":"tptx","name":"Tension pneumothorax","normal":"Negative pressure in the pleural space holds the lung against the chest wall, and the mediastinum stays midline.","broke":"Air enters the pleural space with each breath but can't escape (a one-way valve). Pressure builds, collapses the lung, shoves the mediastinum and trachea to the other side, and kinks the great veins, so blood can't return to the heart. Result: JVD, hypotension, and obstructive shock. Positive-pressure ventilation and clamped chest tubes are classic causes.","care":"A clinical diagnosis: don't wait for an X-ray. Immediate needle decompression, then a chest tube. Check for clamped or blocked chest tubes, and give 100% oxygen.","nursing":[{"t":"Get the provider or rapid response team for immediate needle decompression.","ok":true,"r":"Releasing the trapped air restores venous return and saves the patient."},{"t":"Prepare for chest tube insertion after decompression.","ok":true,"r":"Needle decompression is temporary; a chest tube provides ongoing drainage."},{"t":"Check any existing chest tube for clamps, kinks, or clots.","ok":true,"r":"A blocked chest tube is a common, fixable cause."},{"t":"Get a chest X-ray to confirm before treating.","ok":false,"r":"Tension pneumothorax is diagnosed clinically; waiting for imaging can be fatal."},{"t":"Give 100% oxygen.","ok":true,"r":"Supports oxygenation while the cause is being fixed."},{"t":"Clamp the chest tube to see if the patient improves.","ok":false,"r":"Clamping traps air and causes or worsens tension."},{"t":"Give a fluid bolus and recheck in 30 minutes.","ok":false,"r":"Fluids don't fix the obstruction to venous return; decompression does."},{"t":"Recognize the signs: tracheal shift away from the affected side, JVD, hypotension, absent breath sounds.","ok":true,"r":"These signs together demand immediate action."}]},{"id":"pedema","name":"Pulmonary edema (cardiogenic)","normal":"The left ventricle pumps out what it receives, so pressure in the pulmonary capillaries stays low and fluid stays in the vessels.","broke":"The left ventricle can't keep up (heart attack, weak muscle, very high blood pressure, or fluid overload). Pressure backs up into the pulmonary capillaries and pushes fluid into the interstitium and alveoli. Result: sudden breathlessness, orthopnea, crackles, pink frothy sputum, and low oxygen. BNP is high.","care":"High Fowler's position with legs down, oxygen or CPAP/BiPAP, IV diuretics, nitrates, careful monitoring of potassium, output, and weight, and treating the trigger.","nursing":[{"t":"Sit the patient upright with legs dangling.","ok":true,"r":"Reduces blood return to the heart and eases breathing."},{"t":"Give oxygen; prepare for CPAP or BiPAP.","ok":true,"r":"Positive pressure pushes fluid out of the alveoli and lowers the work of breathing."},{"t":"Give IV furosemide as ordered and monitor potassium and urine output.","ok":true,"r":"Diuresis removes excess fluid; loop diuretics lower potassium."},{"t":"Give nitrates as ordered while watching blood pressure.","ok":true,"r":"Nitrates lower preload and afterload quickly."},{"t":"Lay the patient flat with legs raised.","ok":false,"r":"This increases blood return to an overloaded heart and worsens the edema."},{"t":"Give a rapid IV fluid bolus.","ok":false,"r":"Extra fluid worsens pulmonary edema."},{"t":"Teach daily weights and a low-sodium diet.","ok":true,"r":"Early weight gain signals fluid retention before symptoms appear."},{"t":"Encourage the patient to skip diuretics on busy days to avoid bathroom trips.","ok":false,"r":"Missed diuretics are a common trigger of acute pulmonary edema."}]}],"tests":[{"id":"cbc","cat":"labs","name":"CBC","el":false,"normal":{"t":"WBC 8.1 K/µL, Hgb 13.8 g/dL, platelets 236 K/µL.","ro":[],"s":null}},{"id":"bmp","cat":"labs","name":"Basic metabolic panel","el":false,"normal":{"t":"Na 139, K 4.2, Cl 103, HCO₃ 24 mEq/L; BUN 15, Cr 0.9 mg/dL; glucose 104 mg/dL.","ro":[],"s":null}},{"id":"abg","cat":"labs","name":"Arterial blood gas","el":false,"normal":{"t":"pH 7.40, PaCO₂ 40 mmHg, PaO₂ 92 mmHg, HCO₃ 24 mEq/L.","ro":["arf"],"s":"No hypercapnia"}},{"id":"ddimer","cat":"labs","name":"D-dimer","el":false,"normal":{"t":"0.3 µg/mL FEU (normal \u003c 0.5).","ro":["pe"],"s":"Normal D-dimer"}},{"id":"b ":{"t":"pH 7.43, PaCO₂ 35 mmHg, PaO₂ 54 mmHg, HCO₃ 23 mEq/L.","ro":["arf"],"s":"No hypercapnic acidosis","sup":true},"ecg":{"t":"Sinus tachycardia. Left ventricular hypertrophy with strain.","ro":[],"s":null}},"clues":"Stopped antihypertensives, BP 228/124, sudden dyspnea, crackles, S4, high BNP, stiff thick LV: flash pulmonary edema from hypertensive emergency.","variant":"Hypertensive emergency (flash edema)"},{"id":"c-pedema-3","dx":"pedema","acute":true,"name":"Evelyn Crane","age":84,"sex":"F","setting":"Medical Unit","summary":"Receiving her third unit of packed red blood cells for anemia. Halfway through the unit she became short of breath, her BP rose, and her neck veins are distended.","history":[{"t":"Halfway through her third unit of packed red blood cells today, she became short of breath.","ro":[],"s":"Dyspnea during transfusion","sup":true},{"t":"Has heart failure (EF 35%) and chronic kidney disease.","ro":[],"s":null},{"t":"Each unit has run over 90 minutes.","ro":[],"s":null},{"t":"No chest injury or broken bones.","ro":["flail","fat"],"s":"No chest trauma or fractures"}],"vitals":[{"t":"Temp 98.8 °F (37.1 °C)","ro":[],"s":null},{"t":"HR 108 bpm","ro":[],"s":null},{"t":"RR 30/min","ro":[],"s":null},{"t":"BP 176/92 mmHg","ro":[],"s":null},{"t":"SpO₂ 87% on 2 L","ro":[],"s":null}],"physical":[{"t":"Crackles in both lungs; JVD; S3.","ro":[],"s":"Crackles, JVD, S3","sup":true},{"t":"Sitting forward; can't lie back.","ro":[],"s":null},{"t":"Up 2.4 kg since yesterday.","ro":[],"s":null},{"t":"Breath sounds present on both sides. Trachea midline.","ro":["ptx","tptx"],"s":"Breath sounds present, trachea midline"},{"t":"Chest wall moves symmetrically; no paradoxical movement.","ro":["flail"],"s":"No paradoxical chest movement"}],"tests":{"bnp":{"t":"1,420 pg/mL (up from 510 last month).","ro":["ards"],"s":"High BNP (cardiac cause)","sup":true},"echo":{"t":"EF 35%, unchanged. Dilated left atrium. Full, non-collapsing IVC.","ro":["ards"],"s":"Weak left ventricle <script>
(function(){
const START_TOKENS = 15;
const KEY = "cm-du-resp-casebook-v1";
const CMAP = Object.fromEntries(CATS.map(c=>[c.id,c]));
CATS.forEach(c=>{ c.DXMAP=Object.fromEntries(c.dx.map(d=>[d.id,d])); c.TMAP=Object.fromEntries(c.tests.map(t=>[t.id,t])); c.cases.forEach(p=>p.cat=c.id); });
const ALL = CATS.flatMap(c=>c.cases);
const PMAP = Object.fromEntries(ALL.map(p=>[p.id,p]));
const DEFERRED = {t:"Deferred. This test isn't appropriate for an unstable, acute patient. Think about what this patient needs right now.", ro:[], deferred:true};
const TABS = [
  {id:"history", name:"Patient History", kind:"bulk"},
  {id:"vitals", name:"Vital Signs", kind:"bulk"},
  {id:"physical", name:"Physical Assessment", kind:"bulk"},
  {id:"labs", name:"Labs", kind:"test"},
  {id:"diag", name:"Diagnostics", kind:"test"},
  {id:"img", name:"Imaging", kind:"test"},
  {id:"dx", name:"Diagnosis", kind:"dx"}
];

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fresh(){ return {tokens:START_TOKENS, tabs:{}, tests:[], ev:{}, solved:false, wrong:0, pick:null, msg:null}; }
function load(){
  let s=null;
  try{ s=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s||!s.cases) s={view:"wards", cat:null, cur:null, tab:"history", cases:{}, order:{}, mode:"focus"};
  s.order=s.order||{};
  ALL.forEach(p=>{ if(!s.cases[p.id]) s.cases[p.id]=fresh(); });
  CATS.forEach(c=>{ const o=s.order[c.id], ids=c.cases.map(p=>p.id);
    if(!Array.isArray(o)||o.length!==ids.length||!ids.every(i=>o.includes(i))) s.order[c.id]=shuffle(ids); });
  if(s.cur && !PMAP[s.cur]) { s.cur=null; s.view="wards"; }
  if(s.cat && !CMAP[s.cat]) { s.cat=null; s.view="wards"; }
  if(s.mode!=="mystery") s.mode="focus";
  s.confirmNew=false; s.confirmReset=false;
  return s;
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const esc = s => String(s).replace(/[&<>"]/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const app = document.getElementById("app");
const ageOf = p => p.ageLabel || p.age;
const solvedIn = c => c.cases.filter(p=>S.cases[p.id].solved).length;

function testResult(cat,p,tid){ const t=cat.TMAP[tid]; if(p.tests[tid]) return p.tests[tid]; if(t.el && p.acute) return DEFERRED; return t.normal; }
function finding(cat,p,key){ const i=key.indexOf(":"), src=key.slice(0,i), rest=key.slice(i+1); if(src==="t") return testResult(cat,p,rest); return (p[src]||[])[+rest]; }
function label(f){ if(f.s) return f.s; const t=f.t.split(/[.;]/)[0]; return t.length>60 ? t.slice(0,57)+"…" : t; }
function eliminated(cat,p,c){
  const out={};
  Object.keys(c.ev).forEach(k=>{ if(!c.ev[k]) return; const f=finding(cat,p,k); if(!f) return;
    f.ro.forEach(d=>{ if(d===p.dx) return; (out[d]=out[d]||[]).push(label(f)); }); });
  return out;
}

function go(view, extra){ Object.assign(S,{view, confirmNew:false, confirmReset:false}, extra||{}); setHash(); render(); window.scrollTo(0,0); }
function setHash(){ const h = S.view==="wards" ? "" : "#"+(S.view==="case" ? S.cur : S.cat); try{ if(location.hash!==h) history.replaceState(null,"",h||location.pathname+location.search); }catch(e){} }
function fromHash(){ const h=(location.hash||"").slice(1); if(!h) return false;
  if(PMAP[h]){ if(S.cur!==h) S.from=S.mode==="mystery"?"mystery":"focus"; S.view="case"; S.cur=h; S.cat=PMAP[h].cat; S.tab=S.tab||"history"; return true; }
  if(CMAP[h]){ S.view="ward"; S.cat=h; return true; } return false; }
window.addEventListener("hashchange",()=>{ if(fromHash()) render(); });
document.getElementById("home").onclick=()=>go("wards");

function render(){
  save();
  if(S.view==="case" && S.cur) renderCase();
  else if(S.view==="ward" && S.cat) renderWard();
  else renderWards();
}

function renderWards(){
  const total=ALL.length, solved=ALL.filter(p=>S.cases[p.id].solved).length;
  app.innerHTML=`
  <section class="hero">
    <h1>Diagnosis <span>Unknown</span>: The Respiratory Casebook</h1>
    <p>${CATS.reduce((n,c)=>n+c.dx.length,0)} respiratory diagnoses across four wards, three different patients for each. Pick a ward, then choose a diagnosis to practice or play the cases as a shuffled mystery. Spend tokens to gather data and eliminate diagnoses until only one fits.</p>
    <div class="rules">
      <div class="rule"><b>15 tokens per patient</b>History, Vital Signs, and Physical Assessment cost 1 token to unlock the whole tab. Each lab, diagnostic, or imaging test costs 1 token.</div>
      <div class="rule"><b>You choose the evidence</b>Mark findings as evidence. The Diagnosis tab crosses off any diagnosis your evidence contradicts and shows why.</div>
      <div class="rule"><b>Order wisely</b>Some tests aren't appropriate for an unstable patient. They'll be deferred and the token is still spent. A wrong diagnosis costs 1 token.</div>
      <div class="rule"><b>Practice what you don't know</b>Choose a diagnosis and pick any of its three cases. Each one shows the condition in a different patient and setting.</div>
    </div>
  </section>
  <div class="progress"><span>${solved} of ${total} cases solved</span><div class="bar"><i style="width:${solved/total*100}%"></i></div></div>
  <div class="sect">Choose a ward</div>
  <div class="wards">${CATS.map(c=>{ const s=solvedIn(c);
    return `<button class="ward" style="--c:${c.color}" data-ward="${c.id}">
      <div class="wk"><span>${c.dx.length} DIAGNOSES · ${c.cases.length} CASES</span><span>${s?s+" solved":"New"}</span></div>
      <div class="wn">${esc(c.name)}</div><div class="ws">${esc(c.sub)}</div>
      <div class="wb">${esc(c.blurb)}</div>
      <div class="wdx">${c.dx.map(d=>`<span>${esc(d.name)}</span>`).join("")}</div>
      <div class="wprog"><div class="bar"><i style="width:${s/c.cases.length*100}%"></i></div><span>${s}/${c.cases.length}</span></div>
    </button>`; }).join("")}</div>`;
  app.querySelectorAll("[data-ward]").forEach(b=>b.onclick=()=>go("ward",{cat:b.dataset.ward}));
}

function statusPill(p){
  const st=S.cases[p.id];
  const started = st.tokens<START_TOKENS || Object.keys(st.ev).length;
  return st.solved ? '<span class="pill solved">Solved</span>' : started ? `<span class="pill open">${st.tokens} tokens left</span>` : '<span class="pill">New</span>';
}
const dxCases = (c,dxId) => c.cases.filter(p=>p.dx===dxId);
function caseCard(c,p,i){
  const st=S.cases[p.id], pill=statusPill(p);
  return `<button class="case" data-open="${p.id}" data-from="mystery">
    <div class="num"><span>CASE ${String(i+1).padStart(2,"0")}</span>${pill}</div>
    <div class="nm">${esc(p.name)}</div>
    <div class="meta">${esc(ageOf(p))} · ${p.sex} · ${esc(p.setting)}</div>
    <div class="cc">${esc(p.summary)}</div>
    ${st.solved?`<div class="sdx">✓ ${esc(c.DXMAP[p.dx].name)}</div>`:""}
  </button>`;
}
function renderWard(){
  const c=CMAP[S.cat], ord=S.order[c.id], s=solvedIn(c);
  const no = p => ord.indexOf(p.id);
  const focus = S.mode!=="mystery";
  let grid;
  if(focus){
    grid = `<div class="focuslist">${c.dx.map(d=>{ const list=dxCases(c,d.id), sv=list.filter(p=>S.cases[p.id].solved).length;
      return `<section class="fdx" id="fdx-${d.id}">
        <div class="fhead"><h3>${esc(d.name)}</h3><span class="fcount ${sv===3?"done":""}">${sv}/3 solved</span></div>
        <div class="fopts">${list.map((p,i)=>`<button class="fopt ${S.cases[p.id].solved?"isdone":""}" data-open="${p.id}" data-from="focus">
          <span class="fk">CASE ${i+1} OF 3 ${statusPill(p)}</span>
          <span class="fv">${esc(p.variant)}</span>
          <span class="fp">${esc(p.name)} · ${esc(ageOf(p))} ${p.sex} · ${esc(p.setting)}</span>
        </button>`).join("")}</div>
      </section>`; }).join("")}</div>`;
  } else {
    grid = `<div class="cases">${ord.map((id,i)=>caseCard(c,PMAP[id],i)).join("")}</div>`;
  }
  app.innerHTML=`
  <div class="topbar"><button class="btn ghost" id="back">← All wards</button></div>
  <section class="hero" style="padding-top:8px">
    <h1 style="color:${c.color}">${esc(c.name)} <span style="color:var(--muted);font-weight:500">· ${esc(c.sub)}</span></h1>
    <p>${esc(c.blurb)} ${esc(c.hint)}</p>
    <div class="diffbox"><div class="dl">This ward's differential · each diagnosis appears in 3 cases</div>
      <div class="dd">${c.dx.map(d=>`<span>${esc(d.name)}</span>`).join("")}</div></div>
  </section>
  <div class="progress" style="--c:${c.color}"><span>${s} of ${c.cases.length} solved</span><div class="bar"><i style="width:${s/c.cases.length*100}%"></i></div>
    ${S.confirmNew
      ? `<span class="confirm">Reshuffle this ward and clear its progress on this device? <button class="btn" id="newYes">Reshuffle &amp; clear</button><button class="btn ghost" id="newNo">Cancel</button></span>`
      : `<button class="btn" id="newGame">Reshuffle ward</button>`}</div>
  <div class="toolrow">
    <div class="seg" role="radiogroup" aria-label="How to pick a case">
      <button role="radio" aria-checked="${focus}" data-mode="focus">By diagnosis</button>
      <button role="radio" aria-checked="${!focus}" data-mode="mystery">Mystery shuffle</button>
    </div>
    <span class="modehint">${focus
      ? "Pick the diagnosis you want to practice, then choose one of its three cases. Each case shows a different side of the condition."
      : "Cases are shuffled and unlabeled. Work out the diagnosis yourself."}</span>
  </div>
  ${focus?`<nav class="jump" aria-label="Jump to a diagnosis">${c.dx.map(d=>`<a href="#fdx-${d.id}" data-jump="${d.id}">${esc(d.name)}</a>`).join("")}</nav>`:""}
  ${grid}
  <div style="height:30px"></div>`;
  document.getElementById("back").onclick=()=>go("wards");
  const ng=document.getElementById("newGame"); if(ng) ng.onclick=()=>{S.confirmNew=true;render();};
  const ny=document.getElementById("newYes"); if(ny) ny.onclick=()=>{ c.cases.forEach(p=>S.cases[p.id]=fresh()); S.order[c.id]=shuffle(c.cases.map(p=>p.id)); S.confirmNew=false; render(); };
  const nn=document.getElementById("newNo"); if(nn) nn.onclick=()=>{S.confirmNew=false;render();};
  app.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;render();});
  app.querySelectorAll("[data-jump]").forEach(a=>a.onclick=e=>{ e.preventDefault(); const el=document.getElementById("fdx-"+a.dataset.jump); if(el) window.scrollTo(0, el.getBoundingClientRect().top+window.scrollY-12); });
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>go("case",{cur:b.dataset.open, tab:"history", from:b.dataset.from}));
  if(S.scrollDx){ const el=document.getElementById("fdx-"+S.scrollDx); S.scrollDx=null; if(el) requestAnimationFrame(()=>window.scrollTo(0, el.getBoundingClientRect().top+window.scrollY-12)); }
}

let tabJump=false;
function renderCase(){
  const p=PMAP[S.cur], cat=CMAP[p.cat], c=S.cases[p.id];
  const elim=eliminated(cat,p,c);
  const remaining=cat.dx.filter(d=>!elim[d.id]).length;
  const tcls = c.tokens===0?"out":c.tokens<=4?"low":"";
  const evCount=Object.keys(c.ev).filter(k=>{ if(!c.ev[k]) return false; const f=finding(cat,p,k); return f && (f.sup || f.ro.length===0); }).length;
  const oldTabs=app.querySelector(".tabs");
  const keepLeft=oldTabs?oldTabs.scrollLeft:0, keepY=window.scrollY;
  const no=S.order[cat.id].indexOf(p.id)+1;
  const inFocus = S.from==="focus";
  const D0=cat.DXMAP[p.dx], fi=dxCases(cat,p.dx).indexOf(p)+1;
  const metaLine = inFocus
    ? `${esc(cat.name.toUpperCase())} · ${esc(D0.name.toUpperCase())} · CASE ${fi} OF 3 · ${esc(p.setting)}`
    : `${esc(cat.name.toUpperCase())} · CASE ${String(no).padStart(2,"0")} · ${esc(p.setting)}`;
  app.innerHTML=`
  <div class="topbar">
    <button class="btn ghost" id="back">← ${inFocus?esc(D0.name):esc(cat.name)} cases</button>
    <span class="spacer"></span>
    ${S.confirmReset
      ? `<span class="confirm">Reset this case to 15 tokens and clear all findings? <button class="btn" id="resetYes">Reset case</button><button class="btn ghost" id="resetNo">Cancel</button></span>`
      : `<button class="btn" id="reset">Reset case</button>`}
  </div>
  <section class="file">
    <div class="who">
      <div class="meta" style="color:${cat.color}">${metaLine}</div>
      ${inFocus?`<div class="fvar">${esc(p.variant)}</div>`:""}
      <h2>${esc(p.name)}, ${esc(ageOf(p))} ${p.sex}</h2>
      <p class="cc">${esc(p.summary)}</p>
    </div>
    <div class="tokens">
      <div class="lbl">Tokens</div>
      <div class="count ${tcls}">${c.tokens}</div>
      <div class="pips">${Array.from({length:START_TOKENS},(_,i)=>`<i class="${i<c.tokens?"on":""}"></i>`).join("")}</div>
    </div>
  </section>
  <nav class="tabs" role="tablist">
    ${TABS.map(t=>{ let extra="";
      if(t.kind==="bulk" && !c.tabs[t.id]) extra='<span class="lock">🔒</span>';
      if(t.kind==="dx") extra=`<span class="badge">${remaining} left</span>`;
      return `<button class="tab" role="tab" aria-selected="${S.tab===t.id}" data-tab="${t.id}">${t.name}${extra}</button>`;}).join("")}
  </nav>
  <section class="pane" id="pane"></section>`;
  document.getElementById("back").onclick=()=>go("ward",{cat:cat.id, scrollDx: inFocus?p.dx:null});
  const r=document.getElementById("reset"); if(r) r.onclick=()=>{S.confirmReset=true;render();};
  const ry=document.getElementById("resetYes"); if(ry) ry.onclick=()=>{S.cases[p.id]=fresh();S.confirmReset=false;S.tab="history";render();};
  const rn=document.getElementById("resetNo"); if(rn) rn.onclick=()=>{S.confirmReset=false;render();};
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;tabJump=true;render();});
  renderPane(cat,p,c,elim,remaining,evCount);
  const tabs=app.querySelector(".tabs");
  tabs.scrollLeft=keepLeft; window.scrollTo(0,keepY);
  const sel=tabs.querySelector('[aria-selected="true"]');
  if(sel){ const l=sel.offsetLeft-tabs.offsetLeft, rr=l+sel.offsetWidth;
    if(l<tabs.scrollLeft) tabs.scrollLeft=l-8; else if(rr>tabs.scrollLeft+tabs.clientWidth) tabs.scrollLeft=rr-tabs.clientWidth+8; }
  if(tabJump){ tabJump=false; const pane=document.getElementById("pane");
    const top=pane.getBoundingClientRect().top+window.scrollY-tabs.offsetHeight; if(window.scrollY>top) window.scrollTo(0,top); }
}
function evBtn(c,key){ const on=!!c.ev[key]; return `<button class="ev" aria-pressed="${on}" data-ev="${key}">${on?"✓ Evidence":"+ Add as evidence"}</button>`; }

function renderPane(cat,p,c,elim,remaining,evCount){
  const pane=document.getElementById("pane");
  const tab=TABS.find(t=>t.id===S.tab)||TABS[0];
  if(tab.kind==="bulk"){
    if(!c.tabs[tab.id]){
      pane.innerHTML=`<div class="locked"><p>${tab.name} is locked.</p><button class="btn primary" id="unlock" ${c.tokens<1||c.solved?"disabled":""}>Unlock for 1 token</button>${c.tokens<1?'<p style="margin-top:10px">Out of tokens. Make your diagnosis with the evidence you have.</p>':""}</div>`;
      document.getElementById("unlock").onclick=()=>{ if(c.tokens<1)return; c.tokens--; c.tabs[tab.id]=true; render(); };
      return;
    }
    const list=p[tab.id];
    let order=list.map((_,i)=>i);
    if(tab.id!=="vitals"){ c.ford=c.ford||{};
      if(!Array.isArray(c.ford[tab.id])||c.ford[tab.id].length!==list.length) c.ford[tab.id]=shuffle(order);
      order=c.ford[tab.id]; }
    pane.innerHTML=`<p class="hint">Mark the findings you think matter. Only evidence can eliminate a diagnosis.</p>
      <div class="${tab.id==="vitals"?"vgrid":"items"}">${order.map(i=>{ const f=list[i], key=`${tab.id}:${i}`;
        return `<div class="item ${c.ev[key]?"in":""}"><div class="txt">${esc(f.t)}</div>${evBtn(c,key)}</div>`;}).join("")}</div>`;
  } else if(tab.kind==="test"){
    const tests=cat.tests.filter(t=>t.cat===tab.id);
    pane.innerHTML=`<p class="hint">Each test costs 1 token and can't be un-ordered. Once a result is back, you decide whether it counts as evidence.</p>
      <div class="items">${tests.map(t=>{
        if(!c.tests.includes(t.id)) return `<div class="item"><div class="txt"><div class="tname">${esc(t.name)}</div></div><button class="order" data-order="${t.id}" ${c.tokens<1||c.solved?"disabled":""}>Order · 1 token</button></div>`;
        const r=testResult(cat,p,t.id), key="t:"+t.id;
        return `<div class="item ${c.ev[key]?"in":""}"><div class="txt"><div class="tname">${esc(t.name)}</div><div class="res ${r.deferred?"def":""}">${esc(r.t)}</div></div>${r.deferred?"":evBtn(c,key)}</div>`;
      }).join("")}</div>`;
    pane.querySelectorAll("[data-order]").forEach(b=>b.onclick=()=>{ if(c.tokens<1)return; c.tokens--; c.tests.push(b.dataset.order); render(); });
  } else renderDx(cat,pane,p,c,elim,remaining,evCount);
  pane.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>{ const k=b.dataset.ev; if(c.ev[k]) delete c.ev[k]; else c.ev[k]=true; if(c.pick&&eliminated(cat,p,c)[c.pick]) c.pick=null; render(); });
}

function renderDx(cat,pane,p,c,elim,remaining,evCount){
  const D=cat.DXMAP[p.dx];
  const opts=cat.dx.map(d=>{ const out=elim[d.id], sel=c.pick===d.id;
    return `<label class="dx ${out?"out":""} ${sel?"sel":""}">
      <input type="radio" name="dxpick" id="dx-${d.id}" value="${d.id}" ${out||c.solved?"disabled":""} ${sel?"checked":""}>
      <div class="dn">${esc(d.name)}</div>
      ${out?`<div class="why">Ruled out by: ${out.map(esc).join("; ")}</div>`:""}
    </label>`;}).join("");
  pane.innerHTML=`
    <div class="dxhead"><h3>Differential · ${esc(cat.name)}</h3><span class="left">${remaining} of ${cat.dx.length} still possible · ${evCount} piece${evCount===1?"":"s"} of evidence</span></div>
    <div class="dxgrid">${opts}</div>
    ${c.solved?"":`<div class="submitrow"><button class="btn primary" id="submit" ${c.pick?"":"disabled"}>Submit diagnosis</button>
      ${c.msg?`<span class="msg bad">${esc(c.msg)}</span>`:`<span class="msg" style="color:var(--muted)">${c.pick?"Ready when you are.":"Select a diagnosis that hasn't been ruled out."}</span>`}</div>`}
    ${c.solved?`<div class="reveal">
      <div class="rh"><div class="k">Good job. Case solved.</div><h3>${esc(D.name)}</h3></div>
      <div class="rb">
        <div class="blk"><b>How it should work</b><p>${esc(p.normal||D.normal)}</p></div>
        <div class="blk"><b>What broke</b><p>${esc(p.broke||D.broke)}</p></div>
        <div class="blk"><b>The clues that mattered</b><p>${esc(p.clues)}</p></div>
        <div class="stats">Solved with ${c.tokens} of ${START_TOKENS} tokens left · ${c.wrong} wrong guess${c.wrong===1?"":"es"}</div>
        ${sataHTML(cat,p,c)}
      </div></div>`:""}`;
  pane.querySelectorAll("input[name=dxpick]").forEach(i=>i.onchange=()=>{c.pick=i.value;c.msg=null;render();});
  pane.querySelectorAll("input[data-nq]").forEach(i=>i.onchange=()=>{ const k=+i.dataset.nq; if(i.checked) c.nq.sel[k]=true; else delete c.nq.sel[k]; render(); });
  const ns=document.getElementById("nqSubmit"); if(ns) ns.onclick=()=>{ if(!Object.keys(c.nq.sel).length) return; c.nq.done=true; render(); };
  const sb=document.getElementById("submit");
  if(sb) sb.onclick=()=>{ if(!c.pick) return;
    if(c.pick===p.dx){ c.solved=true; c.msg=null; c.nq=null; }
    else { c.wrong++; if(c.tokens>0) c.tokens--; c.msg=`Not ${cat.DXMAP[c.pick].name}. That cost a token. What evidence haven't you gathered yet?`; c.pick=null; }
    render(); };
  const nb=document.getElementById("next");
  if(nb) nb.onclick=()=>{ const nx=nextCase(cat,p); if(nx) go("case",{cur:nx.id, tab:"history"}); else go("ward",{cat:cat.id, scrollDx: S.from==="focus"?p.dx:null}); };
}
function sataHTML(cat,p,c){
  const opts=p.nursing||cat.DXMAP[p.dx].nursing;
  if(!c.nq||!c.nq.order||c.nq.order.length!==opts.length) c.nq={order:shuffle(opts.map((_,i)=>i)), sel:{}, done:false};
  const q=c.nq, nSel=Object.keys(q.sel).length;
  const body=q.order.map(i=>{ const o=opts[i], on=!!q.sel[i];
    if(!q.done) return `<label class="nopt ${on?"on":""}"><input type="checkbox" id="nq-${p.id}-${i}" data-nq="${i}" ${on?"checked":""}><span>${esc(o.t)}</span></label>`;
    const kind = on ? (o.ok?"hit":"wrong") : (o.ok?"miss":"skip");
    const tag={hit:"You selected this · Correct", wrong:"You selected this · Should not be selected", miss:"Not selected · Should have been selected", skip:"Not selected · Correctly left out"}[kind];
    const mark={hit:"✓", wrong:"✗", miss:"!", skip:"–"}[kind];
    return `<div class="nopt res ${kind}"><div class="nmark">${mark}</div>
      <div><div>${esc(o.t)}</div><div class="ntag">${tag}</div><div class="nrat"><b>${o.ok?"Priority.":"Not a priority."}</b> ${esc(o.r)}</div></div></div>`;
  }).join("");
  let foot;
  if(!q.done) foot=`<div class="submitrow"><button class="btn primary" id="nqSubmit" ${nSel?"":"disabled"}>Check my answers</button><span class="msg" style="color:var(--muted)">${nSel?nSel+" selected":"Select all that apply."}</span></div>`;
  else { const total=opts.filter(o=>o.ok).length, hit=q.order.filter(i=>opts[i].ok&&q.sel[i]).length, extra=q.order.filter(i=>!opts[i].ok&&q.sel[i]).length, perfect=hit===total&&extra===0;
    foot=`<div class="nlegend"><span class="lg hit">✓ Correct pick</span><span class="lg wrong">✗ Wrong pick</span><span class="lg miss">! Missed priority</span><span class="lg skip">– Correctly left out</span></div>
      <div class="nfocus"><b>Nursing focus</b><p>${esc(p.care||cat.DXMAP[p.dx].care)}</p></div>
      <div class="nscore ${perfect?"good":""}">${perfect?"All correct. ":""}You chose ${hit} of ${total} priorities${extra?` and ${extra} option${extra===1?"":"s"} that should not be selected`:""}.</div><div class="submitrow">${nextBtn(cat,p)}</div>`; }
  return `<div class="sata"><b class="sq">Nursing priorities</b>
    <p class="sp">Which actions are priorities for ${esc(p.name.split(" ")[0])}? Select all that apply.</p>
    <div class="nopts">${body}</div>${foot}</div>`;
}
function nextCase(cat,p){ const L=S.from==="focus" ? dxCases(cat,p.dx) : S.order[cat.id].map(id=>PMAP[id]), i=L.indexOf(p);
  for(let k=1;k<=L.length;k++){ const q=L[(i+k)%L.length]; if(!S.cases[q.id].solved) return q; } return null; }
function nextBtn(cat,p){
  if(S.from==="focus"){ const dn=esc(cat.DXMAP[p.dx].name);
    return nextCase(cat,p)?`<button class="btn primary" id="next">Next ${dn} case →</button>`:`<button class="btn primary" id="next">All 3 ${dn} cases solved. Pick another diagnosis</button>`; }
  return nextCase(cat,p)?`<button class="btn primary" id="next">Next patient →</button>`:`<button class="btn primary" id="next">All ${cat.cases.length} solved. Back to the ward</button>`; }

fromHash();
setHash();
render();
})();
</script>

</body></html>
