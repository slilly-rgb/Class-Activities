 {cc:"Short of breath with a murmur",bonus:true,
  pts:[{who:"Grace, 58",ctx:"Rheumatic fever as a child",first:["Short of breath with activity","Heart flutters; irregular pulse"],more:["Low-pitched rumbling diastolic murmur at the apex","Atrial fibrillation on the monitor","Coughed up blood-streaked sputum"],cond:0,mech:"The narrowed mitral valve blocks blood leaving the left atrium. The atrium enlarges (AFib) and pressure backs up into the lungs."},
       {who:"Ray, 70",ctx:"MI 6 months ago",first:["Short of breath with activity","Increasing fatigue"],more:["Blowing holosystolic murmur at the apex, radiating to the left axilla","S3 heart sound","Echo: leaky mitral valve, enlarged left ventricle"],cond:1,mech:"The leaky mitral valve lets blood flow back into the atrium with each squeeze, overloading the left ventricle."}],
  names:["Mitral stenosis","Mitral regurgitation","Aortic stenosis","Aortic regurgitation"],
  tell:{q:"Which finding best tells A and B apart?",o:[["The timing of the murmur: diastolic rumble vs. holosystolic blowing murmur",1,"Stenosis is heard when the valve should be open (diastole for mitral); regurgitation when it should be closed (systole)."],["Dyspnea",0,"Both are short of breath."],["Murmur loudest at the apex",0,"Both mitral murmurs are loudest at the apex."],["Age",0,"Not distinguishing."]]},
  act:{cols:["A","B","Both","Neither"],rows:[["Anticoagulate as ordered to lower stroke risk from atrial fibrillation",0,"Blood pools in Grace's enlarged atrium."],["Slow the heart rate as ordered to lengthen diastole for filling",0,"More time for blood to cross the narrow valve."],["Teach to report worsening dyspnea, weight gain or swelling",2,"Both can progress to heart failure."],["Follow left ventricular size on repeat echocardiograms",1,"Ray's ventricle is enlarging from the extra volume."],["Lie flat to ease breathing",3,"Lying flat worsens pulmonary congestion."]]},
  fac:["Use the rule: stenosis is heard when the valve should be open. Apply it to all four valve problems.","Why does a fast heart rate hurt Grace more than Ray?"]}
];
const STEPS=["First look","Full picture","Name it","The tell","Act","Debrief"];
const LET=["A","B","C"]; const COL=["var(--pA)","var(--pB)","var(--pC)"];
const S={r:0,step:0,rev:{},how:false,teams:[["Team 1",0],["Team 2",0],["Team 3",0],["Team 4",0],["Team 5",0]]};
try{const t=JSON.parse(localStorage.getItem("cla-board")||"null");if(Array.isArray(t)&&t.length===5)S.teams=t}catch(e){}
function saveBoard(){try{localStorage.setItem("cla-board",JSON.stringify(S.teams))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rev=(k)=>(S.rev[S.r]||{})[k];
function maxPts(rd){return 1+rd.pts.length+1+rd.act.rows.length}

function renderHow(){
  $("#howto").innerHTML=`<div><h3>How to play</h3><ol>
   <li>Five teams of 4, each with a whiteboard. Every student commits an answer (Vevox or paper) before the team talks.</li>
   <li><b>First look:</b> teams may lock in names for every patient now. All correct at first look earns a <b>+1 bonus</b>.</li>
   <li><b>Full picture:</b> new findings appear in bold. Teams may change answers (no bonus).</li>
   <li><b>Name it:</b> teams write each patient letter with an option number (for example A-2, B-1). 1 point per correct patient.</li>
   <li><b>The tell:</b> write one option number. 1 point.</li>
   <li><b>Act:</b> write a column for each numbered action (1-A, 2-Both…). 1 point per correct row; teams self-score.</li>
   <li><b>Debrief</b> 2 minutes per round, using the prompts.</li></ol></div>
   <div><h3>Suggested 3-hour session</h3><table>
   <tr><td class="num">0:00</td><td>Vevox warm-up: 5 recall questions from the prep</td><td class="num">10</td></tr>
   <tr><td class="num">0:10</td><td>Micro-lecture: heart failure and HF medications</td><td class="num">20</td></tr>
   <tr><td class="num">0:30</td><td>Micro-lecture: shock types and hemodynamics</td><td class="num">15</td></tr>
   <tr><td class="num">0:45</td><td>Look-Alikes Rounds 1–2</td><td class="num">20</td></tr>
   <tr><td class="num">1:05</td><td>Micro-lecture: inflammatory, infectious, valve and muscle disease</td><td class="num">20</td></tr>
   <tr><td class="num">1:25</td><td>Break</td><td class="num">10</td></tr>
   <tr><td class="num">1:35</td><td>Look-Alikes Rounds 3–6, bonus if time (mixed topics)</td><td class="num">45</td></tr>
   <tr><td class="num">2:20</td><td>Whole-game debrief: which pair was hardest and why</td><td class="num">15</td></tr>
   <tr><td class="num">2:35</td><td>Exit ticket: 5 mixed questions + muddiest point</td><td class="num">10</td></tr>
   <tr><td class="num">2:45</td><td>Muddiest points from the prep, buffer</td><td class="num">15</td></tr></table></div>`;
}
function renderRail(){
  $("#rail").innerHTML=R.map((rd,i)=>`<button class="rd" data-r="${i}" aria-current="${S.r===i}"><span class="n">${rd.bonus?"Bonus":"Round "+(i+1)}</span><span class="l">${esc(rd.cc)}</span></button>`).join("");
}
function renderStage(){
  const rd=R[S.r], st=S.step, showMore=st>=1, named=!!rev("name");
  const pts=rd.pts.map((p,i)=>`<article class="pt" style="--c:${COL[i]}">
     <div class="who"><span class="lt">${LET[i]}</span><div><div class="nm">${esc(p.who)}</div><div class="ctx">${esc(p.ctx)}</div></div></div>
     <ul>${p.first.map(f=>`<li>${esc(f)}</li>`).join("")}${showMore?p.more.map(f=>`<li class="${st===1?"new":""}">${esc(f)}</li>`).join(""):""}</ul>
     ${showMore?"":`<p class="hidden-more">${p.more.length} more findings in the full picture</p>`}
     ${named?`<div class="ans"><b>${esc(rd.names[p.cond])}</b><span>${esc(p.mech)}</span></div>`:""}
   </article>`).join("");
  let task="";
  if(st===0) task=`<h3>First look</h3><p class="instr">Same complaint, different problems. With only these findings, can your team name each patient? Lock in now for a <b>+1 bonus</b> if every name is correct. Options appear on the Name it step, so use your own words.</p>`;
  if(st===1) task=`<h3>Full picture</h3><p class="instr">New findings are in bold. Look for the one finding that separates the patients, and change your answers if you need to.</p>`;
  if(st===2){const r=rev("name");
    task=`<h3>Name it</h3><p class="instr">Write each patient letter with an option number, for example <b>A-2</b>. <span class="ptsnote">1 point per patient</span></p>
    <div class="olist">${rd.names.map((n,i)=>{const used=rd.pts.map((p,j)=>p.cond===i?LET[j]:null).filter(Boolean);
      return `<div class="oi${r?(used.length?" right":" dim"):""}"><span class="k">${i+1}</span><span>${esc(n)}${r&&used.length?`<span class="why">Patient ${used.join(", ")}</span>`:""}</span></div>`}).join("")}</div>
    <div class="row">${r?"":`<button class="btn" data-rev="name">Reveal names</button>`}</div>`;}
  if(st===3){const r=rev("tell");
    task=`<h3>The tell</h3><p class="instr">${esc(rd.tell.q)} <span class="ptsnote">1 point</span></p>
    <div class="olist">${rd.tell.o.map((o,i)=>`<div class="oi${r?(o[1]?" right":" dim"):""}"><span class="k">${i+1}</span><span>${esc(o[0])}${r?`<span class="why">${esc(o[2])}</span>`:""}</span></div>`).join("")}</div>
    <div class="row">${r?"":`<button class="btn" data-rev="tell">Reveal the tell</button>`}</div>`;}
  if(st===4){const r=rev("act");
    task=`<h3>Act</h3><p class="instr">For each numbered action, write the column it belongs to, for example <b>1-Both</b>. <span class="ptsnote">1 point per correct row</span></p>
    <div class="tbl"><table class="act"><thead><tr><th>#</th><th>Action</th>${rd.act.cols.map(c=>`<th class="c">${c}</th>`).join("")}</tr></thead><tbody>${
      rd.act.rows.map((row,i)=>`<tr class="${r?"has-why":""}"><td class="n">${i+1}</td><td>${esc(row[0])}</td>${rd.act.cols.map((c,j)=>`<td class="c"><span class="mark${r&&row[1]===j?" on":""}" aria-label="${r&&row[1]===j?"Correct: "+c:""}">${r&&row[1]===j?"✓":""}</span></td>`).join("")}</tr>${r?`<tr class="why"><td></td><td colspan="${rd.act.cols.length+1}">${esc(row[2])}</td></tr>`:""}`).join("")
    }</tbody></table></div>
    <div class="row">${r?"":`<button class="btn" data-rev="act">Reveal actions</button>`}</div>`;}
  if(st===5) task=`<h3>Debrief</h3><div class="deb"><ul>${rd.fac.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>`;
  const nextLbl = st<5?`Next: ${STEPS[st+1]} →`:(S.r<R.length-1?`Next: ${R[S.r+1].bonus?"Bonus round":"Round "+(S.r+2)} →`:"");
  $("#stage").innerHTML=`<div class="rhead"><div><div class="cc">${rd.bonus?"Bonus round":"Round "+(S.r+1)} · ${rd.pts.length} patients</div><h2>${esc(rd.cc)}</h2></div><span class="max">Up to ${maxPts(rd)} points</span></div>
   <div class="steps">${STEPS.map((s,i)=>`<button class="sp" data-step="${i}" ${i===st?'aria-current="step"':""}>${s}</button>`).join("")}</div>
   <div class="pts">${pts}</div>
   <div class="task">${task}<div class="row">${st>0?`<button class="btn ghost" id="backBtn">← Back</button>`:""}${nextLbl?`<button class="btn ghost" id="nextBtn">${nextLbl}</button>`:""}</div></div>`;
}
function renderBoard(){
  $("#board").innerHTML=`<span class="lbl">Teams</span>${S.teams.map((t,i)=>`<div class="team"><input class="tn" id="tn${i}" value="${esc(t[0])}" aria-label="Team ${i+1} name"><input class="tp" id="tp${i}" inputmode="numeric" value="${t[1]}" aria-label="Team ${i+1} points"><button data-team="${i}" data-d="-1" aria-label="Subtract a point">−</button><button data-team="${i}" data-d="1" aria-label="Add a point">+</button></div>`).join("")}<button class="chip reset" id="resetBoard">Reset scores</button>`;
}
function renderAll(){renderRail();renderStage();}

let resetArmed=false;
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="howBtn"){S.how=!S.how;b.setAttribute("aria-pressed",S.how);$("#howto").hidden=!S.how;return;}
  if(b.dataset.r!=null){S.r=+b.dataset.r;S.step=0;renderAll();return;}
  if(b.dataset.step!=null){S.step=+b.dataset.step;renderStage();return;}
  if(b.dataset.rev){(S.rev[S.r]=S.rev[S.r]||{})[b.dataset.rev]=true;renderStage();return;}
  if(b.id==="nextBtn"){if(S.step<5)S.step++;else{S.r++;S.step=0;}renderAll();window.scrollTo({top:0,behavior:"smooth"});return;}
  if(b.id==="backBtn"){S.step=Math.max(0,S.step-1);renderStage();return;}
  if(b.dataset.team!=null){const i=+b.dataset.team;S.teams[i][1]=Math.max(0,(+S.teams[i][1]||0)+ +b.dataset.d);saveBoard();renderBoard();return;}
  if(b.id==="resetBoard"){if(!resetArmed){resetArmed=true;b.textContent="Tap again to reset";setTimeout(()=>{resetArmed=false;const x=$("#resetBoard");if(x)x.textContent="Reset scores"},3000);return;}
    S.teams.forEach(t=>t[1]=0);resetArmed=false;saveBoard();renderBoard();return;}
});
document.addEventListener("input",e=>{
  let m=e.target.id.match(/^tn(\d)$/);if(m){S.teams[+m[1]][0]=e.target.value;saveBoard();return;}
  m=e.target.id.match(/^tp(\d)$/);if(m){S.teams[+m[1]][1]=Math.max(0,parseInt(e.target.value,10)||0);saveBoard();}
});
renderHow();renderAll();renderBoard();
</script>

</body></html>
