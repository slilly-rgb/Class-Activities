<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Break the Machine: Respiratory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: lab-manual workbench. Sticky top bar with station tabs; one centered column (~760px) per station; "normal" sections in oxygen blue, "broken" sections in deoxygenated raspberry. */
:root {
  --paper: #f3f6f7;
  --surface: #ffffff;
  --sunk: #e8eef0;
  --ink: #142630;
  --muted: #536772;
  --line: #cfdbe0;
  --o2: #0b6e8a;
  --o2-soft: #dcedf2;
  --broken: #a2335a;
  --broken-soft: #f6e4ea;
  --ok: #217a4b;
  --ok-soft: #dff1e6;
  --bad: #b3361f;
  --bad-soft: #fae3dd;
  --focus: #e0a100;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1a20; --surface: #16242c; --sunk: #1d2e37; --ink: #e4eef1; --muted: #93a9b3; --line: #2c4250;
    --o2: #5cc3dd; --o2-soft: #173847; --broken: #f08aac; --broken-soft: #3d1f2b;
    --ok: #6fd39c; --ok-soft: #173826; --bad: #ff8f78; --bad-soft: #43201a; --focus: #ffc94a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1a20; --surface: #16242c; --sunk: #1d2e37; --ink: #e4eef1; --muted: #93a9b3; --line: #2c4250;
  --o2: #5cc3dd; --o2-soft: #173847; --broken: #f08aac; --broken-soft: #3d1f2b;
  --ok: #6fd39c; --ok-soft: #173826; --bad: #ff8f78; --bad-soft: #43201a; --focus: #ffc94a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55; margin: 0; }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.05rem; letter-spacing: -0.01em; }
.brand span { color: var(--broken); }
.team { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.team input { font: inherit; font-size: 0.9rem; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); width: 11rem; max-width: 40vw; }
.score { font-family: var(--mono); font-size: 0.85rem; padding: 5px 10px; border-radius: 6px; background: var(--o2-soft); color: var(--o2); font-weight: 600; white-space: nowrap; }
.tabs { max-width: 1100px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; }
.tab { border: 0; background: none; padding: 8px 12px 10px; font-size: 0.9rem; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--o2); font-weight: 700; }
.tab .n { font-family: var(--mono); font-size: 0.75rem; margin-right: 4px; }
.tab .done { color: var(--ok); margin-left: 4px; }

main { max-width: 780px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 80px; display: grid; gap: 28px; }
section { display: grid; gap: 14px; min-width: 0; }
p { margin: 0; }
.lede { font-size: 1.12rem; color: var(--muted); max-width: 62ch; }
.hero h1 { font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 800; letter-spacing: -0.02em; }
.hero h1 em { font-style: normal; color: var(--broken); }

/* machine chain */
.chain { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 0; align-items: stretch; }
.node { position: relative; background: var(--surface); border: 1px solid var(--line); padding: 12px; display: grid; gap: 4px; text-align: left; border-radius: 0; }
.node:first-child { border-radius: 10px 0 0 10px; }
.node:last-child { border-radius: 0 10px 10px 0; }
.node + .node { border-left: 0; }
.node:hover { background: var(--o2-soft); }
.node .k { font-family: var(--mono); font-size: 0.72rem; color: var(--o2); }
.node b { font-family: var(--display); font-size: 1.1rem; }
.node small { color: var(--muted); font-size: 0.8rem; line-height: 1.35; }
.node .via { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 4px; margin-top: 4px; }
@media (max-width: 640px) {
  .chain { grid-template-columns: 1fr; }
  .node, .node:first-child, .node:last-child { border-radius: 0; }
  .node:first-child { border-radius: 10px 10px 0 0; }
  .node:last-child { border-radius: 0 0 10px 10px; }
  .node + .node { border-left: 1px solid var(--line); border-top: 0; }
}

.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.step .num { font-family: var(--mono); color: var(--o2); font-size: 0.8rem; }
.step b { display: block; font-family: var(--display); font-size: 1.05rem; }
.step p { font-size: 0.9rem; color: var(--muted); }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: var(--sunk); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
td.v { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* station */
.st-head { display: grid; gap: 6px; }
.st-head h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); font-weight: 800; letter-spacing: -0.02em; }
.st-head .tag { color: var(--muted); font-size: 1.05rem; }
.phase { display: flex; align-items: baseline; gap: 10px; border-top: 2px solid var(--o2); padding-top: 10px; }
.phase.broken { border-top-color: var(--broken); }
.phase h2 { font-size: 1.35rem; }
.phase .eyebrow { color: var(--o2); }
.phase.broken .eyebrow { color: var(--broken); }
.how p + p { margin-top: 10px; }
.how { display: grid; gap: 10px; max-width: 66ch; }
.rule { background: var(--o2-soft); border-radius: 10px; padding: 14px 16px; }
.rule .eyebrow { color: var(--o2); font-weight: 600; }
.rule p { font-weight: 700; margin-top: 4px; }

.q { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }
.q > p { font-weight: 700; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 7px 12px; font-size: 0.93rem; text-align: left; line-height: 1.35; }
.opt:hover:not(:disabled) { border-color: var(--o2); }
.opt[aria-pressed="true"] { border-color: var(--o2); background: var(--o2-soft); font-weight: 700; }
.opt:disabled { cursor: default; }
.opt.right { background: var(--ok-soft); border-color: var(--ok); color: var(--ink); font-weight: 700; }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); text-decoration: line-through; }
.fb { font-size: 0.92rem; border-left: 3px solid var(--ok); padding: 4px 0 4px 10px; }
.fb.no { border-left-color: var(--bad); }
.fb b { color: var(--ok); }
.fb.no b { color: var(--bad); }

.break { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.break-top { padding: 14px 16px; display: grid; gap: 8px; background: var(--broken-soft); }
.break-top .eyebrow { color: var(--broken); font-weight: 600; }
.break-top h3 { font-size: 1.3rem; }
.break-body { padding: 14px 16px 16px; display: grid; gap: 12px; }
.pred { display: grid; grid-template-columns: minmax(0, 12rem) minmax(0, 1fr); gap: 8px 14px; align-items: start; padding-bottom: 12px; border-bottom: 1px dashed var(--line); }
.pred:last-of-type { border-bottom: 0; }
.pred .lbl { font-weight: 700; font-size: 0.95rem; padding-top: 6px; }
.pred .fb { grid-column: 2; }
@media (max-width: 600px) { .pred { grid-template-columns: 1fr; } .pred .fb { grid-column: 1; } .pred .lbl { padding-top: 0; } }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 700; background: var(--o2); color: var(--surface); }
.btn.broken { background: var(--broken); }
.btn.ghost { background: transparent; color: var(--o2); border: 1px solid var(--line); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.hint { font-size: 0.85rem; color: var(--muted); }

.reveal { border-top: 1px solid var(--line); padding: 16px; display: grid; gap: 12px; background: var(--surface); }
.reveal .eyebrow { color: var(--broken); font-weight: 600; }
.reveal h4 { font-size: 1.55rem; font-weight: 800; letter-spacing: -0.01em; }
.reveal .sub { color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.fact { background: var(--sunk); border-radius: 8px; padding: 10px 12px; font-size: 0.92rem; }
.fact .eyebrow { color: var(--muted); }
.reveal ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; font-size: 0.95rem; }
.also { font-size: 0.92rem; font-style: italic; color: var(--muted); }

.cmp td:first-child { font-weight: 700; }
.unk { color: var(--muted); font-family: var(--mono); }
.next { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* triage */
.dots { display: flex; flex-wrap: wrap; gap: 6px; }
.dot { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-family: var(--mono); font-size: 0.8rem; }
.dot[aria-current="true"] { border: 2px solid var(--o2); font-weight: 700; }
.dot.full { background: var(--ok-soft); border-color: var(--ok); }
.dot.part { background: var(--broken-soft); border-color: var(--broken); }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 14px; }
.chart .vig { font-size: 1.02rem; border-left: 4px solid var(--broken); padding-left: 12px; }
.tstep { display: grid; gap: 8px; }
.tstep .eyebrow { color: var(--o2); font-weight: 600; }
.tstep.locked-out { opacity: 0.45; }

/* map */
.pool { display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px; padding: 10px; border: 1px dashed var(--line); border-radius: 10px; background: var(--surface); }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 12px; font-size: 0.88rem; }
.chip[aria-pressed="true"] { border-color: var(--broken); background: var(--broken-soft); font-weight: 700; }
.chip.right { border-color: var(--ok); background: var(--ok-soft); }
.chip.wrong { border-color: var(--bad); background: var(--bad-soft); }
.bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.bin { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 120px; text-align: left; }
.bin.target { border: 2px dashed var(--broken); }
.bin h3 { font-size: 1.05rem; }
.bin .k { font-family: var(--mono); font-size: 0.72rem; color: var(--o2); }
.bin .in { display: flex; flex-wrap: wrap; gap: 6px; }
.debrief { display: grid; gap: 10px; counter-reset: d; padding: 0; margin: 0; list-style: none; }
.debrief li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 12px 46px; position: relative; }
.debrief li::before { counter-increment: d; content: counter(d); position: absolute; left: 14px; top: 12px; font-family: var(--mono); color: var(--broken); font-weight: 600; }
.tally { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tally div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.tally b { font-family: var(--mono); font-size: 1.3rem; display: block; }
.tally span { font-size: 0.85rem; color: var(--muted); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.9rem; }
@media (prefers-reduced-motion: no-preference) { .reveal, .fb { animation: rise .25s ease-out; } @keyframes rise { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } } }
</style>

<header class="bar">
  <div class="bar-in">
    <div class="brand">Break the <span>Machine</span> · Respiratory</div>
    <div class="team">
      <label for="team" class="hint">Team</label>
      <input id="team" type="text" placeholder="Team or student name" autocomplete="off">
      <div class="score" id="score" aria-live="polite">0 / 0</div>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Activity sections"></nav>
</header>

<script>
// Shared content for "Break the Machine: Respiratory" (HTML activity + instructor guide)
const UP = ["↑ Increases", "↔ No change", "↓ Decreases"];
const DATA = {
  title: "Break the Machine: Respiratory",
  normals: [
    ["Respiratory rate", "12–20 /min"],
    ["SpO₂", "95–100%"],
    ["PaO₂", "80–100 mm Hg"],
    ["PaCO₂", "35–45 mm Hg"],
    ["pH", "7.35–7.45"],
    ["HCO₃⁻", "22–26 mEq/L"]
  ],
  stations: [
    {
      id: "drive", name: "Drive", part: "Brainstem control",
      tagline: "The boss that decides when and how hard to breathe.",
      how: [
        "Breathing is automatic because respiratory centers in the medulla and pons fire on a rhythm, sending signals down the phrenic and intercostal nerves to the breathing muscles.",
        "Sensors adjust that rhythm. Central chemoreceptors in the medulla respond to CO₂ (through the pH of the cerebrospinal fluid). This is the main, minute-to-minute stimulus to breathe. Peripheral chemoreceptors in the carotid and aortic bodies respond mostly to a low PaO₂ (below about 60 mm Hg).",
        "The cerebral cortex can override the brainstem for a while: you can hold your breath, talk, or breathe fast when you are scared or in pain."
      ],
      principle: { label: "The rule", text: "Ventilation is how the body gets rid of CO₂. PaCO₂ moves opposite to ventilation: breathe less and CO₂ rises (acidosis); breathe more and CO₂ falls (alkalosis)." },
      check: [
        { q: "What is the main chemical signal that drives your next breath in a healthy person?", o: ["A low oxygen level", "A rising CO₂ level", "A low bicarbonate level", "A high potassium level"], a: 1, why: "Central chemoreceptors respond to CO₂ through CSF pH. Low O₂ only becomes a strong drive below a PaO₂ of about 60 mm Hg." },
        { q: "If a person doubles their ventilation for a few minutes, their PaCO₂ will:", o: ["Rise", "Stay the same", "Fall"], a: 2, why: "More air moved out means more CO₂ blown off. PaCO₂ falls." }
      ],
      breaks: [
        {
          id: "drive-down", action: "Turn the signal down",
          scenario: "Post-op day 1. The patient pushed the opioid PCA button many times overnight. The opioid is suppressing the respiratory centers in the brainstem. The lungs, airways and alveoli are healthy.",
          predict: [
            { p: "Respiratory rate", o: UP, a: 2, why: "The brainstem fires less often, so fewer breaths are triggered. Breaths also get shallower." },
            { p: "PaCO₂", o: UP, a: 0, why: "The body keeps making CO₂ at the same rate, but less is exhaled. It builds up." },
            { p: "pH", o: UP, a: 2, why: "CO₂ + H₂O forms carbonic acid. More CO₂ means more acid, so pH drops: respiratory acidosis." },
            { p: "Breath sounds", o: ["Crackles in the bases", "Clear but diminished", "Wheezing", "Absent on one side"], a: 1, why: "Nothing is wrong inside the lungs. Sounds are clear, just quiet because the breaths are small." },
            { p: "Level of consciousness", o: ["More alert", "No change", "Increasingly sedated"], a: 2, why: "The opioid sedates, and rising CO₂ adds to it (CO₂ narcosis). Sedation usually shows up before the respiratory rate drops." }
          ],
          reveal: {
            name: "Hypoventilation → acute respiratory acidosis",
            sub: "Opioid-induced respiratory depression",
            affects: "The control center. The lungs themselves are normal, which is why the breath sounds are clear.",
            clue: "Sedated, slow shallow breathing, clear lungs, rising CO₂.",
            nursing: [
              "Assess sedation level (e.g., POSS) before every opioid dose. Increasing sedation is the early warning.",
              "Stop the opioid, stimulate the patient, give naloxone per order, and support ventilation with a bag-valve mask if needed.",
              "Pulse oximetry can look fine on supplemental O₂ while CO₂ climbs. Capnography (EtCO₂) catches hypoventilation earlier."
            ],
            also: "Same break, other causes: benzodiazepines, alcohol, general anesthesia, brainstem stroke, head injury, increased ICP."
          }
        },
        {
          id: "drive-up", action: "Turn the signal up",
          scenario: "A patient is having a panic attack. The cortex overrides the brainstem and drives breathing fast and deep. The lungs are healthy.",
          predict: [
            { p: "Respiratory rate", o: UP, a: 0, why: "The cortex is driving extra breaths." },
            { p: "PaCO₂", o: UP, a: 2, why: "CO₂ is blown off faster than it is made." },
            { p: "pH", o: UP, a: 0, why: "Losing CO₂ removes acid, so pH rises: respiratory alkalosis." },
            { p: "Likely symptoms", o: ["Barrel chest and clubbing", "Tingling lips and fingers, lightheadedness", "Pink frothy sputum", "Tracheal deviation"], a: 1, why: "Alkalosis makes more calcium bind to albumin, lowering ionized calcium and making nerves irritable (tingling, cramps). Low CO₂ also constricts brain blood vessels (lightheaded)." }
          ],
          reveal: {
            name: "Hyperventilation → respiratory alkalosis",
            sub: "Anxiety, pain, fever, early hypoxemia",
            affects: "The control center is over-firing. Lungs are normal.",
            clue: "Fast deep breathing, low CO₂, tingling, lightheaded.",
            nursing: [
              "Rule out hypoxemia first. Early asthma, PE and pneumonia also cause fast breathing and a low CO₂. Never assume it is \"just anxiety.\"",
              "Coach slow breathing, stay with the patient, and treat the cause (pain, fear, fever)."
            ],
            also: "Breathing fast is often the body's correct response to a problem somewhere else in the machine."
          }
        }
      ]
    },
    {
      id: "bellows", name: "Bellows", part: "Diaphragm, chest wall & pleura",
      tagline: "The pump that pulls air in.",
      how: [
        "Lungs cannot inflate themselves. They are elastic and always want to recoil inward, while the chest wall wants to spring outward.",
        "The pleural space sits between them: visceral pleura on the lung, parietal pleura on the chest wall, and a thin film of fluid in between. Its pressure is negative (below atmospheric), and that suction keeps the lung stuck to the chest wall.",
        "To inhale, the diaphragm (phrenic nerve, C3–C5) contracts and moves down while the external intercostals lift the ribs. The chest gets bigger, pressure in the lungs drops below the air outside, and air flows in. Quiet exhalation is passive recoil."
      ],
      principle: { label: "The rule", text: "Boyle's law: bigger volume → lower pressure → air flows in. Air always moves from high to low pressure. Break the seal, weaken the muscles, or damage the frame and the pump fails." },
      check: [
        { q: "What keeps the lung stretched open against the chest wall?", o: ["Positive pressure in the alveoli", "Cartilage rings", "Negative pressure in the pleural space", "Surfactant"], a: 2, why: "The negative intrapleural pressure is the seal. Lose it and the lung recoils (collapses)." },
        { q: "Which nerve roots supply the diaphragm?", o: ["C3–C5", "T1–T4", "C7–T1", "L1–L2"], a: 0, why: "\"C3, 4, 5 keeps the diaphragm alive\" (phrenic nerve)." }
      ],
      breaks: [
        {
          id: "bellows-air", action: "Break the seal with air",
          scenario: "A tall, thin 20-year-old feels a sudden \"pop\" and sharp right chest pain while sitting at his desk. A small bleb on the lung surface ruptured and air is leaking into the right pleural space.",
          predict: [
            { p: "Right-side breath sounds", o: ["Louder than normal", "Diminished or absent", "Coarse crackles"], a: 1, why: "The lung has pulled away from the chest wall, so little air moves on that side and air in the pleural space blocks sound." },
            { p: "Chest rise", o: ["Equal on both sides", "Less on the right", "Less on the left"], a: 1, why: "The collapsed side cannot expand." },
            { p: "Percussion over the right chest", o: ["Dull", "Hyperresonant", "Flat"], a: 1, why: "A pocket of air sounds hollow (hyperresonant)." },
            { p: "SpO₂", o: UP, a: 2, why: "Less lung is ventilated, so less oxygen gets into the blood." }
          ],
          reveal: {
            name: "Pneumothorax",
            sub: "Spontaneous, traumatic, or iatrogenic (central line, thoracentesis)",
            affects: "The pleural seal. The lung tissue itself may be normal; it collapses because nothing holds it open.",
            clue: "Sudden sharp pain, absent sounds and hyperresonance on one side.",
            nursing: [
              "Position upright, give O₂, and prepare for chest tube insertion.",

    <section>
      <div class="actions">
        ${st.mapChecked ? `<p class="fb ${wrongs.length ? "no" : ""}"><b>${allBreaks.length - wrongs.length} of ${allBreaks.length} placed correctly.</b> ${wrongs.length ? "Misplaced: " + wrongs.map(b => `${esc(SHORT[b.id])} → ${esc(partName(b.part))}`).join("; ") + "." : "Every condition is where it belongs."}</p>` : `<button class="btn" id="checkMap" ${placedAll ? "" : "disabled"}>Check my map</button><span class="hint">${placedAll ? "Ready to check." : "Place every condition first."}</span>`}
      </div>
    </section>
    <section>
      <div class="phase broken"><span class="eyebrow">Debrief</span><h2>Talk it through</h2></div>
      <ol class="debrief">
        <li>COPD shows up in more than one part. Which parts does it break, and how does one break lead to the next?</li>
        <li>Opioid overdose and Guillain-Barré both raise CO₂ with clear lungs. How would you tell them apart at the bedside?</li>
        <li>Pulmonary edema and ARDS both flood the membrane. Why does one respond to a diuretic and the other doesn't?</li>
        <li>Why does extra oxygen help a PE patient somewhat but barely help a patient with a large shunt?</li>
        <li>Pick one condition you used to memorize as a list. Explain each sign and symptom using only how the machine works.</li>
      </ol>
    </section>
    <section>
      <div class="eyebrow">${st.team ? esc(st.team) + " · " : ""}Score summary</div>
      <div class="tally">
        <div><b>${t.checks}/${t.checksMax}</b><span>Normal-function checks</span></div>
        <div><b>${t.preds}/${t.predsMax}</b><span>Predictions</span></div>
        <div><b>${t.tri}/${t.triMax}</b><span>Triage steps</span></div>
        <div><b>${t.map}/${t.mapMax}</b><span>Machine Map</span></div>
        <div><b>${t.total}/${t.max}</b><span>Total</span></div>
      </div>
    </section>`;
  }

  function decoder() {
    return `
    <section class="st-head">
      <div class="eyebrow">Reference</div>
      <h1>Clue Decoder</h1>
      <p class="tag">An assessment finding points to a part of the machine. Use this during the triage round.</p>
    </section>
    <section><div class="tbl-wrap"><table><thead><tr><th>If you find</th><th>Look at</th></tr></thead><tbody>${D.decoder.map(r => `<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td></tr>`).join("")}</tbody></table></div></section>
    <section>
      <div class="eyebrow">Normal values</div>
      <div class="tbl-wrap"><table><tbody>${D.normals.map(n => `<tr><td>${n[0]}</td><td class="v">${n[1]}</td></tr>`).join("")}</tbody></table></div>
    </section>`;
  }

  function render() {
    renderTabs();
    const s = S.find(x => x.id === st.view);
    $("#main").innerHTML = st.view === "home" ? home() : s ? station(s) : st.view === "triage" ? triage() : st.view === "map" ? mapView() : decoder();
    const tm = $("#team"); if (document.activeElement !== tm) tm.value = st.team || "";
  }

  // ---------- events ----------
  document.addEventListener("click", e => {
    const el = e.target.closest("button, [data-bin]"); if (!el || el.disabled) return;
    const d = el.dataset;
    if (d.go) return go(d.go);
    if (d.chk !== undefined) { st.checks[d.chk] = +d.i; save(); return render(); }
    if (d.pred) { st.preds[d.pred + d.i] = +d.j; save(); return renderKeep(el); }
    if (d.lock) { st.locked[d.lock] = true; save(); render(); const c = document.getElementById("b-" + d.lock); if (c) c.scrollIntoView({ block: "nearest" }); return; }
    if (d.triGo !== undefined) { st.tIdx = +d.triGo; save(); render(); return window.scrollTo({ top: 0 }); }
    if (d.tri) { const r = st.tri[d.i] || (st.tri[d.i] = {}); r[d.tri] = d.tri === "part" ? S[+d.j].id : +d.j; save(); return render(); }
    if (d.chip) { e.stopPropagation(); picked = picked === d.chip ? null : d.chip; return render(); }
    if (d.bin !== undefined && picked && !st.mapChecked) { if (d.bin) st.map[picked] = d.bin; else delete st.map[picked]; picked = null; save(); return render(); }
    if (el.id === "checkMap") { st.mapChecked = true; save(); return render(); }
    if (el.id === "resetAsk") { $("#resetBox").innerHTML = '<span>Erase every answer and score?</span><button class="btn broken" id="resetYes">Yes, reset</button><button class="btn ghost" id="resetNo">Cancel</button>'; return; }
    if (el.id === "resetYes") { const team = st.team; st = { team, checks: {}, preds: {}, locked: {}, tri: {}, map: {}, mapChecked: false, view: "home", tIdx: 0 }; save(); return render(); }
    if (el.id === "resetNo") return render();
  });
  // re-render without losing scroll position on prediction clicks
  function renderKeep(el) { const y = window.scrollY; render(); window.scrollTo({ top: y }); }
  document.addEventListener("keydown", e => { const b = e.target.closest && e.target.closest(".bin"); if (b && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); b.click(); } });
  $("#team").addEventListener("input", e => { st.team = e.target.value; save(); });
  render();
})();
</script>

</body></html>
