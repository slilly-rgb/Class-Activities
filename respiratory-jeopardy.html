  const step = t => {
    ctx.clearRect(0, 0, W, H);
    for (const p of parts){ p.vy += .18; p.vx *= .99; p.vy *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); }
    if (t < stopAt) confRAF = requestAnimationFrame(step); else ctx.clearRect(0, 0, W, H);
  };
  confRAF = requestAnimationFrame(step);
}
let actx = null;
function playTier(tier){
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { return; }
  const t0 = actx.currentTime + .05;
  const note = (f, start, dur, type, vol, glideTo, vib) => {
    const o = actx.createOscillator(), g = actx.createGain(), lp = actx.createBiquadFilter();
    o.type = type; o.frequency.setValueAtTime(f, start); if (glideTo) o.frequency.linearRampToValueAtTime(glideTo, start + dur);
    if (vib){ const l = actx.createOscillator(), lg = actx.createGain(); l.frequency.value = 5; lg.gain.value = vib; l.connect(lg); lg.connect(o.frequency); l.start(start); l.stop(start + dur); }
    lp.type = 'lowpass'; lp.frequency.value = type === 'sine' ? 8000 : 2400;
    g.gain.setValueAtTime(0, start); g.gain.linearRampToValueAtTime(vol, start + .03); g.gain.setValueAtTime(vol, start + dur * .7); g.gain.exponentialRampToValueAtTime(.0001, start + dur);
    o.connect(lp); lp.connect(g); g.connect(actx.destination); o.start(start); o.stop(start + dur + .05);
  };
  if (tier === 'fanfare'){
    [[392,0,.13],[392,.15,.13],[392,.3,.13],[523,.45,.45],[466,.95,.2],[523,1.17,.2],[659,1.4,1.4]].forEach(([f, st, d]) => { note(f, t0 + st, d, 'sawtooth', .11); note(f / 2, t0 + st, d, 'square', .045); });
    [523, 784].forEach(f => note(f, t0 + 1.4, 1.4, 'sawtooth', .06));
  } else if (tier === 'small'){
    [[784,0],[988,.12],[1175,.24],[1568,.38]].forEach(([f, st]) => note(f, t0 + st, .7, 'sine', .15));
  } else {
    [[311,0],[294,.5],[277,1]].forEach(([f, st]) => note(f, t0 + st, .45, 'sawtooth', .15, f * .97));
    note(262, t0 + 1.5, 1.7, 'sawtooth', .15, null, 7);
  }
}

function tickFinal(){
  F.left = Math.max(0, (F.left ?? 30) - 1);
  const t = $('#f-timer'), b = $('#f-bar'); if (t) t.textContent = F.left; if (b) b.style.width = (F.left/30*100) + '%';
  if (F.left === 0){ clearInterval(timerId); timerId = null; renderFinal(); }
}
function closeFinal(){ stopTimer(); clearInterval(timerId); timerId = null; F = null; $('#final').hidden = true; S.screen = 'board'; save(); show('board'); }

// ---------- Screens ----------
function show(which){
  S.screen = which; save();
  $('#s-title').hidden = which !== 'title';
  $('#s-board').hidden = which !== 'board';
  if (which === 'title') renderTitle(); else { renderBoard(); autoReveal(); }
}
// Flip each unrevealed category in, left to right, when a round's board appears.
let revealRun = 0;
function autoReveal(){
  const run = ++revealRun, round = S.round;
  const rv = S.revealed[round] = S.revealed[round] || [];
  let d = 500;
  DATA.rounds[round].categories.forEach((c, ci) => {
    if (rv[ci]) return;
    setTimeout(() => {
      if (run !== revealRun || S.round !== round || $('#s-board').hidden) return;
      rv[ci] = true; save(); renderBoard();
      const el = $(`.cat[data-c="${ci}"]`); el && el.classList.add('flip');
    }, d);
    d += 550;
  });
}

// ---------- Editor ----------
let standalone = false;
let edTab = 0, dirty = false, saving = false, artifactApi = undefined, saveMsg = '';
let mayEdit = false;
function openEditor(){ if (!mayEdit) return; $('#editor').hidden = false; renderEditor(); }
function renderEditor(){
  const ed = $('#editor');
  const status = saving ? 'Saving…' : saveMsg ? saveMsg : standalone
    ? (dirty ? 'Unsaved changes. They show in the game now; select Download updated file, then upload it to Netlify to make them permanent.' : 'Edits apply to the game right away. To keep them, download the updated file and upload it to your Netlify site.')
    : dirty
    ? (artifactApi ? 'Unsaved changes. They show in the game now; select Save to keep them in this page.' : 'Unsaved changes. They show in the game now but will be lost when the page reloads.')
    : (artifactApi === null ? 'Edits apply right away. Saving into the page isn’t available in this view, so changes last until reload.' : 'Edits apply to the game right away. Save keeps them in this page for next time.');
  let body = '';
  if (edTab < 2){
    const R = DATA.rounds[edTab];
    body = `<div class="ed-values">Dollar values:
      ${R.values.map((v, i) => `<input type="number" id="ev-${edTab}-${i}" data-ed="val" data-i="${i}" value="${v}" step="100" aria-label="Row ${i+1} value">`).join('')}</div>` +
      R.categories.map((c, ci) => `<div class="ed-cat">
        <div class="ed-cat-head"><label for="ec-${edTab}-${ci}">Category ${ci+1}</label><input type="text" id="ec-${edTab}-${ci}" data-ed="cat" data-c="${ci}" value="${esc(c.name)}"></div>
        ${c.clues.map((q, i) => `<div class="ed-clue">
          <div class="ed-val">${money(R.values[i])}</div>
          <div class="ed-col"><small>Clue</small><textarea id="eq-${edTab}-${ci}-${i}" data-ed="q" data-c="${ci}" data-i="${i}">${esc(q.q)}</textarea></div>
          <div class="ed-col"><small>Correct response</small><input type="text" id="ea-${edTab}-${ci}-${i}" data-ed="a" data-c="${ci}" data-i="${i}" value="${esc(q.a)}">
            <small>Also accept in solo play (separate with ;)</small><input type="text" id="ex-${edTab}-${ci}-${i}" data-ed="acc" data-c="${ci}" data-i="${i}" value="${esc((q.accept || []).join('; '))}">
            <div class="ed-opts">
              <label><input type="checkbox" id="ed-${edTab}-${ci}-${i}" data-ed="dd" data-c="${ci}" data-i="${i}" ${q.dd ? 'checked' : ''}> Daily Double</label>
              ${q.audio ? `<span class="chip">Sound attached</span><button class="btn small ghost" data-act="ed-audio-del" data-c="${ci}" data-i="${i}">Remove sound</button>` : ''}
              ${q.img ? `<img class="ed-thumb" src="${q.img}" alt=""><button class="btn small ghost" data-act="ed-img-del" data-c="${ci}" data-i="${i}">Remove image</button>` : ''}
              <label class="btn small ghost" style="cursor:pointer">${q.img ? 'Replace image' : 'Add image'}<input type="file" accept="image/*" hidden id="eg-${edTab}-${ci}-${i}" data-ed="img" data-c="${ci}" data-i="${i}"></label>
              <label class="btn small ghost" style="cursor:pointer">${q.audio ? 'Replace sound' : 'Add sound'}<input type="file" accept="audio/*" hidden id="ef-${edTab}-${ci}-${i}" data-ed="audio" data-c="${ci}" data-i="${i}"></label>
            </div></div>
        </div>`).join('')}
      </div>`).join('');
  } else {
    const f = DATA.final;
    body = `<div class="ed-cat"><div class="ed-cat-head"><label for="ef-cat">Final category</label><input type="text" id="ef-cat" data-ed="f-cat" value="${esc(f.category)}"></div>
      <div class="ed-clue"><div class="ed-val">Final</div>
        <div class="ed-col"><small>Clue</small><textarea id="ef-q" data-ed="f-q">${esc(f.q)}</textarea></div>
        <div class="ed-col"><small>Correct response</small><input type="text" id="ef-a" data-ed="f-a" value="${esc(f.a)}">
          <small>Also accept in solo play (separate with ;)</small><input type="text" id="ef-x" data-ed="f-acc" value="${esc((f.accept || []).join('; '))}"></div></div></div>
      <div class="ed-cat"><div class="ed-cat-head"><label for="ef-title">Game title</label><input type="text" id="ef-title" data-ed="title" value="${esc(DATA.title)}"></div></div>`;
  }
  ed.innerHTML = `<div class="ed-head">
      <h2>Edit questions</h2>
      <div class="tabs" role="tablist">${['Jeopardy','Double Jeopardy','Final'].map((n, i) => `<button class="tab" role="tab" aria-selected="${edTab === i}" data-act="ed-tab" data-i="${i}">${n}</button>`).join('')}</div>
      ${artifactApi ? `<button class="btn primary" data-act="ed-save" ${dirty && !saving ? '' : 'disabled'}>Save</button>` : ''}
      ${standalone ? `<button class="btn primary" data-act="ed-download">Download updated file</button>` : ''}
      <button class="btn" data-act="ed-close">Done</button>
      <div class="ed-status${dirty ? ' dirty' : ''}">${status}</div>
    </div>
    <div class="ed-body"><div class="ed-inner">${body}</div></div>`;
}
function markDirty(){ dirty = true; saveMsg = ''; const st = $('.ed-status'); if (st){ st.classList.add('dirty'); st.textContent = standalone ? 'Unsaved changes. They show in the game now; select Download updated file, then upload it to Netlify to make them permanent.' : artifactApi ? 'Unsaved changes. They show in the game now; select Save to keep them in this page.' : 'Unsaved changes. They show in the game now but will be lost when the page reloads.'; } const sb = $('[data-act="ed-save"]'); if (sb) sb.disabled = false; }
function buildDocument(){
  const json = JSON.stringify(DATA).replace(/</g, '\\u003c');
  const parts = KEEP.map((el, i) => el.id === 'game-data' ? `<script type="application/json" id="game-data" data-keep>${json}<\/script>` : SOURCE[i]);
  if (standalone) return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n</head>\n<body>\n' + parts.join('\n') + '\n</body>\n</html>\n';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>' + parts.join('\n') + '</body></html>';
}
async function saveToPage(){
  if (!artifactApi || saving) return;
  saving = true; renderEditor();
  try { await artifactApi.publish(buildDocument()); dirty = false; saveMsg = 'Saved. The page reloads with your changes.'; }
  catch (e) {
    const code = e && (e.code || e.message) || '';
    saveMsg = /not_writer|not_granted/.test(code) ? 'You can’t save this page. Ask its owner for edit access.'
      : /conflict/.test(code) ? 'Someone saved a newer version first. Make your change again after the page reloads.'
      : 'Save didn’t go through. Check your connection and select Save again.';
  }
  saving = false; renderEditor();
}

// ---------- Events ----------
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, R = DATA.rounds[S.round];
  switch (act){
    case 'add-team': S.teams.push({id: uid(), name: 'Team ' + (S.teams.length + 1)}); save(); renderTitle(); break;
    case 'del-team': S.teams = S.teams.filter(t => t.id !== b.dataset.t); S.history = S.history.filter(h => h.t !== b.dataset.t); save(); renderTitle(); break;
    case 'reset-ask': $('#reset-slot').innerHTML = `<span class="confirm">Clear all scores and played clues? <button class="btn small primary" data-act="reset-yes">Clear</button><button class="btn small ghost" data-act="reset-no">Keep</button></span>`; break;
    case 'reset-yes': { const teams = S.teams, mode = S.mode, solo = S.solo; S = fresh(); Object.assign(S, {teams, mode, solo}); save(); renderTitle(); }
    // falls through
    case 'reset-no': $('#reset-slot').innerHTML = `<button class="btn small ghost" data-act="reset-ask">New game (clear scores)</button>`; break;
    case 'go-round': S.round = +b.dataset.r; show('board'); break;
    case 'go-final': show('board'); openFinal(); break;
    case 'home': show('title'); break;
    case 'next-round': nextRound(); break;
    case 'intro-go': $('#intro').hidden = true; S.round = +b.dataset.r; show('board'); break;
    case 'cat': { const rv = S.revealed[S.round] = S.revealed[S.round] || []; if (!rv[+b.dataset.c]){ rv[+b.dataset.c] = true; save(); renderBoard(); const el = $(`.cat[data-c="${b.dataset.c}"]`); el && el.classList.add('flip'); } break; }
    case 'reveal-all': { const rv = S.revealed[S.round] = S.revealed[S.round] || []; let d = 0;
      R.categories.forEach((c, ci) => { if (!rv[ci]){ setTimeout(() => { rv[ci] = true; save(); renderBoard(); const el = $(`.cat[data-c="${ci}"]`); el && el.classList.add('flip'); }, d); d += 450; } }); break; }
    case 'tile': openClue(+b.dataset.c, +b.dataset.i, b); break;
    case 'adj': adjusting = b.dataset.t; renderPodiums(); const inp = $('#adj-in'); inp && (inp.focus(), inp.select()); break;
    case 'adj-set': { const v = Number($('#adj-in').value); if (!Number.isNaN(v)){ const d = v - score(b.dataset.t); if (d) S.history.push({k:'adj-' + uid(), t:b.dataset.t, d}); save(); } adjusting = null; renderPodiums(); break; }
    case 'adj-cancel': adjusting = null; renderPodiums(); break;
    case 'dd-team': clueCtx.wagerDraft = $('#dd-wager').value; clueCtx.ddTeam = b.dataset.t; renderClue(); break;
    case 'dd-go': { const w = Math.max(0, Number($('#dd-wager').value) || 0); clueCtx.wager = w; clueCtx.stage = 'q'; $('#clue').classList.remove('dd-bg'); renderClue(); if (S.mode === 'solo') startTimer(clueCtx, SOLO_SECONDS, submitSolo); break; }
    case 'reveal': clueCtx.stage = 'a'; renderClue(); break;
    case 'judge': { const amt = clueCtx.wager ?? clueCtx.value; setResult(clueCtx.k, b.dataset.t, +b.dataset.s * amt); renderClue(); break; }
    case 'play': togglePlay(); break;
    case 'close-clue': closeClue(); break;
    case 'mode': S.mode = b.dataset.m === 'solo' ? 'solo' : 'team'; save(); renderTitle(); break;
    case 'solo-submit': if (clueCtx) submitSolo(); else if (F) submitSoloFinal(); break;
    case 'solo-pass': { const inp = $('#solo-ans'); if (inp) inp.value = ''; clueCtx.typed = ''; submitSolo(); break; }
    case 'override': clueCtx.verdict = b.dataset.v; applySolo(clueCtx.k, clueCtx.verdict, clueCtx.wager ?? clueCtx.value); renderClue(); break;
    case 'f-override': F.verdict = b.dataset.v; applySolo('final', F.verdict, Number(F.wagers[S.solo.id] || 0)); renderFinal(); break;
    case 'f-next': {
      if (F.stage === 'wager') players().forEach(t => { const el = $(`[data-fw="${t.id}"]`); if (el) F.wagers[t.id] = Math.max(0, Number(el.value) || 0); });
      S.finalWagers = F.wagers; save();
      if (b.dataset.to === 'answer'){ clearInterval(timerId); timerId = null; }
      if (b.dataset.to === 'answer' && S.mode === 'solo'){ submitSoloFinal(); break; }
      F.stage = b.dataset.to; renderFinal();
      if (S.mode === 'solo' && F.stage === 'clue'){ F.left = null; F.typed = ''; startTimer(F, SOLO_SECONDS, submitSoloFinal); }
      else if (F.stage !== 'clue') stopTimer();
      break; }
    case 'f-timer':
      if (timerId){ clearInterval(timerId); timerId = null; }
      else { if (F.left === 0 || F.left == null) F.left = 30; timerId = setInterval(tickFinal, 1000); }
      renderFinal(); break;
    case 'f-judge': setResult('final', b.dataset.t, +b.dataset.s * Number(F.wagers[b.dataset.t] || 0)); renderFinal(); break;
    case 'close-final': closeFinal(); break;
    case 'results': showResults(); break;
    case 'main-menu': stopConfetti(); $('#results').hidden = true; $('#results').innerHTML = ''; show('title'); break;
    case 'edit': openEditor(); break;
    case 'ed-tab': edTab = +b.dataset.i; renderEditor(); break;
    case 'ed-close': $('#editor').hidden = true; if (!$('#s-board').hidden) renderBoard(); else renderTitle(); break;
    case 'ed-save': saveToPage(); break;
    case 'ed-download': {
      const url = URL.createObjectURL(new Blob([buildDocument()], {type: 'text/html'}));
      const a = document.createElement('a'); a.href = url; a.download = 'index.html'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      dirty = false; saveMsg = 'Downloaded index.html. Upload it on your Netlify site’s Deploys page to publish the changes.'; renderEditor(); break; }
    case 'ed-img-del': { const q = DATA.rounds[edTab].categories[+b.dataset.c].clues[+b.dataset.i]; delete q.img; delete q.imgAlt; markDirty(); renderEditor(); break; }
    case 'ed-audio-del': { const q = DATA.rounds[edTab].categories[+b.dataset.c].clues[+b.dataset.i]; delete q.audio; delete q.audioLabel; markDirty(); renderEditor(); break; }
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'solo-ans'){ const o = clueCtx || F; if (o) o.typed = el.value; return; }
  if (el.id === 'solo-name'){ S.solo.name = el.value; save(); return; }
  if (el.dataset.team){ const t = S.teams.find(t => t.id === el.dataset.team); if (t){ t.name = el.value; save(); } return; }
  const k = el.dataset.ed; if (!k || k === 'audio' || k === 'img') return;
  const R = DATA.rounds[edTab];
  if (k === 'val') R.values[+el.dataset.i] = Number(el.value) || 0;
  else if (k === 'cat') R.categories[+el.dataset.c].name = el.value;
  else if (k === 'q') R.categories[+el.dataset.c].clues[+el.dataset.i].q = el.value;
  else if (k === 'a') R.categories[+el.dataset.c].clues[+el.dataset.i].a = el.value;
  else if (k === 'dd') R.categories[+el.dataset.c].clues[+el.dataset.i].dd = el.checked;
  else if (k === 'acc') R.categories[+el.dataset.c].clues[+el.dataset.i].accept = el.value.split(';').map(v => v.trim()).filter(Boolean);
  else if (k === 'f-acc') DATA.final.accept = el.value.split(';').map(v => v.trim()).filter(Boolean);
  else if (k === 'f-cat') DATA.final.category = el.value;
  else if (k === 'f-q') DATA.final.q = el.value;
  else if (k === 'f-a') DATA.final.a = el.value;
  else if (k === 'title') DATA.title = el.value;
  markDirty();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.ed === 'dd') return; // handled on input
  if (el.dataset.ed === 'img' && el.files && el.files[0]){
    const file = el.files[0];
    if (file.size > 3 * 1024 * 1024){ saveMsg = 'That image is over 3 MB. Use a smaller or cropped image.'; renderEditor(); return; }
    const fr = new FileReader();
    fr.onload = () => { const q = DATA.rounds[edTab].categories[+el.dataset.c].clues[+el.dataset.i]; q.img = fr.result; markDirty(); renderEditor(); };
    fr.readAsDataURL(file); return;
  }
  if (el.dataset.ed !== 'audio' || !el.files || !el.files[0]) return;
  const file = el.files[0];
  if (file.size > 4 * 1024 * 1024){ saveMsg = 'That sound file is over 4 MB. Trim it or pick a shorter clip.'; renderEditor(); return; }
  const fr = new FileReader();
  fr.onload = () => { const q = DATA.rounds[edTab].categories[+el.dataset.c].clues[+el.dataset.i]; q.audio = fr.result; q.audioLabel = q.audioLabel || 'sound'; markDirty(); renderEditor(); };
  fr.readAsDataURL(file);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'solo-form'){ if (clueCtx) submitSolo(); else if (F) submitSoloFinal(); }
});
document.addEventListener('keydown', e => {
  if (!$('#editor').hidden) return;
  if (e.target.id === 'solo-ans' && e.key === 'Enter'){ e.preventDefault(); if (clueCtx) submitSolo(); else if (F) submitSoloFinal(); return; }
  if (e.target.id === 'solo-ans' && e.key === 'Escape'){ if (clueCtx) closeClue(); else if (F) closeFinal(); return; }
  if (e.target.matches('input,textarea')) { if (e.key === 'Enter' && e.target.id === 'adj-in') $('[data-act="adj-set"]').click(); return; }
  if (clueCtx){
    if (e.key === 'Escape') closeClue();
    else if ((e.key === ' ' || e.key === 'Enter') && clueCtx.stage === 'q' && S.mode !== 'solo'){ e.preventDefault(); clueCtx.stage = 'a'; renderClue(); }
  } else if (F && e.key === 'Escape') closeFinal();
});

// ---------- Boot ----------
function start(d){
  load(d);
  try { window.claude?.hot?.snapshot?.(() => S); } catch(e){}
  if (S.screen === 'board' || S.screen === 'final') show('board'); else show('title');
  if (S.screen === 'final'){ /* stay on board after reload */ S.screen = 'board'; save(); }
  // Saving edits into the page needs the artifact capability; without it the editor still works for this session.
  (async () => {
    // Outside Claude (e.g. hosted on Netlify): editing unlocks with #edit on the address, and edits are saved by downloading an updated file.
    if (!window.claude?.use){
      standalone = true;
      mayEdit = /(^|[?&#])edit\b/i.test(location.search + location.hash);
      document.querySelectorAll('[data-edit-only]').forEach(el => { el.hidden = !mayEdit; });
      return;
    }
    // Only the owner and people given edit access see the Edit buttons; viewers just play.
    try { const user = window.claude?.use ? await window.claude.use('user') : null; mayEdit = user ? await user.canEdit() : false; } catch(e){ mayEdit = false; }
    document.querySelectorAll('[data-edit-only]').forEach(el => { el.hidden = !mayEdit; });
    if (!mayEdit){ $('#editor').hidden = true; return; }
    try { artifactApi = window.claude?.use ? await window.claude.use('artifact') : null; } catch(e){ artifactApi = null; }
    if (!$('#editor').hidden) renderEditor();
  })();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
