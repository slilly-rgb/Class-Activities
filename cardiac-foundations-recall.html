<style>

  --accent:#a3263a; --accent-soft:#f8e4e7; --ok:#1d7a4f; --ok-soft:#e3f3ea; --bad:#b23a3a; --bad-soft:#f8e6e6;
  --core:#2d5f8a; --core-soft:#e3edf6;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1214; --surface:#24191c; --ink:#f0e6e8; --muted:#b29ba1; --line:#3a2a2e;
  --accent:#ec7d8f; --accent-soft:#41222a; --ok:#5ec993; --ok-soft:#163327; --bad:#ee8686; --bad-soft:#3a1d1f;
  --core:#86b6e0; --core-soft:#1d2c3b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1214; --surface:#24191c; --ink:#f0e6e8; --muted:#b29ba1; --line:#3a2a2e;
  --accent:#ec7d8f; --accent-soft:#41222a; --ok:#5ec993; --ok-soft:#163327; --bad:#ee8686; --bad-soft:#3a1d1f;
  --core:#86b6e0; --core-soft:#1d2c3b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:10px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand .sub{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:700;font-size:1.55rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.score{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.rail{display:grid;gap:4px}
.rail button{height:8px;border:0;border-radius:4px;background:var(--line);padding:0;cursor:pointer}
.rail button.done-ok{background:var(--ok)} .rail button.done-bad{background:var(--bad)}
.rail button.cur{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px clamp(18px,4vw,36px);display:flex;flex-direction:column;gap:18px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;padding:4px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.core{background:var(--core-soft);color:var(--core)}
.chip.plain{background:transparent;color:var(--muted);padding-inline:0}
.steps{display:flex;gap:6px;margin-left:auto}

.coreq{font-family:var(--display);font-weight:500;font-size:clamp(1.5rem,4.5vw,2.1rem);line-height:1.2;margin:0;text-wrap:balance}

label.notes{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem;color:var(--muted)}

textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stem{font-size:1.12rem;margin:0;font-weight:600;line-height:1.45}

.opt label{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:12px 14px;cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.mark{width:24px;height:24px;border:2px solid var(--muted);display:grid;place-items:center;font-family:var(--mono);font-size:.75rem;color:var(--muted);margin-top:1px}
.radio .mark{border-radius:50%} .check .mark{border-radius:6px}
.opt:hover:not(.locked){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .mark{border-color:var(--accent);background:var(--accent);color:var(--surface)}
.opt input:focus-visible + .mark{outline:2px solid var(--accent);outline-offset:2px}
.opt.locked label{cursor:default}
.opt.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-ok .mark{border-color:var(--ok);background:var(--ok);color:var(--surface)}
.opt.is-bad.sel{border-color:var(--bad);background:var(--bad-soft)}
.opt.is-bad.sel .mark{border-color:var(--bad);background:var(--bad);color:var(--surface)}
.why{grid-column:2;font-size:.94rem;color:var(--ink);margin-top:6px;padding-top:8px;border-top:1px dashed var(--line)}
.why .tag{font-family:var(--mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;margin-right:6px}
.is-ok .why .tag{color:var(--ok)} .is-bad .why .tag{color:var(--bad)}
.miss{font-family:var(--mono);font-size:.7rem;color:var(--ok);letter-spacing:.05em;text-transform:uppercase;margin-left:6px}
.verdict{border-radius:11px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.verdict.ok{background:var(--ok-soft)} .verdict.bad{background:var(--bad-soft)}
.verdict strong{font-family:var(--display);font-size:1.15rem}
.verdict.ok strong{color:var(--ok)} .verdict.bad strong{color:var(--bad)}
.actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
button.btn{font:inherit;font-weight:700;border-radius:10px;padding:11px 20px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:var(--surface)}
button.btn.ghost{background:transparent;color:var(--accent)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.results h2{font-family:var(--display);font-size:2rem;margin:0}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rlist li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.rlist .n{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.rlist .s{min-width:0}
.rlist .r{font-family:var(--mono);font-size:.75rem;letter-spacing:.05em}
.rlist .r.ok{color:var(--ok)} .rlist .r.bad{color:var(--bad)}
.rlist button{all:unset;cursor:pointer;color:var(--ink)} .rlist button:hover{color:var(--accent);text-decoration:underline}
.foot{color:var(--muted);font-size:.85rem;text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <div style="display:flex;flex-direction:column;gap:2px"><span class="sub">Remember level · core recall</span><h1>Cardiac Foundations Recall</h1></div>
      <span class="score" id="score"></span>
    </div>
    <div class="rail" id="rail" aria-label="Question progress"></div>
  </header>
  <main class="card" id="card" aria-live="polite"></main>
  <p class="foot">Heart anatomy · blood flow · coronary circulation · conduction system · ECG waves and intervals · cardiac output. Notes stay on this screen and are not saved.</p>
</div>

<script>
const Q=[
{t:"Heart wall",s:"Which layer of the heart is the muscle?",c:"The myocardium. \"Myo\" means muscle.",
 q:"Which layer of the heart wall is responsible for contraction?",o:[
 ["Endocardium",0,"The endocardium is the thin inner lining of the chambers and valves. It doesn't contract."],
 ["Myocardium",1,"The myocardium is the thick middle layer of cardiac muscle that contracts to pump blood."],
 ["Epicardium",0,"The epicardium is the outer surface layer of the heart wall (the visceral pericardium). It doesn't contract."],
 ["Parietal pericardium",0,"The parietal pericardium is part of the sac around the heart, not the heart wall itself."]]},
{t:"Valves",s:"What valve sits between the right atrium and right ventricle?",c:"The tricuspid valve. Remember: \"tri before you bi\" (tricuspid on the right, bicuspid/mitral on the left).",
 q:"Blood passes through which valve as it moves from the right atrium into the right ventricle?",o:[
 ["Mitral valve",0,"The mitral (bicuspid) valve is between the left atrium and left ventricle."],
 ["Pulmonic valve",0,"The pulmonic valve is between the right ventricle and the pulmonary artery."],
 ["Tricuspid valve",1,"The tricuspid valve separates the right atrium from the right ventricle."],
 ["Aortic valve",0,"The aortic valve is between the left ventricle and the aorta."]]},
{t:"Blood flow",s:"Name the places oxygen-rich blood travels through after it leaves the lungs.",c:"Pulmonary veins, left atrium, left ventricle, aorta.",
 q:"Which structures carry oxygenated blood? Select all that apply.",o:[
 ["Pulmonary veins",1,"The pulmonary veins return freshly oxygenated blood from the lungs to the left atrium. After birth, they are the only veins that carry oxygenated blood."],
 ["Left atrium",1,"The left atrium receives oxygenated blood from the pulmonary veins."],
 ["Left ventricle",1,"The left ventricle pumps oxygenated blood out to the body."],
 ["Aorta",1,"The aorta carries oxygenated blood from the left ventricle to the body."],
 ["Pulmonary artery",0,"The pulmonary artery carries deoxygenated blood from the right ventricle to the lungs. After birth, it is the only artery that carries deoxygenated blood."],
 ["Superior vena cava",0,"The superior vena cava returns deoxygenated blood from the upper body to the right atrium."]]},
{t:"Chambers",s:"Which chamber has the thickest, strongest wall?",c:"The left ventricle, because it pumps blood out to the whole body.",
 q:"Which chamber of the heart has the thickest muscular wall?",o:[
 ["Right atrium",0,"The atria have thin walls because they only push blood a short distance into the ventricles."],
 ["Right ventricle",0,"The right ventricle pumps only to the nearby, low-pressure lungs, so its wall is thinner than the left's."],
 ["Left atrium",0,"The left atrium is thin-walled, like the right atrium."],
 ["Left ventricle",1,"The left ventricle pumps against the high pressure of the systemic circulation, so it has the thickest wall."]]},
{t:"Heart sounds",s:"What makes the first heart sound, the \"lub\"?",c:"The mitral and tricuspid valves closing.",
 q:"The first heart sound (S1) is produced by the closure of which valves?",o:[
 ["Aortic and pulmonic valves",0,"Closure of the aortic and pulmonic (semilunar) valves produces S2, the \"dub.\""],
 ["Mitral and tricuspid valves",1,"S1 is heard when the atrioventricular valves (mitral and tricuspid) close at the start of ventricular contraction."],
 ["Mitral and aortic valves",0,"These valves are on the same side of the heart but close at different times."],
 ["Tricuspid and pulmonic valves",0,"These valves are on the right side of the heart but close at different times."]]},
{t:"Coronary circulation",s:"When do the coronary arteries fill with blood?",c:"During diastole, when the heart muscle relaxes.",
 q:"During which phase of the cardiac cycle do the coronary arteries receive most of their blood flow?",o:[
 ["Systole",0,"During systole the contracting myocardium squeezes the coronary arteries, limiting flow."],
 ["Diastole",1,"The coronary arteries fill mainly during diastole, when the heart muscle relaxes and the aortic valve is closed."],
 ["Isovolumetric contraction",0,"This is the early part of systole, when the ventricle is contracting and coronary flow is limited."],
 ["Atrial contraction",0,"Atrial contraction is the late part of ventricular filling, not the main time the coronary arteries fill."]]},
{t:"Coronary circulation",s:"Which artery is called the \"widow maker\"?",c:"The left anterior descending (LAD) artery.",
 q:"Which coronary artery supplies blood to the anterior wall of the left ventricle?",o:[
 ["Right coronary artery",0,"The right coronary artery supplies the right ventricle, the inferior wall, and in most people the SA and AV nodes."],
 ["Left anterior descending artery",1,"The LAD supplies the anterior wall of the left ventricle and most of the ventricular septum."],
 ["Circumflex artery",0,"The circumflex artery supplies the lateral and posterior walls of the left ventricle."],
 ["Posterior descending artery",0,"The posterior descending artery supplies the inferior and posterior walls."]]},
{t:"Conduction system",s:"What is the heart's natural pacemaker, and how fast does it fire?",c:"The SA node, 60 to 100 beats per minute.",
 q:"What is the normal intrinsic firing rate of the sinoatrial (SA) node?",o:[
 ["20 to 40 beats per minute",0,"This is the intrinsic rate of the ventricles (Purkinje fibers)."],
 ["40 to 60 beats per minute",0,"This is the intrinsic rate of the AV junction."],
 ["60 to 100 beats per minute",1,"The SA node fires at 60 to 100 beats per minute, which is why it sets a normal heart rate."],
 ["100 to 150 beats per minute",0,"A rate above 100 from the SA node is sinus tachycardia, not its normal intrinsic rate."]]},
{t:"Conduction system",s:"If the SA node stops, what is the backup and how fast is it?",c:"The AV junction, 40 to 60 beats per minute.",
 q:"If the SA node fails, the AV junction can take over as pacemaker at what rate?",o:[
 ["60 to 100 beats per minute",0,"This is the SA node's rate."],
 ["40 to 60 beats per minute",1,"The AV junction's intrinsic rate is 40 to 60 beats per minute."],
 ["20 to 40 beats per minute",0,"This is the ventricles' rate, the last backup pacemaker."],
 ["10 to 20 beats per minute",0,"No pacemaker site in the heart has this as its normal intrinsic rate."]]},
{t:"Conduction system",s:"Trace the electrical signal from start to finish.",c:"SA node → AV node → bundle of His → right and left bundle branches → Purkinje fibers.",
 q:"Which sequence shows the normal pathway of electrical conduction through the heart?",o:[
 ["AV node → SA node → bundle of His → Purkinje fibers → bundle branches",0,"The impulse starts at the SA node, not the AV node, and the bundle branches come before the Purkinje fibers."],
 ["SA node → AV node → bundle of His → bundle branches → Purkinje fibers",1,"This is the normal order: the SA node starts the impulse, the AV node delays it, and it then spreads down the bundle of His, bundle branches and Purkinje fibers."],
 ["SA node → bundle of His → AV node → Purkinje fibers → bundle branches",0,"The AV node comes before the bundle of His, and the bundle branches come before the Purkinje fibers."],
 ["SA node → Purkinje fibers → bundle branches → bundle of His → AV node",0,"This runs the pathway backward after the SA node."]]},
{t:"Cardiac cells",s:"Name the four special properties of cardiac cells.",c:"Automaticity, excitability, conductivity, contractility.",
 q:"Which are properties of cardiac cells? Select all that apply.",o:[
 ["Automaticity",1,"Automaticity is the ability to start an electrical impulse on its own, without outside stimulation."],
 ["Excitability",1,"Excitability is the ability to respond to an electrical stimulus."],
 ["Conductivity",1,"Conductivity is the ability to pass an impulse from one cell to the next."],
 ["Contractility",1,"Contractility is the ability of the muscle fibers to shorten (contract) in response to a stimulus."],
 ["Elasticity",0,"Elasticity describes stretch and recoil, a property of arteries. It isn't one of the four cardiac cell properties."],
 ["Permeability",0,"Permeability isn't one of the four classic cardiac cell properties."]]},
{t:"Electrophysiology",s:"What does depolarization lead to?",c:"Contraction. Depolarization is the electrical event; contraction is the mechanical response.",
 q:"Which statement best describes depolarization?",o:[
 ["The electrical stimulation of cardiac cells that triggers contraction",1,"Depolarization is the wave of electrical activation (sodium moving into the cell) that leads to contraction."],
 ["The return of cardiac cells to their resting state",0,"This describes repolarization."],
 ["The period when the heart cannot respond to any stimulus",0,"This describes the absolute refractory period."],
 ["The relaxation of the ventricles as they fill with blood",0,"This describes diastole, the mechanical relaxation phase."]]},
{t:"Electrophysiology",s:"What does repolarization mean?",c:"The cells recover and reset to their resting state, ready to fire again.",
 q:"Repolarization of cardiac cells refers to which process?",o:[
 ["The start of an electrical impulse at the SA node",0,"Starting an impulse describes automaticity and depolarization at the SA node."],
 ["The spread of the impulse through the Purkinje fibers",0,"This describes conduction through the ventricles during depolarization."],
 ["The return of the cell to its resting electrical state",1,"During repolarization, potassium moves out of the cell and the cell resets so it can depolarize again."],
 ["The contraction of the atria",0,"Atrial contraction follows atrial depolarization."]]},
{t:"ECG waves",s:"What does the P wave show?",c:"The atria depolarizing.",
 q:"On an ECG, the P wave represents which event?",o:[
 ["Atrial depolarization",1,"The P wave is the electrical activation of the atria, which leads to atrial contraction."],
 ["Atrial repolarization",0,"Atrial repolarization happens during the QRS complex and is hidden by it."],
 ["Ventricular depolarization",0,"Ventricular depolarization is shown by the QRS complex."],
 ["Ventricular repolarization",0,"Ventricular repolarization is shown by the T wave."]]},
{t:"ECG waves",s:"What does the QRS complex show?",c:"The ventricles depolarizing.",
 q:"The QRS complex on an ECG represents which event?",o:[
 ["Atrial depolarization",0,"Atrial depolarization is the P wave."],
 ["Ventricular depolarization",1,"The QRS complex is the electrical activation of the ventricles, which leads to ventricular contraction."],
 ["Ventricular repolarization",0,"Ventricular repolarization is the T wave."],
 ["The delay at the AV node",0,"The AV node delay is part of the PR interval."]]},
{t:"ECG waves",s:"What does the T wave show?",c:"The ventricles repolarizing (recovering).",
 q:"The T wave on an ECG represents which event?",o:[
 ["Atrial depolarization",0,"Atrial depolarization is the P wave."],
 ["Ventricular depolarization",0,"Ventricular depolarization is the QRS complex."],
 ["Ventricular repolarization",1,"The T wave is the ventricles returning to their resting state after contraction."],
 ["Atrial repolarization",0,"Atrial repolarization is hidden within the QRS complex."]]},
{t:"ECG intervals",s:"What is a normal PR interval?",c:"0.12 to 0.20 seconds (3 to 5 small boxes).",
 q:"What is the normal duration of the PR interval?",o:[
 ["0.04 to 0.10 seconds",0,"This is too short for a normal PR interval. A short PR suggests the impulse bypassed the normal AV node delay."],
 ["0.12 to 0.20 seconds",1,"A normal PR interval is 0.12 to 0.20 seconds, the time from the start of atrial depolarization to the start of ventricular depolarization."],
 ["0.20 to 0.30 seconds",0,"A PR interval longer than 0.20 seconds is prolonged (a first-degree AV block)."],
 ["0.36 to 0.44 seconds",0,"This range is close to a normal QT interval, not a PR interval."]]},
{t:"ECG intervals",s:"How long should a normal QRS complex be?",c:"Less than 0.12 seconds (under 3 small boxes).",
 q:"What is the normal duration of the QRS complex?",o:[
 ["Less than 0.12 seconds",1,"A normal QRS is narrow, usually 0.06 to 0.10 seconds and less than 0.12 seconds, because the impulse travels quickly through the normal conduction pathway."],
 ["0.12 to 0.20 seconds",0,"This is the normal PR interval. A QRS of 0.12 seconds or wider is considered wide."],
 ["0.20 to 0.40 seconds",0,"A QRS this wide is abnormal."],
 ["More than 0.44 seconds",0,"This describes a prolonged QT interval, not a QRS complex."]]},
{t:"ECG paper",s:"How much time is one small box on ECG paper?",c:"0.04 seconds. One large box (5 small boxes) is 0.20 seconds.",
 q:"On standard ECG paper, each small box represents how much time?",o:[
 ["0.02 seconds",0,"Each small box is 0.04 seconds at the standard paper speed of 25 mm per second."],
 ["0.04 seconds",1,"At the standard speed of 25 mm per second, each 1 mm small box equals 0.04 seconds."],
 ["0.20 seconds",0,"0.20 seconds is one large box, made of 5 small boxes."],
 ["1 second",0,"One second equals 5 large boxes (25 small boxes)."]]},
{t:"Cardiac output",s:"What two numbers multiply to give cardiac output?",c:"Heart rate × stroke volume. Normal cardiac output is 4 to 8 L/min.",
 q:"Cardiac output is calculated by multiplying heart rate by which value?",o:[
 ["Blood pressure",0,"Blood pressure is related to cardiac output and resistance, but it isn't part of the cardiac output formula."],
 ["Stroke volume",1,"Cardiac output equals heart rate times stroke volume, the amount of blood ejected with each beat."],
 ["Ejection fraction",0,"Ejection fraction is the percentage of blood ejected from the ventricle each beat. It isn't multiplied by heart rate to get cardiac output."],
 ["Respiratory rate",0,"Respiratory rate isn't part of the cardiac output calculation."]]},
{t:"Cardiac output",s:"What is preload?",c:"The stretch of the ventricle from the blood filling it at the end of diastole (the volume).",
 q:"Which term describes the amount of stretch on the ventricle at the end of diastole?",o:[
 ["Afterload",0,"Afterload is the resistance the ventricle must pump against to eject blood."],
 ["Contractility",0,"Contractility is the force of the heart muscle's contraction."],
 ["Preload",1,"Preload is the volume of blood stretching the ventricle at the end of diastole, just before it contracts."],
 ["Stroke volume",0,"Stroke volume is the amount of blood ejected with each beat."]]},
{t:"Cardiac output",s:"What is afterload?",c:"The resistance the ventricle has to push against to get blood out.",
 q:"Afterload is best defined as which of the following?",o:[
 ["The volume of blood in the ventricle at the end of diastole",0,"This describes preload."],
 ["The resistance the ventricle must overcome to eject blood",1,"Afterload is the pressure or resistance the ventricle pumps against, mainly set by the arteries (systemic vascular resistance for the left ventricle)."],
 ["The number of times the heart beats per minute",0,"This is heart rate."],
 ["The amount of blood pumped by the heart each minute",0,"This is cardiac output."]]},
{t:"Electrolytes",s:"Which electrolytes run the heart's electrical activity?",c:"Sodium, potassium and calcium.",
 q:"Which electrolytes move across cardiac cell membranes to produce depolarization and repolarization? Select all that apply.",o:[
 ["Sodium",1,"Sodium rushing into the cell starts depolarization."],
 ["Potassium",1,"Potassium moving out of the cell drives repolarization."],
 ["Calcium",1,"Calcium enters the cell during the plateau phase and triggers muscle contraction."],
 ["Glucose",0,"Glucose is a fuel, not an electrolyte that carries the electrical charge."],
 ["Albumin",0,"Albumin is a plasma protein, not an electrolyte involved in the action potential."]]}
];

const N=Q.length;
const st={i:0,stage:1,notes:Q.map(()=>""),picks:Q.map(()=>new Set()),done:Q.map(()=>null)};
const card=document.getElementById('card'),rail=document.getElementById('rail'),score=document.getElementById('score');
const L="ABCDEFG";
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const isSata=q=>q.o.filter(o=>o[1]).length>1;

rail.style.gridTemplateColumns=`repeat(${N},1fr)`;
Q.forEach((q,n)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',`Question ${n+1}`);b.onclick=()=>go(n);rail.appendChild(b)});

function paintTop(){
  [...rail.children].forEach((b,n)=>{b.className=(st.done[n]===true?'done-ok':st.done[n]===false?'done-bad':'')+(n===st.i&&st.stage?' cur':'')});
  const a=st.done.filter(d=>d!==null).length,c=st.done.filter(d=>d===true).length;
  score.textContent=`${c} correct · ${a} of ${N} answered`;
}
function go(n){st.i=n;st.stage=st.done[n]===null?1:2;render()}

function render(){
  paintTop();
  if(st.stage===0)return results();
  const q=Q[st.i],n=st.i+1,sata=isSata(q);
  const head=`<div class="meta"><span class="chip">${q.t}</span><span class="chip plain">Question ${n} of ${N}</span>
    <div class="steps"><span class="${st.stage===1?'on':''}">1 Core</span><span>·</span><span class="${st.stage===2?'on':''}">2 ${sata?'Select all':'Multiple choice'}</span></div></div>`;
  if(st.stage===1){
    card.innerHTML=`${head}
      <span class="chip core" style="align-self:flex-start">Core question</span>
      <p class="coreq">${q.s}</p>
      <p class="hint">Say it or jot it down before you see the answer choices.</p>
      <label class="notes" for="note">Your answer (optional)<textarea id="note" placeholder="Type your answer here...">${esc(st.notes[st.i])}</textarea></label>
      <div class="actions"><button class="btn ghost" id="prev" type="button" ${st.i===0?'disabled':''}>Previous</button>
      <button class="btn" id="next" type="button">Show the question</button></div>`;
    const t=document.getElementById('note');t.oninput=()=>st.notes[st.i]=t.value;
    document.getElementById('prev').onclick=()=>{st.i--;st.stage=st.done[st.i]===null?1:2;render()};
    document.getElementById('next').onclick=()=>{st.stage=2;render();card.querySelector('.stem')?.focus()};
    return;
  }
  const done=st.done[st.i]!==null,picks=st.picks[st.i];
  const note=st.notes[st.i].trim();
  const opts=q.o.map((o,k)=>{
    const sel=picks.has(k),cls=['opt',sel?'sel':'',done?'locked':'',done?(o[1]?'is-ok':'is-bad'):''].join(' ');
    const why=done?`<div class="why"><span class="tag">${o[1]?'Correct':'Incorrect'}</span>${o[2]}</div>`:'';
    const missed=done&&o[1]&&!sel?'<span class="miss">Missed</span>':'';
    return `<li class="${cls}"><label class="${sata?'check':'radio'}"><input type="${sata?'checkbox':'radio'}" name="o" value="${k}" ${sel?'checked':''} ${done?'disabled':''}>
      <span class="mark">${L[k]}</span><span>${o[0]}${missed}${why}</span></label></li>`}).join('');
  let verdict='';
  if(done){const ok=st.done[st.i];
    verdict=`<div class="verdict ${ok?'ok':'bad'}"><strong>${ok?'Correct':'Not quite'}</strong>
      <span>Answer: ${q.o.map((o,k)=>o[1]?L[k]:null).filter(Boolean).join(', ')}. ${sata&&!ok?'Select-all items need every correct choice and no incorrect ones.':''}</span></div>
      <div class="recall"><b>Core question:</b> ${q.s}<br><b>Core answer:</b> ${q.c}</div>`}
  card.innerHTML=`${head}
    ${note&&!done?`<div class="recall"><b>Your core answer:</b> ${esc(note)}</div>`:''}
    <p class="stem" tabindex="-1">${q.q}</p>
    ${sata?'<span class="sata">Select all that apply</span>':''}
    <ul class="opts">${opts}</ul>
    ${verdict}
    ${done&&note?`<div class="recall"><b>What you wrote:</b> ${esc(note)}</div>`:''}
    <div class="actions"><button class="btn ghost" id="back" type="button">${done?'Previous':'Back to core question'}</button>
    ${done?`<button class="btn" id="nxt" type="button">${st.done.every(d=>d!==null)?'See results':st.i===N-1?'Go to first unanswered':'Next question'}</button>`
          :`<button class="btn" id="chk" type="button" ${picks.size?'':'disabled'}>Check answer</button>`}</div>`;
  if(!done){
    card.querySelectorAll('input').forEach(inp=>inp.onchange=()=>{const k=+inp.value;
      if(sata){inp.checked?picks.add(k):picks.delete(k)}else{picks.clear();picks.add(k)}
      card.querySelectorAll('.opt').forEach((li,j)=>li.classList.toggle('sel',picks.has(j)));
      document.getElementById('chk').disabled=!picks.size});
    document.getElementById('chk').onclick=()=>{
      st.done[st.i]=q.o.every((o,k)=>!!o[1]===picks.has(k));render()};
    document.getElementById('back').onclick=()=>{st.stage=1;render()};
  }else{
    document.getElementById('back').onclick=()=>{if(st.i>0){st.i--;st.stage=st.done[st.i]===null?1:2}else{st.stage=1}render()};
    document.getElementById('nxt').onclick=()=>{
      if(st.done.every(d=>d!==null)){st.stage=0;return render()}
      let n=st.i+1;while(n<N&&st.done[n]!==null)n++;
      if(n>=N)n=st.done.findIndex(d=>d===null);
      st.i=n;st.stage=1;render();window.scrollTo({top:0})};
  }
}

function results(){
  const c=st.done.filter(Boolean).length;
  card.innerHTML=`<div class="results" style="display:flex;flex-direction:column;gap:16px">
    <span class="chip core" style="align-self:flex-start">Results</span>
    <h2>${c} of ${N} correct</h2>
    <p class="hint">Select any question to review its rationales.</p>
    <ul class="rlist">${Q.map((q,n)=>`<li><span class="n">${String(n+1).padStart(2,'0')}</span>
      <span class="s"><button type="button" data-n="${n}">${q.s}</button></span>
      <span class="r ${st.done[n]?'ok':'bad'}">${st.done[n]?'Correct':'Missed'}</span></li>`).join('')}</ul>
    <div class="actions"><span></span><button class="btn" id="again" type="button">Start over</button></div></div>`;
  card.querySelectorAll('.rlist button').forEach(b=>b.onclick=()=>{st.i=+b.dataset.n;st.stage=2;render()});
  document.getElementById('again').onclick=()=>{st.i=0;st.stage=1;st.notes=Q.map(()=>"");st.picks=Q.map(()=>new Set());st.done=Q.map(()=>null);render()};
}
render();
</script>

</body></html>
