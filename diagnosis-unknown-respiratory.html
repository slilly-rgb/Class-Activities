<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Diagnosis Unknown Respiratory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: black case-file masthead, case board grid, then a single case workspace with tabbed evidence and a diagnosis board. Single dark brand theme (Clinical Mysteries). */
:root{
  color-scheme: dark;
  --bg:#070a0b; --panel:#0e1416; --panel2:#131c1e; --line:#203034;
  --fg:#dfe9e8; --muted:#8ea3a2; --teal:#1ec8b8; --teal-dim:#0f6b63; --teal-ink:#03211e;
  --red:#ef6a5f; --amber:#efb54a; --green:#53d48e;
  --display:"Oxanium","Eurostile","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible+label{outline:2px solid var(--teal);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}

/* masthead */
.mast{background:#000;border-bottom:1px solid var(--line)}
.mast .wrap{display:flex;align-items:center;gap:14px;padding-block:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px}
.logo svg{width:44px;height:44px;flex:none}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:18px;color:var(--teal);line-height:1}
.tag{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.edition{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);padding:4px 10px;border-radius:3px}

/* board */
.hero{padding-block:28px 10px}
.hero h1{font-size:clamp(28px,5vw,44px);font-weight:700;letter-spacing:.01em}
.hero h1 span{color:var(--teal)}
.hero p{max-width:66ch;color:var(--muted);margin:10px 0 0}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:18px 0 6px}
.rule{border-top:2px solid var(--teal-dim);padding-top:8px;font-size:13.5px;color:var(--muted)}
.rule b{display:block;color:var(--fg);font-family:var(--display);font-size:14px;letter-spacing:.04em;margin-bottom:2px}
.progress{font-family:var(--mono);font-size:13px;color:var(--muted);margin:18px 0 10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.progress .bar{flex:1;min-width:120px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--teal)}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;padding-bottom:40px}
.case{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .15s}
.case:hover{border-color:var(--teal-dim)}
.case .num{font-family:var(--mono);font-size:12px;color:var(--teal);display:flex;justify-content:space-between}
.case .nm{font-family:var(--display);font-size:18px;font-weight:700}
.case .meta{font-size:12.5px;color:var(--muted)}
.case .cc{font-size:13.5px;color:var(--fg);opacity:.85;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pill{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:2px;border:1px solid var(--line);color:var(--muted)}
.pill.solved{border-color:var(--green);color:var(--green)}
.pill.open{border-color:var(--amber);color:var(--amber)}

/* case view */
.topbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:16px 6px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:7px 12px;font-size:13.5px}
.btn:hover{border-color:var(--teal-dim)}
.btn.primary{background:var(--teal);color:var(--teal-ink);border-color:var(--teal);font-weight:600}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none}
.spacer{flex:1}
.file{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.file .who{min-width:0}
.file h2{font-size:26px}
.file .meta{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:3px}
.file .cc{margin:10px 0 0;max-width:70ch}
.tokens{text-align:right}
.tokens .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tokens .count{font-family:var(--display);font-size:34px;font-weight:700;color:var(--teal);line-height:1;font-variant-numeric:tabular-nums}
.tokens .count.low{color:var(--amber)}
.tokens .count.out{color:var(--red)}
.pips{display:grid;grid-template-columns:repeat(5,10px);gap:4px;justify-content:end;margin-top:8px}
.pips i{width:10px;height:10px;border-radius:50%;border:1px solid var(--teal-dim)}
.pips i.on{background:var(--teal);border-color:var(--teal)}

.tabs{display:flex;gap:2px;margin-top:16px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font-family:var(--display);font-size:14px;letter-spacing:.03em;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--teal)}
.tab .lock{font-size:11px;opacity:.7}
.tab .badge{font-family:var(--mono);font-size:11px;background:var(--teal-dim);color:var(--fg);padding:0 6px;border-radius:8px}
.pane{padding-block:16px 40px}
.locked{border:1px dashed var(--line);border-radius:4px;padding:28px 18px;text-align:center;color:var(--muted)}
.locked p{margin:0 0 12px}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px;max-width:72ch}

.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.item.in{border-color:var(--teal);background:linear-gradient(90deg,rgba(30,200,184,.08),transparent 60%),var(--panel)}
.item .txt{min-width:0}
.item .tname{font-family:var(--display);font-size:14px;letter-spacing:.02em}
.item .res{font-family:var(--mono);font-size:13px;color:var(--fg);margin-top:4px}
.item .res.def{color:var(--amber)}
.ev{border:1px solid var(--line);background:var(--panel2);border-radius:3px;padding:6px 10px;font-size:12.5px;white-space:nowrap;color:var(--muted)}
.ev[aria-pressed="true"]{border-color:var(--teal);color:var(--teal);font-weight:600}
.order{border:1px solid var(--teal-dim);background:none;border-radius:3px;padding:6px 10px;font-size:12.5px;white-space:nowrap;color:var(--teal)}
.order:disabled{opacity:.35;cursor:not-allowed}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.vgrid .item{font-family:var(--mono);font-size:14px}

/* diagnosis */
.dxhead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.dxhead h3{font-size:18px}
.dxhead .left{font-family:var(--mono);font-size:13px;color:var(--teal)}
.dxzone{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.dxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.dx{position:relative;display:block;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px 10px 38px;cursor:pointer;min-width:0}
.dx input{position:absolute;left:12px;top:13px;accent-color:var(--teal)}
.dx .dn{font-weight:600}
.dx .why{font-size:12px;color:var(--red);margin-top:3px}
.dx.out{opacity:.55;cursor:not-allowed;background:var(--bg)}
.dx.out .dn{text-decoration:line-through;text-decoration-color:var(--red)}
.dx.sel{border-color:var(--teal)}
.submitrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}
.msg{font-size:14px}
.msg.bad{color:var(--red)} .msg.ok{color:var(--green)}

.reveal{margin-top:20px;border:1px solid var(--green);border-radius:4px;background:var(--panel);overflow:hidden}
.reveal .rh{background:rgba(83,212,142,.12);padding:14px 16px;border-bottom:1px solid var(--line)}
.reveal .rh .k{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--green)}
.reveal .rh h3{font-size:24px;margin-top:4px}
.reveal .rb{padding:6px 16px 16px;display:grid;gap:12px}
.reveal .blk{max-width:72ch}
.reveal .blk b{display:block;font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin:8px 0 2px}
.reveal .blk p{margin:0}
.reveal .stats{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--amber)}
.sata{border-top:1px solid var(--line);padding-top:6px}
.sata .sq{display:block;font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin:8px 0 2px}
.sata .sp{margin:0 0 10px;max-width:72ch}
.nopts{display:flex;flex-direction:column;gap:8px}
.nopt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:10px 12px;cursor:pointer}
.nopt input{margin-top:4px;accent-color:var(--teal);width:16px;height:16px}
.nopt.on{border-color:var(--teal)}
.nopt.res{cursor:default}
.nopt.res.good{border-color:var(--green)}
.nopt.res.bad{border-color:var(--red)}
.nmark{font-weight:700;font-size:16px;width:16px;text-align:center}
.nopt.good .nmark{color:var(--green)} .nopt.bad .nmark{color:var(--red)}
.ntag{font-family:var(--mono);font-size:12px;margin-top:3px}
.nopt.good .ntag{color:var(--green)} .nopt.bad .ntag{color:var(--red)}
.nrat{font-size:13.5px;color:var(--muted);margin-top:4px}
.nrat b{color:var(--fg)}
.nscore{margin-top:12px;font-size:14px}
.nscore.good{color:var(--green)}
@media (max-width:560px){
  .file{grid-template-columns:1fr}
  .tokens{text-align:left}.pips{justify-content:start}
  .item{grid-template-columns:1fr}
  .item .ev,.item .order{justify-self:start}
  .edition{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="mast">
  <div class="wrap">
    <div class="logo" aria-label="Clinical Mysteries">
      <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="20" cy="20" r="14" fill="none" stroke="#1ec8b8" stroke-width="3"/><path d="M30.5 30.5 L43 43" stroke="#1ec8b8" stroke-width="5" stroke-linecap="round"/><path d="M8 21 h6 l2.5 -6 l3.5 12 l3 -9 l2 3 h6" fill="none" stroke="#dfe9e8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <div><div class="brand">Clinical Mysteries</div><div class="tag">Investigate. Analyze. Solve.</div></div>
    </div>
    <div class="edition">Diagnosis Unknown · Respiratory</div>
  </div>
</header>
<main id="app" class="wrap"></main>

<script>
const F = (t, ro, s) => ({ t, ro: ro || [], s: s || null });

const DX = [
  { id: "epi", name: "Acute epiglottitis", zone: "Upper" },
  { id: "facial", name: "Facial fracture / trauma", zone: "Upper" },
  { id: "laryn", name: "Laryngeal trauma", zone: "Upper" },
  { id: "pta", name: "Peritonsillar abscess", zone: "Upper" },
  { id: "asthma", name: "Asthma / status asthmaticus", zone: "Lower" },
  { id: "osa", name: "Obstructive sleep apnea", zone: "Upper" },
  { id: "cb", name: "COPD: chronic bronchitis", zone: "Lower" },
  { id: "emph", name: "COPD: emphysema", zone: "Lower" },
  { id: "cf", name: "Cystic fibrosis", zone: "Lower" },
  { id: "pah", name: "Pulmonary arterial hypertension", zone: "Lower" },
  { id: "ipf", name: "Pulmonary fibrosis", zone: "Lower" },
  { id: "lca", name: "Lung cancer", zone: "Lower" }
];

// el = elective/outpatient test: deferred (token still spent) when the patient is acute
const TESTS = [
  // LABS
  { id: "cbc", cat: "labs", name: "CBC with differential", normal: F("WBC 7.4 K/µL, Hgb 14.0 g/dL, Hct 42%, platelets 248 K/µL. Differential normal.") },
  { id: "bmp", cat: "labs", name: "Basic metabolic panel + calcium", normal: F("Na 139, K 4.1, Cl 102, HCO₃ 25 mEq/L; BUN 14, Cr 0.9 mg/dL; glucose 96 mg/dL; Ca 9.4 mg/dL.") },
  { id: "abg", cat: "labs", name: "Arterial blood gas (room air)", normal: F("pH 7.40, PaCO₂ 40 mmHg, PaO₂ 92 mmHg, HCO₃ 24 mEq/L, SaO₂ 97%.") },
  { id: "bnp", cat: "labs", name: "BNP", normal: F("42 pg/mL (normal < 100).") },
  { id: "strep", cat: "labs", name: "Rapid strep / throat culture", normal: F("Negative for group A streptococcus.") },
  { id: "bcx", cat: "labs", name: "Blood cultures × 2", normal: F("No growth at 48 hours.") },
  { id: "sputum", cat: "labs", name: "Sputum culture & Gram stain", normal: F("Normal oral flora. No predominant pathogen.") },
  { id: "cyto", cat: "labs", name: "Sputum cytology", normal: F("No malignant cells identified.") },
  { id: "ige", cat: "labs", name: "Serum IgE & eosinophil count", normal: F("IgE 58 IU/mL (normal). Eosinophils 2%.") },
  { id: "a1at", cat: "labs", name: "Alpha-1 antitrypsin level", normal: F("142 mg/dL (normal). MM phenotype.") },
  { id: "sweat", cat: "labs", name: "Sweat chloride test", el: true, normal: F("Sweat chloride 18 mmol/L (≤ 29 = CF unlikely).", ["cf"], "Normal sweat chloride") },
  { id: "elastase", cat: "labs", name: "Fecal elastase", el: true, normal: F("410 µg/g (normal > 200). Normal pancreatic function.") },

  // DIAGNOSTICS
  { id: "peak", cat: "diag", name: "Peak expiratory flow (pre/post bronchodilator)", normal: F("PEF 94% of predicted. No change after bronchodilator.", ["asthma"], "Normal peak flow, no reversibility") },
  { id: "pft", cat: "diag", name: "Pulmonary function tests (spirometry, lung volumes, DLCO)", el: true, normal: F("FEV₁ 96%, FVC 98%, FEV₁/FVC 0.80. TLC 100%. DLCO 94%. All normal.", ["cb", "emph", "ipf"], "Normal PFTs") },
  { id: "psg", cat: "diag", name: "Polysomnography (overnight sleep study)", el: true, normal: F("AHI 2 events/hr (normal < 5). Lowest SpO₂ 93%.", ["osa"], "Normal sleep study") },
  { id: "laryngo", cat: "diag", name: "Flexible laryngoscopy", normal: F("Normal epiglottis. Vocal cords move symmetrically. No edema, hematoma, or mucosal tear.", ["epi", "laryn"], "Normal laryngoscopy") },
  { id: "aspirate", cat: "diag", name: "Needle aspiration, peritonsillar space", normal: F("Not performed. No peritonsillar swelling to aspirate.", ["pta"], "No peritonsillar collection") },
  { id: "ecg", cat: "diag", name: "12-lead ECG", normal: F("Sinus rhythm at the patient's current rate. Normal axis. No hypertrophy or ST changes.") },
  { id: "echo", cat: "diag", name: "Echocardiogram", normal: F("Normal LV and RV size and function. Estimated PA systolic pressure 24 mmHg.", ["pah"], "Normal echo / PA pressure") },
  { id: "rhc", cat: "diag", name: "Right heart catheterization", el: true, normal: F("mPAP 15 mmHg, PAWP 9 mmHg, PVR 1.4 Wood units. Normal.", ["pah"], "Normal right heart cath") },
  { id: "bronch", cat: "diag", name: "Bronchoscopy with biopsy", el: true, normal: F("Normal airways. Biopsy benign. No malignancy.", ["lca"], "Benign bronchoscopy biopsy") },
  { id: "cftr", cat: "diag", name: "CFTR genetic testing", el: true, normal: F("No disease-causing CFTR variants detected.", ["cf"], "Negative CFTR genetics") },

  // IMAGING
  { id: "cxr", cat: "img", name: "Chest X-ray", normal: F("Clear lungs. Normal heart size. No mass, infiltrate, or hyperinflation.") },
  { id: "latneck", cat: "img", name: "Lateral soft-tissue neck X-ray", normal: F("Normal epiglottis and prevertebral soft tissue.", ["epi"], "Normal epiglottis on neck X-ray") },
  { id: "ctneck", cat: "img", name: "CT neck with contrast", normal: F("No abscess. No laryngeal fracture. Normal epiglottis and soft tissues.", ["epi", "pta", "laryn"], "Normal CT neck") },
  { id: "ctface", cat: "img", name: "Maxillofacial CT", normal: F("No facial bone fractures.", ["facial"], "No facial fractures on CT") },
  { id: "ctchest", cat: "img", name: "High-resolution CT chest", normal: F("Normal lung tissue. No nodules, emphysema, bronchiectasis, or fibrosis.", ["emph", "ipf", "cf", "lca"], "Normal HRCT chest") },
  { id: "cta", cat: "img", name: "CT pulmonary angiogram", normal: F("No pulmonary embolism. Main pulmonary artery normal caliber (2.6 cm).") },
  { id: "pet", cat: "img", name: "PET-CT", el: true, normal: F("No hypermetabolic lesions.", ["lca"], "Negative PET-CT") }
];

const DEFERRED = F("Deferred. This test isn't appropriate for an unstable, acute patient. Think about what this patient needs right now.");

const PATIENTS = [
  // 1 EPIGLOTTITIS
  {
    id: "p1", dx: "epi", acute: true, name: "Marcus Bell", age: 42, sex: "M", setting: "Emergency Department",
    summary: "Brought in by his wife with a severe sore throat that started this morning and has worsened fast. He is sitting bolt upright, leaning forward, and drooling. His voice sounds muffled.",
    history: [
      F("Sore throat began about 8 hours ago. Now so painful he cannot swallow his own saliva."),
      F("No chronic cough, sputum, or shortness of breath with activity before today.", ["cb", "emph", "ipf", "pah"], "No chronic cough or exertional dyspnea"),
      F("No history of asthma, wheezing, or inhaler use.", ["asthma"], "No asthma history"),
      F("Former smoker, quit 15 years ago (10 pack-years)."),
      F("Wife says he does not snore and sleeps well.", ["osa"], "No snoring"),
      F("Healthy childhood. No recurrent lung infections or digestive problems.", ["cf"], "Healthy childhood"),
      F("Born overseas; childhood vaccination records (including Hib) are unavailable."),
      F("Teaches high school chemistry. Several students have been out with the flu."),
      F("No weight loss, night sweats, or coughing up blood.", ["lca"], "No weight loss or hemoptysis")
    ],
    vitals: [F("Temp 103.1 °F (39.5 °C)"), F("HR 124 bpm"), F("RR 28/min"), F("BP 138/84 mmHg"), F("SpO₂ 93% on room air")],
    physical: [
      F("Sitting upright, leaning forward with neck extended (sniffing position). Drooling."),
      F("Muffled, 'hot potato' voice. Soft inspiratory stridor."),
      F("Provider deferred the tongue-blade throat exam to avoid triggering laryngospasm."),
      F("Exquisite tenderness over the anterior neck at the level of the hyoid. No bruising."),
      F("Face symmetric, nontender, no swelling or deformity.", ["facial"], "Normal facial exam"),
      F("Lungs: upper-airway noise transmitted, no wheezes.", ["asthma"], "No wheezing")
    ],
    tests: {
      cbc: F("WBC 19,800/µL with 86% neutrophils and bands (left shift)."),
      abg: F("pH 7.33, PaCO₂ 49 mmHg, PaO₂ 68 mmHg, HCO₃ 25 mEq/L."),
      bcx: F("Preliminary: gram-negative coccobacilli, identified as Haemophilus influenzae."),
      peak: F("Not performed. Forced breathing maneuvers could worsen upper-airway obstruction."),
      aspirate: F("Not performed. Manipulating the oropharynx risks complete airway obstruction."),
      latneck: F("Swollen, thickened epiglottis: positive 'thumb sign.'"),
      laryngo: F("Done in the OR with the airway team at bedside: cherry-red, markedly swollen epiglottis. No hematoma or mucosal tear.", ["laryn"], "No laryngeal injury on scope"),
      ctneck: F("Epiglottic and aryepiglottic fold swelling. No abscess. No fracture.", ["pta", "laryn"], "CT: no abscess, no fracture"),
      ecg: F("Sinus tachycardia 124. Otherwise normal.")
    },
    reveal: {
      normal: "The epiglottis is a flap of cartilage that closes over the larynx when you swallow, then opens so air can pass.",
      broke: "Bacterial infection (classically H. influenzae type b) makes the epiglottis and surrounding tissue swell fast. A swollen epiglottis can seal the airway opening within hours.",
      clues: "Rapid onset, high fever, drooling, muffled voice, sniffing position, stridor, thumb sign on neck X-ray, no Hib vaccine record.",
      nursing: "Airway first. Keep him upright and calm, never put a tongue blade or swab in the throat, and have intubation and emergency surgical airway equipment at the bedside. IV antibiotics after the airway is secured."
    }
  },

  // 2 FACIAL FRACTURE
  {
    id: "p2", dx: "facial", acute: true, name: "Tyler Okafor", age: 24, sex: "M", setting: "Emergency Department",
    summary: "Arrived by EMS after a hockey puck hit him in the face. His left eye and cheek are swollen, he says he is seeing double, and his teeth 'don't fit together right.'",
    history: [
      F("Struck in the left cheek by a puck about 1 hour ago. No face shield."),
      F("No chronic cough, sputum, or exertional shortness of breath.", ["cb", "emph", "ipf", "pah"], "No chronic lung symptoms"),
      F("Mild intermittent asthma. Uses albuterol about once a month. No wheezing today."),
      F("Never smoker. No weight loss or coughing up blood.", ["lca"], "Never smoker, no hemoptysis"),

    N("Never interrupt a continuous epoprostenol infusion; keep a backup pump and supplies on hand.", true, "Epoprostenol has a half-life of minutes. Stopping it can cause rebound pulmonary hypertension and death."),
    N("Monitor for right-sided heart failure: daily weights, edema, and JVD.", true, "Her right ventricle is failing against high pulmonary pressures."),
    N("Give oxygen to keep her SpO₂ at the ordered target.", true, "Low oxygen constricts the pulmonary arteries and raises pressure further."),
    N("Teach her to avoid pregnancy and use reliable contraception.", true, "Pregnancy carries a very high death rate in PAH, and some PAH drugs cause birth defects."),
    N("Teach energy conservation and avoiding heavy exertion, straining, and high altitude.", true, "These raise pulmonary pressure and oxygen demand and can cause fainting."),
    N("Encourage vigorous exercise to build her endurance.", false, "Heavy exertion can cause syncope or sudden death in PAH. Only supervised, low-level rehab is advised."),
    N("Flush the epoprostenol line with a saline bolus to check that it's working.", false, "Flushing pushes a bolus of drug in and can cause severe hypotension. The line is dedicated and never flushed."),
    N("Suggest OTC decongestants for colds.", false, "Decongestants constrict blood vessels and can worsen pulmonary hypertension.")
  ],
  p11: [
    N("Titrate oxygen for activity and check his SpO₂ while he walks.", true, "His SpO₂ drops from 90% to 82% with walking. His oxygen needs are higher with exertion than at rest."),
    N("Teach energy conservation and refer him to pulmonary rehabilitation.", true, "Rehab improves exercise tolerance and breathlessness, even though it can't reverse the scarring."),
    N("Teach about antifibrotic drugs (pirfenidone, nintedanib), including GI side effects and liver monitoring.", true, "Antifibrotics slow the decline in lung function. Side effects are common, and liver labs need monitoring."),
    N("Start goals-of-care and palliative care conversations early.", true, "IPF is progressive and irreversible, so planning early respects his wishes."),
    N("Help him manage his reflux (elevate the head of the bed, take medications as prescribed).", true, "GERD is linked with IPF. Microaspiration may contribute to lung injury."),
    N("Tell him a bronchodilator inhaler will reverse the scarring.", false, "His problem is restriction and poor diffusion from scar tissue. Bronchodilators don't reverse fibrosis."),
    N("Give oxygen only at rest because he's fine when sitting.", false, "He desaturates most during activity, which is when he needs oxygen most."),
    N("Expect long-term high-dose steroids to cure the fibrosis.", false, "Steroids don't help IPF and can cause harm. The scarring is permanent.")
  ],
  p12: [
    N("Monitor for hypercalcemia: confusion, weakness, constipation, and frequent urination.", true, "Her calcium is 11.8 from a tumor-produced hormone. Severe hypercalcemia can cause arrhythmias and coma."),
    N("Watch for superior vena cava syndrome: facial or neck swelling, dyspnea, and distended chest veins.", true, "Mediastinal tumor and lymph nodes can compress the SVC. It's an oncologic emergency."),
    N("Offer smoking cessation support.", true, "Quitting still improves treatment response, surgical outcomes, and survival after a cancer diagnosis."),
    N("Assess and manage pain, fatigue, dyspnea, and nutrition.", true, "Symptom management is central to her care. She has lost 18 lb and is fatigued."),
    N("If she has heavy hemoptysis, position her with the affected (left) side down.", true, "Lying on the bleeding side keeps blood out of the good lung."),
    N("Tell her quitting smoking won't make a difference now.", false, "False. Quitting improves outcomes even after diagnosis."),
    N("Restrict fluids because her calcium is high.", false, "Hydration helps the kidneys excrete calcium. IV fluids are first-line treatment for hypercalcemia."),
    N("Encourage calcium supplements to protect her bones during treatment.", false, "Extra calcium would make her hypercalcemia worse.")
  ]
};

</script>
<script>
(function(){
const START_TOKENS = 15;
const KEY = "cm-du-resp-v2";
const DXMAP = Object.fromEntries(DX.map(d=>[d.id,d]));
const TMAP = Object.fromEntries(TESTS.map(t=>[t.id,t]));
const TABS = [
  {id:"history", name:"Patient History", kind:"bulk"},
  {id:"vitals", name:"Vital Signs", kind:"bulk"},
  {id:"physical", name:"Physical Assessment", kind:"bulk"},
  {id:"labs", name:"Labs", kind:"test"},
  {id:"diag", name:"Diagnostics", kind:"test"},
  {id:"img", name:"Imaging", kind:"test"},
  {id:"dx", name:"Diagnosis", kind:"dx"}
];

let S = load();
function fresh(){ return {tokens:START_TOKENS, tabs:{}, tests:[], ev:{}, solved:false, wrong:0, pick:null, msg:null}; }
function load(){
  let s=null;
  try{ s=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s||!s.cases) s={view:"board", cur:null, tab:"history", cases:{}, confirmReset:false};
  PATIENTS.forEach(p=>{ if(!s.cases[p.id]) s.cases[p.id]=fresh(); });
  const valid = Array.isArray(s.order) && s.order.length===PATIENTS.length && PATIENTS.every(p=>s.order.includes(p.id));
  if(!valid) s.order=shuffle(PATIENTS.map(p=>p.id));
  return s;
}
function shuffle(a){
  a=a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function newGame(){
  S={view:"board", cur:null, tab:"history", cases:{}, confirmReset:false, confirmNew:false, order:shuffle(PATIENTS.map(p=>p.id))};
  PATIENTS.forEach(p=>{ S.cases[p.id]=fresh(); });
}
const ORDERED = () => S.order.map(P);
const caseNo = p => String(S.order.indexOf(p.id)+1).padStart(2,"0");
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const P = id => PATIENTS.find(p=>p.id===id);
const C = () => S.cases[S.cur];
function testResult(p, tid){
  const t=TMAP[tid];
  if(p.tests[tid]) return p.tests[tid];
  if(t.el && p.acute) return Object.assign({deferred:true}, DEFERRED);
  return t.normal;
}
function finding(p, key){
  const [src, rest] = key.split(":");
  if(src==="t") return testResult(p, rest);
  return p[src][+rest];
}
function label(f){
  if(f.s) return f.s;
  const t=f.t.split(/[.;]/)[0];
  return t.length>60 ? t.slice(0,57)+"…" : t;
}
function eliminated(p, c){
  const out={};
  Object.keys(c.ev).forEach(k=>{
    if(!c.ev[k]) return;
    const f=finding(p,k); if(!f) return;
    f.ro.forEach(d=>{ if(d===p.dx) return; (out[d]=out[d]||[]).push(label(f)); });
  });
  return out;
}
const esc = s => String(s).replace(/[&<>"]/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const app = document.getElementById("app");

function render(){
  save();
  if(S.view==="case" && S.cur) renderCase(); else renderBoard();
}

function renderBoard(){
  const solved = PATIENTS.filter(p=>S.cases[p.id].solved).length;
  app.innerHTML = `
  <section class="hero">
    <h1>Diagnosis <span>Unknown</span>: Airway &amp; Lung</h1>
    <p>Twelve patients in a shuffled order. Twelve possible diagnoses, each used once. Spend tokens to gather data, decide which findings count as evidence, and eliminate diagnoses until only one fits.</p>
    <div class="rules">
      <div class="rule"><b>15 tokens per patient</b>History, Vital Signs, and Physical Assessment cost 1 token to unlock the whole tab. Each lab, diagnostic, or imaging test costs 1 token.</div>
      <div class="rule"><b>You choose the evidence</b>Mark findings as evidence. The Diagnosis tab crosses off any diagnosis your evidence contradicts and shows why.</div>
      <div class="rule"><b>Order wisely</b>Some tests aren't appropriate for an unstable patient. They'll be deferred and the token is still spent. A wrong diagnosis costs 1 token.</div>
      <div class="rule"><b>Think like the body</b>Ask what normal function is failing: upper airway, airways, alveoli, interstitium, or pulmonary vessels.</div>
    </div>
  </section>
  <div class="progress"><span>${solved} of ${PATIENTS.length} solved</span><div class="bar"><i style="width:${solved/PATIENTS.length*100}%"></i></div>
    ${S.confirmNew
      ? `<span class="confirm">Shuffle the cases and clear all progress on this device? <button class="btn" id="newYes">Start new game</button><button class="btn ghost" id="newNo">Cancel</button></span>`
      : `<button class="btn" id="newGame">New game</button>`}</div>
  <div class="cases">
    ${ORDERED().map((p,i)=>{
      const c=S.cases[p.id];
      const started = c.tokens<START_TOKENS || Object.keys(c.ev).length;
      const st = c.solved ? '<span class="pill solved">Solved</span>' : started ? `<span class="pill open">${c.tokens} tokens left</span>` : '<span class="pill">New</span>';
      return `<button class="case" data-open="${p.id}">
        <div class="num"><span>CASE ${String(i+1).padStart(2,"0")}</span>${st}</div>
        <div class="nm">${esc(p.name)}</div>
        <div class="meta">${p.age} · ${p.sex} · ${esc(p.setting)}</div>
        <div class="cc">${esc(p.summary)}</div>
      </button>`;}).join("")}
  </div>`;
  const ng=document.getElementById("newGame"); if(ng) ng.onclick=()=>{S.confirmNew=true;render();};
  const ny=document.getElementById("newYes"); if(ny) ny.onclick=()=>{newGame();render();};
  const nn=document.getElementById("newNo"); if(nn) nn.onclick=()=>{S.confirmNew=false;render();};
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{ S.view="case"; S.confirmNew=false; S.cur=b.dataset.open; S.tab="history"; S.confirmReset=false; render(); window.scrollTo(0,0); });
}

function renderCase(){
  const p=P(S.cur), c=C();
  const elim=eliminated(p,c);
  const remaining=DX.filter(d=>!elim[d.id]).length;
  const tcls = c.tokens===0?"out":c.tokens<=4?"low":"";
  const evCount=Object.keys(c.ev).filter(k=>{ if(!c.ev[k]) return false; const f=finding(p,k); return f && (f.sup || f.ro.length===0); }).length; // pure rule-out (negative) findings don't count as evidence
  const oldTabs=app.querySelector(".tabs");
  const keepLeft=oldTabs?oldTabs.scrollLeft:0, keepY=window.scrollY;
  app.innerHTML = `
  <div class="topbar">
    <button class="btn ghost" id="back">← All cases</button>
    <span class="spacer"></span>
    ${S.confirmReset
      ? `<span class="confirm">Reset this case to 15 tokens and clear all findings? <button class="btn" id="resetYes">Reset case</button><button class="btn ghost" id="resetNo">Cancel</button></span>`
      : `<button class="btn" id="reset">Reset case</button>`}
  </div>
  <section class="file">
    <div class="who">
      <div class="meta">CASE ${caseNo(p)} · ${esc(p.setting)}</div>
      <h2>${esc(p.name)}, ${p.age} ${p.sex}</h2>
      <p class="cc">${esc(p.summary)}</p>
    </div>
    <div class="tokens">
      <div class="lbl">Tokens</div>
      <div class="count ${tcls}">${c.tokens}</div>
      <div class="pips">${Array.from({length:START_TOKENS},(_,i)=>`<i class="${i<c.tokens?"on":""}"></i>`).join("")}</div>
    </div>
  </section>
  <nav class="tabs" role="tablist">
    ${TABS.map(t=>{
      let extra="";
      if(t.kind==="bulk" && !c.tabs[t.id]) extra='<span class="lock">🔒</span>';
      if(t.kind==="dx") extra=`<span class="badge">${remaining} left</span>`;
      return `<button class="tab" role="tab" aria-selected="${S.tab===t.id}" data-tab="${t.id}">${t.name}${extra}</button>`;}).join("")}
  </nav>
  <section class="pane" id="pane"></section>`;
  document.getElementById("back").onclick=()=>{S.view="board";S.confirmReset=false;render();window.scrollTo(0,0);};
  const r=document.getElementById("reset"); if(r) r.onclick=()=>{S.confirmReset=true;render();};
  const ry=document.getElementById("resetYes"); if(ry) ry.onclick=()=>{S.cases[p.id]=fresh();S.confirmReset=false;S.tab="history";render();};
  const rn=document.getElementById("resetNo"); if(rn) rn.onclick=()=>{S.confirmReset=false;render();};
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;tabJump=true;render();});
  renderPane(p,c,elim,remaining,evCount);
  // keep the tab strip and page where the student left them
  const tabs=app.querySelector(".tabs");
  tabs.scrollLeft=keepLeft;
  window.scrollTo(0,keepY);
  const sel=tabs.querySelector('[aria-selected="true"]');
  if(sel){
    const l=sel.offsetLeft-tabs.offsetLeft, r=l+sel.offsetWidth;
    if(l<tabs.scrollLeft) tabs.scrollLeft=l-8;
    else if(r>tabs.scrollLeft+tabs.clientWidth) tabs.scrollLeft=r-tabs.clientWidth+8;
  }
  if(tabJump){
    tabJump=false;
    const pane=document.getElementById("pane");
    const top=pane.getBoundingClientRect().top+window.scrollY-tabs.offsetHeight;
    if(window.scrollY>top) window.scrollTo(0,top);
  }
}
let tabJump=false;

function evBtn(c,key){
  const on=!!c.ev[key];
  return `<button class="ev" aria-pressed="${on}" data-ev="${key}">${on?"✓ Evidence":"+ Add as evidence"}</button>`;
}

function renderPane(p,c,elim,remaining,evCount){
  const pane=document.getElementById("pane");
  const tab=TABS.find(t=>t.id===S.tab);
  if(tab.kind==="bulk"){
    if(!c.tabs[tab.id]){
      pane.innerHTML=`<div class="locked"><p>${tab.name} is locked.</p><button class="btn primary" id="unlock" ${c.tokens<1||c.solved?"disabled":""}>Unlock for 1 token</button>${c.tokens<1?'<p style="margin-top:10px">Out of tokens. Make your diagnosis with the evidence you have.</p>':""}</div>`;
      document.getElementById("unlock").onclick=()=>{ if(c.tokens<1)return; c.tokens--; c.tabs[tab.id]=true; render(); };
      return;
    }
    const list=p[tab.id];
    // history and exam findings show in a per-case shuffled order so key clues are mixed in with the rest
    let order=list.map((_,i)=>i);
    if(tab.id!=="vitals"){
      c.ford=c.ford||{};
      if(!Array.isArray(c.ford[tab.id])||c.ford[tab.id].length!==list.length) c.ford[tab.id]=shuffle(order);
      order=c.ford[tab.id];
    }
    pane.innerHTML=`<p class="hint">Mark the findings you think matter. Only evidence can eliminate a diagnosis.</p>
      <div class="${tab.id==="vitals"?"vgrid":"items"}">${order.map(i=>{ const f=list[i];
        const key=`${tab.id}:${i}`;
        return `<div class="item ${c.ev[key]?"in":""}"><div class="txt">${esc(f.t)}</div>${evBtn(c,key)}</div>`;}).join("")}</div>`;
  } else if(tab.kind==="test"){
    const tests=TESTS.filter(t=>t.cat===tab.id);
    pane.innerHTML=`<p class="hint">Each test costs 1 token and can't be un-ordered. Once a result is back, you decide whether it counts as evidence.</p>
      <div class="items">${tests.map(t=>{
        const ordered=c.tests.includes(t.id);
        if(!ordered) return `<div class="item"><div class="txt"><div class="tname">${esc(t.name)}</div></div><button class="order" data-order="${t.id}" ${c.tokens<1||c.solved?"disabled":""}>Order · 1 token</button></div>`;
        const r=testResult(p,t.id), key="t:"+t.id;
        return `<div class="item ${c.ev[key]?"in":""}"><div class="txt"><div class="tname">${esc(t.name)}</div><div class="res ${r.deferred?"def":""}">${esc(r.t)}</div></div>${r.deferred?"":evBtn(c,key)}</div>`;
      }).join("")}</div>`;
    pane.querySelectorAll("[data-order]").forEach(b=>b.onclick=()=>{ if(c.tokens<1)return; c.tokens--; c.tests.push(b.dataset.order); render(); });
  } else {
    renderDx(pane,p,c,elim,remaining,evCount);
  }
  pane.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>{ const k=b.dataset.ev; if(c.ev[k]) delete c.ev[k]; else c.ev[k]=true; if(c.pick&&eliminated(p,c)[c.pick]) c.pick=null; render(); });
}

function renderDx(pane,p,c,elim,remaining,evCount){
  const group=z=>DX.filter(d=>d.zone===z).map(d=>{
    const out=elim[d.id];
    const sel=c.pick===d.id;
    return `<label class="dx ${out?"out":""} ${sel?"sel":""}">
      <input type="radio" name="dxpick" id="dx-${d.id}" value="${d.id}" ${out||c.solved?"disabled":""} ${sel?"checked":""}>
      <div class="dn">${esc(d.name)}</div>
      ${out?`<div class="why">Ruled out by: ${out.map(esc).join("; ")}</div>`:""}
    </label>`;}).join("");
  const rv=p.reveal;
  pane.innerHTML=`
    <div class="dxhead"><h3>Differential</h3><span class="left">${remaining} of ${DX.length} still possible · ${evCount} piece${evCount===1?"":"s"} of evidence</span></div>
    <div class="dxzone">Upper respiratory tract</div><div class="dxgrid">${group("Upper")}</div>
    <div class="dxzone">Lower respiratory tract</div><div class="dxgrid">${group("Lower")}</div>
    ${c.solved?"":`<div class="submitrow"><button class="btn primary" id="submit" ${c.pick?"":"disabled"}>Submit diagnosis</button>
      ${c.msg?`<span class="msg bad">${esc(c.msg)}</span>`:`<span class="msg" style="color:var(--muted)">${c.pick?"Ready when you are.":"Select a diagnosis that hasn't been ruled out."}</span>`}</div>`}
    ${c.solved?`<div class="reveal">
      <div class="rh"><div class="k">Good job. Case solved.</div><h3>${esc(DXMAP[p.dx].name)}</h3></div>
      <div class="rb">
        <div class="blk"><b>How it should work</b><p>${esc(rv.normal)}</p></div>
        <div class="blk"><b>What broke</b><p>${esc(rv.broke)}</p></div>
        <div class="blk"><b>The clues that mattered</b><p>${esc(rv.clues)}</p></div>
        <div class="stats">Solved with ${c.tokens} of ${START_TOKENS} tokens left · ${c.wrong} wrong guess${c.wrong===1?"":"es"}</div>
        ${sataHTML(p,c)}
      </div></div>`:""}`;
  pane.querySelectorAll("input[name=dxpick]").forEach(i=>i.onchange=()=>{c.pick=i.value;c.msg=null;render();});
  pane.querySelectorAll("input[data-nq]").forEach(i=>i.onchange=()=>{ const k=+i.dataset.nq; if(i.checked) c.nq.sel[k]=true; else delete c.nq.sel[k]; render(); });
  const ns=document.getElementById("nqSubmit");
  if(ns) ns.onclick=()=>{ if(!Object.keys(c.nq.sel).length) return; c.nq.done=true; render(); };
  const sb=document.getElementById("submit");
  if(sb) sb.onclick=()=>{
    if(!c.pick) return;
    if(c.pick===p.dx){ c.solved=true; c.msg=null; c.nq={order:shuffle(NURSING[p.id].map((_,i)=>i)), sel:{}, done:false}; }
    else { c.wrong++; if(c.tokens>0) c.tokens--; c.msg = `Not ${DXMAP[c.pick].name}. That cost a token. What evidence haven't you gathered yet?`; c.pick=null; }
    render();
  };
  const nb=document.getElementById("next");
  if(nb) nb.onclick=()=>{ const nx=nextCase(p); if(nx){S.cur=nx.id;S.tab="history";} else {S.view="board";} render(); window.scrollTo(0,0); };
}
function sataHTML(p,c){
  const opts=NURSING[p.id];
  if(!c.nq||!c.nq.order||c.nq.order.length!==opts.length) c.nq={order:shuffle(opts.map((_,i)=>i)), sel:{}, done:false};
  const q=c.nq, nSel=Object.keys(q.sel).length;
  let body=q.order.map(i=>{
    const o=opts[i], on=!!q.sel[i];
    if(!q.done) return `<label class="nopt ${on?"on":""}"><input type="checkbox" id="nq-${p.id}-${i}" data-nq="${i}" ${on?"checked":""}><span>${esc(o.t)}</span></label>`;
    const right = on===o.ok;
    const tag = on ? (o.ok?"You selected this · Correct":"You selected this · Should not be selected")
                   : (o.ok?"Not selected · Should have been selected":"Not selected · Correctly left out");
    return `<div class="nopt res ${right?"good":"bad"} ${on?"on":""}">
      <div class="nmark">${right?"✓":"✗"}</div>
      <div><div>${esc(o.t)}</div><div class="ntag">${tag}</div><div class="nrat"><b>${o.ok?"Priority.":"Not a priority."}</b> ${esc(o.r)}</div></div></div>`;
  }).join("");
  let foot;
  if(!q.done){
    foot=`<div class="submitrow"><button class="btn primary" id="nqSubmit" ${nSel?"":"disabled"}>Check my answers</button><span class="msg" style="color:var(--muted)">${nSel?nSel+" selected":"Select all that apply."}</span></div>`;
  } else {
    const total=opts.filter(o=>o.ok).length;
    const hit=q.order.filter(i=>opts[i].ok&&q.sel[i]).length;
    const extra=q.order.filter(i=>!opts[i].ok&&q.sel[i]).length;
    const perfect=hit===total&&extra===0;
    foot=`<div class="nscore ${perfect?"good":""}">${perfect?"All correct. ":""}You chose ${hit} of ${total} priorities${extra?` and ${extra} option${extra===1?"":"s"} that should not be selected`:""}.</div>
      <div class="submitrow">${nextBtn(p)}</div>`;
  }
  return `<div class="sata"><b class="sq">Nursing priorities</b>
    <p class="sp">Which actions are priorities for ${esc(p.name.split(" ")[0])}? Select all that apply.</p>
    <div class="nopts">${body}</div>${foot}</div>`;
}
function nextCase(p){
  const L=ORDERED(), i=L.indexOf(p);
  for(let k=1;k<=L.length;k++){ const q=L[(i+k)%L.length]; if(!S.cases[q.id].solved) return q; }
  return null;
}
function nextBtn(p){
  const nx=nextCase(p);
  return nx?`<button class="btn primary" id="next">Next patient →</button>`:`<button class="btn primary" id="next">All 12 solved. Back to case board</button>`;
}
render();
})();
</script>

</body></html>
