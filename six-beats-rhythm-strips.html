<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Six Beats Rhythm Strips</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: projected game board — team bay | clue board | team bay; stacks to teams-over-board on narrow screens. Single dark look by choice (projector-first). */
:root{
  --ink:#0c1a22; --panel:#13252e; --panel2:#183039; --line:#264550;
  --text:#eef5f2; --muted:#93acb0;
  --o2:#5fd3c6; --t1:#ff8a5c; --t2:#8fb0ff; --good:#5fd38c; --bad:#ff5f6d;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--text)}
body{font-family:var(--f-body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 20px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--o2);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.35}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px;max-width:1500px;margin:0 auto 14px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:clamp(24px,3vw,34px);letter-spacing:-.01em;margin:0;text-wrap:balance}
.brand h1 span{color:var(--o2)}
.brand small{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:7px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--o2);border-color:var(--o2);color:var(--ink);font-weight:700}

.stage{display:grid;grid-template-columns:minmax(190px,1fr) minmax(0,2.7fr) minmax(190px,1fr);grid-template-areas:"a board b";gap:16px;max-width:1500px;margin:0 auto}
@media (max-width:860px){.stage{grid-template-columns:1fr 1fr;grid-template-areas:"a b" "board board"}}

/* Team bays */
.team{grid-area:a;--tc:var(--t1);background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;transition:border-color .2s,box-shadow .2s}
.team.b{grid-area:b;--tc:var(--t2)}
.team.buzzed{border-color:var(--tc);box-shadow:0 0 0 4px color-mix(in srgb,var(--tc) 30%,transparent)}
.team.locked{opacity:.6}
.tname{width:100%;min-width:0;background:transparent;border:0;border-bottom:2px solid var(--tc);color:var(--tc);font-family:var(--f-display);font-weight:800;font-size:clamp(18px,2vw,24px);padding:2px 0 6px;text-align:center}
.score{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums;font-size:clamp(56px,8vw,112px);line-height:1;text-align:center;color:var(--text)}
.score.neg{color:var(--bad)}
.score.pop{animation:pop .45s ease}
@keyframes pop{40%{transform:scale(1.15)}}
.buzz{background:var(--tc);color:var(--ink);font-family:var(--f-display);font-weight:900;font-size:clamp(16px,1.7vw,20px);text-transform:uppercase;letter-spacing:.03em;padding:16px 10px;border-radius:12px}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.judge button{padding:14px 6px;border-radius:10px;font-weight:700;font-size:16px}
.ok{background:var(--good);color:var(--ink)}
.no{background:var(--bad);color:var(--ink)}
.status{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-align:center;color:var(--muted);min-height:1.4em}
.team.buzzed .status{color:var(--tc)}
.adj{display:flex;justify-content:center;gap:8px;margin-top:auto}
.adj button{font-family:var(--f-mono);font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 12px;color:var(--muted)}

/* Board */
.board{grid-area:board;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,2.2vw,28px);display:flex;flex-direction:column;gap:16px;min-width:0}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cat{font-family:var(--f-mono);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--o2);border:1px solid var(--o2);border-radius:6px;padding:5px 10px}
.count{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.wave{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;height:38px}
.wave svg{width:100%;height:100%;overflow:visible}
.wave path{fill:none;stroke:var(--line);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;transition:stroke .3s}
.wave .on path{stroke:var(--o2)}

.clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.clue{display:grid;grid-template-columns:2.2em 1fr;gap:12px;align-items:baseline;padding:10px 14px;border-radius:10px;background:var(--panel2);min-width:0}
.clue .n{font-family:var(--f-mono);font-weight:700;color:var(--o2);font-size:clamp(15px,1.4vw,18px)}
.clue .t{font-size:clamp(18px,1.9vw,26px);line-height:1.3;min-width:0}
.clue.hid{background:transparent;border:1px dashed var(--line)}
.clue.hid .n,.clue.hid .t{color:var(--line)}
.clue.fresh{animation:in .5s ease}
@keyframes in{from{transform:translateY(6px);background:color-mix(in srgb,var(--o2) 25%,var(--panel2))}}

.answer{border-radius:12px;padding:16px 18px;background:color-mix(in srgb,var(--o2) 14%,var(--panel2));border:2px solid var(--o2);display:flex;flex-direction:column;gap:6px}
.answer .lbl{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.answer .w{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,4vw,52px);line-height:1.05;text-wrap:balance}
.answer .p{color:var(--muted);font-size:clamp(15px,1.4vw,18px);max-width:65ch}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.primary{background:var(--o2);color:var(--ink);font-family:var(--f-display);font-weight:900;font-size:18px;text-transform:uppercase;letter-spacing:.03em;padding:14px 22px;border-radius:12px}
.ghost{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-weight:700;color:var(--text)}
.card{font-family:var(--f-mono);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
.win{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px 10px;--wc:var(--t1)}
.win.wb{--wc:var(--t2)}
.win .wl{font-family:var(--f-mono);font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--wc);font-size:clamp(16px,2vw,24px)}
.win h2{font-family:var(--f-display);font-weight:900;font-size:clamp(48px,9vw,140px);line-height:1;margin:0;color:var(--wc);text-wrap:balance;overflow-wrap:anywhere;animation:pop .7s ease}
.win .wf{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;margin:0;font-size:clamp(18px,2vw,26px);color:var(--muted)}
.win .wf b{font-family:var(--f-mono);color:var(--text)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
.keys{max-width:1500px;margin:14px auto 0;font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px}
.keys b{color:var(--text);font-weight:700;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.tossrow{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.tside{text-align:center;padding:clamp(18px,3vw,34px) 10px;border-radius:14px;border:3px solid var(--line);background:var(--panel2);font-family:var(--f-display);font-weight:900;font-size:clamp(22px,3vw,40px);min-width:0;overflow-wrap:anywhere;color:var(--muted);transition:all .08s}
.tside.ta.hi{border-color:var(--t1);color:var(--ink);background:var(--t1)}
.tside.tb.hi{border-color:var(--t2);color:var(--ink);background:var(--t2)}
.tvs{font-family:var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.tmsg{font-size:clamp(18px,2vw,24px);margin:0;text-align:center}
.tmsg strong{color:var(--o2)}
.pickhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pickhead h2{font-family:var(--f-display);font-weight:900;font-size:clamp(26px,3.4vw,44px);margin:0;text-wrap:balance}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.picks{grid-template-columns:1fr}}
.pickcat{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;text-align:left;padding:18px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);transition:border-color .15s}
.pickcat:hover:not(:disabled){border-color:var(--o2)}
.pickcat .pk{grid-row:1/3;font-family:var(--f-mono);font-weight:700;color:var(--o2);font-size:20px}
.pickcat .pn{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,2.2vw,28px);min-width:0}
.pickcat .pc{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.pickcat.any{border-style:dashed}
@media (min-width:861px){
  html,body{height:100%}
  body{display:flex;flex-direction:column}
  .stage{flex:1;min-height:0;width:100%}
  .top,.keys{width:100%}
  .board{min-height:0;overflow-y:auto}
  .team{min-height:0}
  .clues{flex:1;justify-content:space-evenly}
  .clue .t{font-size:clamp(18px,min(1.9vw,3.2vh),34px)}
  .score{font-size:clamp(56px,min(8vw,16vh),160px)}
}
@media (min-width:861px){.top,.stage,.keys{max-width:none}}
button.ck{outline:4px solid var(--text);outline-offset:3px;box-shadow:0 0 0 9px color-mix(in srgb,var(--o2) 40%,transparent);position:relative;z-index:1}
.board .controls{position:sticky;bottom:calc(-1 * clamp(16px,2.2vw,28px));background:var(--panel);padding-block:12px;margin-block:-12px;z-index:2}
@media (min-width:861px){
  .keys{flex-wrap:nowrap;overflow:hidden;white-space:nowrap}
  .board{gap:clamp(8px,1.6vh,16px)}
  .clue{padding-block:clamp(5px,1vh,10px)}
  .wave{height:clamp(24px,4vh,38px)}
  .answer{padding-block:clamp(10px,1.6vh,16px)}
  .answer .w{font-size:clamp(26px,min(4vw,6.5vh),52px)}
  .answer .p{font-size:clamp(14px,min(1.4vw,2.4vh),18px)}
  .board>*{flex-shrink:0}
  .board>.clues{flex:1 1 auto;min-height:0;overflow-y:auto}
  .clues.compact{gap:6px}
  .clues.compact .clue .t{font-size:clamp(15px,min(1.5vw,2.6vh),26px)}
}
.judge .wide{grid-column:1/-1}
.worth{font-family:var(--f-display);font-weight:800;font-size:clamp(16px,1.7vw,24px);display:flex;align-items:baseline;gap:6px}
.worth b{font-family:var(--f-mono);color:var(--o2);font-size:1.6em;line-height:1;font-variant-numeric:tabular-nums}
.timer{--p:1;width:clamp(110px,11vw,170px);aspect-ratio:1;max-width:100%;border-radius:50%;margin:4px auto 0;display:grid;place-content:center;text-align:center;position:relative;
  background:conic-gradient(var(--tc) calc(var(--p) * 360deg),var(--line) 0)}
.timer::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--panel)}
.timer b,.timer span{position:relative}
.timer b{font-family:var(--f-mono);font-weight:700;font-size:clamp(40px,4.5vw,68px);line-height:1;font-variant-numeric:tabular-nums}
.timer span{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.timer.low{--tc:var(--bad)}
.timer.low b{color:var(--bad);animation:pop .5s ease infinite}
.timer.out{background:var(--bad)}
.timer.out b,.timer.out span{color:var(--bad)}
.tgtrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tchip{font-family:var(--f-mono);font-size:14px;font-weight:700;padding:9px 14px;border-radius:999px;border:1px solid var(--line);color:var(--text)}
.tchip[aria-pressed="true"]{background:var(--o2);border-color:var(--o2);color:var(--ink)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.mode{display:flex;flex-direction:column;gap:8px;text-align:left;padding:clamp(18px,2.4vw,30px);border-radius:14px;background:var(--panel2);border:2px solid var(--line);transition:border-color .15s}
.mode:hover{border-color:var(--o2)}
.mode .mk{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--o2)}
.mode .mt{font-family:var(--f-display);font-weight:900;font-size:clamp(26px,3vw,40px);line-height:1.05}
.mode .md{color:var(--muted);font-size:clamp(15px,1.3vw,18px);line-height:1.45;max-width:46ch}
.guess{display:flex;gap:10px;flex-wrap:wrap}
.guess input{flex:1 1 240px;min-width:0;font:inherit;font-size:clamp(18px,1.8vw,24px);padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);color:var(--text)}
.guess input:focus{outline:none;border-color:var(--o2)}
.smsg{margin:0;color:var(--bad);font-weight:700;font-size:clamp(15px,1.4vw,19px)}
.team.solo{--tc:var(--o2)}
.team.solo .tname.as{display:block;text-align:center;font-family:var(--f-mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--o2);border-bottom:2px solid var(--o2);padding-bottom:8px}
.score .of{font-size:.4em;color:var(--muted)}
.meter{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--o2);border-radius:inherit;transition:width .4s}
.meter.low i{background:var(--bad)}
.win.ws{--wc:var(--o2)}
.missed{display:flex;flex-direction:column;gap:8px;align-items:center;max-width:640px}
.missed>span{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.missed ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.missed li{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-weight:700}
.stripbox{border-radius:10px;overflow:hidden;border:1px solid var(--line);flex-shrink:0;line-height:0}
.stripbox canvas{display:block;width:100%;max-width:100%}
.clues.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:700px){.clues.grid2{grid-template-columns:1fr}}
.clues.grid2 .clue{padding-block:8px}
.clues.grid2 .clue .t{font-size:clamp(15px,min(1.35vw,2.5vh),24px)!important;line-height:1.3}
.clues.grid2 .clue .t b{display:block;font-family:var(--f-mono);font-size:.62em;letter-spacing:.1em;text-transform:uppercase;color:var(--o2);font-weight:700}
.clues.grid2 .clue.hid .t b{color:var(--line)}
@media (min-width:861px){
  .board>.clues.grid2{flex:0 1 auto}
  .clues.grid2.compact{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .clues.grid2.compact .clue{padding:6px 10px;gap:8px}
  .clues.grid2.compact .clue .t{font-size:clamp(13px,min(1.05vw,2.1vh),19px)!important}
}
.done{text-align:center;padding:30px 10px;display:flex;flex-direction:column;gap:12px;align-items:center}
.done h2{font-family:var(--f-display);font-weight:900;font-size:clamp(26px,3vw,40px);margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top">
  <div class="brand"><h1>Six <span>Beats</span></h1><small>Rhythm strips · <span id="tgtlbl">first to 30 wins</span></small></div>
  <div class="chips" id="chips" role="group" aria-label="Category"></div>
</header>

<main class="stage">
  <section class="team a" id="teamA"></section>
  <section class="board" id="board" aria-live="polite"></section>
  <section class="team b" id="teamB"></section>
</main>

<div class="keys">
  <span><b>Clicker</b> ▶ press highlighted · ◀ move highlight</span><span><b>1</b>–<b>6</b> category</span><span><b>Space</b> next clue</span><span><b>Q</b> / <b>P</b> buzz left / right</span><span><b>C</b> correct / steal</span><span><b>X</b> wrong / missed steal</span><span><b>R</b> reveal</span><span><b>A</b> show all clues</span><span><b>N</b> next word</span><span><b>F</b> full screen</span><span><b>M</b> sound</span>
</div>

<script>
const DECK=[
{"c": "Sinus", "a": "Normal sinus rhythm", "r": "nsr", "p": "Know this one cold: rate 60–100, regular, one P for every QRS, PR 0.12–0.20, QRS under 0.12.", "k": ["<b>Rate</b> About 75 beats per minute.", "<b>Rhythm</b> Regular.", "<b>P waves</b> One upright P before every QRS, all alike.", "<b>PR interval</b> 0.16 seconds and constant.", "<b>QRS</b> Narrow, about 0.08 seconds.", "<b>Key feature</b> Every measurement is normal. All other strips are compared to this one."]},
{"c": "Sinus", "a": "Sinus bradycardia", "r": "sb", "p": "Treat the patient, not the monitor. If they’re symptomatic, atropine 1 mg IV is first.", "k": ["<b>Rate</b> About 45 beats per minute.", "<b>Rhythm</b> Regular.", "<b>P waves</b> One upright P before every QRS, all alike.", "<b>PR interval</b> 0.16 seconds and constant.", "<b>QRS</b> Narrow, about 0.08 seconds.", "<b>Key feature</b> Looks exactly like normal sinus rhythm, only slower than 60."]},
{"c": "Sinus", "a": "Sinus tachycardia", "r": "st", "p": "Find and treat the cause: fever, pain, anxiety, hypovolemia, or hypoxia.", "k": ["<b>Rate</b> About 120 beats per minute.", "<b>Rhythm</b> Regular.", "<b>P waves</b> One upright P before every QRS; they sit close to the T waves.", "<b>PR interval</b> 0.14 seconds and constant.", "<b>QRS</b> Narrow, about 0.08 seconds.", "<b>Key feature</b> Looks exactly like normal sinus rhythm, only faster than 100."]},
{"c": "Sinus", "a": "Sinus arrhythmia", "r": "sarr", "p": "Common and normal in children and young adults. Usually no treatment is needed.", "k": ["<b>Rate</b> Averages about 65–70 beats per minute.", "<b>Rhythm</b> Irregular. The R-R interval speeds up and slows down in a repeating pattern.", "<b>P waves</b> One upright P before every QRS, all alike.", "<b>PR interval</b> 0.16 seconds and constant.", "<b>QRS</b> Narrow, about 0.08 seconds.", "<b>Key feature</b> The rate rises with inspiration and falls with expiration."]},

  <div class="controls">
    ${S.res?`<button class="primary" data-a="next" data-ck="1">${S.mode==="solo"&&(S.solo.correct>=SOLO_GOAL||S.solo.bank<=0||!left().length)?"See results":"Next word"} →</button>${S.shown<6?`<button class="ghost" data-a="clue" data-ck="2">Show next clue</button><button class="ghost" data-a="allclues" data-ck="3">Show all clues</button>`:""}`
      :`<button class="primary" data-a="clue" data-ck="1" ${S.buzz||S.steal||S.shown>=6?"disabled":""}>${S.shown===0?"First clue":"Next clue"}</button>
        <button class="ghost" data-a="reveal" data-ck="4">Reveal answer</button>`}
  </div>`}`;
  freshClue=-1;lastPop=null;
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.mode){const n=S.names;S=fresh();S.names=n;if(t.dataset.mode==="solo")soloNew();else{S.mode="team";S.phase="toss"}save();render();return}
  if(t.dataset.solo){soloAct(t.dataset.solo);return}
  if(t.dataset.toss==="spin"){spin();return}
  if(t.dataset.toss==="go"&&S.tossWin){S.picker=S.tossWin;S.phase="pick";save();render();return}
  if(t.dataset.win==="new"){const n=S.names;S=fresh();S.names=n;save();render();return}
  if(t.dataset.win==="back"){S.phase=S.prev||"play";S.winner=null;save();render();return}
  if(t.id==="fs"){toggleFs();return}
  if(t.id==="snd"){setSound(!AU.on);return}
  if(t.dataset.target){S.target=+t.dataset.target;save();render();return}
  if(t.id==="newgame"){if(resetArm){const n=S.names;S=fresh();S.names=n;resetArm=false;save()}else{resetArm=true;setTimeout(()=>{resetArm=false;render()},4000)}render();return}
  if(t.dataset.pick){pick(t.dataset.pick==="*"?null:t.dataset.pick);return}
  if(t.dataset.swap){S.picker=S.picker==="A"?"B":"A";save();render();return}
  if(t.dataset.adj){const tm=t.dataset.t;S.scores[tm]+=+t.dataset.adj;lastPop=tm;if(S.res==="reveal"&&+t.dataset.adj>0)S.awarded=tm;if(+t.dataset.adj>0)checkWin(tm);save();render();return}
  if(t.dataset.a==="redeal"){S.used=[];S.phase="pick";save();render();return}
  if(t.dataset.a)act(t.dataset.a,t.dataset.t);
});
document.addEventListener("submit",e=>{if(e.target.id==="gform"){e.preventDefault();const g=$("guess");soloAct("guess",g?g.value:"")}});
const CK_FWD=["PageDown","ArrowRight","ArrowDown"],CK_BACK=["PageUp","ArrowLeft","ArrowUp"];
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"&&!["PageDown","PageUp"].includes(e.key))return;
  if(e.key==="F5"){e.preventDefault();return}
  if(CK_FWD.includes(e.key)){e.preventDefault();if(e.target.tagName==="INPUT")e.target.blur();const l=ckList();if(l[ckI])l[ckI].click();return}
  if(CK_BACK.includes(e.key)){e.preventDefault();if(e.target.tagName==="INPUT")e.target.blur();ckI++;ckPaint();return}const k=e.key.toLowerCase();
  if(k==="m"){setSound(!AU.on);return}
  if(S.phase==="toss"){if(k===" "||k==="enter"){e.preventDefault();if(S.tossWin&&k==="enter"){S.picker=S.tossWin;S.phase="pick";save();render()}else if(!S.tossWin)spin()}return}
  if(S.phase==="pick"){const i="123456".indexOf(k);if(i>=0&&left().length){const c=i===5?null:CATS[i];if(left(c).length)pick(c)}return}
  if(k===" "){e.preventDefault();act("clue")}
  else if(k==="q"||k==="1")act("buzz","A");
  else if(k==="p"||k==="2")act("buzz","B");
  else if(k==="c")act("right");
  else if(k==="x")act("wrong");
  else if(k==="r")act("reveal");
  else if(k==="a")act("allclues");
  else if(k==="f")toggleFs();
  else if(k==="n"&&S.res)act("next");
});

function start(data){
  S=data&&data.used&&data.n===DECK.length?data:null;
  if(!S){try{const s=JSON.parse(localStorage.getItem("sixstrips1"));if(s&&s.used&&s.n===DECK.length)S=s}catch(e){}}
  if(!S)S=fresh();
  render();
}
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
