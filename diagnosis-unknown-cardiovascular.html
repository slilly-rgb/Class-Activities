Plaque narrows a coronary artery. At rest, enough blood gets through; with exertion, demand outruns supply and the muscle becomes ischemic. Stable angina is predictable: brought on by exertion, cold, or a heavy meal, and relieved within minutes by rest or nitroglycerin. No muscle dies.","care":"Teach nitroglycerin use (sit down, 1 dose every 5 minutes, call 911 if not better after the first), risk-factor control (smoking, lipids, BP, diabetes), statins, aspirin, beta-blockers, and activity pacing.","nursing":[{"t":"Teach to sit down before taking sublingual nitroglycerin.","ok":true,"r":"Nitroglycerin can drop BP and cause dizziness or fainting."},{"t":"Call 911 if pain isn't better 5 minutes after one nitro dose.","ok":true,"r":"Pain that doesn't respond may be an MI."},{"t":"Store nitroglycerin in its original dark glass bottle.","ok":true,"r":"Light, heat, and moisture break it down."},{"t":"Take nitroglycerin with sildenafil for better effect.","ok":false,"r":"The combination can cause severe, life-threatening hypotension."},{"t":"Teach smoking cessation and a heart-healthy diet.","ok":true,"r":"Risk-factor control slows plaque progression."},{"t":"Stop the statin once cholesterol is normal.","ok":false,"r":"Statins also stabilize plaque; they're usually lifelong."},{"t":"Avoid all exercise for the rest of their life.","ok":false,"r":"Gradual, regular exercise improves the heart's efficiency."},{"t":"Take aspirin daily as prescribed.","ok":true,"r":"Aspirin lowers the chance of a clot forming on plaque."}]},{"id":"ua","name":"Unstable angina","normal":"Plaque in a coronary artery stays stable, covered by a thick cap.","broke":"A plaque cracks, and a partial clot forms. Blood flow drops even at rest. Angina becomes new, more frequent, longer, or occurs at rest, and it responds less to nitroglycerin. Troponin stays normal because muscle hasn't died yet, but the patient is one clot away from an MI. It's part of acute coronary syndrome.","care":"Treat as an emergency: continuous ECG monitoring, serial troponins, aspirin, anticoagulation (heparin), nitroglycerin, beta-blocker, oxygen if SpO₂ \u003c 90%, and early cardiac cath.","nursing":[{"t":"Put the patient on continuous cardiac monitoring.","ok":true,"r":"Ischemia can trigger dangerous rhythms and evolve into MI."},{"t":"Draw serial troponins as ordered.","ok":true,"r":"Rising troponin means the event has become an MI."},{"t":"Give aspirin and heparin as ordered.","ok":true,"r":"They limit clot growth on the ruptured plaque."},{"t":"Discharge home if the first troponin is normal.","ok":false,"r":"Troponin rises hours after injury; one normal value doesn't rule out MI."},{"t":"Get a 12-lead ECG during any episode of pain.","ok":true,"r":"Changes during pain show ischemia and guide treatment."},{"t":"Encourage walking the halls to test exercise tolerance.","ok":false,"r":"Exertion raises demand on an unstable artery."},{"t":"Give oxygen to keep SpO₂ at 100% regardless.","ok":false,"r":"Oxygen is for SpO₂ \u003c 90%; routine high oxygen gives no benefit."},{"t":"Prepare the patient for a cardiac catheterization.","ok":true,"r":"Early cath identifies and opens the narrowed artery."}]},{"id":"mi","name":"Myocardial infarction","normal":"Coronary arteries deliver continuous oxygen to the heart muscle.","broke":"A clot completely or nearly completely blocks a coronary artery. The muscle downstream becomes ischemic, then dies. Troponin rises. A STEMI (complete blockage) shows ST elevation in the leads facing the damaged area. Complications: dysrhythmias (VF), heart failure, cardiogenic shock, papillary muscle rupture, pericarditis.","care":"Time is muscle: 12-lead within 10 minutes, aspirin, nitroglycerin if BP allows, morphine for unrelieved pain, oxygen if hypoxemic, PCI within 90 minutes (or fibrinolytics within 30), and monitoring for complications.","nursing":[{"t":"Get a 12-lead ECG within 10 minutes of arrival.","ok":true,"r":"STEMI recognition starts the clock for reperfusion."},{"t":"Give chewable aspirin as ordered.","ok":true,"r":"Aspirin blocks platelets from adding to the clot."},{"t":"Prepare for PCI within 90 minutes of arrival.","ok":true,"r":"Opening the artery fast saves heart muscle."},{"t":"Give nitroglycerin even if the BP is 84/50.","ok":false,"r":"Nitrates can cause profound hypotension; hold for systolic BP \u003c 90."},{"t":"Watch the monitor closely for VF and VT.","ok":true,"r":"Lethal dysrhythmias are the leading cause of early death after MI."},{"t":"Give an IM injection for pain.","ok":false,"r":"IM injections raise CK and are risky with fibrinolytics; use IV."},{"t":"Hold all pain medicine until the cath is done.","ok":false,"r":"Pain raises oxygen demand; morphine is given for unrelieved pain."},{"t":"Check for bleeding at the cath access site.","ok":true,"r":"Anticoagulants and the arterial puncture raise bleeding risk."}]}],"tests":[{"id":"trop","cat":"labs","name":"Troponin I (serial ×3)","el":false,"normal":{"t":"\u003c 0.01, \u003c 0.01, \u003c 0.01 ng/mL (all normal).","ro":["mi"],"s":"Serial troponins normal"}},{"id":"lipid","cat":"labs","name":"Lipid panel","el":false,"normal":{"t":"Total cholesterol 172, LDL 92, HDL 54, triglycerides 128 mg/dL.","ro":[],"s":null}},{"id":"cbc","cat":"labs","name":"CBC","el":false,"normal":{"t":"Hgb 14.2 g/dL. WBC 7.4 K/µL. Platelets 236 K/µL.","ro":[],"s":null}},{"id":"bmp","cat":"labs","name":"Basic metabolic panel","el":false,"normal":{"t":"Normal electrolytes and kidney function. Glucose 98 mg/dL.","ro":[],"s":null}},{"id":"a1c","cat":"labs","name":"Hemoglobin A1C","el":false,"normal":{"t":"5.4% (normal).","ro":[],"s":null}},{"id":"ecg","cat":"diag","name":"12-lead ECG (at rest)","el":false,"normal":{"t":"Normal sinus rhythm. No ST changes or Q waves.","ro":["mi"],"s":"No ST changes at rest"}},{"id":"stress","cat":"diag","name":"Exercise stress test","el":true,"normal":{"t":"Exercised 12 minutes. No chest pain. No ST changes.","ro":["cad"],"s":"Normal stress test"}}, es.","ro":[],"s":null},{"t":"Grass clippings on his shoes and pants.","ro":[],"s":null},{"t":"Old tattoo on the left upper arm.","ro":[],"s":null}],"tests":{"ecg":{"t":"ST elevation of 4 mm in V1–V4 with reciprocal ST depression in II, III, and aVF.","ro":["ua","cad"],"s":"ST elevation (STEMI)","sup":true},"trop":{"t":"0.8 ng/mL, rising to 14.2 ng/mL at 3 hours.","ro":["ua","cad"],"s":"Rising troponin (muscle death)","sup":true},"cath":{"t":"100% blockage of the proximal left anterior descending artery by a clot.","ro":[],"s":null,"sup":true},"echo":{"t":"Front wall of the LV barely moves. EF 35%.","ro":[],"s":null},"bmp":{"t":"K 3.8 mEq/L.","ro":[],"s":null}},"clues":"Crushing pain for 45 minutes unrelieved by rest or nitro, ST elevation in V1–V4, rising troponin, and a blocked LAD: anterior STEMI. Note the recent sildenafil: no more nitrates."}]},{"id":"vascular","name":"Vascular","sub":"Arteries & veins","color":"#62a8f0","blurb":"Problems of the arteries, the aorta, and the deep veins.","hint":"Ask whether the problem is arterial (narrowing, high pressure, a weak or torn wall) or venous (a clot), and whether it's chronic or sudden.","dx":[{"id":"athero","name":"Atherosclerosis: carotid artery disease","normal":"Arteries have a smooth, flexible lining that lets blood flow freely.","broke":"LDL cholesterol gets into a damaged artery wall and triggers inflammation; fatty plaque builds up and hardens. In the carotid arteries, plaque narrows the vessel and can send small clots or debris to the brain: a TIA (symptoms that resolve within minutes to hours) is a warning of stroke.","care":"Risk-factor control (statin, BP, glucose, smoking), antiplatelet therapy, stroke-warning teaching, and carotid endarterectomy or stenting for severe narrowing. After endarterectomy: neuro checks, BP control, airway and neck swelling.","nursing":[{"t":"Teach stroke warning signs (BE-FAST) and to call 911.","ok":true,"r":"A TIA is a warning; a stroke may follow within days."},{"t":"Give a statin and an antiplatelet as ordered.","ok":true,"r":"They stabilize plaque and lower the chance of clots."},{"t":"Teach smoking cessation and BP control.","ok":true,"r":"Both slow plaque growth and lower stroke risk."},{"t":"Teach that a TIA is harmless because it went away.","ok":false,"r":"A TIA signals a high short-term stroke risk."},{"t":"After endarterectomy, check neuro status and neck swelling.","ok":true,"r":"Watch for stroke and a hematoma that could block the airway."},{"t":"Encourage a high-saturated-fat diet for energy.","ok":false,"r":"Saturated fat raises LDL and worsens plaque."},{"t":"Massage the neck over the carotid to improve flow.","ok":false,"r":"Pressure on a plaque-filled carotid can dislodge debris or slow the heart."},{"t":"Check blood pressure in both arms.","ok":true,"r":"A large difference may mean narrowing in an arm artery."}]},{"id":"htn","name":"Hypertension / hypertensive crisis","normal":"The body keeps blood pressure under about 120/80 by balancing heart output, vessel tone, and fluid volume.","broke":"Pressure stays high (≥ 130/80), damaging the heart, brain, kidneys, eyes, and vessels over years. In a hypertensive crisis (often ≥ 180/120), pressure rises fast. With organ damage (headache, confusion, vision changes, chest pain, kidney injury, papilledema), it's a hypertensive emergency.","care":"Hypertensive emergency: ICU, IV antihypertensives (nicardipine, labetalol), lower MAP by no more than about 25% in the first hour, frequent neuro and BP checks. Chronic: lifestyle changes, medication adherence, home BP monitoring.","nursing":[{"t":"Lower MAP by no more than 25% in the first hour.","ok":true,"r":"Dropping too fast can cause stroke, MI, or kidney injury."},{"t":"Give IV nicardipine or labetalol as ordered.","ok":true,"r":"IV drugs allow controlled, titratable lowering in an emergency."},{"t":"Check BP every 5–15 minutes and do neuro checks.","ok":true,"r":"Close monitoring catches overshoot and brain changes."},{"t":"Bring the BP to 120/80 within 30 minutes.","ok":false,"r":"Rapid normalization can cause brain and heart ischemia."},{"t":"Teach to take BP medicines even when feeling well.","ok":true,"r":"Hypertension is usually silent; stopping meds causes crises."},{"t":"Recommend decongestants for the headache.","ok":false,"r":"Decongestants raise BP."},{"t":"Teach a low-sodium (DASH) diet and limited alcohol.","ok":true,"r":"Both lower BP."},{"t":"Teach that a single normal reading means stop medications.","ok":false,"r":"BP needs ongoing control; the provider decides on changes."}]},{"id":"pad","name":"Peripheral artery disease","normal":"Leg arteries deliver more blood when muscles work harder.","broke":"Atherosclerotic plaque narrows the leg arteries. With walking, the muscles can't get enough blood: cramping calf pain that eases with rest (intermittent claudication). Signs: weak or absent pulses, cool, pale, shiny, hairless skin, thick nails, slow healing, and pain at rest or ulcers on the toes in severe disease.","care":"Supervised walking program, smoking cessation, antiplatelet and statin, foot care, keeping legs in a dependent position for comfort, and revascularization for severe disease.","nursing":[{"t":"Encourage a walking program: walk until pain, rest, repeat.","ok":true,"r":"Regular walking builds collateral circulation."},{"t":"Teach daily foot inspection and careful nail care.","ok":true,"r":"Poor blood flow makes small wounds slow to heal."},{"t":"Help the patient quit smoking.","ok":true,"r":"Nicotine narrows vessels and speeds plaque growth."},{"t":"Elevate the legs above the heart to relieve pain.","ok":false,"r":"Elevation reduces arterial flow; dangling the legs helps."},{"t":"Apply a heating pad to warm cold feet.","ok":false,"r":"Reduced sensation and blood flow make burns likely."},{"t":"Give cilostazol, antiplatelets, and statins as ordered.","ok":true,"r":"They improve walking distance and reduce cardiovascular events."},{"t":"Apply compression stockings to improve circulation.","ok":false,"r":"Compression can further limit arterial flow."},{"t":"Report a cold, pale, painful leg right away.","ok":true,"r":"This can mean acute arterial occlusion."}]},{"id":"aaa","name":"Abdominal aortic aneurysm","normal":"The abdominal aorta is about 2 cm wide with strong, elastic walls.","broke":"The aortic wall weakens (atherosclerosis, smoking, high BP, age, male sex, family history) and balloons out. Most aneurysms grow slowly without symptoms; some cause back or belly pain or a pulsating mass. Rupture causes sudden severe back or flank pain, hypotension, and shock; mortality is very high.","care":"Control BP and smoking, monitor size with ultrasound, and plan repair (endovascular or open) for aneurysms ≥ 5.5 cm or growing fast. Teach rupture warning signs. Don't palpate deeply.","nursing":[{"t":"Keep BP controlled as ordered.","ok":true,"r":"High pressure stretches the weakened wall."},{"t":"Teach to report sudden back, belly, or flank pain.","ok":true,"r":"This can mean the aneurysm is leaking or rupturing."},{"t":"Prepare the patient for planned repair.","ok":true,"r":"Aneurysms ≥ 5.5 cm usually need repair."},{"t":"Palpate the mass firmly to measure its size.","ok":false,"r":"Deep palpation can cause rupture; imaging measures size."},{"t":"Help the patient stop smoking.","ok":true,"r":"Smoking speeds aneurysm growth."},{"t":"Encourage heavy lifting to strengthen the core.","ok":false,"r":"Straining spikes BP and stresses the wall."},{"t":"After repair, check pulses and urine output.","ok":true,"r":"Clots or graft problems can block flow to the legs or kidneys."},{"t":"Teach that the aneurysm will shrink with exercise.","ok":false,"r":"Aneurysms don't shrink; they're monitored or repaired."}]},{"id":"dissect","name":"Aortic dissection","normal":"The aortic wall has three layers bonded together, and blood flows only through the central channel.","broke":"A tear in the inner layer lets blood split the wall and form a false channel. Sudden, severe 'tearing' or 'ripping' pain in the chest or between the shoulder blades. Different BP in each arm, pulse deficits, stroke symptoms, aortic regurgitation, or tamponade can follow. Type A (ascending aorta) needs emergency surgery.","care":"Lower HR and BP quickly (IV beta-blocker first, then vasodilator as ordered) to a systolic goal around 100–120 and HR ≤ 60, opioids for pain, and emergency surgery for type A. Avoid anticoagulants and thrombolytics.","nursing":[{"t":"Give an IV beta-blocker first, as ordered.","ok":true,"r":"Lowering HR and the force of each beat slows the tear."},{"t":"Keep systolic BP around 100–120 as ordered.","ok":true,"r":"Lower pressure reduces stress on the torn wall."},{"t":"Check BP in both arms and compare pulses.","ok":true,"r":"A difference shows branch vessels are affected."},{"t":"Give heparin and thrombolytics as for an MI.","ok":false,"r":"Anticoagulants can cause fatal bleeding into the dissection."},{"t":"Give IV opioids for pain as ordered.","ok":true,"r":"Pain control lowers sympathetic surges in HR and BP."},{"t":"Give a vasodilator before any beta-blocker.","ok":false,"r":"Vasodilators alone cause reflex tachycardia that extends the tear."},{"t":"Prepare for emergency surgery for a type A dissection.","ok":true,"r":"Ascending dissections can rupture or cause tamponade quickly."},{"t":"Encourage the patient to walk to relieve back pain.","ok":false,"r":"Activity raises BP and HR."}]},{"id":"dvt","name":"Deep vein thrombosis","normal":"Blood flows steadily through the deep leg veins, helped by calf-muscle pumping and one-way valves.","broke":"Virchow's triad (stasis, vessel injury, hypercoagulability) causes a clot in a deep vein, usually in the calf or thigh. One leg swells, aches, and is warm and red. The clot can break off and travel to the lungs (PE).","care":"Anticoagulation (heparin, LMWH, or a DOAC), bleeding precautions, monitoring for PE, early walking once anticoagulated (as ordered), and preven n shooting to between his shoulder blades.","ro":["athero","pad","dvt"],"s":"Sudden tearing pain","sup":true},{"t":"Has uncontrolled hypertension; skips his medicines.","ro":[],"s":null},{"t":"Uses cocaine on weekends.","ro":[],"s":null},{"t":"Is 6 ft 4 in tall with long arms and fingers.","ro":[],"s":null},{"t":"Allergic to penicillin.","ro":[],"s":null},{"t":"Works in a warehouse.","ro":[],"s":null}],"vitals":[{"t":"Temp 98.6 °F (37.0 °C)","ro":[],"s":null},{"t":"HR 112 bpm","ro":[],"s":null},{"t":"RR 24/min","ro":[],"s":null},{"t":"BP 186/104 (right arm); 138/78 (left arm) mmHg","ro":[],"s":null},{"t":"SpO₂ 96% on room air","ro":[],"s":null}],"physical":[{"t":"Systolic BP 48 mmHg higher in the right arm than the left; weak left radial pulse.","ro":["htn","aaa","vte"],"s":"Unequal BP and pulses in the arms","sup":true},{"t":"New soft diastolic murmur at the right upper sternal border.","ro":[],"s":null},{"t":"Pale and sweaty; anxious.","ro":[],"s":null},{"t":"No leg swelling.","ro":["dvt"],"s":"No leg swelling"},{"t":"Abrasion on the right palm from the box.","ro":[],"s":null},{"t":"Wearing a back support belt for work.","ro":[],"s":null}],"tests":{"cta":{"t":"Flap in the ascending aorta extending into the arch and down the descending aorta (Stanford type A). Abdominal aorta normal width.","ro":["aaa"],"s":"Dissection flap; no aneurysm","sup":true},"cxr":{"t":"Widened mediastinum.","ro":[],"s":null},"ecg":{"t":"Sinus tachycardia. LVH. No ST elevation.","ro":[],"s":null},"trop":{"t":"\u003c 0.01 ng/mL (normal).","ro":[],"s":null},"ddimer":{"t":"6.8 µg/mL FEU (high).","ro":[],"s":null},"ctpa":{"t":"No pulmonary embolism.","ro":["vte"],"s":"No clot in the lungs"}},"clues":"Uncontrolled HTN and cocaine, sudden tearing pain to the back, unequal arm BPs, new aortic regurgitation murmur, widened mediastinum, and a type A dissection flap. Beta-blocker first; no anticoagulants."},{"id":"v-dvt","dx":"dvt","acute":true,"variant":"Swollen leg after a long road trip","name":"Megan Doyle","age":34,"sex":"F","setting":"Urgent Care","summary":"Her left calf has been swollen, warm, and achy for 2 days, since she drove 10 hours to visit family.","history":[{"t":"Left calf swollen, warm, and aching for 2 days after a 10-hour drive.","ro":["pad"],"s":"One swollen, warm leg after prolonged sitting","sup":true},{"t":"Takes an estrogen birth control pill; smokes.","ro":[],"s":null},{"t":"No shortness of breath or chest pain.","ro":["vte"],"s":"No dyspnea or chest pain"},{"t":"No pain that gets better when she stops walking.","ro":["pad"],"s":"No claudication"},{"t":"Runs 3 miles twice a week.","ro":[],"s":null},{"t":"Allergic to cats.","ro":[],"s":null},{"t":"Had her tonsils out as a child.","ro":[],"s":null}],"vitals":[{"t":"Temp 99.2 °F (37.3 °C)","ro":[],"s":null},{"t":"HR 88 bpm","ro":[],"s":null},{"t":"RR 16/min","ro":[],"s":null},{"t":"BP 118/74 mmHg","ro":[],"s":null},{"t":"SpO₂ 99% on room air","ro":[],"s":null}],"physical":[{"t":"Left calf 4 cm larger than the right; warm, red, tender along the deep veins.","ro":["pad"],"s":"Unilateral calf swelling and tenderness","sup":true},{"t":"Strong pedal pulses; feet warm.","ro":["pad"],"s":"Normal arterial pulses"},{"t":"Lungs clear.","ro":["vte"],"s":"Clear lungs"},{"t":"Small tattoo on the right ankle.","ro":[],"s":null},{"t":"A few small shaving nicks on both shins.","ro":[],"s":null}],"tests":{"venous":{"t":"Clot in the left popliteal and posterior tibial veins.","ro":[],"s":null,"sup":true},"ddimer":{"t":"2.4 µg/mL FEU (high).","ro":[],"s":null,"sup":true},"ctpa":{"t":"No pulmonary embolism.","ro":["vte"],"s":"No clot in the lungs"},"abi":{"t":"Normal both legs.","ro":[],"s":null}},"clues":"Long car ride, estrogen, smoking (Virchow's triad), one swollen, warm, tender calf, high D-dimer, and a clot on duplex: DVT without PE."},{"id":"v-vte","dx":"vte","acute":true,"variant":"Cancer patient, sudden breathlessness","name":"Harriet Simms","age":63,"sex":"F","setting":"Oncology Unit","summary":"On chemotherapy for pancreatic cancer. She suddenly became short of breath while getting out of bed and has sharp pain on the right when she breathes in.","history":[{"t":"Sudden shortness of breath and sharp right-sided chest pain on breathing in.","ro":["athero","pad","aaa"],"s":"Sudden dyspnea with pleuritic pain","sup":true},{"t":"Pancreatic cancer on chemotherapy; in bed most of the past week.","ro":[],"s":null},{"t":"No tearing pain or pain moving to the back.","ro":["dissect"],"s":"No tearing pain"},{"t":"Feels anxious, 'like something is wrong.'","ro":[],"s":null},{"t":"Takes ondansetron before chemo.","ro":[],"s":null},{"t":"Her husband is a retired teacher.","ro":[],"s":null},{"t":"Has a port in her left chest.","ro":[],"s":null}],"vitals":[{"t":"Temp 99.6 °F (37.6 °C)","ro":[],"s":null},{"t":"HR 118 bpm","ro":[],"s":null},{"t":"RR 28/min","ro":[],"s":null},{"t":"BP 112/70 mmHg","ro":[],"s":null},{"t":"SpO₂ 88% on room air","ro":[],"s":null}],"physical":[{"t":"Anxious, breathing fast.","ro":[],"s":null},{"t":"Legs equal size, not tender or swollen.","ro":["dvt"],"s":"No leg swelling"},{"t":"BP equal in both arms.","ro":["dissect"],"s":"Equal BP in arms"},{"t":"Lungs clear.","ro":[],"s":null},{"t":"Port site clean and dry.","ro":[],"s":null},{"t":"Thinning hair.","ro":[],"s":null}],"tests":{"ctpa":{"t":"Clots in the right lower lobe and left upper lobe pulmonary arteries.","ro":[],"s":null,"sup":true},"ddimer":{"t":"5.2 µg/mL FEU (high).","ro":[],"s":null,"sup":true},"abg":{"t":"pH 7.48, PaCO₂ 31 mmHg, PaO₂ 58 mmHg.","ro":[],"s":null,"sup":true},"venous":{"t":"No clot remaining in either leg.","ro":["dvt"],"s":"No DVT on duplex"},"ecg":{"t":"Sinus tachycardia at 118.","ro":[],"s":null},"cta":{"t":"Normal aorta.","ro":[],"s":null}},"clues":"Cancer, chemotherapy, and bed rest (hypercoagulable and stasis), sudden dyspnea, pleuritic pain, tachycardia, hypoxemia with respiratory alkalosis, and clots on CTPA: pulmonary embolism."}]},{"id":"heme","name":"Hematologic","sub":"Blood & clotting","color":"#e87fa6","blurb":"Problems with red cells, white cells, platelets, clotting, and transfused blood.","hint":"Ask which cell line is off (red cells, white cells, platelets, or all), whether the problem is making them, losing them, or destroying them, and whether clotting studies are normal.","dx":[{"id":"scd","name":"Sickle cell disease (crisis)","normal":"Red blood cells are soft, round discs that bend to squeeze through capillaries and live about 120 days.","broke":"Two copies of the sickle gene make hemoglobin S. When oxygen drops (dehydration, infection, cold, high altitude, stress), it stiffens the cells into sickles. They block small vessels (vaso-occlusive crisis: severe pain, organ damage) and break down early (chronic hemolytic anemia). Acute chest syndrome, stroke, splenic sequestration, and infection are major dangers.","care":"Fast, scheduled pain control (often IV opioids, no meperidine), IV and oral hydration, oxygen if hypoxemic, incentive spirometry, watching for acute chest syndrome and stroke, and teaching triggers to avoid. Long term: hydroxyurea, vaccines, folic acid.","nursing":[{"t":"Give IV opioids promptly and on a schedule as ordered.","ok":true,"r":"Pain from vaso-occlusion is severe; delays worsen suffering and stress."},{"t":"Give IV fluids and encourage oral fluids.","ok":true,"r":"Hydration thins the blood and reduces sickling."},{"t":"Encourage incentive spirometry every hour while awake.","ok":true,"r":"Deep breathing helps prevent acute chest syndrome."},{"t":"Apply ice packs to the painful joints.","ok":false,"r":"Cold causes vasoconstriction and more sickling; use warmth."},{"t":"Report chest pain, fever, or new breathlessness.","ok":true,"r":"These suggest acute chest syndrome, a leading cause of death."},{"t":"Give meperidine (Demerol) for the pain.","ok":false,"r":"Its metabolite can cause seizures; it's avoided in sickle cell."},{"t":"Teach to avoid high altitudes and dehydration.","ok":true,"r":"Low oxygen and dehydration trigger crises."},{"t":"Assume pain behaviors mean drug-seeking.","ok":false,"r":"Undertreatment is common and harmful; believe and treat the pain."}]},{"id":"ida","name":"Iron-deficiency anemia","normal":"The marrow uses iron to make hemoglobin; iron lost each day is replaced through diet.","broke":"Iron is lost (heavy periods, GI bleeding) or not taken in or absorbed (diet, pregnancy, celiac disease, gastric surgery). Without enough iron, the marrow makes small, pale cells (microcytic, hypochromic). Fatigue, pallor, breathlessness on exertion, pica (craving ice or dirt), spoon-shaped nails, and a sore tongue.","care":"Find and treat the cause of loss, oral iron with vitamin C on an empty stomach (or IV iron), iron-rich foods, and teaching about side effects.","nursing":[{"t":"Teach to take oral iron with vitamin C on an empty stomach.","ok":true,"r":"Vitamin C and an acidic stomach improve absorption."},{"t":"Warn that stools will turn dark green or black.","ok":true,"r":"This is expected and not a sign of bleeding by itself."},{"t":"Encourage iron-rich foods (red meat, beans, leafy greens).","ok":true,"r":"Diet helps maintain iron stores."},{"t":"Teach to take iron with milk to protect the stomach.","ok":false,"r":"Calcium and dairy block iron absorption."},{"t":"Encourage fiber and fluids for constipation.","ok":true,"r":"Constipation is a common side effect of iron."},{"t":"Teach to stop iron once the fatigue improves.","ok":false,"r":"Iron is continued for months to rebuild stores."},{"t":"Give liquid iron through a straw.","ok":true,"r":"A straw prevents tooth staining."},{"t":"Take iron with antacids for better tolerance.","ok":false,"r":"Antacids reduce stomach acid and iron absorption."}]},{"id":"dic","name":"Disseminated intravascular coagulation","normal":"Clotting and clot breakdown stay balanced and local, only where a vessel is injured.","broke":"A major trigger (sepsis, obstetric emergencies, trauma, cancer) turns on clotting throughout the body. Tiny clots block small vessels (organ damage), and clotting factors and platelets get used up, so the patient also bleeds: oozing from IV sites, gums, and wounds, petechiae, and blood in urine. Labs: low platelets and fibrinogen, prolonged PT/PTT, high D-dimer, schistocytes.","care":"Treat the cause, replace what's used up (platelets, FFP, cryoprecipitate) as ordered, bleeding precautions, organ monitoring, and gentle care.","nursing":[{"t":"Treat the underlying cause as ordered.","ok":true,"r":"DIC continues until the trigger is controlled."},{"t":"Give platelets, plasma, and cryoprecipitate as ordered.","ok":true,"r":"These replace the consumed clotting factors and platelets."},{"t":"Apply pressure to puncture sites for at least 5 minutes.","ok":true,"r":"Low platelets and factors prolong bleeding."},{"t":"Give IM injections for pain control.","ok":false,"r":"IM injections can cause large hematomas."},{"t":"Monitor for organ damage (urine output, mental status).","ok":true,"r":"Microclots can injure the kidneys, brain, and lungs."},{"t":"Use a firm toothbrush to remove the bloody crust.","ok":false,"r":"A firm brush causes more gum bleeding; use soft swabs."},{"t":"Take rectal temperatures for accuracy.","ok":false,"r":"Rectal thermometers can cause bleeding."},{"t":"Check for new petechiae, oozing, and blood in urine.","ok":true,"r":"These track the bleeding side of DIC."}]},{"id":"txr","name":"Blood transfusion reaction","normal":"Donor cells matched to the recipient's ABO and Rh type circulate without being attacked.","broke":"The recipient's immune system reacts to the transfused blood. In an acute hemolytic reaction (usually ABO mismatch from an identification error), antibodies destroy donor cells within minutes: fever, chills, back or flank pain, low BP, dark urine, and kidney injury. Other types: febrile, allergic, anaphylactic, TRALI, TACO.","care":"Stop the transfusion, keep the IV open with normal saline through new tubing, notify the provider and blood bank, send the bag and tubing back, draw blood and urine samples, and monitor vitals and urine output.","nursing":[{"t":"Stop the transfusion immediately.","ok":true,"r":"Every milliliter of mismatched blood worsens the reaction."},{"t":"Keep the IV open with normal saline using new tubing.","ok":true,"r":"IV access is needed for treatment; new tubing avoids giving more blood."},{"t":"Return the bag and tubing to the blood bank.","ok":true,"r":"The lab needs them to investigate the reaction."},{"t":"Slow the rate and continue the transfusion.","ok":false,"r":"Any suspected reaction means stopping, not slowing."},{"t":"Monitor urine output and send a urine sample.","ok":true,"r":"Free hemoglobin can damage the kidneys."},{"t":"Flush the blood tubing with dextrose 5% in water.","ok":false,"r":"D5W causes red cells to hemolyze; only normal saline is used."},{"t":"Discard the bag to prevent contamination.","ok":false,"r":"The bag is evidence and must be returned."},{"t":"Recheck patient ID against the unit with a second nurse.","ok":true,"r":"Identification errors cause most hemolytic reactions."}]},{"id":"cml","name":"Chronic myeloid leukemia","normal":"The marrow makes white cells in controlled numbers and they mature before release.","broke":"A swap between chromosomes 9 and 22 (the Philadelphia chromosome) creates the BCR-ABL gene, which drives uncontrolled growth of myeloid cells. The WBC count climbs very high with cells at every stage. Symptoms: fatigue, weight loss, night sweats, early fullness from a large spleen. Without treatment, it can transform to an acute blast crisis.","care":"Tyrosine kinase inhibitors (imatinib) taken exactly as prescribed, monitoring of counts and BCR-ABL levels, infection and bleeding precautions, spleen protection, and nutrition support.","nursing":[{"t":"Teach to take imatinib every day exactly as prescribed.","ok":true,"r":"Missed doses let resistant leukemia cells grow."},{"t":"Teach to avoid contact sports while the spleen is enlarged.","ok":true,"r":"A blow could rupture the spleen."},{"t":"Offer small, frequent meals.","ok":true,"r":"The enlarged spleen presses on the stomach, causing early fullness."},{"t":"Teach that a high WBC means strong protection from infection.","ok":false,"r":"The cells don't work normally; infection risk is still high."},{"t":"Monitor CBC results and report signs of infection.","ok":true,"r":"Counts guide treatment and reveal complications."},{"t":"Stop imatinib once the WBC is normal.","ok":false,"r":"Treatment continues long term to keep the leukemia in remission."},{"t":"Teach to report fluid retention and swelling.","ok":true,"r":"Edema is a common imatinib side effect."},{"t":"Encourage grapefruit juice with each dose.","ok":false,"r":"Grapefruit raises imatinib levels and toxicity."}]},{"id":"pv","name":"Polycythemia vera","normal":"The marrow makes red cells only when the kidneys signal low oxygen with erythropoietin (EPO).","broke":"A JAK2 mutation lets the marrow make red cells (and often white cells and platelets) on its own. The blood becomes thick: headaches, dizziness, ruddy face, itching after a warm shower, burning hands, high BP, an enlarged spleen, and high risk of clots (stroke, MI, DVT). EPO is low because the body tries to shut production off.","care":"Regular phlebotomy to keep Hct under 45%, low-dose aspirin, hydroxyurea for high-risk patients, hydration, and clot warning-sign teaching.","nursing":[{"t":"Assist with phlebotomy as ordered.","ok":true,"r":"Removing blood lowers Hct and thickness quickly."},{"t":"Encourage 2–3 liters of fluid a day.","ok":true,"r":"Hydration reduces blood thickness and clot risk."},{"t":"Teach signs of stroke, MI, and DVT.","ok":true,"r":"Thick blood raises the risk of clots in arteries and veins."},{"t":"Teach to take iron supplements to prevent fatigue.","ok":false,"r":"Iron fuels more red cell production."},{"t":"Give low-dose aspirin as ordered.","ok":true,"r":"Aspirin reduces clot risk."},{"t":"Recommend hot baths to ease the itching.","ok":false,"r":"Heat makes the itching worse; use lukewarm water."},{"t":"Encourage moving and avoiding long sitting.","ok":true,"r":"Activity reduces venous stasis and clots."},{"t":"Restrict fluids to lower blood volume.","ok":false,"r":"Dehydration thickens the blood further."}]},{"id":"itp","name":"Immune thrombocytopenia (ITP)","normal":"Platelets live 7–10 days and plug small vessel injuries.","broke":"The immune system makes antibodies against the body's own platelets, and the spleen destroys them. In children, it often follows a viral illness and is usually short-lived. The platelet count drops very low while the rest of the CBC is normal: petechiae, bruising, nosebleeds, gum bleeding. The biggest danger is bleeding in the brain.","care":"Bleeding precautions, corticosteroids or IVIG as ordered, platelet transfusion only for serious bleeding, avoiding aspirin and NSAIDs, and avoiding contact sports. Many children recover within weeks to months.","nursing":[{"t":"Teach to avoid aspirin and ibuprofen.","ok":true,"r":"They interfere with platelet function and raise bleeding risk."},{"t":"Use a soft toothbrush and pad the crib or bed rails.","ok":true,"r":"These prevent gum bleeding and bruising."},{"t":"Teach to avoid contact sports until counts recover.","ok":true,"r":"A head injury could cause bleeding in the brain."},{"t":"Give IVIG or steroids as ordered.","ok":true,"r":"They slow platelet destruction and raise counts."},{"t":"Give platelets routinely for the low count.","ok":false,"r":"Transfused platelets are destroyed quickly; they're for serious bleeding."},{"t":"Encourage tackle football to stay active.","ok":false,"r":"Contact sports risk serious bleeding."},{"t":"Take rectal temperatures in the young child.","ok":false,"r":"Rectal thermometers can cause bleeding."},{"t":"Teach signs of a head bleed (headache, vomiting).","ok":true,"r":"Bleeding in the brain is the most serious risk."}]}]," <script>
(function(){
const START_TOKENS = 15;
const KEY = "cm-du-cv-casebook-v2";
const PER = 1;
const DEFAULT_MODE = "mystery";
const SHOW_DX = false;
const CMAP = Object.fromEntries(CATS.map(c=>[c.id,c]));
CATS.forEach(c=>{ c.DXMAP=Object.fromEntries(c.dx.map(d=>[d.id,d])); c.TMAP=Object.fromEntries(c.tests.map(t=>[t.id,t])); c.cases.forEach(p=>p.cat=c.id); });
const ALL = CATS.flatMap(c=>c.cases);
const PMAP = Object.fromEntries(ALL.map(p=>[p.id,p]));
const DEFERRED = {t:"Deferred. This test isn't appropriate for an unstable, acute patient. Think about what this patient needs right now.", ro:[], deferred:true};
const BASE_TABS = [
  {id:"history", name:"Patient History", kind:"bulk"},
  {id:"vitals", name:"Vital Signs", kind:"bulk"},
  {id:"physical", name:"Physical Assessment", kind:"bulk"},
  {id:"labs", name:"Labs", kind:"test"},
  {id:"diag", name:"Diagnostics", kind:"test"},
  {id:"img", name:"Imaging", kind:"test"},
  {id:"dx", name:"Diagnosis", kind:"dx"}
];

function tabsFor(cat){ if(!cat.ekgTab) return BASE_TABS; const t=BASE_TABS.slice(); t.splice(3,0,{id:"ekg", name:"EKG Strip", kind:"ekg"}); return t; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fresh(){ return {tokens:START_TOKENS, tabs:{}, tests:[], ev:{}, solved:false, wrong:0, pick:null, msg:null}; }
function load(){
  let s=null;
  try{ s=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s||!s.cases) s={view:"wards", cat:null, cur:null, tab:"history", cases:{}, order:{}, mode:DEFAULT_MODE};
  s.order=s.order||{};
  ALL.forEach(p=>{ if(!s.cases[p.id]) s.cases[p.id]=fresh(); });
  CATS.forEach(c=>{ const o=s.order[c.id], ids=c.cases.map(p=>p.id);
    if(!Array.isArray(o)||o.length!==ids.length||!ids.every(i=>o.includes(i))) s.order[c.id]=shuffle(ids); });
  if(s.cur && !PMAP[s.cur]) { s.cur=null; s.view="wards"; }
  if(s.cat && !CMAP[s.cat]) { s.cat=null; s.view="wards"; }
  if(s.mode!=="mystery" && s.mode!=="focus") s.mode=DEFAULT_MODE;
  s.confirmNew=false; s.confirmReset=false;
  return s;
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const esc = s => String(s).replace(/[&<>"]/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const app = document.getElementById("app");
const ageOf = p => p.ageLabel || p.age;
const solvedIn = c => c.cases.filter(p=>S.cases[p.id].solved).length;

function testResult(cat,p,tid){ const t=cat.TMAP[tid]; if(p.tests[tid]) return p.tests[tid]; if(t.el && p.acute) return DEFERRED; return t.normal; }
function finding(cat,p,key){ const i=key.indexOf(":"), src=key.slice(0,i), rest=key.slice(i+1); if(src==="t") return testResult(cat,p,rest); return (p[src]||[])[+rest]; }
function label(f){ if(f.s) return f.s; const t=f.t.split(/[.;]/)[0]; return t.length>60 ? t.slice(0,57)+"…" : t; }
function eliminated(cat,p,c){
  const out={};
  Object.keys(c.ev).forEach(k=>{ if(!c.ev[k]) return; const f=finding(cat,p,k); if(!f) return;
    f.ro.forEach(d=>{ if(d===p.dx) return; (out[d]=out[d]||[]).push(label(f)); }); });
  return out;
}

function go(view, extra){ Object.assign(S,{view, confirmNew:false, confirmReset:false}, extra||{}); setHash(); render(); window.scrollTo(0,0); }
function setHash(){ const h = S.view==="wards" ? "" : "#"+(S.view==="case" ? S.cur : S.cat); try{ if(location.hash!==h) history.replaceState(null,"",h||location.pathname+location.search); }catch(e){} }
function fromHash(){ const h=(location.hash||"").slice(1); if(!h) return false;
  if(PMAP[h]){ if(S.cur!==h) S.from=S.mode==="mystery"?"mystery":"focus"; S.view="case"; S.cur=h; S.cat=PMAP[h].cat; S.tab=S.tab||"history"; return true; }
  if(CMAP[h]){ S.view="ward"; S.cat=h; return true; } return false; }
window.addEventListener("hashchange",()=>{ if(fromHash()) render(); });
document.getElementById("home").onclick=()=>go("wards");

function render(){
  save();
  if(S.view==="case" && S.cur) renderCase();
  else if(S.view==="ward" && S.cat) renderWard();
  else renderWards();
}

function renderWards(){
  const total=ALL.length, solved=ALL.filter(p=>S.cases[p.id].solved).length;
  app.innerHTML=`
  <section class="hero">
    <h1>Diagnosis <span>Unknown</span>: The Cardiovascular Casebook</h1>
    <p>${CATS.reduce((n,c)=>n+c.dx.length,0)} cardiovascular and hematologic diagnoses across six wards, one patient for each. Pick a ward, then choose a diagnosis to practice or play the cases as a shuffled mystery. Spend tokens to gather data and eliminate diagnoses until only one fits.</p>
    <div class="rules">
      <div class="rule"><b>15 tokens per patient</b>History, Vital Signs, and Physical Assessment cost 1 token to unlock the whole tab. Each lab, diagnostic, or imaging test costs 1 token.</div>
      <div class="rule"><b>You choose the evidence</b>Mark findings as evidence. The Diagnosis tab crosses off any diagnosis your evidence contradicts and shows why.</div>
      <div class="rule"><b>Order wisely</b>Some tests aren't appropriate for an unstable patient. They'll be deferred and the token is still spent. A wrong diagnosis costs 1 token.</div>
      <div class="rule"><b>Practice what you don't know</b>${PER>1?"Choose a diagnosis and pick any of its "+PER+" cases. Each one shows the condition in a different patient and setting.":"Choose the diagnosis you want to work on and open its case. Switch to Mystery shuffle to test yourself."}</div>
    </div>
  </section>
  <div class="progress"><span>${solved} of ${total} cases solved</span><div class="bar"><i style="width:${solved/total*100}%"></i></div></div>
  <div class="sect">Choose a ward</div>
  <div class="wards">${CATS.map(c=>{ const s=solvedIn(c);
    return `<button class="ward" style="--c:${c.color}" data-ward="${c.id}">
      <div class="wk"><span>${c.dx.length} DIAGNOSES · ${c.cases.length} CASES</span><span>${s?s+" solved":"New"}</span></div>
      <div class="wn">${esc(c.name)}</div><div class="ws">${esc(c.sub)}</div>
      <div class="wb">${esc(c.blurb)}</div>
      ${SHOW_DX?`<div class="wdx">${c.dx.map(d=>`<span>${esc(d.name)}</span>`).join("")}</div>`:""}
      <div class="wprog"><div class="bar"><i style="width:${s/c.cases.length*100}%"></i></div><span>${s}/${c.cases.length}</span></div>
    </button>`; }).join("")}</div>`;
  app.querySelectorAll("[data-ward]").forEach(b=>b.onclick=()=>go("ward",{cat:b.dataset.ward}));
}

function statusPill(p){
  const st=S.cases[p.id];
  const started = st.tokens<START_TOKENS || Object.keys(st.ev).length;
  return st.solved ? '<span class="pill solved">Solved</span>' : started ? `<span class="pill open">${st.tokens} tokens left</span>` : '<span class="pill">New</span>';
}
const dxCases = (c,dxId) => c.cases.filter(p=>p.dx===dxId);
function caseCard(c,p,i){
  const st=S.cases[p.id], pill=statusPill(p);
  return `<button class="case" data-open="${p.id}" data-from="mystery">
    <div class="num"><span>CASE ${String(i+1).padStart(2,"0")}</span>${pill}</div>
    <div class="nm">${esc(p.name)}</div>
    <div class="meta">${esc(ageOf(p))} · ${p.sex} · ${esc(p.setting)}</div>
    <div class="cc">${esc(p.summary)}</div>
    ${st.solved?`<div class="sdx">✓ ${esc(c.DXMAP[p.dx].name)}</div>`:""}
  </button>`;
}
function renderWard(){
  const c=CMAP[S.cat], ord=S.order[c.id], s=solvedIn(c);
  const no = p => ord.indexOf(p.id);
  const focus = S.mode!=="mystery";
  let grid;
  if(focus && PER===1){
    grid = `<div class="fopts" style="margin-top:18px">${c.cases.map(p=>`<button class="fopt ${S.cases[p.id].solved?"isdone":""}" data-open="${p.id}" data-from="focus">
          <span class="fk">${esc(ageOf(p))} ${p.sex} · ${esc(p.setting)} ${statusPill(p)}</span>
          <span class="fv">${esc(c.DXMAP[p.dx].name)}</span>
          <span class="fp">${esc(p.variant)}</span>
        </button>`).join("")}</div>`;
  } else if(focus){
    grid = `<div class="focuslist">${c.dx.map(d=>{ const list=dxCases(c,d.id), sv=list.filter(p=>S.cases[p.id].solved).length;
      return `<section class="fdx" id="fdx-${d.id}">
        <div class="fhead"><h3>${esc(d.name)}</h3><span class="fcount ${sv===list.length?"done":""}">${sv}/${list.length} solved</span></div>
        <div class="fopts">${list.map((p,i)=>`<button class="fopt ${S.cases[p.id].solved?"isdone":""}" data-open="${p.id}" data-from="focus">
          <span class="fk">CASE ${i+1} OF ${list.length} ${statusPill(p)}</span>
          <span class="fv">${esc(p.variant)}</span>
          <span class="fp">${esc(p.name)} · ${esc(ageOf(p))} ${p.sex} · ${esc(p.setting)}</span>
        </button>`).join("")}</div>
      </section>`; }).join("")}</div>`;
  } else {
    grid = `<div class="cases">${ord.map((id,i)=>caseCard(c,PMAP[id],i)).join("")}</div>`;
  }
  app.innerHTML=`
  <div class="topbar"><button class="btn ghost" id="back">← All wards</button></div>
  <section class="hero" style="padding-top:8px">
    <h1 style="color:${c.color}">${esc(c.name)} <span style="color:var(--muted);font-weight:500">· ${esc(c.sub)}</span></h1>
    <p>${esc(c.blurb)} ${esc(c.hint)}</p>
    ${!SHOW_DX && !focus ? "" : `<div class="diffbox"><div class="dl">This ward's differential · each diagnosis appears in ${PER} case${PER===1?"":"s"}</div>
      <div class="dd">${c.dx.map(d=>`<span>${esc(d.name)}</span>`).join("")}</div></div>`}
  </section>
  <div class="progress" style="--c:${c.color}"><span>${s} of ${c.cases.length} solved</span><div class="bar"><i style="width:${s/c.cases.length*100}%"></i></div>
    ${S.confirmNew
      ? `<span class="confirm">Reshuffle this ward and clear its progress on this device? <button class="btn" id="newYes">Reshuffle &amp; clear</button><button class="btn ghost" id="newNo">Cancel</button></span>`
      : `<button class="btn" id="newGame">Reshuffle ward</button>`}</div>
  <div class="toolrow">
    <div class="seg" role="radiogroup" aria-label="How to pick a case">
      ${(DEFAULT_MODE==="mystery"?["mystery","focus"]:["focus","mystery"]).map(m=>`<button role="radio" aria-checked="${(m==="focus")===focus}" data-mode="${m}">${m==="focus"?"By diagnosis":(DEFAULT_MODE==="mystery"?"Shuffled patients":"Mystery shuffle")}</button>`).join("")}
    </div>
    <span class="modehint">${focus
      ? (PER>1?"Pick the diagnosis you want to practice, then choose one of its "+PER+" cases. Each case shows a different side of the condition.":"Pick the diagnosis you want to practice and open its case.")
      : "Cases are shuffled and unlabeled. Work out the diagnosis yourself."}</span>
  </div>
  ${focus&&PER>1?`<nav class="jump" aria-label="Jump to a diagnosis">${c.dx.map(d=>`<a href="#fdx-${d.id}" data-jump="${d.id}">${esc(d.name)}</a>`).join("")}</nav>`:""}
  ${grid}
  <div style="height:30px"></div>`;
  document.getElementById("back").onclick=()=>go("wards");
  const ng=document.getElementById("newGame"); if(ng) ng.onclick=()=>{S.confirmNew=true;render();};
  const ny=document.getElementById("newYes"); if(ny) ny.onclick=()=>{ c.cases.forEach(p=>S.cases[p.id]=fresh()); S.order[c.id]=shuffle(c.cases.map(p=>p.id)); S.confirmNew=false; render(); };
  const nn=document.getElementById("newNo"); if(nn) nn.onclick=()=>{S.confirmNew=false;render();};
  app.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;render();});
  app.querySelectorAll("[data-jump]").forEach(a=>a.onclick=e=>{ e.preventDefault(); const el=document.getElementById("fdx-"+a.dataset.jump); if(el) window.scrollTo(0, el.getBoundingClientRect().top+window.scrollY-12); });
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>go("case",{cur:b.dataset.open, tab:"history", from:b.dataset.from}));
  if(S.scrollDx){ const el=document.getElementById("fdx-"+S.scrollDx); S.scrollDx=null; if(el) requestAnimationFrame(()=>window.scrollTo(0, el.getBoundingClientRect().top+window.scrollY-12)); }
}

let tabJump=false;
function renderCase(){
  const p=PMAP[S.cur], cat=CMAP[p.cat], c=S.cases[p.id];
  const elim=eliminated(cat,p,c);
  const remaining=cat.dx.filter(d=>!elim[d.id]).length;
  const tcls = c.tokens===0?"out":c.tokens<=4?"low":"";
  const evCount=Object.keys(c.ev).filter(k=>{ if(!c.ev[k]) return false; const f=finding(cat,p,k); return f && (f.sup || f.ro.length===0); }).length;
  const oldTabs=app.querySelector(".tabs");
  const keepLeft=oldTabs?oldTabs.scrollLeft:0, keepY=window.scrollY;
  const no=S.order[cat.id].indexOf(p.id)+1;
  const inFocus = S.from==="focus";
  const D0=cat.DXMAP[p.dx], fi=dxCases(cat,p.dx).indexOf(p)+1;
  const metaLine = inFocus
    ? `${esc(cat.name.toUpperCase())} · ${esc(D0.name.toUpperCase())} ${PER>1?`· CASE ${fi} OF ${PER} `:""}· ${esc(p.setting)}`
    : `${esc(cat.name.toUpperCase())} · CASE ${String(no).padStart(2,"0")} · ${esc(p.setting)}`;
  app.innerHTML=`
  <div class="topbar">
    <button class="btn ghost" id="back">← ${inFocus?esc(D0.name):esc(cat.name)} cases</button>
    <span class="spacer"></span>
    ${S.confirmReset
      ? `<span class="confirm">Reset this case to 15 tokens and clear all findings? <button class="btn" id="resetYes">Reset case</button><button class="btn ghost" id="resetNo">Cancel</button></span>`
      : `<button class="btn" id="reset">Reset case</button>`}
  </div>
  <section class="file">
    <div class="who">
      <div class="meta" style="color:${cat.color}">${metaLine}</div>
      ${inFocus?`<div class="fvar">${esc(p.variant)}</div>`:""}
      <h2>${esc(p.name)}, ${esc(ageOf(p))} ${p.sex}</h2>
      <p class="cc">${esc(p.summary)}</p>
    </div>
    <div class="tokens">
      <div class="lbl">Tokens</div>
      <div class="count ${tcls}">${c.tokens}</div>
      <div class="pips">${Array.from({length:START_TOKENS},(_,i)=>`<i class="${i<c.tokens?"on":""}"></i>`).join("")}</div>
    </div>
  </section>
  <nav class="tabs" role="tablist">
    ${tabsFor(cat).map(t=>{ let extra="";
      if((t.kind==="bulk"||t.kind==="ekg") && !c.tabs[t.id]) extra='<span class="lock">🔒</span>';
      if(t.kind==="dx") extra=`<span class="badge">${remaining} left</span>`;
      return `<button class="tab" role="tab" aria-selected="${S.tab===t.id}" data-tab="${t.id}">${t.name}${extra}</button>`;}).join("")}
  </nav>
  <section class="pane" id="pane"></section>`;
  document.getElementById("back").onclick=()=>go("ward",{cat:cat.id, scrollDx: inFocus?p.dx:null});
  const r=document.getElementById("reset"); if(r) r.onclick=()=>{S.confirmReset=true;render();};
  const ry=document.getElementById("resetYes"); if(ry) ry.onclick=()=>{S.cases[p.id]=fresh();S.confirmReset=false;S.tab="history";render();};
  const rn=document.getElementById("resetNo"); if(rn) rn.onclick=()=>{S.confirmReset=false;render();};
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;tabJump=true;render();});
  renderPane(cat,p,c,elim,remaining,evCount);
  const tabs=app.querySelector(".tabs");
  tabs.scrollLeft=keepLeft; window.scrollTo(0,keepY);
  const sel=tabs.querySelector('[aria-selected="true"]');
  if(sel){ const l=sel.offsetLeft-tabs.offsetLeft, rr=l+sel.offsetWidth;
    if(l<tabs.scrollLeft) tabs.scrollLeft=l-8; else if(rr>tabs.scrollLeft+tabs.clientWidth) tabs.scrollLeft=rr-tabs.clientWidth+8; }
  if(tabJump){ tabJump=false; const pane=document.getElementById("pane");
    const top=pane.getBoundingClientRect().top+window.scrollY-tabs.offsetHeight; if(window.scrollY>top) window.scrollTo(0,top); }
}
function ekgSVG(sp){
  const W=150,H=34,base=19,dt=0.002,T=6;
  let seed=sp.seed||1; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const comps=[], add=(c,w,a)=>comps.push([c,w,a]);
  const narrow=(t0,withP)=>{ if(withP) add(t0+0.05,0.022,1.6); add(t0+0.17,0.008,-1.2); add(t0+0.19,0.009,11); add(t0+0.215,0.009,-2.6); add(t0+0.42,0.045,3); };
  let base2=()=>0;
  if(sp.kind==="sinus"){ const rr=60/sp.rate; for(let t0=-0.25-rnd()*0.2; t0<T; t0+=rr) narrow(t0,true); }
  else if(sp.kind==="vt"){ const rr=60/sp.rate; for(let t0=-0.1-rnd()*0.1; t0<T; t0+=rr){ add(t0+0.06,0.034,12); add(t0+0.17,0.05,-5.5); } }
  else if(sp.kind==="afib"){ const mean=60/sp.rate; let t0=-0.1; while(t0<T){ narrow(t0-0.12,false); t0+=mean*(0.55+rnd()*0.9); }
    base2=t=>0.45*Math.sin(2*Math.PI*6.3*t)+0.3*Math.sin(2*Math.PI*8.9*t+1)+0.2*Math.sin(2*Math.PI*4.7*t+2); }
  else if(sp.kind==="vf"){ const f=[4.1+rnd(),5.3+rnd(),6.2+rnd(),7.4+rnd()], ph=f.map(()=>rnd()*6.28);
    base2=t=>{ const A=3.2+2.2*Math.sin(2*Math.PI*0.35*t+ph[0]); return A*(0.55*Math.sin(2*Math.PI*f[0]*t+ph[0])+0.35*Math.sin(2*Math.PI*f[1]*t+ph[1])+0.25*Math.sin(2*Math.PI*f[2]*t+ph[2])+0.15*Math.sin(2*Math.PI*f[3]*t+ph[3])); }; }
  else { const ph=rnd()*6.28; base2=t=>0.35*Math.sin(2*Math.PI*0.25*t+ph)+0.08*Math.sin(2*Math.PI*3.1*t); }
  let d="";
  for(let i=0;i<=T/dt;i++){ const t=i*dt; let v=base2(t);
    for(const [c,w,a] of comps){ const z=t-c; if(z>-5*w && z<5*w) v+=a*Math.exp(-(z*z)/(2*w*w)); }
    const y=Math.max(0.5,Math.min(H-0.5,base-v));
    d+=(i?"L":"M")+(t*25).toFixed(2)+" "+y.toFixed(2); }
  let grid="";
  for(let x=0;x<=W;x++) grid+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" class="${x%5?"gs":"gl"}"/>`;
  for(let y=0;y<=H;y++) grid+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" class="${y%5?"gs":"gl"}"/>`;
  const ticks=[0,75,150].map(x=>`<line x1="${x}" y1="0" x2="${x}" y2="2.5" class="tick"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><rect width="${W}" height="${H}" class="paper"/>${grid}${ticks}<path d="${d}" class="trace"/><text x="2" y="${H-1.5}" class="lbl">II</text></svg>`;
}
function evBtn(c,key){ const on=!!c.ev[key]; return `<button class="ev" aria-pressed="${on}" data-ev="${key}">${on?"✓ Evidence":"+ Add as evidence"}</button>`; }

function renderPane(cat,p,c,elim,remaining,evCount){
  const pane=document.getElementById("pane");
  const TABS=tabsFor(cat), tab=TABS.find(t=>t.id===S.tab)||TABS[0];
  if((tab.kind==="bulk"||tab.kind==="ekg") && !c.tabs[tab.id]){
    {
      pane.innerHTML=`<div class="locked"><p>${tab.name} is locked.</p><button class="btn primary" id="unlock" ${c.tokens<1||c.solved?"disabled":""}>Unlock for 1 token</button>${c.tokens<1?'<p style="margin-top:10px">Out of tokens. Make your diagnosis with the evidence you have.</p>':""}</div>`;
      document.getElementById("unlock").onclick=()=>{ if(c.tokens<1)return; c.tokens--; c.tabs[tab.id]=true; render(); };
      return;
    }
  }
  if(tab.kind==="ekg"){
    const f=p.ekg[0], key="ekg:0";
    pane.innerHTML=`<p class="hint">Lead II, 25 mm/sec. Each small box is 0.04 sec; each large box is 0.20 sec. The marks across the top are 3 seconds apart, so count the complexes between the first and last mark and multiply by 10 to estimate the rate.</p>
      <div class="ekgwrap" role="img" aria-label="Six-second rhythm strip">${ekgSVG(p.wave)}</div>
      <div class="item ${c.ev[key]?"in":""}" style="margin-top:10px"><div class="txt">${esc(f.t)}</div>${evBtn(c,key)}</div>`;
  } else if(tab.kind==="bulk"){
    const list=p[tab.id];
    let order=list.map((_,i)=>i);
    if(tab.id!=="vitals"){ c.ford=c.ford||{};
      if(!Array.isArray(c.ford[tab.id])||c.ford[tab.id].length!==list.length) c.ford[tab.id]=shuffle(order);
      order=c.ford[tab.id]; }
    pane.innerHTML=`<p class="hint">Mark the findings you think matter. Only evidence can eliminate a diagnosis.</p>
      <div class="${tab.id==="vitals"?"vgrid":"items"}">${order.map(i=>{ const f=list[i], key=`${tab.id}:${i}`;
        return `<div class="item ${c.ev[key]?"in":""}"><div class="txt">${esc(f.t)}</div>${evBtn(c,key)}</div>`;}).join("")}</div>`;
  } else if(tab.kind==="test"){
    const tests=cat.tests.filter(t=>t.cat===tab.id);
    pane.innerHTML=`<p class="hint">Each test costs 1 token and can't be un-ordered. Once a result is back, you decide whether it counts as evidence.</p>
      <div class="items">${tests.map(t=>{
        if(!c.tests.includes(t.id)) return `<div class="item"><div class="txt"><div class="tname">${esc(t.name)}</div></div><button class="order" data-order="${t.id}" ${c.tokens<1||c.solved?"disabled":""}>Order · 1 token</button></div>`;
        const r=testResult(cat,p,t.id), key="t:"+t.id;
        return `<div class="item ${c.ev[key]?"in":""}"><div class="txt"><div class="tname">${esc(t.name)}</div><div class="res ${r.deferred?"def":""}">${esc(r.t)}</div></div>${r.deferred?"":evBtn(c,key)}</div>`;
      }).join("")}</div>`;
    pane.querySelectorAll("[data-order]").forEach(b=>b.onclick=()=>{ if(c.tokens<1)return; c.tokens--; c.tests.push(b.dataset.order); render(); });
  } else renderDx(cat,pane,p,c,elim,remaining,evCount);
  pane.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>{ const k=b.dataset.ev; if(c.ev[k]) delete c.ev[k]; else c.ev[k]=true; if(c.pick&&eliminated(cat,p,c)[c.pick]) c.pick=null; render(); });
}

function renderDx(cat,pane,p,c,elim,remaining,evCount){
  const D=cat.DXMAP[p.dx];
  const opts=cat.dx.map(d=>{ const out=elim[d.id], sel=c.pick===d.id;
    return `<label class="dx ${out?"out":""} ${sel?"sel":""}">
      <input type="radio" name="dxpick" id="dx-${d.id}" value="${d.id}" ${out||c.solved?"disabled":""} ${sel?"checked":""}>
      <div class="dn">${esc(d.name)}</div>
      ${out?`<div class="why">Ruled out by: ${out.map(esc).join("; ")}</div>`:""}
    </label>`;}).join("");
  pane.innerHTML=`
    <div class="dxhead"><h3>Differential · ${esc(cat.name)}</h3><span class="left">${remaining} of ${cat.dx.length} still possible · ${evCount} piece${evCount===1?"":"s"} of evidence</span></div>
    <div class="dxgrid">${opts}</div>
    ${c.solved?"":`<div class="submitrow"><button class="btn primary" id="submit" ${c.pick?"":"disabled"}>Submit diagnosis</button>
      ${c.msg?`<span class="msg bad">${esc(c.msg)}</span>`:`<span class="msg" style="color:var(--muted)">${c.pick?"Ready when you are.":"Select a diagnosis that hasn't been ruled out."}</span>`}</div>`}
    ${c.solved?`<div class="reveal">
      <div class="rh"><div class="k">Good job. Case solved.</div><h3>${esc(D.name)}</h3></div>
      <div class="rb">
        <div class="blk"><b>How it should work</b><p>${esc(p.normal||D.normal)}</p></div>
        <div class="blk"><b>What broke</b><p>${esc(p.broke||D.broke)}</p></div>
        <div class="blk"><b>The clues that mattered</b><p>${esc(p.clues)}</p></div>
        <div class="stats">Solved with ${c.tokens} of ${START_TOKENS} tokens left · ${c.wrong} wrong guess${c.wrong===1?"":"es"}</div>
        ${sataHTML(cat,p,c)}
      </div></div>`:""}`;
  pane.querySelectorAll("input[name=dxpick]").forEach(i=>i.onchange=()=>{c.pick=i.value;c.msg=null;render();});
  pane.querySelectorAll("input[data-nq]").forEach(i=>i.onchange=()=>{ const k=+i.dataset.nq; if(i.checked) c.nq.sel[k]=true; else delete c.nq.sel[k]; render(); });
  const ns=document.getElementById("nqSubmit"); if(ns) ns.onclick=()=>{ if(!Object.keys(c.nq.sel).length) return; c.nq.done=true; render(); };
  const sb=document.getElementById("submit");
  if(sb) sb.onclick=()=>{ if(!c.pick) return;
    if(c.pick===p.dx){ c.solved=true; c.msg=null; c.nq=null; }
    else { c.wrong++; if(c.tokens>0) c.tokens--; c.msg=`Not ${cat.DXMAP[c.pick].name}. That cost a token. What evidence haven't you gathered yet?`; c.pick=null; }
    render(); };
  const nb=document.getElementById("next");
  if(nb) nb.onclick=()=>{ const nx=nextCase(cat,p); if(nx) go("case",{cur:nx.id, tab:"history"}); else go("ward",{cat:cat.id, scrollDx: S.from==="focus"?p.dx:null}); };
}
function sataHTML(cat,p,c){
  const opts=p.nursing||cat.DXMAP[p.dx].nursing;
  if(!c.nq||!c.nq.order||c.nq.order.length!==opts.length) c.nq={order:shuffle(opts.map((_,i)=>i)), sel:{}, done:false};
  const q=c.nq, nSel=Object.keys(q.sel).length;
  const body=q.order.map(i=>{ const o=opts[i], on=!!q.sel[i];
    if(!q.done) return `<label class="nopt ${on?"on":""}"><input type="checkbox" id="nq-${p.id}-${i}" data-nq="${i}" ${on?"checked":""}><span>${esc(o.t)}</span></label>`;
    const kind = on ? (o.ok?"hit":"wrong") : (o.ok?"miss":"skip");
    const tag={hit:"You selected this · Correct", wrong:"You selected this · Should not be selected", miss:"Not selected · Should have been selected", skip:"Not selected · Correctly left out"}[kind];
    const mark={hit:"✓", wrong:"✗", miss:"!", skip:"–"}[kind];
    return `<div class="nopt res ${kind}"><div class="nmark">${mark}</div>
      <div><div>${esc(o.t)}</div><div class="ntag">${tag}</div><div class="nrat"><b>${o.ok?"Priority.":"Not a priority."}</b> ${esc(o.r)}</div></div></div>`;
  }).join("");
  let foot;
  if(!q.done) foot=`<div class="submitrow"><button class="btn primary" id="nqSubmit" ${nSel?"":"disabled"}>Check my answers</button><span class="msg" style="color:var(--muted)">${nSel?nSel+" selected":"Select all that apply."}</span></div>`;
  else { const total=opts.filter(o=>o.ok).length, hit=q.order.filter(i=>opts[i].ok&&q.sel[i]).length, extra=q.order.filter(i=>!opts[i].ok&&q.sel[i]).length, perfect=hit===total&&extra===0;
    foot=`<div class="nlegend"><span class="lg hit">✓ Correct pick</span><span class="lg wrong">✗ Wrong pick</span><span class="lg miss">! Missed priority</span><span class="lg skip">– Correctly left out</span></div>
      <div class="nfocus"><b>Nursing focus</b><p>${esc(p.care||cat.DXMAP[p.dx].care)}</p></div>
      <div class="nscore ${perfect?"good":""}">${perfect?"All correct. ":""}You chose ${hit} of ${total} priorities${extra?` and ${extra} option${extra===1?"":"s"} that should not be selected`:""}.</div><div class="submitrow">${nextBtn(cat,p)}</div>`; }
  return `<div class="sata"><b class="sq">Nursing priorities</b>
    <p class="sp">Which actions are priorities for ${esc(p.name.split(" ")[0])}? Select all that apply.</p>
    <div class="nopts">${body}</div>${foot}</div>`;
}
function nextCase(cat,p){ const L=S.from==="focus" ? (PER>1?dxCases(cat,p.dx):cat.cases) : S.order[cat.id].map(id=>PMAP[id]), i=L.indexOf(p);
  for(let k=1;k<=L.length;k++){ const q=L[(i+k)%L.length]; if(!S.cases[q.id].solved) return q; } return null; }
function nextBtn(cat,p){
  if(S.from==="focus" && PER===1) return nextCase(cat,p)?`<button class="btn primary" id="next">Next diagnosis →</button>`:`<button class="btn primary" id="next">All ${cat.cases.length} solved. Back to the ward</button>`;
  if(S.from==="focus"){ const dn=esc(cat.DXMAP[p.dx].name);
    return nextCase(cat,p)?`<button class="btn primary" id="next">Next ${dn} case →</button>`:`<button class="btn primary" id="next">All 3 ${dn} cases solved. Pick another diagnosis</button>`; }
  return nextCase(cat,p)?`<button class="btn primary" id="next">Next patient →</button>`:`<button class="btn primary" id="next">All ${cat.cases.length} solved. Back to the ward</button>`; }

fromHash();
setHash();
render();
})();
</script>

</body></html>
