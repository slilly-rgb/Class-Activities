<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Diagnosis Unknown: Cardiovascular Casebook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: black case-file masthead; a ward board of four categories; each ward opens a shuffled case grid; each case is a tabbed evidence file with a diagnosis board. Single dark Clinical Mysteries theme by design. */
:root{
  color-scheme: dark;
  --bg:#070a0b; --panel:#0e1416; --panel2:#131c1e; --line:#203034;
  --fg:#dfe9e8; --muted:#8ea3a2; --teal:#1ec8b8; --teal-dim:#0f6b63; --teal-ink:#03211e;
  --red:#ef6a5f; --amber:#efb54a; --green:#53d48e; --blue:#62a8f0;
  --display:"Oxanium","Eurostile","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible+span,label:focus-within{outline:2px solid var(--teal);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.mast{background:#000;border-bottom:1px solid var(--line)}
.mast .wrap{display:flex;align-items:center;gap:14px;padding-block:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left}
.logo svg{width:44px;height:44px;flex:none}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:18px;color:var(--teal);line-height:1}
.tag{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.edition{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);padding:4px 10px;border-radius:3px}

.hero{padding-block:28px 10px}
.hero h1{font-size:clamp(28px,5vw,44px);font-weight:700;letter-spacing:.01em}
.hero h1 span{color:var(--teal)}
.hero p{max-width:66ch;color:var(--muted);margin:10px 0 0}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:18px 0 6px}
.rule{border-top:2px solid var(--teal-dim);padding-top:8px;font-size:13.5px;color:var(--muted)}
.rule b{display:block;color:var(--fg);font-family:var(--display);font-size:14px;letter-spacing:.04em;margin-bottom:2px}

/* wards */
.sect{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.wards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding-bottom:40px}
.ward{--c:var(--teal);background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:4px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0;transition:border-color .15s}
.ward:hover{border-color:var(--c)}
.ward .wk{font-family:var(--mono);font-size:12px;color:var(--c);display:flex;justify-content:space-between;gap:8px}
.ward .wn{font-family:var(--display);font-size:22px;font-weight:700}
.ward .ws{font-size:13px;color:var(--muted);margin-top:-6px}
.ward .wb{font-size:13.5px;opacity:.85}
.ward .wdx{display:flex;flex-wrap:wrap;gap:4px}
.ward .wdx span{font-size:11.5px;border:1px solid var(--line);border-radius:2px;padding:1px 6px;color:var(--muted)}
.bar{flex:1;min-width:80px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--teal))}
.wprog{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted)}

.progress{font-family:var(--mono);font-size:13px;color:var(--muted);margin:14px 0 10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;padding-bottom:16px}
.case{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .15s}
.case:hover{border-color:var(--teal-dim)}
.case .num{font-family:var(--mono);font-size:12px;color:var(--teal);display:flex;justify-content:space-between;gap:8px}
.case .nm{font-family:var(--display);font-size:18px;font-weight:700}
.case .meta{font-size:12.5px;color:var(--muted)}
.case .cc{font-size:13.5px;color:var(--fg);opacity:.85;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.case .sdx{font-size:12.5px;color:var(--green)}
.pill{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:2px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.solved{border-color:var(--green);color:var(--green)}
.pill.open{border-color:var(--amber);color:var(--amber)}
.dxgroup{margin:18px 0 6px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dxgroup h3{font-size:17px}
.dxgroup span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.diffbox{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-top:14px}
.diffbox .dl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.diffbox .dd{display:flex;flex-wrap:wrap;gap:6px}
.diffbox .dd span{font-size:13px;border:1px solid var(--line);border-radius:2px;padding:2px 8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:none}
.seg button{background:none;border:0;padding:8px 14px;font-family:var(--display);font-size:14px;letter-spacing:.03em;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-checked="true"]{background:var(--teal);color:var(--teal-ink);font-weight:700}
.modehint{font-size:13px;color:var(--muted);flex:1;min-width:220px;max-width:62ch}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.jump a{font-size:12.5px;color:var(--fg);text-decoration:none;border:1px solid var(--line);border-radius:2px;padding:3px 9px;background:var(--panel)}
.jump a:hover{border-color:var(--teal-dim);color:var(--teal)}
.focuslist{display:flex;flex-direction:column;gap:22px;margin-top:18px}
.fdx{scroll-margin-top:12px}
.fhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px}
.fhead h3{font-size:19px}
.fcount{font-family:var(--mono);font-size:12px;color:var(--muted)}
.fcount.done{color:var(--green)}
.fopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.fopt{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color .15s}
.fopt:hover{border-color:var(--teal)}
.fopt.isdone{border-color:rgba(83,212,142,.45)}
.fopt .fk{font-family:var(--mono);font-size:11.5px;color:var(--teal);display:flex;justify-content:space-between;gap:8px;align-items:center}
.fopt .fv{font-family:var(--display);font-size:16.5px;font-weight:700;line-height:1.25}
.fopt .fp{font-size:12.5px;color:var(--muted)}
.fvar{font-family:var(--display);font-size:15px;color:var(--fg);opacity:.8;margin-top:2px}
.toolrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 4px}
.toggle{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted);cursor:pointer}
.toggle input{accent-color:var(--teal);width:16px;height:16px}

.topbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:16px 6px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:7px 12px;font-size:13.5px}
.btn:hover{border-color:var(--teal-dim)}
.btn.primary{background:var(--teal);color:var(--teal-ink);border-color:var(--teal);font-weight:600}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none}
.spacer{flex:1}
.crumb{font-family:var(--mono);font-size:12px;color:var(--muted)}
.file{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.file .who{min-width:0}
.file h2{font-size:26px}
.file .meta{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:3px}
.file .cc{margin:10px 0 0;max-width:70ch}
.tokens{text-align:right}
.tokens .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tokens .count{font-family:var(--display);font-size:34px;font-weight:700;color:var(--teal);line-height:1;font-variant-numeric:tabular-nums}
.tokens .count.low{color:var(--amber)}
.tokens .count.out{color:var(--red)}
.pips{display:grid;grid-template-columns:repeat(5,10px);gap:4px;justify-content:end;margin-top:8px}
.pips i{width:10px;height:10px;border-radius:50%;border:1px solid var(--teal-dim)}
.pips i.on{background:var(--teal);border-color:var(--teal)}

.tabs{display:flex;gap:2px;margin-top:16px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font-family:var(--display);font-size:14px;letter-spacing:.03em;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--teal)}
.tab .lock{font-size:11px;opacity:.7}
.tab .badge{font-family:var(--mono);font-size:11px;background:var(--teal-dim);color:var(--fg);padding:0 6px;border-radius:8px}
.pane{padding-block:16px 40px}
.locked{border:1px dashed var(--line);border-radius:4px;padding:28px 18px;text-align:center;color:var(--muted)}
.locked p{margin:0 0 12px}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px;max-width:72ch}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.item.in{border-color:var(--teal);background:linear-gradient(90deg,rgba(30,200,184,.08),transparent 60%),var(--panel)}
.item .txt{min-width:0}
.item .tname{font-family:var(--display);font-size:14px;letter-spacing:.02em}
.item .res{font-family:var(--mono);font-size:13px;color:var(--fg);margin-top:4px}
.item .res.def{color:var(--amber)}
.ev{border:1px solid var(--line);background:var(--panel2);border-radius:3px;padding:6px 10px;font-size:12.5px;white-space:nowrap;color:var(--muted)}
.ev[aria-pressed="true"]{border-color:var(--teal);color:var(--teal);font-weight:600}
.order{border:1px solid var(--teal-dim);background:none;border-radius:3px;padding:6px 10px;font-size:12.5px;white-space:nowrap;color:var(--teal)}
.order:disabled{opacity:.35;cursor:not-allowed}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.vgrid .item{font-family:var(--mono);font-size:14px}

.ekgwrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:#fbf3f1}
.ekgwrap svg{display:block;min-width:720px;width:100%;height:auto;aspect-ratio:150/34}
.ekgwrap .paper{fill:#fbf3f1}
.ekgwrap .gs{stroke:#f2c9c4;stroke-width:0.06}
.ekgwrap .gl{stroke:#de8f88;stroke-width:0.14}
.ekgwrap .tick{stroke:#2a2a2a;stroke-width:0.35}
.ekgwrap .trace{fill:none;stroke:#141414;stroke-width:0.28;stroke-linejoin:round}
.ekgwrap .lbl{font:600 2.4px var(--mono);fill:#2a2a2a}
.dxhead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.dxhead h3{font-size:18px}
.dxhead .left{font-family:var(--mono);font-size:13px;color:var(--teal)}
.dxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.dx{position:relative;display:block;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px 10px 38px;cursor:pointer;min-width:0}
.dx input{position:absolute;left:12px;top:13px;accent-color:var(--teal)}
.dx .dn{font-weight:600}
.dx .why{font-size:12px;color:var(--red);margin-top:3px}
.dx.out{opacity:.55;cursor:not-allowed;background:var(--bg)}
.dx.out .dn{text-decoration:line-through;text-decoration-color:var(--red)}
.dx.sel{border-color:var(--teal)}
.submitrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}
.msg{font-size:14px}
.msg.bad{color:var(--red)} .msg.ok{color:var(--green)}
.reveal{margin-top:20px;border:1px solid var(--green);border-radius:4px;background:var(--panel);overflow:hidden}
.reveal .rh{background:rgba(83,212,142,.12);padding:14px 16px;border-bottom:1px solid var(--line)}
.reveal .rh .k{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--green)}
.reveal .rh h3{font-size:24px;margin-top:4px}
.reveal .rb{padding:6px 16px 16px;display:grid;gap:12px}
.reveal .blk{max-width:72ch}
.reveal .blk b{display:block;font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin:8px 0 2px}
.reveal .blk p{margin:0}
.reveal .stats{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--amber)}
.sata{border-top:1px solid var(--line);padding-top:6px}
.sata .sq{display:block;font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin:8px 0 2px}
.sata .sp{margin:0 0 10px;max-width:72ch}
.nopts{display:flex;flex-direction:column;gap:8px}
.nopt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:10px 12px;cursor:pointer}
.nopt input{margin-top:4px;accent-color:var(--teal);width:16px;height:16px}
.nopt.on{border-color:var(--teal)}
.nopt.res{cursor:default}
.nmark{font-weight:700;font-size:16px;width:16px;text-align:center}
.ntag{font-family:var(--mono);font-size:12px;margin-top:3px}
.nopt.res.hit{border-color:var(--green);background:linear-gradient(90deg,rgba(83,212,142,.14),transparent 70%),var(--panel2)}
.nopt.res.wrong{border-color:var(--red);background:linear-gradient(90deg,rgba(239,106,95,.16),transparent 70%),var(--panel2)}
.nopt.res.miss{border-color:var(--amber);border-style:dashed;background:linear-gradient(90deg,rgba(239,181,74,.14),transparent 70%),var(--panel2)}
.nopt.res.skip{opacity:.72}
.nopt.hit .nmark,.nopt.hit .ntag{color:var(--green)}
.nopt.wrong .nmark,.nopt.wrong .ntag{color:var(--red)}
.nopt.miss .nmark,.nopt.miss .ntag{color:var(--amber)}
.nopt.skip .nmark,.nopt.skip .ntag{color:var(--muted)}
.nfocus{margin-top:14px;border:1px solid var(--teal-dim);border-radius:4px;padding:10px 14px;background:var(--panel2);max-width:78ch}
.nfocus b{display:block;font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:2px}
.nfocus p{margin:0}
.nlegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-family:var(--mono);font-size:12px}
.nlegend .lg{display:inline-flex;align-items:center;gap:6px}
.nlegend .lg::before{content:"";width:10px;height:10px;border-radius:2px;border:1px solid currentColor}
.nlegend .hit{color:var(--green)} .nlegend .wrong{color:var(--red)} .nlegend .miss{color:var(--amber)} .nlegend .skip{color:var(--muted)}
.nrat{font-size:13.5px;color:var(--muted);margin-top:4px}
.nrat b{color:var(--fg)}
.nscore{margin-top:12px;font-size:14px}
.nscore.good{color:var(--green)}
@media (max-width:560px){
  .file{grid-template-columns:1fr}
  .tokens{text-align:left}.pips{justify-content:start}
  .item{grid-template-columns:1fr}
  .item .ev,.item .order{justify-self:start}
  .edition{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <div class="wrap">
    <button class="logo" id="home" aria-label="Clinical Mysteries: back to the wards">

<script>
const CATS = [{"id":"rhythm","ekgTab":true,"name":"Dysrhythmias","sub":"Rhythm & arrest","color":"#ef6a5f","blurb":"Lethal and common rhythms: what the monitor shows, whether there's a pulse, and what to do next.","hint":"Always ask two questions: is there a pulse, and what does the rhythm strip actually show (rate, regularity, P waves, QRS width)?","dx":[{"id":"asys","name":"Asystole","normal":"The SA node fires 60–100 times a minute, and each impulse spreads through the atria and ventricles so the heart squeezes in rhythm.","broke":"All electrical activity has stopped. There's no impulse, no contraction, and no cardiac output. Asystole often follows a prolonged arrest or severe metabolic problems such as hyperkalemia or acidosis. It isn't a shockable rhythm.","care":"Confirm the flat line in more than one lead, then start high-quality CPR and give epinephrine every 3–5 minutes. Don't defibrillate. Search for reversible causes (the Hs and Ts).","nursing":[{"t":"Start high-quality CPR right away.","ok":true,"r":"Compressions are the only thing moving blood. Push hard, push fast (100–120/min), allow full recoil."},{"t":"Confirm asystole in a second lead and check the leads.","ok":true,"r":"A loose lead or low gain can mimic a flat line, and fine VF can look flat in one lead."},{"t":"Give epinephrine 1 mg IV every 3–5 minutes.","ok":true,"r":"Epinephrine raises coronary and cerebral perfusion pressure during CPR."},{"t":"Defibrillate at 200 joules immediately.","ok":false,"r":"Asystole isn't shockable. Shocks don't restart a heart with no electrical activity."},{"t":"Look for reversible causes (Hs and Ts).","ok":true,"r":"Hyperkalemia, hypoxia, acidosis, and other causes must be treated for ROSC."},{"t":"Give amiodarone 300 mg IV push.","ok":false,"r":"Amiodarone treats VF and pulseless VT, not asystole."},{"t":"Minimize pauses in compressions.","ok":true,"r":"Every pause drops perfusion pressure back toward zero."},{"t":"Stop CPR during each dose of medication.","ok":false,"r":"Medications are given during compressions; CPR shouldn't pause for them."}]},{"id":"vtp","name":"Ventricular tachycardia (with a pulse)","normal":"Normal impulses start in the SA node and travel down the conduction system, producing narrow QRS complexes.","broke":"An irritable focus in the ventricle takes over and fires fast (usually 150–250/min). Impulses spread muscle-to-muscle, so the QRS is wide. The ventricles fill poorly, so output falls. With a pulse, the patient may be stable or unstable, and VT can deteriorate into pulseless VT or VF at any moment.","care":"Check for a pulse and signs of instability. Stable: antiarrhythmics such as amiodarone. Unstable (low BP, altered mental status, chest pain, heart failure): synchronized cardioversion. Correct potassium and magnesium.","nursing":[{"t":"Check the pulse and assess for signs of instability.","ok":true,"r":"A pulse means this isn't an arrest; stability decides between drugs and cardioversion."},{"t":"Apply pads and prepare for synchronized cardioversion.","ok":true,"r":"If the patient becomes unstable, synchronized cardioversion is needed fast."},{"t":"Give amiodarone as ordered while the patient is stable.","ok":true,"r":"Amiodarone can convert stable VT and keep it from recurring."},{"t":"Start chest compressions right away.","ok":false,"r":"This patient has a pulse. Compressions are for pulseless rhythms."},{"t":"Replace low potassium and magnesium as ordered.","ok":true,"r":"Low K⁺ and Mg²⁺ make the ventricles more irritable."},{"t":"Deliver an unsynchronized shock at 200 joules.","ok":false,"r":"An unsynchronized shock can land on the T wave and cause VF in a patient with a pulse."},{"t":"Watch the monitor for pulseless VT or VF.","ok":true,"r":"VT can deteriorate at any moment; be ready to start CPR and defibrillate."},{"t":"Encourage the patient to walk to the bathroom.","ok":false,"r":"Exertion raises demand and can trigger collapse. Keep the patient in bed."}]},{"id":"pvt","name":"Pulseless ventricular tachycardia","normal":"Organized impulses make the ventricles squeeze and eject blood with each beat.","broke":"The ventricles fire so fast and inefficiently that they don't fill or eject. The monitor shows wide, regular complexes, but there's no pulse and no blood pressure. It's cardiac arrest and is treated like VF.","care":"Start CPR and defibrillate as soon as possible. Give epinephrine after the second shock and amiodarone after the third, and keep compressions going between shocks.","nursing":[{"t":"Start CPR and attach the defibrillator immediately.","ok":true,"r":"Every minute without CPR and defibrillation lowers survival."},{"t":"Defibrillate (unsynchronized) as soon as possible.","ok":true,"r":"Pulseless VT is shockable; early defibrillation is the key treatment."},{"t":"Resume compressions right after each shock.","ok":true,"r":"Don't stop for a pulse check after the shock; resume CPR for 2 minutes."},{"t":"Use synchronized cardioversion instead.","ok":false,"r":"There's no pulse; synchronizing can delay or prevent the shock."},{"t":"Give epinephrine and amiodarone as ordered.","ok":true,"r":"Epinephrine after the 2nd shock; amiodarone 300 mg after the 3rd."},{"t":"Give adenosine 6 mg rapid IV push.","ok":false,"r":"Adenosine is for narrow-complex SVT with a pulse, not pulseless VT."},{"t":"Call 'clear' and check no one touches the patient.","ok":true,"r":"Safety during the shock protects staff from injury."},{"t":"Wait for a 12-lead ECG before shocking.","ok":false,"r":"Treatment is based on the monitor rhythm and pulse check. Delay costs lives."}]},{"id":"vf","name":"Ventricular fibrillation","normal":"Each ventricular muscle cell depolarizes in an orderly wave so the ventricles squeeze together.","broke":"Many chaotic electrical impulses fire at once. The ventricles quiver instead of contracting, so there's no output, no pulse, and no blood pressure. Common causes: acute MI, hypokalemia, hypomagnesemia, and drug toxicity. Without defibrillation, it degrades to asystole within minutes.","care":"CPR and defibrillation as fast as possible, then epinephrine and amiodarone per ACLS. Look for and treat the cause (ischemia, electrolytes).","nursing":[{"t":"Start CPR and defibrillate as fast as possible.","ok":true,"r":"Survival drops sharply each minute without defibrillation."},{"t":"Resume CPR for 2 minutes after each shock.","ok":true,"r":"The heart needs perfusion even if the shock worked; check rhythm after 2 minutes."},{"t":"Give epinephrine and amiodarone as ordered.","ok":true,"r":"ACLS drugs support perfusion and help the heart respond to shocks."},{"t":"Check potassium and magnesium after ROSC.","ok":true,"r":"Low K⁺ and Mg²⁺ trigger VF; correcting them prevents recurrence."},{"t":"Use synchronized cardioversion at 50 joules.","ok":false,"r":"VF has no QRS to sync to; the shock may never fire. Defibrillate unsynchronized."},{"t":"Check a carotid pulse for a full minute first.","ok":false,"r":"Pulse checks take 10 seconds or less; longer pauses waste perfusion."},{"t":"Give atropine for the chaotic rhythm.","ok":false,"r":"Atropine is for symptomatic bradycardia, not VF."},{"t":"Prepare to start targeted temperature management.","ok":true,"r":"After ROSC, temperature control protects the brain in comatose patients."}]},{"id":"afib","name":"Atrial fibrillation","normal":"The SA node sends one organized impulse at a time; the atria contract and top off the ventricles before each beat.","broke":"Hundreds of chaotic impulses fire in the atria, which quiver instead of contracting. The AV node lets some through at random, so the ventricular rate is irregularly irregular. The atria don't empty well, blood pools, and clots can form and travel to the brain (stroke). A fast rate can cause heart failure.","care":"Control the rate (beta-blockers, diltiazem, digoxin) or rhythm (amiodarone, cardioversion), and prevent stroke with anticoagulation. Cardioversion for AFib lasting more than 48 hours requires anticoagulation or a TEE first.","nursing":[{"t":"Give rate-control drugs (diltiazem, metoprolol) as ordered.","ok":true,"r":"Slowing the ventricular rate improves filling and cardiac output."},{"t":"Teach about anticoagulation and bleeding precautions.","ok":true,"r":"Pooled atrial blood can clot and cause a stroke; anticoagulants lower that risk."},{"t":"Check the apical pulse for a full minute.","ok":true,"r":"An irregular rhythm needs a full minute; a radial count may show a pulse deficit."},{"t":"Prepare for immediate cardioversion without anticoagulation.","ok":false,"r":"AFib for more than 48 hours (or unknown duration) needs anticoagulation or a TEE first to avoid stroke."},{"t":"Teach stroke warning signs (BE-FAST).","ok":true,"r":"Early recognition of a stroke allows treatment in time."},{"t":"Start CPR because the rhythm is irregular.","ok":false,"r":"AFib with a pulse isn't cardiac arrest."},{"t":"Hold digoxin if the apical pulse is under 60.","ok":true,"r":"Digoxin slows conduction; bradycardia is a sign of toxicity."},{"t":"Encourage energy drinks to fight fatigue.","ok":false,"r":"Caffeine and stimulants can trigger AFib and raise the rate."}]},{"id":"pea","name":"Pulseless electrical activity (PEA)","normal":"Electrical activity normally triggers a mechanical squeeze that ejects blood and makes a pulse.","broke":"The monitor shows an organized rhythm, but the heart isn't pumping enough to make a pulse. The electrical system works; something else stops the pump (no blood volume, a tension pneumothorax, tamponade, a massive PE, severe acidosis, hyperkalemia). It isn't shockable.","care":"CPR and epinephrine, no shocks. The key is finding and fixing the cause, the Hs and Ts (hypovolemia is common: give volume or blood).","nursing":[{"t":"Start CPR as soon as no pulse is found.","ok":true,"r":"The monitor's rhythm doesn't mean blood is moving; treat as cardiac arrest."},{"t":"Give epinephrine every 3–5 minutes.","ok":true,"r":"Epinephrine is the main drug for nonshockable arrest rhythms."},{"t":"Search for and treat the Hs and Ts.","ok":true,"r":"PEA almost always has a cause; fixing it is how ROSC happens."},{"t":"Defibrillate because there's a rhythm on the monitor.","ok":false,"r":"PEA isn't shockable; the electrical system is already working."},{"t":"Give volume or blood fast if hypovolemia is the cause.","ok":true,"r":"Hypovolemia is a common, reversible cause of PEA."},{"t":"Trust the monitor's rhythm as proof of a pulse.","ok":false,"r":"Always check for a pulse; that's how PEA is recognized."},{"t":"Give amiodarone for the organized rhythm.","ok":false,"r":"Antiarrhythmics don't help PEA; the problem isn't the rhythm."},{"t":"Use waveform capnography to judge CPR quality.","ok":true,"r":"EtCO₂ reflects CPR quality and a sudden rise suggests ROSC."}]}],"tests":[{"id":"bmp","cat":"labs","name":"Basic metabolic panel","el":false,"normal":{"t":"Na 139, K 4.2, Cl 102, HCO₃ 24 mEq/L; BUN 15, Cr 0.9 mg/dL; glucose 102 mg/dL.","ro":[],"s":null}},{"id":"mag","cat":"labs","name":"Magnesium","el":false,"normal":{"t":"2.1 mg/dL (normal 1.7–2.2).","ro":[],"s":null}},{"id":"trop","cat":"labs","name":"Troponin I","el":false,"normal":{"t":"\u003c 0.01 ng/mL (normal).","ro":[],"s":null}},{"id":"abg","cat":"labs","name":"Arterial blood gas","el":false,"normal":{"t":"pH 7.40, PaCO₂ 40 mmHg, PaO₂ 92 mmHg, HCO₃ 24 mEq/L.","ro":[],"s":null}},{"id":"cbc","cat":"labs","name":"CBC","el":false,"normal":{"t":"WBC 7.8 K/µL, Hgb 14.1 g/dL, platelets 241 K/µL.","ro":[],"s":null}},{"id":"tsh","cat":"labs","name":"TSH & free T₄","el":false,"normal":{"t":"TSH 1.9 mIU/L. Free T₄ normal.","ro":[],"s":null}},{"id":"dig","cat":"labs","name":"Digoxin level","el":false,"normal":{"t":"Not detected (not on digoxin).","ro":[],"s":null}},{"id":"ecg","cat":"diag","name":"12-lead ECG","el":false,"normal":{"t":"Normal sinus rhythm at 78. Normal intervals and axis. No ST changes.","ro":["asys","vtp","pvt","vf","afib","pea"],"s":"Normal 12-lead ECG"}},{"id":"echo","cat":"diag","name":"Bedside cardiac ultrasound","el":false,"normal":{"t":"Both ventricles squeeze normally and in sync. No pericardial effusion.","ro":["asys","pvt","vf","pea"],"s":"Heart contracting normally"}},{"id":"etco2","cat":"diag","name":"Waveform capnography (EtCO₂)","el":false,"normal":{"t":"35–45 mmHg with a normal waveform.","ro":[],"s":null}},{"id":"cxr","cat":"img","name":"Chest X-ray (portable)","el":false,"normal":{"t":"Normal heart size. Clear lungs. No pneumothorax.","ro":[],"s":null}}],"cases":[{"id":"r-asys","dx":"asys","acute":true,"variant":"Dialysis patient found down at home","name":"Leon Watts","age":71,"sex":"M","setting":"Emergency Department","summary":"Found unresponsive at home by his son, who says it could have been 20 minutes since he last saw him. EMS has been doing CPR for 15 minutes.","history":[{"t":"Gets dialysis Monday, Wednesday, and Friday; missed Friday and Monday's sessions.","ro":[],"s":"Missed dialysis (risk of hyperkalemia)","sup":true},{"t":"His son last saw him alive about 20 minutes before finding him.","ro":[],"s":null},{"t":"Has diabetes, heart failure, and end-stage kidney disease.","ro":[],"s":null},{"t":"Is a full code.","ro":[],"s":null},{"t":"Ate a large bowl of bananas and oranges yesterday, his son says.","ro":[],"s":null},{"t":"Allergic to penicillin (hives).","ro":[],"s":null},{"t":"Uses a walker since a hip replacement 3 years ago.","ro":[],"s":null},{"t":"His son says he mentioned 'heart flutters' last month.","ro":[],"s":null}],"vitals":[{"t":"Temp 96.4 °F (35.8 °C)","ro":[],"s":null},{"t":"HR: no palpable pulse","ro":[],"s":null},{"t":"RR: none (bag-valve-mask)","ro":[],"s":null},{"t":"BP: not obtainable","ro":[],"s":null},{"t":"SpO₂: no waveform","ro":[],"s":null}],"physical":[{"t":"No carotid or femoral pulse after a 10-second check.","ro":["vtp","afib"],"s":"No pulse (cardiac arrest)","sup":true},{"t":"Unresponsive. Pupils fixed and dilated.","ro":[],"s":null},{"t":"Dialysis fistula in the le 102/64 mmHg","ro":[],"s":null},{"t":"SpO₂ 95% on room air","ro":[],"s":null}],"physical":[{"t":"Weak, regular, rapid carotid and radial pulses.","ro":["asys","pvt","vf","pea"],"s":"Pulse present (not an arrest rhythm)","sup":true},{"t":"Alert and oriented; anxious.","ro":[],"s":null},{"t":"Skin pale and slightly cool.","ro":[],"s":null},{"t":"Lungs clear.","ro":[],"s":null},{"t":"Mild ankle swelling, unchanged from his last visit.","ro":[],"s":null},{"t":"Hearing aid in the left ear.","ro":[],"s":null}],"ekg":[{"t":"6-second rhythm strip, lead II. Find the rate, the regularity, the P waves, and the QRS width.","ro":["asys","vf","afib","pea"],"s":"Regular, wide QRS at 172 (not chaotic or irregular)","sup":true}],"wave":{"kind":"vt","rate":172,"seed":5},"tests":{"ecg":{"t":"Wide-complex tachycardia at 172, QRS 0.16 s, AV dissociation. Old Q waves in V1–V4.","ro":["asys","vf","afib","pea"],"s":"Wide-complex tachycardia","sup":true},"bmp":{"t":"K 3.1 mEq/L. Otherwise normal.","ro":[],"s":null,"sup":true},"mag":{"t":"1.4 mg/dL (low).","ro":[],"s":null,"sup":true},"echo":{"t":"Rapid, weak ventricular contractions with a large scar at the front wall. Heart is pumping (pulse present).","ro":["asys","pvt","vf","pea"],"s":"Heart is pumping"},"trop":{"t":"0.02 ng/mL (borderline).","ro":[],"s":null}},"clues":"Prior MI with low EF, new diuretic with low K⁺ and Mg²⁺, regular wide-complex tachycardia at 172, and a pulse. He's currently stable; prepare for synchronized cardioversion if he becomes unstable."},{"id":"r-pvt","dx":"pvt","acute":true,"variant":"Witnessed collapse at the gym","name":"Marcus Reed","age":55,"sex":"M","setting":"Emergency Department","summary":"Collapsed on a treadmill at the gym 6 minutes ago. Bystanders started CPR. He's unresponsive with agonal gasps.","history":[{"t":"Collapsed suddenly while running; a bystander started CPR within a minute.","ro":[],"s":null},{"t":"Has untreated high blood pressure and high cholesterol.","ro":[],"s":null},{"t":"Told his wife he had chest pressure on and off this week.","ro":[],"s":null},{"t":"Smokes a pack a day.","ro":[],"s":null},{"t":"Took ibuprofen this morning for a sore knee.","ro":[],"s":null},{"t":"Recently started a high-intensity workout class.","ro":[],"s":null},{"t":"Allergic to shellfish.","ro":[],"s":null}],"vitals":[{"t":"Temp 98.2 °F (36.8 °C)","ro":[],"s":null},{"t":"HR: no palpable pulse","ro":[],"s":null},{"t":"RR: agonal gasps","ro":[],"s":null},{"t":"BP: not obtainable","ro":[],"s":null},{"t":"SpO₂: no waveform","ro":[],"s":null}],"physical":[{"t":"No carotid or femoral pulse after a 10-second check.","ro":["vtp","afib"],"s":"No pulse (cardiac arrest)","sup":true},{"t":"Unresponsive. Agonal breathing.","ro":[],"s":null},{"t":"Skin ashen and sweaty.","ro":[],"s":null},{"t":"No signs of injury.","ro":[],"s":null},{"t":"Small abrasion on the forehead from the fall.","ro":[],"s":null},{"t":"Tattoo on the right forearm.","ro":[],"s":null}],"ekg":[{"t":"6-second rhythm strip, lead II. Find the rate, the regularity, the P waves, and the QRS width.","ro":["asys","vf","afib","pea"],"s":"Regular, wide QRS at 220 (organized, not chaotic)","sup":true}],"wave":{"kind":"vt","rate":220,"seed":7},"tests":{"ecg":{"t":"Not obtained during resuscitation.","ro":[],"s":null},"echo":{"t":"No effective contraction; the ventricles twitch rapidly without ejecting.","ro":["vtp","afib"],"s":"No effective contraction","sup":true},"etco2":{"t":"12 mmHg during compressions.","ro":[],"s":null},"bmp":{"t":"K 3.9 mEq/L. Glucose 188 mg/dL.","ro":[],"s":null},"trop":{"t":"0.09 ng/mL (rising).","ro":[],"s":null}},"clues":"Sudden witnessed collapse, no pulse, regular uniform wide complexes at 220 on the monitor. Shockable: CPR and early defibrillation. The chest pressure this week suggests ischemia as the trigger."},{"id":"r-vf","dx":"vf","acute":true,"variant":"Day 2 after MI, on telemetry","name":"Diane Kessler","age":58,"sex":"F","setting":"Cardiac Step-Down Unit","summary":"Admitted 2 days ago with an MI. The telemetry alarm sounds; her nurse finds her unresponsive in bed.","history":[{"t":"Had a heart attack 2 days ago; got a stent in her left anterior descending artery.","ro":[],"s":null},{"t":"Had vomiting and diarrhea overnight.","ro":[],"s":null},{"t":"Takes aspirin, clopidogrel, atorvastatin, and metoprolol.","ro":[],"s":null},{"t":"Was chatting with her daughter 10 minutes earlier.","ro":[],"s":null},{"t":"Has hypothyroidism; takes levothyroxine.","ro":[],"s":null},{"t":"Slept poorly because of IV pump alarms.","ro":[],"s":null},{"t":"Her daughter brought a blanket from home.","ro":[],"s":null}],"vitals":[{"t":"Temp 98.8 °F (37.1 °C)","ro":[],"s":null},{"t":"HR: no palpable pulse","ro":[],"s":null},{"t":"RR: none","ro":[],"s":null},{"t":"BP: not obtainable","ro":[],"s":null},{"t":"SpO₂: no waveform","ro":[],"s":null}],"physical":[{"t":"No carotid or femoral pulse after a 10-second check.","ro":["vtp","afib"],"s":"No pulse (cardiac arrest)","sup":true},{"t":"Unresponsive. Not breathing.","ro":[],"s":null},{"t":"Skin pale.","ro":[],"s":null},{"t":"IV patent in the right forearm.","ro":[],"s":null},{"t":"Small, soft bruise at the right wrist cath site.","ro":[],"s":null},{"t":"Reading glasses on the bedside table.","ro":[],"s":null}],"ekg":[{"t":"6-second rhythm strip, lead II. Find the rate, the regularity, the P waves, and the QRS width.","ro":["asys","vtp","pvt","afib","pea"],"s":"Chaotic waves with no QRS complexes","sup":true}],"wave":{"kind":"vf","seed":11},"tests":{"ecg":{"t":"Not obtained during resuscitation.","ro":[],"s":null},"echo":{"t":"Ventricles quivering with no effective squeeze.","ro":["vtp","afib"],"s":"No effective contraction","sup":true},"bmp":{"t":"K 2.9 mEq/L (low).","ro":[],"s":null,"sup":true},"mag":{"t":"1.3 mg/dL (low).","ro":[],"s":null,"sup":true},"trop":{"t":"8.4 ng/mL (high, from her MI 2 days ago).","ro":[],"s":null}},"clues":"Recent MI, overnight GI losses with low K⁺ and Mg²⁺, sudden unresponsiveness, chaotic waves with no QRS on the monitor, no pulse. CPR and defibrillate now."},{"id":"r-afib","dx":"afib","acute":true,"variant":"New palpitations with an overactive thyroid","name":"Joan Albright","age":72,"sex":"F","setting":"Emergency Department","summary":"Her heart has been 'fluttering' for 2 days. She's short of breath climbing the stairs and has lost weight recently.","history":[{"t":"Fluttering heartbeat and fatigue for 2 days.","ro":[],"s":null},{"t":"Lost 12 lb in 2 months; feels hot and sweaty; hands shake.","ro":[],"s":null},{"t":"High blood pressure; takes amlodipine.","ro":[],"s":null},{"t":"Not on any blood thinner.","ro":[],"s":null},{"t":"Drinks a glass of wine with dinner most nights.","ro":[],"s":null},{"t":"Had a normal mammogram last month.","ro":[],"s":null},{"t":"Knits sweaters for her grandchildren.","ro":[],"s":null}],"vitals":[{"t":"Temp 98.9 °F (37.2 °C)","ro":[],"s":null},{"t":"HR 138 (irregular) bpm","ro":[],"s":null},{"t":"RR 22/min","ro":[],"s":null},{"t":"BP 134/82 mmHg","ro":[],"s":null},{"t":"SpO₂ 95% on room air","ro":[],"s":null}],"physical":[{"t":"Radial pulse irregularly irregular, varying in strength.","ro":["asys","pvt","vf","pea"],"s":"Pulse present (not an arrest rhythm)","sup":true},{"t":"Apical rate 138; radial rate 112 (pulse deficit of 26).","ro":["vtp"],"s":"Irregular pulse with a pulse deficit","sup":true},{"t":"Fine tremor of both hands; warm, moist skin.","ro":[],"s":null},{"t":"Mild crackles at both bases.","ro":[],"s":null},{"t":"Bunions on both feet.","ro":[],"s":null},{"t":"Small bruise on the left shin from bumping a table.","ro":[],"s":null}],"ekg":[{"t":"6-second rhythm strip, lead II. Find the rate, the regularity, the P waves, and the QRS width.","ro":["asys","vtp","pvt","vf","pea"],"s":"Irregularly irregular, narrow QRS, no P waves","sup":true}],"wave":{"kind":"afib","rate":138,"seed":13},"tests":{"ecg":{"t":"Atrial fibrillation with rapid ventricular response, rate 138. Narrow QRS. No ST elevation.","ro":["asys","vtp","pvt","vf","pea"],"s":"Atrial fibrillation on 12-lead","sup":true},"tsh":{"t":"TSH \u003c 0.01 mIU/L (low). Free T₄ 3.9 ng/dL (high).","ro":[],"s":null,"sup":true},"echo":{"t":"Enlarged left atrium. Ventricles pump normally; EF 55%. No clot seen.","ro":["asys","pvt","vf","pea"],"s":"Heart is pumping"},"bmp":{"t":"Normal.","ro":[],"s":null}},"clues":"Irregularly irregular pulse with a pulse deficit, no P waves and a fibrillatory baseline, enlarged left atrium, and an overactive thyroid as the trigger. She needs rate control, stroke-risk assessment, and anticoagulation."},{"id":"r-pea","dx":"pea","acute":true,"variant":"GI bleed, rhythm on the monitor but no pulse","name":"Victor Lam","age":66,"sex":"M","setting":"Medical Unit","summary":"Admitted for black, tarry stools. He just vomited a large amount of bright red blood and stopped responding. The monitor still shows a rhythm.","history":[{"t":"Admitted this morning with 2 days of black, tarry stools.","ro":[],"s":null},{"t":"Takes ibuprofen several times a day for arthritis.","ro":[],"s":null},{"t":"Drinks 6 beers a day.","ro":[],"s":null},{"t":"Just vomited a large amount of bright red blood, then went limp.","ro":[],"s":null},{"t":"Has gout; takes allopurinol.","ro":[],"s":null},{"t":"Had two polyps removed at a colonoscopy 6 years ago.","ro":[],"s":null},{"t":"Was planning a fishing trip this weekend.","ro":[],"s":null}],"vitals":[{"t":"Temp 97.6 °F (36.4 °C)","ro":[],"s":null},{"t":"HR (monitor): 118, but no palpable pulse","ro":[],"s":null},{"t":"RR: agonal gasps","ro":[],"s":null},{"t":"BP: not obtainable","ro":[],"s":null},{"t":"SpO₂: no waveform","ro":[],"s":null}],"physical":[{"t":"No carotid or femoral pulse after a 10-second check.","ro":["vtp","afib"],"s":"No pulse (cardiac arrest)","sup":true},{"t":"Unresponsive. Pale, cold skin.","ro":[],"s":null},{"t":"Large pool of blood on the bed and floor.","ro":[],"s":null},{"t":"Flat neck veins.","ro":[],"s":null},{"t":"Spider angiomas on the chest.","ro":[],"s":null},{"t":"Healed burn scar on the left hand.","ro":[],"s":null}],"ekg":[{"t":"6-second rhythm strip, lead II. Find the rate, the regularity, the P waves, and the QRS width.","ro":["asys","vtp","pvt","vf","afib"],"s":"Organized, narrow-complex rhythm (yet no pulse)","sup":true}],"wave":{"kind":"sinus","rate":118,"seed":17},"tests":{"ecg":{"t":"Not obtained during resuscitation.","ro":[],"s":null},"echo":{"t":"Small, nearly empty ventricles with weak, barely visible movement. No pericardial effusion.","ro":["vtp","afib"],"s":"Weak, ineffective contraction (empty heart)","sup":true},"cbc":{"t":"Hgb 5.4 g/dL (was 9.8 this morning).","ro":[],"s":null,"sup":true},"etco2":{"t":"10 mmHg during compressions.","ro":[],"s":null},"bmp":{"t":"K 4.4 mEq/L. BUN 64 mg/dL.","ro":[],"s":null}},"clues":"Organized narrow-complex rhythm with no pulse, an empty heart on ultrasound, massive GI bleeding with a falling Hgb: PEA from hypovolemia. CPR, epinephrine, and blood; no shocks."}]},{"id":"cardiac","name":"Cardiac Conditions","sub":"Pump, valves & pericardium","color":"#1ec8b8","blurb":"Problems with the heart muscle, its valves, the sac around it, and the circulation it supports.","hint":"Ask what's failing: the muscle (pump), a valve (murmur), the pericardium (rub, effusion, compression), infection on the endocardium, or perfusion of the whole body.","dx":[{"id":"hf","name":"Heart failure","normal":"The left ventricle pumps out what it receives, and cardiac output matches the body's needs without pressure backing up into the lungs or veins.","broke":"The ventricle is too weak (reduced EF) or too stiff (preserved EF). Output falls, pressure backs up into the lungs (left-sided: crackles, orthopnea) and veins (right-sided: JVD, edema, weight gain). The kidneys sense low flow and hold onto salt and water, which makes the overload worse.","care":"Daily weights, fluid and sodium limits, diuretics with potassium monitoring, GDMT (ACE inhibitor/ARB/ARNI, beta-blocker, SGLT2 inhibitor), upright positioning, and teaching to report weight gain early.","nursing":[{"t":"Weigh daily at the same time on the same scale.","ok":true,"r":"Weight is the best indicator of fluid gain; 2–3 lb in a day or 5 lb in a week needs reporting."},{"t":"Give IV furosemide and monitor potassium.","ok":true,"r":"Loop diuretics remove excess fluid but waste potassium."},{"t":"Keep the head of the bed elevated.","ok":true,"r":"Upright positioning eases orthopnea and reduces venous return."},{"t":"Encourage 3 liters of fluid a day.","ok":false,"r":"Extra fluid worsens overload; most patients need a fluid limit."},{"t":"Teach a low-sodium diet (about 2 g a day).","ok":true,"r":"Sodium makes the body hold water."},{"t":"Hold the beta-blocker whenever HR is over 60.","ok":false,"r":"Beta-blockers protect the failing heart; hold parameters are for bradycardia or hypotension."},{"t":"Report a weight gain of 2–3 lb in one day.","ok":true,"r":"Rapid gain is fluid, not fat, and signals worsening failure."},{"t":"Lay the patient flat to rest the heart.","ok":false,"r":"Lying flat increases venous return and worsens breathlessness."}]},{"id":"valve","name":"Valvular dysfunction","normal":"Four one-way valves open fully to let blood through and close tightly so it can't leak back.","broke":"A valve either doesn't open fully (stenosis) or doesn't close tightly (regurgitation). With aortic stenosis, the left ventricle must push against a narrow opening; it thickens, and the patient develops the classic triad: chest pain, syncope, and heart failure with exertion. The turbulent flow makes a murmur.","care":"Monitor for the triad, avoid sudden drops in preload or afterload (careful with nitrates and diuretics in aortic stenosis), plan activity with rest, prepare for valve replacement (TAVR or surgery), and teach about anticoagulation and endocarditis prevention after a valve replacement.","nursing":[{"t":"Teach to rest and report chest pain or fainting.","ok":true,"r":"In aortic stenosis, these mean the heart can't meet demand."},{"t":"Use nitrates and vasodilators with great caution.","ok":true,"r":"A stiff, thick LV depends on preload; vasodilators can crash the BP."},{"t":"Plan activities with rest periods in between.","ok":true,"r":"Pacing reduces oxygen demand on a struggling heart."},{"t":"Encourage a strenuous exercise program.","ok":false,"r":"Heavy exertion can cause syncope or sudden death with severe stenosis."},{"t":"Prepare the patient for valve replacement.","ok":true,"r":"Symptomatic severe stenosis needs the valve replaced."},{"t":"Give a large fluid bolus for low blood pressure.","ok":false,"r":"Extra volume can tip a stiff ventricle into pulmonary edema."},{"t":"Teach that the murmur will go away with rest.","ok":false,"r":"The murmur comes from the narrowed valve; it persists until repair."},{"t":"Teach good dental care and dental visits.","ok":true,"r":"Valve disease raises the risk of endocarditis."}]},{"id":"peric","name":"Pericarditis","normal":"The pericardium is a two-layer sac with a few milliliters of fluid that lets the heart slide smoothly as it beats.","broke":"The pericardium becomes inflamed (often after a virus, an MI, surgery, or with kidney failure or autoimmune disease). The rough layers rub together: sharp chest pain that's worse lying flat and with a deep breath, and better sitting up and leaning forward; a friction rub; widespread ST elevation. It can lead to effusion or tamponade.","care":"NSAIDs and colchicine, rest, positioning for comfort, and monitoring for effusion or tamponade (muffled heart sounds, falling BP, pulsus paradoxus).","nursing":[{"t":"Help the patient sit up and lean forward.","ok":true,"r":"This position eases the pull on the inflamed pericardium."},{"t":"Give NSAIDs and colchicine as ordered.","ok":true,"r":"They treat the inflammation and lower the chance of recurrence."},{"t":"Listen for a friction rub with the patient leaning forward.","ok":true,"r":"The rub is the classic sign; it's loudest at the left lower sternal border."},{"t":"Give nitroglycerin for the chest pain.","ok":false,"r":"The pain is inflammatory, not ischemic; nitrates don't help."},{"t":"Watch for muffled heart sounds and falling BP.","ok":true,"r":"These suggest the inflammation has caused an effusion or tamponade."},{"t":"Prepare for an emergency cardiac cath.","ok":false,"r":"Diffuse ST elevation with PR depression fits pericarditis, not a single blocked artery."},{"t":"Start anticoagulation with heparin.","ok":false,"r":"Anticoagulants can cause bleeding into the pericardium."},{"t":"Teach to limit strenuous activity until symptoms resolve.","ok":true,"r":"Activity can prolong inflammation and raise recurrence risk."}]},{"id":"effus","name":"Pericardial effusion","normal":"The pericardial sac holds only 15–50 mL of fluid, which keeps the heart free to fill.","broke":"Fluid builds up in the sac (from cancer, kidney failure, hypothyroidism, infection, or inflammation). If it builds slowly, the sac stretches and the heart keeps filling, so symptoms are mild (fullness, mild breathlessness, muffled heart sounds). If it builds faster than the sac can stretch, it becomes tamponade.","care":"Monitor closely for tamponade, treat the cause, and prepare for pericardiocentesis or a pericardial window if the effusion is large or growing.","nursing":[{"t":"Monitor BP, HR, JVD, and heart sounds closely.","ok":true,"r":"Changes signal progression to tamponade."},{"t":"Check for pulsus paradoxus regularly.","ok":true,"r":"A drop of more than 10 mmHg on inspiration suggests tamponade."},{"t":"Prepare for pericardiocentesis if ordered.","ok":true,"r":"Draining the fluid relieves pressure and identifies the cause."},{"t":"Give a strong diuretic to remove the fluid.","ok":false,"r":"Diuretics don't remove pericardial fluid and can lower preload dangerously."},{"t":"Report new hypotension or narrowing pulse pressure.","ok":true,"r":"These suggest the heart is being compressed."},{"t":"Massage the chest to help the fluid absorb.","ok":false,"r":"This has no effect on fluid inside the pericardium."},{"t":"Keep the patient flat in bed at all times.","ok":false,"r":"Patients usually breathe more easily upright."},{"t":"Treat the underlying cause as ordered.","ok":true,"r":"The fluid returns unless the cause (cancer, kidney failure, thyroid) is treated."}]},{"id":"tamp","name":"Cardiac tamponade","normal":"The heart relaxes fully between beats and fills with blood at low pressure.","broke":"Fluid or blood fills the pericardial sac faster than it can stretch. The pressure squeezes the heart so it can't fill, and output collapses. Beck's triad: low BP, JVD, and muffled heart sounds. Pulsus paradoxus, tachycardia, and electrical alternans also appear. Causes: trauma, cardiac surgery, or an effusion that grew. It's an emergency.","care":"Emergency pericardiocentesis or surgical drainage. Keep IV fluids running to support preload. After cardiac surgery, keep chest tubes patent. Avoid anything that lowers preload.","nursing":[{"t":"Notify the provider and prepare for pericardiocentesis.","ok":true,"r":"Removing even a small amount of fluid restores filling and BP."},{"t":"Give IV fluids as ordered to support preload.","ok":true,"r":"Volume helps the heart fill against the outside pressure."},{"t":"Check chest tubes for clots or kinks after heart surgery.","ok":true,"r":"A blocked tube lets blood collect around the heart."},{"t":"Give IV furosemide to reduce the JVD.","ok":false,"r":"Diuretics lower preload and can cause cardiac arrest in tamponade."},{"t":"Give nitroglycerin for low blood pressure.","ok":false,"r":"Nitrates lower preload and BP further."},{"t":"Recognize Beck's triad and pulsus paradoxus.","ok":true,"r":"These signs together demand immediate action."},{"t":"Wait for the next scheduled echo to confirm.","ok":false,"r":"Tamponade is an emergency; a bedside echo is done now, not later."},{"t":"Watch for drainage of blood after pericardiocentesis.","ok":true,"r":"Recurrent bleeding can cause tamponade to return."}]},{"id":"ie","name":"Infective endocarditis","normal":"The smooth inner lining of the heart and valves resists infection.","broke":"Bacteria in the blood (from IV drug use, dental procedures, catheters, or damaged or artificial valves) stick to a valve and form vegetations. The valve is damaged (new murmur, heart failure), and pieces break off as emboli to the skin, eyes, brain, kidneys, and lungs: splinter hemorrhages, Janeway lesions, Osler nodes, Roth spots, stroke.","care":"Blood cultures before antibiotics, 4–6 weeks of IV antibiotics (often through a PICC), monitoring for emboli and heart failure, and teaching about prophylaxis and dental care.","nursing":[{"t":"Draw blood cultures before the first antibiotic dose.","ok":true,"r":"Cultures identify the organism; antibiotics first can make them falsely negative."},{"t":"Give IV antibiotics on time for the full 4–6 weeks.","ok":true,"r":"Vegetations are hard to sterilize; steady levels are needed for weeks."},{"t":"Watch for signs of emboli: stroke, flank pain, cold limb.","ok":true,"r":"Pieces of vegetation can travel anywhere."},{"t":"Stop antibiotics once the fever breaks.","ok":false,"r":"Stopping early lets the infection return."},{"t":"Listen for new or changing murmurs.","ok":true,"r":"Valve damage can progress to sudden heart failure."},{"t":"Teach that dental care no longer matters.","ok":false,"r":"Good dental care and prophylaxis before some procedures prevent reinfection."},{"t":"Place the PICC line in the same arm as the IV drug use.","ok":false,"r":"Damaged veins and infection risk make that a poor site."},{"t":"Offer referral to substance use treatment.","ok":true,"r":"Ongoing IV drug use is the biggest risk for a repeat infection."}]},{"id":"shock","name":"Shock (septic / distributive)","normal":"The heart, blood volume, and vessels work together to keep the MAP above 65 and deliver oxygen to every tissue.","broke":"Perfusion fails, so cells switch to anaerobic metabolism and lactate rises. In septic shock, infection triggers massive vasodilation and leaky capillaries: low BP despite fluids, warm skin early, then cold and mottled; confusion; low urine output. Other types: hypovolemic, cardiogenic, obstructive, anaphylactic, neurogenic.","care":"Early recognition, cultures then antibiotics within an hour (sepsis), 30 mL/kg fluid bolus, vasopressors (norepinephrine) for MAP ≥ 65, lactate monitoring, and urine output ≥ 0.5 mL/kg/hr.","nursing":[{"t":"Draw cultures and lactate, then give antibiotics within an hour.","ok":true,"r":"Each hour's delay in antibiotics raises mortality in septic shock."},{"t":"Give a 30 mL/kg crystalloid bolus as ordered.","ok":true,"r":"Fluids restore volume lost to vasodilation and capillary leak."},{"t":"Start norepinephrine for MAP under 65 after fluids.","ok":true,"r":"Vasopressors tighten vessels to restore perfusion pressure."},{"t":"Monitor urine output every hour.","ok":true,"r":"Urine output under 0.5 mL/kg/hr shows the kidneys aren't perfused."},{"t":"Keep the patient warm with a heating blanket on high.","ok":false,"r":"Active heating can worsen vasodilation; use warm blankets only for comfort."},{"t":"Hold fluids until the BP improves on its own.","ok":false,"r":"Delay worsens organ damage; fluids are first-line."},{"t":"Give a diuretic for low urine output.","ok":false,"r":"Low output is from poor perfusion, not overload."},{"t":"Recheck lactate to see whether it's falling.","ok":true,"r":"A falling lactate shows perfusion is improving."}]}],"tests":[{"id":"cbc","cat":"labs","name":"CBC with differential","el":false,"normal":{"t":"WBC 7.6 K/µL, Hgb 13.8 g/dL, platelets 244 K/µL.","ro":[],"s":null}},{"id":"bmp","cat":"labs","name":"Basic metabolic panel","el":false,"normal":{"t":"Na 139, K 4.2, HCO₃ 24 mEq/L; BUN 16, Cr 0.9 mg/dL; glucose 98 mg/dL.","ro":[],"s":null}},{"id":"bnp","cat":"labs","name":"BNP","el":false,"normal":{"t":"48 pg/mL (normal \u003c 100).","ro":["hf"],"s":"Normal BNP"}},{"id":"trop","cat":"labs","name":"Troponin I","el":false,"normal":{"t":"\u003c 0.01 ng/mL (normal).","ro":[],"s":null}},{"id":"crp","cat":"labs","name":"CRP & ESR","el":false,"normal":{"t":"CRP 0.4 mg/dL, ESR 12 mm/hr (normal).","ro":["peric","ie"],"s":"No inflammation (CRP/ESR normal)"}},{"id":"bcx","cat":"labs","name":"Blood cultures × 3","el":false,"normal":{"t":"No growth at 48 hours.","ro":["ie"],"s":"Negative blood cultures"}},{"id":"lactate","cat":"labs","name":"Lactate","el":false,"normal":{"t":"1.0 mmol/L (normal).","ro":["shock"],"s":"Normal lactate"}},{"id":"tsh","cat":"labs","name":"TSH","el":false,"normal":{"t":"2.0 mIU/L (normal).","ro":[],"s":null}},{"id":"ecg","cat":"diag","name":"12-lead ECG","el":false,"normal":{"t":"Normal sinus rhythm. Normal voltage. No ST changes.","ro":["peric"],"s":"Normal ECG"}},{"id":"echo","cat":"diag","name":"Echocardiogram","el":false,"normal":{"t":"Normal chamber size and function, EF 60%. Normal valves. No pericardial effusion. No vegetations.","ro":["hf","valve","effus","tamp","ie"],"s":"Normal echo"}},{"id":"cath","cat":"diag","name":"Coronary angiogram","el":true,"normal":{"t":"Normal coronary arteries.","ro":[],"s":null}},{"id":"cxr","cat":"img","name":"Chest X-ray","el":false,"normal":{"t":"Normal heart size. Clear lungs. No effusion.","ro":["hf"],"s":"Normal heart size, clear lungs"}},{"id":"ctchest","cat":"img","name":"CT chest with contrast","el":true,"normal":{"t":"Normal heart and great vessels. No effusion or mass.","ro":[],"s":null}}],"cases":[{"id":"c-hf","dx":"hf","acute":true,"variant":"Weak heart, salt and fluid overload","name":"Raymond Kowal","age":71,"sex":"M","setting":"Emergency Department","summary":"Can't lie flat and has to sleep in his recliner. His ankles are swollen, and his shoes don't fit.","history":[{"t":"Gained 9 lb in a week; ankles and legs swollen.","ro":["peric","ie"],"s":"Rapid weight gain with edema","sup":true},{"t":"Sleeps in a recliner; wakes at night gasping for air.","ro":[],"s":"Orthopnea and PND","sup":true},{"t":"Had two heart attacks; told his heart is 'weak.'","ro":[],"s":null},{"t":"Ate a lot of deli meat and canned soup over the holidays.","ro":[],"s":null},{"t":"No fever, chills, or recent dental work.","ro":["ie"],"s":"No fever"},{"t":"Breathlessness came on gradually over a week.","ro":["tamp"],"s":"Gradual onset"},{"t":"Allergic to codeine (nausea).","ro":[],"s":null},{"t":"Gets a flu shot every fall.","ro":[],"s":null},{"t":"His grandson recently moved in with him.","ro":[],"s":null}],"vitals":[{"t":"Temp 98.2 °F (36.8 °C)","ro":[],"s":null},{"t":"HR 104 bpm","ro":[],"s":null},{"t":"RR 26/min","ro":[],"s":null},{"t":"BP 142/88 mmHg","ro":[],"s":null},{"t":"SpO₂ 89% on room air","ro":[],"s":null}],"physical":[{"t":"Crackles halfway up both lungs; S3 gallop.","ro":[],"s":"Crackles with an S3","sup":true},{"t":"JVD to the angle of the jaw; 3+ pitting edema to the knees.","ro":[],"s":null},{"t":"No friction rub; heart sounds clearly heard.","ro":["peric","tamp","effus"],"s":"No rub, heart sounds clear"},{"t":"Skin warm; mental status normal.","ro":["shock"],"s":"Warm and alert (not in shock)"},{"t":"Cloudy lenses (cataracts) in both eyes.","ro":[],"s":null},{"t":"Thick, yellowed toenails.","ro":[],"s":null}],"tests":{"bnp":{"t":"1,640 pg/mL (high).","ro":[],"s":null,"sup":true},"echo":{"t":"Dilated left ventricle, poor squeeze (EF 22%). Valves structurally normal with mild functional leak. No effusion. No vegetations.","ro":["valve","effus","tamp","ie"],"s":"Weak, dilated LV; valves and pericardium normal","sup":true},"cxr":{"t":"Enlarged heart, vascular congestion, interstitial edema, small effusions.","ro":[],"s":null,"sup":true},"bmp":{"t":"Na 132 mEq/L. K 3.6 mEq/L. BUN 34, Cr 1.4 mg/dL.","ro":[],"s":null},"trop":{"t":"0.03 ng/mL (mildly elevated, chronic).","ro":[],"s":null}},"clues":"Prior MIs with EF 22%, salty diet, 9-lb gain, orthopnea and PND, S3, crackles, JVD and edema, high BNP: acute decompensated systolic heart failure."},{"id":"c-valve","dx":"valve","acute":false,"variant":"Aortic stenosis with fainting","name":"Ida Fenwick","age":81,"sex":"F","setting":"Cardiology Clinic","summary":"Fainted while carrying groceries up her porch steps. She's also been getting chest tightness and breathlessness when she walks.","history":[{"t":"Fainted while climbing steps with groceries; also chest tightness and breathlessness with exertion.","ro":[],"s":"Exertional syncope, angina, and dyspnea","sup":true},{"t":"Was told years ago she had 'a little murmur.'","ro":[],"s":null},{"t":"No fever, weight loss, or recent infections.","ro":["ie"],"s":"No fever or infection"},{"t":"No recent viral illness; chest pain isn't affected by position.","ro":["peric"],"s":"Pain not positional"},{"t":"Takes calcium and vitamin D for osteoporosis.","ro":[],"s":null},{"t":"Lives alone and still drives to church.","ro":[],"s":null},{"t":"Had a knee replacement 6 years ago.","ro":[],"s":null}],"vitals":[{"t":"Temp 98.0 °F (36.7 °C)","ro":[],"s":null},{"t":"HR 78 bpm","ro":[],"s":null},{"t":"RR 18/min","ro":[],"s":null},{"t":"BP 112/88 mmHg","ro":[],"s":null},{"t":"SpO₂ 96% on room air","ro":[],"s":null}],"physical":[{"t":"Harsh crescendo-decrescendo systolic murmur at the right upper sternal border, radiating to both carotids.","ro":[],"s":"Harsh systolic murmur radiating to the carotids","sup":true},{"t":"Weak, slow-rising carotid pulse; narrow pulse pressure.","ro":[],"s":"Weak, delayed carotid pulse","sup":true},{"t":"No JVD, no edema, lungs clear.","ro":["hf","tamp"],"s":"No congestion"},{"t":"Skin warm; alert and oriented.","ro":["shock"],"s":"Not in shock"},{"t":"Hearing aids in both ears.","ro":[],"s":null},{"t":"Mild arthritis in the fingers.","ro":[],"s":null}],"tests":{"echo":{"t":"Heavily calcified aortic valve; valve area 0.7 cm² (severe stenosis). Thick LV walls; EF 60%. No effusion. No vegetations.","ro":["hf","effus","tamp","ie"],"s":"Severe valve narrowing; normal EF, ck"],"s":"Not in shock"},{"t":"Small tattoo on the left shoulder.","ro":[],"s":null},{"t":"Mild acne on the back.","ro":[],"s":null}],"tests":{"ecg":{"t":"Diffuse concave ST elevation in most leads with PR depression.","ro":[],"s":null,"sup":true},"crp":{"t":"CRP 8.6 mg/dL, ESR 52 mm/hr (high).","ro":[],"s":null,"sup":true},"echo":{"t":"Normal chamber size and function, EF 60%. Normal valves. Trace pericardial fluid; no chamber collapse.","ro":["hf","valve","tamp","ie"],"s":"Normal function and valves, no tamponade","sup":true},"trop":{"t":"0.02 ng/mL (borderline).","ro":[],"s":null},"bcx":{"t":"No growth at 48 hours.","ro":[],"s":null}},"clues":"Recent virus, sharp positional and pleuritic chest pain, friction rub, diffuse ST elevation with PR depression, high CRP, normal heart function: acute pericarditis."},{"id":"c-effus","dx":"effus","acute":false,"variant":"Slowly growing effusion with cancer","name":"Nora Castillo","age":62,"sex":"F","setting":"Oncology Clinic","summary":"Being treated for breast cancer. Over 3 weeks she's felt more tired, with chest fullness and mild breathlessness, especially when lying down.","history":[{"t":"Breast cancer, now spread to the lungs; on chemotherapy.","ro":[],"s":null},{"t":"Chest fullness and mild breathlessness developing slowly over 3 weeks.","ro":["tamp"],"s":"Slow, gradual onset","sup":true},{"t":"No sharp chest pain; no pain that changes with position.","ro":["peric"],"s":"No positional pain"},{"t":"No fever or chills.","ro":["ie","shock"],"s":"No fever"},{"t":"Wears a wig since losing her hair to chemo.","ro":[],"s":null},{"t":"Takes ondansetron for nausea after treatments.","ro":[],"s":null},{"t":"Lives with her husband and two dogs.","ro":[],"s":null}],"vitals":[{"t":"Temp 98.4 °F (36.9 °C)","ro":[],"s":null},{"t":"HR 96 bpm","ro":[],"s":null},{"t":"RR 20/min","ro":[],"s":null},{"t":"BP 126/78 mmHg","ro":[],"s":null},{"t":"SpO₂ 96% on room air","ro":[],"s":null}],"physical":[{"t":"Heart sounds muffled and distant.", ad burning with urination for 3 days. Her BP is still low after 2 liters of fluid.","history":[{"t":"Burning with urination for 3 days; now confused.","ro":[],"s":null},{"t":"Has diabetes and a urinary catheter at home.","ro":[],"s":null},{"t":"No chest pain; no history of heart failure.","ro":["hf","peric"],"s":"No chest pain or heart failure history"},{"t":"No recent heart surgery or chest trauma.","ro":["tamp"],"s":"No surgery or trauma"},{"t":"Had a hip replacement 4 years ago.","ro":[],"s":null},{"t":"Allergic to sulfa drugs.","ro":[],"s":null},{"t":"Her cat sleeps on her bed.","ro":[],"s":null}],"vitals":[{"t":"Temp 101.8 °F (38.8 °C)","ro":[],"s":null},{"t":"HR 124 bpm","ro":[],"s":null},{"t":"RR 28/min","ro":[],"s":null},{"t":"BP 76/40 (MAP 52) after 2 L of fluid mmHg","ro":[],"s":null},{"t":"SpO₂ 94% on 2 L","ro":[],"s":null}],"physical":[{"t":"Mottled knees; capillary refill 5 seconds; confused.","ro":["valve","peric","effus"],"s":"Signs of poor perfusion","sup":true},{"t":"Flat neck veins; heart sounds clear; no murmur.","ro":["tamp","hf","ie","valve"],"s":"No JVD or murmur"},{"t":"Cloudy urine in the catheter bag; only 40 mL in the last 2 hours.","ro":[],"s":null},{"t":"Lungs clear.","ro":[],"s":null},{"t":"Healed incision on the right hip.","ro":[],"s":null},{"t":"Dentures in place.","ro":[],"s":null}],"tests":{"lactate":{"t":"5.4 mmol/L (high).","ro":[],"s":null,"sup":true},"cbc":{"t":"WBC 21,800/µL with 18% bands.","ro":[],"s":null,"sup":true},"echo":{"t":"Small, hyperdynamic left ventricle (EF 70%). Normal valves. No effusion. No vegetations.","ro":["hf","valve","effus","tamp","ie"],"s":"Hyperdynamic heart, normal valves, no effusion","sup":true},"bcx":{"t":"E. coli growing (same as the urine culture).","ro":[],"s":null},"bmp":{"t":"Cr 2.1 mg/dL (was 0.9). HCO₃ 16 mEq/L.","ro":[],"s":null}},"clues":"Urinary source, fever, confusion, MAP 52 despite fluids, mottling, low urine output, lactate 5.4, and a hyperdynamic heart: septic (distributive) shock. Norepinephrine for MAP ≥ 65."}]},{"id":"peds","name":"Pediatric Cardiac","sub":"Congenital defects","color":"#b79cf2","blurb":"Congenital heart defects in infants and children: shunts, obstruction, and mixing problems.","hint":"Ask whether the child is cyanotic (right-to-left or mixing) or pink (left-to-right shunt or obstruction), then listen for where the murmur is and compare pulses and pressures.","dx":[{"id":"tof","name":"Tetralogy of Fallot","normal":"After birth, the right ventricle sends blue blood to the lungs and the left ventricle sends red blood to the body, with a wall between them.","broke":"Four defects: pulmonary stenosis, a VSD, an overriding aorta, and right ventricular hypertrophy. The narrow pulmonary outflow pushes blue blood across the VSD into the aorta (right-to-left shunt), so the child is cyanotic. During 'tet spells' (crying, feeding), the outflow narrows further and oxygen drops sharply.","care":"During a tet spell: knee-chest position, calm the child, oxygen, morphine as ordered. Long term: surgical repair, watching for polycythemia, hydration, and endocarditis prevention.","nursing":[{"t":"Place the infant in a knee-chest position during a spell.","ok":true,"r":"This raises systemic resistance so more blood goes to the lungs."},{"t":"Calm the child and give oxygen.","ok":true,"r":"Crying worsens the outflow narrowing; oxygen helps relax lung vessels."},{"t":"Give morphine as ordered for a severe spell.","ok":true,"r":"Morphine eases distress and relaxes the outflow tract spasm."},{"t":"Lay the infant flat and let them cry it out.","ok":false,"r":"Crying and lying flat make the spell worse."},{"t":"Keep the infant well hydrated.","ok":true,"r":"Dehydration thickens blood that's already high in red cells, raising stroke risk."},{"t":"Give a diuretic to relieve the cyanosis.","ok":false,"r":"Cyanosis comes from shunting, not fluid; diuretics dehydrate the child."},{"t":"Encourage vigorous crying to expand the lungs.","ok":false,"r":"Crying triggers or worsens tet spells."},{"t":"Teach parents what a spell looks like and how to respond.","ok":true,"r":"Parents are usually the first to see a spell at home."}]},{"id":"pda","name":"Patent ductus arteriosus","normal":"Before birth, the ductus arteriosus sends blood around the lungs. It closes within the first days of life as oxygen rises.","broke":"The ductus stays open (common in preterm infants). Blood flows from the high-pressure aorta back into the pulmonary artery (left-to-right). The lungs get flooded and the heart works harder: continuous 'machinery' murmur, bounding pulses, wide pulse pressure, rising oxygen needs, heart failure.","care":"Indomethacin, ibuprofen, or acetaminophen to close the duct (preterm infants), fluid limits, monitoring for heart failure, and catheter or surgical closure if drugs fail.","nursing":[{"t":"Give IV ibuprofen or indomethacin as ordered.","ok":true,"r":"These block prostaglandins that keep the duct open."},{"t":"Check urine output and creatinine during treatment.","ok":true,"r":"These drugs can reduce kidney blood flow."},{"t":"Keep to the ordered fluid limit.","ok":true,"r":"Extra fluid worsens lung flooding through the open duct."},{"t":"Give prostaglandin E1 to help the duct close.","ok":false,"r":"Prostaglandin keeps the duct open; it's used for duct-dependent defects."},{"t":"Watch for bleeding and feeding intolerance on NSAIDs.","ok":true,"r":"NSAIDs affect platelets and gut blood flow in preterm infants."},{"t":"Encourage large-volume feeds to build weight.","ok":false,"r":"Fluid limits and careful feeding prevent overload."},{"t":"Monitor for signs of heart failure.","ok":true,"r":"Tachypnea, poor feeding, and hepatomegaly show the shunt is significant."},{"t":"Teach parents the murmur means the baby is cyanotic.","ok":false,"r":"PDA is an acyanotic defect; blood shunts left to right."}]},{"id":"asd","name":"Atrial septal defect","normal":"A wall between the atria keeps oxygenated left-side blood separate from right-side blood.","broke":"A hole between the atria lets blood flow from left to right. The right side handles extra volume, so it enlarges. Many children have no symptoms; they may have frequent respiratory infections, fatigue, a soft systolic murmur, and a fixed split S2. Untreated, it can cause pulmonary hypertension, arrhythmias, or stroke in adulthood.","care":"Monitoring (many small defects close on their own), device closure in the cath lab or surgery for larger ones, and normal activity for most children.","nursing":[{"t":"Teach that many small ASDs close on their own.","ok":true,"r":"Small defects often close in early childhood without surgery."},{"t":"Prepare the family for device closure in the cath lab.","ok":true,"r":"Larger defects are commonly closed with a catheter device."},{"t":"Listen for a fixed split S2.","ok":true,"r":"Extra right-side volume delays pulmonic valve closure."},{"t":"Restrict the child from all physical activity.","ok":false,"r":"Most children with an ASD can be fully active."},{"t":"Encourage routine vaccines and infection prevention.","ok":true,"r":"Increased lung blood flow raises the risk of respiratory infections."},{"t":"Teach that the child will always be cyanotic.","ok":false,"r":"ASD is acyanotic; blood shunts left to right."},{"t":"Keep the child on strict bed rest before closure.","ok":false,"r":"Bed rest isn't needed for a stable child."},{"t":"Teach aspirin use as ordered after device closure.","ok":true,"r":"Aspirin prevents clots on the device while it heals over."}]},{"id":"vsd","name":"Ventricular septal defect","normal":"The ventricular septum keeps the high-pressure left ventricle separate from the right ventricle.","broke":"A hole between the ventricles lets blood flow from left to right. With a large VSD, pulmonary resistance falls in the first weeks of life and the lungs get flooded: tachypnea, sweating and tiring during feeds, poor weight gain, a loud holosystolic murmur at the left lower sternal border, and heart failure.","care":"Heart failure management (diuretics, digoxin as ordered), high-calorie feeds in small amounts, rest during feeds, and surgical repair for large defects.","nursing":[{"t":"Give small, frequent, high-calorie feeds.","ok":true,"r":"Infants tire quickly; concentrated formula gives more calories with less work."},{"t":"Allow rest periods during feeds.","ok":true,"r":"Feeding is exercise for an infant in heart failure."},{"t":"Count the apical pulse for 1 full minute before digoxin.","ok":true,"r":"Hold digoxin per parameters (often HR \u003c 90–110 in infants)."},{"t":"Feed until the infant finishes the full bottle.","ok":false,"r":"Long feeds exhaust the infant; consider gavage after 20–30 minutes."},{"t":"Weigh daily on the same scale.","ok":true,"r":"Weight tracks both growth and fluid status."},{"t":"Give extra free water between feeds.","ok":false,"r":"Extra fluid worsens overload."},{"t":"Keep the infant flat after feeds.","ok":false,"r":"Elevating the head eases breathing."},{"t":"Teach parents signs of worsening heart failure.","ok":true,"r":"Sweating, fast breathing, and poor feeding mean the shunt is worsening."}]},{"id":"coa","name":"Coarctation of the aorta","normal":"The aorta has an even width so blood reaches the arms and legs at similar pressures.","broke":"A narrowing of the aorta (usually near the ductus) means blood pressure is high above it (arms, head) and low below it (legs). Classic findings: higher BP in the arms than the legs, weak or delayed femoral pulses, headaches, nosebleeds, leg pain with exercise. Infants can present in shock when the ductus closes.","care":"Four-extremity blood pressures, balloon angioplasty or surgical repair, and close BP monitoring afterward (hypertension can persist).","nursing":[{"t":"Measure BP in all four extremities.","ok":true,"r":"Arm pressures higher than leg pressures are the key finding."},{"t":"Compare radial and femoral pulses.","ok":true,"r":"Weak, delayed femoral pulses point to a narrowed aorta."},{"t":"After repair, monitor BP closely and give antihypertensives.","ok":true,"r":"High BP is common after repair."},{"t":"Take blood pressure only in the legs.","ok":false,"r":"Comparing upper and lower pressures is what reveals the narrowing."},{"t":"After repair, check leg pulses, color, and warmth.","ok":true,"r":"Problems at the repair site can affect blood flow to the legs."},{"t":"Teach that BP will be normal for life after repair.","ok":false,"r":"Lifelong follow-up is needed; hypertension can recur."},{"t":"Encourage heavy weightlifting before repair.","ok":false,"r":"Straining raises upper-body BP further."},{"t":"Watch an infant for shock as the ductus closes.","ok":true,"r":"In critical coarctation, the duct may be the only route to the lower body."}]},{"id":"tga","name":"Transposition of the great arteries","normal":"The aorta comes off the left ventricle and the pulmonary artery off the right, so blue blood goes to the lungs and red blood to the body.","broke":"The great arteries are switched. Blue blood circulates through the body and red blood through the lungs in two separate loops. The baby survives only if blood mixes through the ductus, foramen ovale, or a septal defect. Severe cyanosis appears within hours of birth and doesn't improve with oxygen.","care":"Prostaglandin E1 to keep the ductus open, balloon atrial septostomy if needed, and the arterial switch operation in the first weeks of life. Monitor for apnea on prostaglandin.","nursing":[{"t":"Start prostaglandin E1 as ordered.","ok":true,"r":"Keeping the ductus open lets the two circulations mix."},{"t":"Monitor for apnea while on prostaglandin.","ok":true,"r":"Apnea is a common side effect of prostaglandin E1."},{"t":"Prepare for a balloon atrial septostomy.","ok":true,"r":"Enlarging the atrial opening improves mixing."},{"t":"Give high-flow oxygen to correct the cyanosis.","ok":false,"r":"Oxygen barely helps and can promote ductus closure."},{"t":"Give indomethacin to close the ductus.","ok":false,"r":"Closing the ductus would cut off mixing and be fatal."},{"t":"Support parents as they prepare for the arterial switch.","ok":true,"r":"Major surgery in a newborn is frightening; support helps them cope."},{"t":"Teach that cyanosis is normal and needs no action.","ok":false,"r":"Severe cyanosis in a newborn is an emergency."},{"t":"Keep the newborn warm and monitor glucose.","ok":true,"r":"Cold stress and low glucose raise oxygen demand."}]}],"tests":[{"id":"cbc","cat":"labs","name":"CBC","el":false,"normal":{"t":"Hgb 14.0 g/dL, Hct 42% (normal for age). Platelets normal.","ro":[],"s":null}},{"id":"bmp","cat":"labs","name":"Basic metabolic panel","el":false,"normal":{"t":"Na 138, K 4.4, HCO₃ 23 mEq/L; Cr 0.3 mg/dL; glucose 88 mg/dL.","ro":[],"s":null}},{"id":"abg","cat":"labs","name":"Blood gas","el":false,"normal":{"t":"pH 7.39, PaCO₂ 40 mmHg, PaO₂ 88 mmHg.","ro":[],"s":null}},{"id":"bnp","cat":"labs","name":"BNP","el":false,"normal":{"t":"35 pg/mL (normal).","ro":[],"s":null}},{"id":"prepost","cat":"diag","name":"Pre- and post-ductal pulse oximetry","el":false,"normal":{"t":"Right hand 99%, foot 99%. No difference.","ro":["tof","tga"],"s":"Normal oxygen saturation"}},{"id":"hyperox","cat":"diag","name":"Hyperoxia test (PaO₂ on 100% O₂)","el":false,"normal":{"t":"PaO₂ rises to 320 mmHg on 100% oxygen.","ro":["tga","tof"],"s":"Oxygen fixes the PaO₂ (not a cyanotic heart defect)"}},{"id":"bp4","cat":"diag","name":"Four-extremity blood pressures","el":false,"normal":{"t":"Right arm 96/60, left arm 94/58, right leg 104/62, left leg 102/60. Legs equal to or higher than arms.","ro":["coa"],"s":"Leg BPs not lower than arm BPs"}},{"id":"ecg","cat":"diag","name":"12-lead ECG","el":false,"normal":{"t":"Normal sinus rhythm for age. Normal axis. No hypertrophy.","ro":[],"s":null}},{"id":"echo","cat":"diag","name":"Echocardiogram","el":false,"normal":{"t":"Normal structure. Intact septa. Ductus closed. Normal great arteries and aortic arch."
