<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GI Drug Decoder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: a pharmacy-label reference — sticky section rail on the left, one section at a time on the right; every drug class is a "label" card, every section ends in a check. */
:root{
  --paper:#f6f7f8;
  --card:#ffffff;
  --ink:#16202b;
  --muted:#56616d;
  --rule:#d9dee3;
  --accent:#a3172f;      /* cardiac crimson */
  --accent-soft:#f8e6e9;
  --heme:#1f4f86;        /* hematology blue */
  --heme-soft:#e4edf8;
  --good:#1d6b42; --good-soft:#e2f2e8;
  --bad:#a12a1b;  --bad-soft:#fbe7e3;
  --warn:#8a5a00; --warn-soft:#fbf0d9;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11161c; --card:#19212a; --ink:#e7ecf1; --muted:#9aa6b2; --rule:#2c3640;
    --accent:#ef6b7f; --accent-soft:#3a1d24; --heme:#7fb0ea; --heme-soft:#1a2a3d;
    --good:#6fd39b; --good-soft:#163024; --bad:#f08a78; --bad-soft:#3a1d18; --warn:#e8b65a; --warn-soft:#352813;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11161c; --card:#19212a; --ink:#e7ecf1; --muted:#9aa6b2; --rule:#2c3640;
  --accent:#ef6b7f; --accent-soft:#3a1d24; --heme:#7fb0ea; --heme-soft:#1a2a3d;
  --good:#6fd39b; --good-soft:#163024; --bad:#f08a78; --bad-soft:#3a1d18; --warn:#e8b65a; --warn-soft:#352813;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2.1rem;font-weight:700}
h2{font-size:1.65rem;font-weight:700}
h3{font-size:1.25rem;font-weight:600}
h4{font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
a{color:var(--heme)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--heme);outline-offset:2px}
.mono{font-family:var(--mono)}

.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;padding:24px 16px;border-right:1px solid var(--rule);background:var(--card);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:4px}
.brand .rx{font-family:var(--mono);font-size:.75rem;color:var(--accent);letter-spacing:.08em}
.brand b{font-family:var(--display);font-size:1.2rem}
.brand span{font-size:.82rem;color:var(--muted)}
nav ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
nav a{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:.92rem}
nav a:hover{background:var(--paper)}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
nav .num{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
nav .chip{font-family:var(--mono);font-size:.7rem;padding:1px 6px;border-radius:10px;background:var(--paper);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
nav .chip.done{background:var(--good-soft);color:var(--good)}
.overall{font-size:.85rem;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.bar{height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);width:0}

main{padding:32px clamp(16px,4vw,48px) 80px;max-width:1080px;width:100%}
.view{display:flex;flex-direction:column;gap:28px}
.eyebrow{font-family:var(--mono);font-size:.78rem;color:var(--accent);letter-spacing:.06em}
.heme .eyebrow{color:var(--heme)}
.lede{max-width:68ch;color:var(--muted);font-size:1.05rem}
.prose{max-width:68ch;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:20px}
.objectives{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.steps .panel{display:flex;flex-direction:column;gap:6px}
.steps .panel b{font-family:var(--display);font-size:1.05rem}

/* stem table */
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-family:var(--display);font-weight:600;font-size:.85rem;background:var(--paper)}
tr:last-child td{border-bottom:0}
td .stem{font-family:var(--mono);font-weight:600;color:var(--accent)}
tr.h td .stem{color:var(--heme)}
.groupRow td{background:var(--paper);font-family:var(--display);font-weight:600;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

/* flip drill */
.drill{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.flip{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:14px 12px;min-height:96px;text-align:left;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.flip .front{font-family:var(--mono);font-size:1.05rem;font-weight:600;color:var(--accent)}
.flip.h .front{color:var(--heme)}
.flip .back{font-size:.82rem;color:var(--muted)}
.flip .hint{font-size:.75rem;color:var(--muted)}
.flip[aria-pressed="true"]{background:var(--paper)}

/* grouped nav, decode steps, tabs, ABCD tiles */
nav .navgroup{font-family:var(--display);font-size:.72rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:12px 10px 2px}
nav .navgroup:first-child{padding-top:0}
.decodeSteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dstep{border:1px solid var(--rule);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:4px;background:var(--paper)}
.dstep .big{font-family:var(--display);font-size:1.35rem;font-weight:600}
.dstep .big.mono{font-family:var(--mono);font-size:1.25rem}
.dstep mark{background:var(--accent-soft);color:var(--accent);padding:0 2px;border-radius:3px}
.dstep small{color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--rule);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:999px;font-size:.88rem}
.tab[aria-selected="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.flip .ex1{font-size:.8rem;color:var(--muted)}
.abcd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.abcdTile{display:flex;flex-direction:column;gap:4px;padding:14px;border:1px solid var(--rule);border-radius:10px;background:var(--card);text-decoration:none;color:var(--ink)}
.abcdTile .letter{font-family:var(--display);font-size:2rem;font-weight:700;line-height:1;color:var(--accent)}
.abcdTile small{color:var(--muted);font-size:.82rem}
.abcdTile:hover{border-color:var(--accent)}
.abcdTile[aria-current="page"]{border:2px solid var(--accent);background:var(--accent-soft)}
@media (max-width:700px){ .decodeSteps,.abcd{grid-template-columns:1fr 1fr} }
/* print controls */
.secHead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.cardTools{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
.printbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--card);color:var(--muted);font-size:.8rem;font-weight:600;padding:5px 10px;border-radius:6px}
.printbtn:hover{color:var(--ink);border-color:var(--muted)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));background:var(--ink);color:var(--card);padding:12px 16px;border-radius:8px;font-size:.9rem;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:10}
@media print{ .rail,.printbtn,.quiz,.pager,.toast{display:none !important} .shell{display:block} }
/* traps */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.trap{border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:0 8px 8px 0;padding:12px 14px;font-size:.92rem}
.trap b{display:block;font-family:var(--display);margin-bottom:2px}

/* pathway diagrams */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.node{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;font-size:.9rem;display:flex;flex-direction:column;gap:4px;min-width:120px;flex:1 1 120px}
.node b{font-family:var(--display);font-size:1rem}
.node small{color:var(--muted)}
.node small b{font-family:inherit;font-size:inherit;font-weight:600;color:var(--ink)}
.arrow{display:flex;align-items:center;color:var(--muted);font-family:var(--mono);font-size:1.1rem}
.block{display:inline-block;font-family:var(--mono);font-size:.74rem;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--accent);color:var(--card);align-self:flex-start}
.heme .block{background:var(--heme)}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.lane{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.lane ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.diagcap{font-size:.85rem;color:var(--muted);max-width:68ch}

/* drug class cards */
.cards{display:flex;flex-direction:column;gap:18px}
.dcard{background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.dhead{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:16px 20px;border-bottom:1px solid var(--rule);border-top:5px solid var(--accent)}
.heme .dhead{border-top-color:var(--heme)}
.dhead .stemTag{font-family:var(--mono);font-weight:600;font-size:1.05rem;color:var(--accent);align-self:start;padding:2px 10px;border:1.5px solid currentColor;border-radius:6px;white-space:nowrap}
.heme .dhead .stemTag{color:var(--heme)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem;color:var(--muted);grid-column:1/-1}
.meta b{color:var(--ink);font-weight:600}
.ex{grid-column:1/-1;font-size:.92rem}
.ex span{font-family:var(--mono);font-size:.86rem;background:var(--paper);border:1px solid var(--rule);padding:1px 7px;border-radius:4px;margin:2px 4px 2px 0;display:inline-block}
.dbody{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
.cell{padding:14px 20px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.cell:nth-child(odd){border-right:1px solid var(--rule)}
.cell.wide{grid-column:1/-1;border-right:0}
.cell ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:3px;font-size:.92rem}
.cell p{font-size:.94rem}
.cell.adv{background:var(--bad-soft)}
.cell.adv h4{color:var(--bad)}
.dtrap{padding:10px 20px;background:var(--warn-soft);font-size:.9rem}
.dtrap b{color:var(--warn)}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:16px}
.quizHead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:10px;border-top:2px solid var(--ink);padding-top:16px}
.score{font-family:var(--mono);font-size:.9rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.q{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.q .qn{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.q .stemQ{font-weight:500;max-width:72ch}
.q .tag{font-family:var(--mono);font-size:.7rem;padding:1px 6px;border-radius:4px;background:var(--warn-soft);color:var(--warn);margin-left:6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--card);cursor:pointer;font-size:.95rem}
.opt:hover{border-color:var(--muted)}
.opt input{margin:3px 0 0;accent-color:var(--heme);width:16px;height:16px}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.missed{border:2px dashed var(--good);background:var(--good-soft)}
.qfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--card);padding:8px 16px;border-radius:6px;font-weight:600;font-size:.9rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink)}
.verdict{font-weight:600;font-size:.92rem}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.why{border-left:3px solid var(--heme);padding:8px 12px;background:var(--heme-soft);border-radius:0 6px 6px 0;font-size:.92rem}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:18px}

/* summary */
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.sumcard{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.sumcard .big{font-family:var(--display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:10px}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.low{background:var(--bad-soft);color:var(--bad)}
.pill.none{background:var(--paper);color:var(--muted)}
.misslist{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.receptor td:first-child{font-family:var(--mono);font-weight:600}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule)}
  nav ol{flex-direction:row;flex-wrap:wrap}
  nav a{grid-template-columns:auto auto;padding:6px 10px}
  nav a .chip{display:none}
  nav .navgroup{width:100%;padding:8px 4px 0}
  .dbody{grid-template-columns:1fr}
  .cell:nth-child(odd){border-right:0}
}
@media (prefers-reduced-motion:no-preference){
  .opt,.flip{transition:background .15s,border-color .15s}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <span class="rx">UNIT 6 · PHARMACOLOGY</span>
      <b>GI Drug Decoder</b>
      <span>Gastrointestinal medications</span>
    </div>
    <nav aria-label="Sections"><ol id="nav"></ol></nav>
    <div class="overall">
      <div style="display:flex;justify-content:space-between"><span>Questions answered</span><span id="ovText" class="mono">0 / 0</span></div>
      <div class="bar"><i id="ovBar"></i></div>
      <button class="btn ghost" id="resetAll" type="button" style="font-size:.8rem;padding:6px 10px">Start over</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
/* ============================================================
   CONTENT
   Card fields: name, pharm, ther, stem, ex[], how, mon[], edu[], se[], ae[], trap
   Question fields: t ("mc"|"sata"), s (stem), o[] (options), a[] (correct indexes), w (rationale)
   ============================================================ */
const SECTIONS = [
{
  id:"start", num:"00", group:"Getting started", title:"Start here", kind:"intro"
},
{
  id:"decode", num:"01", group:"Getting started", title:"How to learn pharmacology", kind:"decode",
  lede:"There are too many drugs to memorize one at a time. These three habits turn a long list into a few patterns you can reason from, and help those patterns stick.",
  quiz:[
    {t:"mc", s:"A drug reference lists omeprazole with pharmacologic class “proton pump inhibitor” and therapeutic class “gastric acid suppressant.” Which statement best explains the two labels?",
     o:["Pharmacologic class tells how it works; therapeutic class tells what it treats",
        "Pharmacologic class tells what it treats; therapeutic class tells how it works",
        "Both labels describe the chemical structure the drug's stem is based on",
        "Therapeutic class is assigned only to drugs whose names have no stem"],
     a:[0], w:"The pharmacologic class names the mechanism (blocks the proton pump). The therapeutic class names the clinical use (suppresses stomach acid). H2 blockers work differently but share the same therapeutic class."},
    {t:"mc", s:"A student has 40 medications to learn for the next exam. Which approach will help the most?",
     o:["Learn one key drug per class, then compare the rest to it","Make a separate flashcard for every drug and reread them","Memorize each drug's side effects as one long list","Focus only on the drugs that seem most likely to be tested"],
     a:[0], w:"Drugs in the same class share a mechanism, monitoring, teaching and adverse effects. Learning one prototype well (omeprazole for the PPIs) and then noting how the others differ turns 40 separate facts into a handful of patterns."},
    {t:"mc", s:"Which study method leads to the best long-term recall of drug information?",
     o:["Quizzing yourself on the material over several days","Rereading your notes and highlighting the key terms","Reviewing everything in one long session the night before","Copying the textbook's drug tables word for word"],
     a:[0], w:"Retrieval practice (pulling information out of memory) spread over several days is one of the best-supported learning strategies. Rereading, highlighting and cramming feel productive but fade quickly."},
    {t:"mc", s:"A nurse knows only that a drug stops the stomach from making acid. What can the nurse predict from that alone?",
     o:["Less acid may mean less B12, calcium and iron absorbed","It will pull extra water into the bowel and cause diarrhea","It will speed stomach emptying and cause cramping","It will coat the ulcer with a thick protective paste"],
     a:[0], w:"Stomach acid helps release B12, calcium and iron from food and helps kill swallowed bacteria. Long-term acid suppression can lower those nutrients and raise the risk of some infections. The mechanism predicts the monitoring."},
    {t:"mc", s:"Which statement best describes the difference between a side effect and an adverse effect?",
     o:["A side effect is expected and mild; an adverse effect is harmful","A side effect happens only in overdose; an adverse effect never does","A side effect is an allergy; an adverse effect is a drug interaction","The two terms mean the same thing and can be used interchangeably"],
     a:[0], w:"Side effects are predictable, usually mild effects the patient can be taught to expect (dark stools with iron). Adverse effects are harmful or dangerous and need action (tardive dyskinesia with metoclopramide)."}
  ]
},
{
  id:"acid", num:"02", group:"Stomach & ulcers", title:"Acid & ulcer drugs", kind:"drug", theme:"cardiac",
  lede:"Ulcers and reflux happen when stomach acid overwhelms the lining's defenses. These drugs either make less acid, neutralize the acid already there, or strengthen the lining.",
  diagram:"acid",
  cards:[
    {name:"H2 receptor antagonists", pharm:"Histamine-2 (H2) receptor antagonist", ther:"Gastric acid suppressant", stem:"-tidine", ex:["famotidine","cimetidine","ranitidine"],
     how:"Block histamine at H2 receptors on the stomach's parietal cells, reducing acid production, especially at night. Used for GERD, peptic ulcers, heartburn and preventing stress ulcers. Weaker than PPIs but work faster for occasional heartburn.",
     mon:["Epigastric pain and signs of GI bleeding (black stools, coffee-ground emesis)","Confusion in older adults or kidney disease","Renal function (dose reduced)","Cimetidine: other drugs on the list (warfarin, phenytoin, theophylline)"],
     edu:["Take at bedtime or before meals as directed","Take 1 hour apart from antacids","Avoid smoking, alcohol, aspirin and NSAIDs","Report black stools, vomiting blood or severe stomach pain"],
     se:["Headache","Constipation or diarrhea","Dizziness"],
     ae:["Confusion, delirium (older adults, IV, kidney disease)","Gynecomastia and impotence (cimetidine)","Raised levels of interacting drugs (cimetidine)"],
     trap:"Ranitidine was removed from the US market in 2020 over a contaminant (NDMA). Cimetidine blocks liver enzymes and has the most interactions."},
    {name:"Proton pump inhibitors (PPIs)", pharm:"Proton pump inhibitor", ther:"Gastric acid suppressant", stem:"-prazole", ex:["omeprazole","esomeprazole","pantoprazole","lansoprazole"],
     how:"Irreversibly block the proton pump (H+/K+ ATPase), the final step of acid production, so they are the strongest acid suppressants. Used for GERD, erosive esophagitis, peptic ulcers, H. pylori (with antibiotics), Zollinger-Ellison syndrome and stress-ulcer prevention (IV pantoprazole).",
     mon:["Signs of GI bleeding","Magnesium level with long-term use","B12 with long-term use","Watery diarrhea (C. difficile)","Whether the drug is still needed"],
     edu:["Take 30–60 minutes before the first meal of the day","Swallow delayed-release capsules and tablets whole; some capsules can be opened onto applesauce","Report severe watery diarrhea, black stools or muscle cramps","Don't stop suddenly after long use; acid can rebound"],
     se:["Headache","Nausea","Diarrhea","Abdominal pain"],
     ae:["C. difficile infection","Pneumonia","Fractures with long-term use","Hypomagnesemia","B12 deficiency","Kidney inflammation (interstitial nephritis)"],
     trap:"Your list names pantoprazole twice. Omeprazole and esomeprazole can reduce the effect of clopidogrel."},
    {name:"Antacids", pharm:"Acid-neutralizing agent", ther:"Antacid", stem:"n/a", ex:["magnesium hydroxide","calcium carbonate"],

{

    {name:"Bulk-forming laxative", pharm:"Bulk-forming laxative", ther:"Laxative", stem:"n/a", ex:["psyllium"],

    {name:"Stimulant laxatives", pharm:"Stimulant laxative", ther:"Laxative", stem:"n/a", ex:["bisacodyl","senna"],

    {name:"Osmotic laxatives", pharm:"Osmotic laxative", ther:"Laxative", stem:"n/a", ex:["magnesium hydroxide","lactulose"],

  quiz:[

     o:["Hold the laxative and notify the provider","Give a stimulant laxative to clear the bowel","Give a bisacodyl suppository for fast relief","Give magnesium hydroxide with extra fluids"],

// stable shuffle of options per question (seeded by question id) so order is consistent across visits
function seeded(str){ let h = 2166136261; for(const c of str){ h ^= c.charCodeAt(0); h = Math.imul(h,16777619); } return function(){ h ^= h<<13; h ^= h>>>17; h ^= h<<5; return ((h>>>0)%100000)/100000; }; }
SECTIONS.forEach(sec=>{ (sec.quiz||[]).forEach((q,i)=>{
  q.id = sec.id + "-" + (i+1);
  const r = seeded(q.id); const order = q.o.map((_,k)=>k);
  for(let k=order.length-1;k>0;k--){ const j = Math.floor(r()*(k+1)); [order[k],order[j]]=[order[j],order[k]]; }
  q.order = order;
});});

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const quizSections = SECTIONS.filter(s=>s.quiz);
const totalQ = quizSections.reduce((n,s)=>n+s.quiz.length,0);

function secStats(sec){
  let done=0, ok=0;
  (sec.quiz||[]).forEach(q=>{ const a = state.answers[q.id]; if(a&&a.done){ done++; if(a.ok) ok++; } });
  return {done, ok, total:(sec.quiz||[]).length};
}

function renderNav(current){
  const nav = document.getElementById("nav");
  let lastGroup = "";
  nav.innerHTML = SECTIONS.map(s=>{
    let head = "";
    if(s.group && s.group!==lastGroup){ lastGroup = s.group; head = `<li class="navgroup">${esc(s.group)}</li>`; }
    let chip = "";
    if(s.quiz){ const st = secStats(s); chip = `<span class="chip ${st.done===st.total?'done':''}">${st.ok}/${st.total}</span>`; }
    return head + `<li><a href="#${s.id}" ${s.id===current?'aria-current="page"':''}><span class="num">${s.num}</span><span>${esc(s.title)}</span>${chip}</a></li>`;
  }).join("");
  let done=0; quizSections.forEach(s=>done+=secStats(s).done);
  document.getElementById("ovText").textContent = done + " / " + totalQ;
  document.getElementById("ovBar").style.width = (100*done/totalQ) + "%";
}

        <div class="node"><b>Signals to the parietal cell</b><small>histamine, gastrin, acetylcholine</small><span class="block">-tidine blocks histamine</span></div>

  if(kind==="hpylori") return `
  <section aria-labelledby="hpH" style="display:flex;flex-direction:column;gap:10px">

function renderQuiz(sec){
  const st = secStats(sec);
  return `<section class="quiz" aria-labelledby="qh-${sec.id}">
    <div class="quizHead"><div><div class="eyebrow">CHECK YOUR UNDERSTANDING</div><h2 id="qh-${sec.id}">${sec.kind==="final"?"Final review":"Section check"}</h2></div>
      <div style="display:flex;gap:10px;align-items:center"><span class="score">${st.ok} correct · ${st.done}/${st.total} answered</span><button class="btn ghost" type="button" data-reset="${sec.id}" style="font-size:.8rem;padding:6px 10px">Retry section</button></div></div>
    ${sec.quiz.map((q,i)=>renderQ(q,i)).join("")}
  </section>`;
}

function renderQ(q,i){
  const a = state.answers[q.id] || {sel:[]};
  const multi = q.t==="sata";
  const opts = q.order.map(k=>{
    let cls = "opt";
    if(a.done){
      const chosen = a.sel.includes(k), right = q.a.includes(k);
      if(chosen && right) cls += " correct"; else if(chosen && !right) cls += " wrong"; else if(!chosen && right) cls += " missed";
    }
    return `<label class="${cls}"><input type="${multi?'checkbox':'radio'}" name="${q.id}" value="${k}" ${a.sel.includes(k)?'checked':''} ${a.done?'disabled':''} data-q="${q.id}"><span>${esc(q.o[k])}</span></label>`;
  }).join("");
  let foot = "";
  if(a.done){
    foot = `<div class="verdict ${a.ok?'ok':'no'}">${a.ok?'Correct.':(multi?'Not quite. Dashed outlines show answers you missed.':'Not quite. The correct answer is outlined in green.')}</div><div class="why">${esc(q.w)}</div>`;
  } else {
    foot = `<div class="qfoot"><button class="btn" type="button" data-check="${q.id}" ${a.sel.length?'':'disabled'}>Check answer</button></div>`;
  }
  return `<div class="q" id="q-${q.id}"><div class="qn">QUESTION ${i+1}${multi?'<span class="tag">SELECT ALL THAT APPLY</span>':''}</div><div class="stemQ">${esc(q.s)}</div><div class="opts" role="${multi?'group':'radiogroup'}" aria-label="Answer choices">${opts}</div>${foot}</div>`;
}

document.addEventListener("change", e=>{
  const inp = e.target.closest("input[data-q]"); if(!inp) return;
  const qid = inp.dataset.q; const a = state.answers[qid] || {sel:[]}; if(a.done) return;
  const k = +inp.value;
  if(inp.type==="radio") a.sel = [k];
  else a.sel = inp.checked ? [...new Set([...a.sel,k])] : a.sel.filter(x=>x!==k);
  state.answers[qid] = a; save();
  const btn = document.querySelector(`[data-check="${qid}"]`); if(btn) btn.disabled = !a.sel.length;
});
document.addEventListener("click", e=>{
  const chk = e.target.closest("[data-check]");
  if(chk){
    const qid = chk.dataset.check; let q; SECTIONS.forEach(s=>(s.quiz||[]).forEach(x=>{ if(x.id===qid) q=x; }));
    const a = state.answers[qid]; if(!a||!a.sel.length) return;
    const sel = [...a.sel].sort(), ans = [...q.a].sort();
    a.ok = sel.length===ans.length && sel.every((v,i)=>v===ans[i]); a.done = true; save();
    const sec = SECTIONS.find(s=>(s.quiz||[]).includes(q));
    document.getElementById("q-"+qid).outerHTML = renderQ(q, sec.quiz.indexOf(q));
    renderNav(sec.id);
    const st = secStats(sec); const sc = document.querySelector(".score"); if(sc) sc.textContent = `${st.ok} correct · ${st.done}/${st.total} answered`;
    return;
  }
  const rs = e.target.closest("[data-reset]");
  if(rs){ const sec = SECTIONS.find(s=>s.id===rs.dataset.reset); sec.quiz.forEach(q=>delete state.answers[q.id]); save(); render(); return; }
  const tg = e.target.closest("[data-group]");
  if(tg){ drillGroup = tg.dataset.group; const y = window.scrollY; render(); window.scrollTo(0,y); return; }
  const fl = e.target.closest("[data-flip]");
  if(fl){ const on = fl.getAttribute("aria-pressed")!=="true"; fl.setAttribute("aria-pressed", on); fl.querySelector(".back").hidden = !on; fl.querySelector(".hint").textContent = on?"Tap to hide":"Tap to reveal"; return; }
});
document.getElementById("resetAll").addEventListener("click", ()=>{
  const b = document.getElementById("resetAll");
  if(b.dataset.confirm){ state = {answers:{}}; save(); delete b.dataset.confirm; b.textContent="Start over"; render(); }
  else { b.dataset.confirm = "1"; b.textContent = "Click again to clear all answers"; setTimeout(()=>{ delete b.dataset.confirm; b.textContent="Start over"; }, 4000); }
});

   + '<div class="printbar"><span class="eyebrow">' + esc(UNIT_LABEL + " · " + APP_TITLE) + '</span><button class="btn" type="button" onclick="window.print()">Print</button></div>'
   + bodyHtml + '</div></main>'
   + '<scr'+'ipt>window.addEventListener("load",function(){setTimeout(function(){try{window.print()}catch(e){}},500)});</scr'+'ipt></body></html>';
}
async function doPrint(title, bodyHtml, heme){
  const html = printDoc(title, bodyHtml, heme);
  if(inViewer()){
    let dl = null;
    try{ dl = await window.claude.use("downloads"); }catch(e){}
    if(!dl){ toast("Printing isn't available in this view. Open the downloaded HTML file in your browser to print."); return; }
    try{
      await dl.save({filename: fileSafe(title) + ".html", data: html});
      toast("Saved. Open the file and the print window appears; choose Save as PDF if you'd rather keep a PDF.");
    }catch(err){
      if(err && err.code === "declined") return;
      if(err && err.code === "rate_limited"){ toast("A save prompt is already open. Finish that one first."); return; }
      toast("This view couldn't save the printable copy. Use the downloadable HTML file to print instead.");
    }
    return;
  }
  try{
    let f = document.getElementById("printFrame"); if(f) f.remove();
    f = document.createElement("iframe");
    f.id = "printFrame"; f.title = "Print preview"; f.setAttribute("aria-hidden","true"); f.tabIndex = -1;
    f.style.cssText = "position:fixed;left:-10000px;top:0;width:900px;height:1200px;border:0;";
    document.body.appendChild(f);
    f.srcdoc = html;
  }catch(e){ toast("Your browser blocked printing. Try Ctrl+P (Cmd+P on a Mac)."); }
}
function sectionPrintBody(sec){
  if(sec.kind==="stems") return '<header style="display:flex;flex-direction:column;gap:8px"><div class="eyebrow">REFERENCE</div><h2>Stem cheat sheet</h2></header>' + stemTable();
  return '<header style="display:flex;flex-direction:column;gap:8px"><div class="eyebrow">SECTION ' + esc(sec.num) + '</div><h2>' + esc(sec.title) + '</h2><p class="lede">' + esc(sec.lede) + '</p></header>'
    + (sec.diagram ? sec.diagram.split(" ").filter(d=>d!=="abcd").map(diagram).join("") : "")
    + '<div class="cards">' + sec.cards.map(c=>card(c)).join("") + '</div>';
}
document.addEventListener("click", e=>{
  const pc = e.target.closest("[data-print-card]");
  if(pc){
    const [sid, ci] = pc.dataset.printCard.split("|");
    const sec = SECTIONS.find(x=>x.id===sid); const c = sec && sec.cards[+ci]; if(!c) return;
    doPrint(c.name, '<div class="eyebrow">' + esc(sec.title.toUpperCase()) + '</div>' + card(c), sec.theme==="heme");
    return;
  }
  const ps = e.target.closest("[data-print-section]");
  if(ps){
    const sec = SECTIONS.find(x=>x.id===ps.dataset.printSection); if(!sec) return;
    doPrint(sec.kind==="stems" ? "Stem cheat sheet" : sec.title, sectionPrintBody(sec), sec.theme==="heme");
  }
});
function go(id){
  viewId = id; render();
  try{ history.replaceState(null, "", "#"+id); }catch(e){}
}
// Navigate with script instead of relying on hash links, which some viewers block.
document.addEventListener("click", e=>{
  const a = e.target.closest('a[href^="#"]'); if(!a) return;
  const id = a.getAttribute("href").slice(1);
  if(!SECTIONS.some(s=>s.id===id)) return;
  e.preventDefault(); go(id);
}, true);
window.addEventListener("hashchange", ()=>{ try{ const h = location.hash.replace("#",""); if(h && h!==viewId){ viewId = h; render(); } }catch(e){} });
render();
</script>
</body>
