<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Breathless Case Rounds</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: clinical chart — patient chart pinned left, decision panel right; stacks on phones */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --sunk:#E3E9ED; --ink:#14212B; --muted:#56656F; --line:#CCD6DC;
  --accent:#1D4E8F; --accent-ink:#FFFFFF; --accent-soft:#DCE6F4;
  --alarm:#B42318; --alarm-soft:#FBE4E1;
  --ok:#1C6E46; --ok-soft:#DDF1E5; --warn:#8A5A00; --warn-soft:#FBEFD2;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F161C; --surface:#18222B; --sunk:#121B22; --ink:#E4ECF1; --muted:#97A8B3; --line:#2C3A45;
  --accent:#7FA9E8; --accent-ink:#0B1520; --accent-soft:#1C2E47;
  --alarm:#F08A7E; --alarm-soft:#3A1D1A; --ok:#6CCB97; --ok-soft:#163327; --warn:#E7B65A; --warn-soft:#3A2D12;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F161C; --surface:#18222B; --sunk:#121B22; --ink:#E4ECF1; --muted:#97A8B3; --line:#2C3A45;
  --accent:#7FA9E8; --accent-ink:#0B1520; --accent-soft:#1C2E47;
  --alarm:#F08A7E; --alarm-soft:#3A1D1A; --ok:#6CCB97; --ok-soft:#163327; --warn:#E7B65A; --warn-soft:#3A2D12;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* masthead */
.mast{padding-block:28px 20px;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink)}
.mast h1{font-size:clamp(40px,7vw,64px);text-transform:uppercase}
.mast h1 span{color:var(--alarm)}
.trace{width:220px;max-width:100%;height:44px}
.trace path{fill:none;stroke:var(--alarm);stroke-width:2.2;stroke-linejoin:round}
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;padding-block:24px}
.intro p{margin:0 0 10px;max-width:62ch}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--mono);font-weight:600;width:28px;height:28px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:13px}
.tally{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:20px}
.tally b{font-family:var(--mono);font-size:22px}
.tally .reset{margin-left:auto;background:none;border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:var(--r)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;color:var(--ink);display:grid;gap:8px;align-content:start;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3{font-size:24px}
.card .meta{color:var(--muted);font-size:14px}
.card .cc{font-style:italic}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.go{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.med{background:var(--alarm-soft);color:var(--alarm);border-color:transparent}

details.ref{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.ref summary{padding:14px 16px;font-family:var(--display);font-size:22px;font-weight:700;cursor:pointer}
.refbody{padding:0 16px 18px;display:grid;gap:18px}
.chambers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ch{border:1.5px solid var(--ink);border-radius:6px;padding:12px;background:var(--sunk);display:grid;gap:6px;align-content:start}
.ch h4{margin:0;font-family:var(--display);font-size:19px}
.ch p{margin:0;font-size:14.5px}
.fluid{height:10px;border-radius:3px;background:linear-gradient(90deg,var(--accent-soft),var(--accent))}
.reflist{margin:0;padding-left:20px;display:grid;gap:4px;max-width:80ch}

/* case view */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.back{background:none;border:1px solid var(--line);color:var(--ink);border-radius:var(--r);padding:6px 12px}
.who{display:grid}
.who b{font-family:var(--display);font-size:22px;line-height:1.1}
.who span{font-size:13px;color:var(--muted)}
.stepper{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.stepper div{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;padding:5px 9px;border-radius:4px;color:var(--muted);background:var(--sunk)}
.stepper .on{background:var(--ink);color:var(--bg)}
.stepper .past{background:var(--ok-soft);color:var(--ok)}
.layout{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:22px;padding-top:20px;align-items:start}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 96px);overflow:auto}
.chart summary{list-style:none;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.chart summary::-webkit-details-marker{display:none}
.chart summary b{font-family:var(--display);font-size:20px}
.cbody{padding:14px;display:grid;gap:16px}
.cbody h4{margin:0 0 6px;font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cbody ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:15px}
.vitals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.vitals div{background:var(--sunk);padding:8px}
.vitals small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted)}
.vitals b{font-family:var(--mono);font-weight:600;font-size:15px}
.diag{width:100%;border-collapse:collapse;font-size:14.5px}
.diag td{padding:6px 0;border-top:1px solid var(--line);vertical-align:top}
.diag td:first-child{color:var(--muted);padding-right:10px;width:38%}
.diag td:last-child{font-family:var(--mono);font-size:13.5px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:16px;min-width:0}
.panel h2{font-size:30px}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.order{border-left:4px solid var(--accent);background:var(--sunk);padding:12px 14px;border-radius:0 6px 6px 0;font-size:17px;font-weight:600}
.order.med{border-left-color:var(--alarm)}
.hint{color:var(--muted);font-size:14.5px;margin:0}
.opts{display:grid;gap:8px}
.dxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.opt{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;padding:11px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;text-align:left;color:var(--ink)}
.opt input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.locked{cursor:default}
.opt .note{display:block;font-size:14px;margin-top:4px;color:var(--muted)}
.opt .tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-right:6px}
.opt.r-hit{border-color:var(--ok);background:var(--ok-soft)} .opt.r-hit .tag{color:var(--ok)}
.opt.r-wrong{border-color:var(--alarm);background:var(--alarm-soft)} .opt.r-wrong .tag{color:var(--alarm)}
.opt.r-miss{border-color:var(--warn);border-style:dashed;background:var(--warn-soft)} .opt.r-miss .tag{color:var(--warn)}
.opt.r-ok{border-color:var(--line)} .opt.r-ok .tag{color:var(--muted)}
.verdict{padding:12px 14px;border-radius:6px;display:grid;gap:4px}
.verdict.good{background:var(--ok-soft);color:var(--ok)}
.verdict.part{background:var(--warn-soft);color:var(--warn)}
.verdict b{font-family:var(--display);font-size:20px}
.verdict p{margin:0;color:var(--ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:var(--r);padding:11px 20px;font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.count{font-family:var(--mono);font-size:13px;color:var(--muted)}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.scores div{border:1px solid var(--line);border-radius:6px;padding:12px}
.scores b{display:block;font-family:var(--mono);font-size:26px}
.big{font-family:var(--mono);font-size:56px;font-weight:600;line-height:1}
@media (max-width:860px){
  .intro{grid-template-columns:1fr}
  .layout{grid-template-columns:1fr}
  .chart{position:static;max-height:none}
  .stepper{margin-left:0;width:100%}
  .chambers{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
// Option format: [text, correct(1/0), feedback note]
const DX = [
  {id:"pe", name:"Pulmonary Embolism"},
  {id:"fes", name:"Fat Embolism Syndrome"},
  {id:"flail", name:"Flail Chest"},
  {id:"ards", name:"ARDS"},
  {id:"arf", name:"Acute Respiratory Failure"},
  {id:"ptx", name:"Pneumothorax"},
  {id:"htx", name:"Hemothorax"},
  {id:"tptx", name:"Tension Pneumothorax"},
  {id:"pedema", name:"Pulmonary Edema"}
];
const CASES = [];

/* ---------- CASE: Pulmonary Embolism ---------- */
CASES.push({
  id:"pe", patient:"Linda Kowalski", age:58, sex:"F",
  unit:"Orthopedic unit · Post-op day 4", complaint:"“I suddenly can’t catch my breath.”",
  dx:["pe"], ok:[],
  history:[
    "Right total knee arthroplasty 4 days ago. Has refused SCDs at night and walked only to the bathroom.",
    "History: obesity (BMI 34), hypertension, takes oral estrogen (HRT), smokes ½ pack per day.",
    "At 0645 she called out with sudden shortness of breath and sharp right-sided chest pain that worsens when she breathes in.",
    "States “I feel like something terrible is happening.”"
  ],
  vitals:{T:"38.0 °C",HR:"122",RR:"30",BP:"104/68",SpO2:"87% RA",Pain:"8/10 chest"},
  assess:[
    "Anxious, restless, diaphoretic",
    "Lungs: few fine crackles right base; otherwise clear",
    "Cough producing blood-streaked sputum",
    "Right calf swollen, warm, tender; circumference 3 cm larger than left",
    "Knee incision clean, dry, approximated; knee pain 3/10"
  ],
  diag:[
    ["ABG (room air)","pH 7.48 · PaCO₂ 30 · PaO₂ 58 · HCO₃ 23"],
    ["D-dimer","2.8 mcg/mL FEU (ref < 0.5)"],
    ["CT pulmonary angiogram","Filling defect in right lower lobe pulmonary artery"],
    ["Chest x-ray","No infiltrate, no effusion"],
    ["ECG","Sinus tachycardia 122"],
    ["CBC","Hgb 11.2 g/dL · Plt 238,000"],
    ["Glucose","128 mg/dL"]
  ],
  dxNote:"Sudden dyspnea, pleuritic chest pain, tachycardia, hypoxemia with a clear chest x-ray, plus a swollen, tender calf in a post-orthopedic patient point to a DVT that traveled to the lung. The CT pulmonary angiogram confirms it.",
  support:[
    ["Sudden dyspnea with pleuritic chest pain",1,"Classic presenting pair; the clot causes V/Q mismatch and pleural irritation."],
    ["HR 122, RR 30, SpO₂ 87%",1,"Tachycardia and tachypnea are the most common signs; hypoxemia comes from perfusion loss to ventilated alveoli."],
    ["Right calf swollen, warm, tender, 3 cm larger",1,"Signs of DVT, the source of most pulmonary emboli."],
    ["Refused SCDs, minimal ambulation, HRT, smoker, obesity",1,"Virchow’s triad: venous stasis plus hypercoagulability from estrogen and smoking."],
    ["Blood-streaked sputum",1,"Hemoptysis can occur with pulmonary infarction."],
    ["ABG: pH 7.48, PaCO₂ 30, PaO₂ 58",1,"Respiratory alkalosis from hyperventilation with hypoxemia is typical early in PE."],
    ["D-dimer 2.8",1,"Elevated D-dimer shows active clot breakdown; sensitive but not specific."],
    ["CTPA filling defect",1,"This is the confirming test."],
    ["Chest x-ray clear",1,"Severe hypoxemia with a clear chest film is a strong clue for PE."],
    ["Knee incision clean and dry",0,"Expected post-op finding; unrelated to the respiratory problem."],
    ["Hgb 11.2 g/dL",0,"Mild post-op anemia is expected after arthroplasty and does not explain the event."],
    ["Glucose 128",0,"Mild stress hyperglycemia; not diagnostic."]
  ],
  orders:[
    {o:"Oxygen via non-rebreather mask; titrate to SpO₂ ≥ 94%. HOB elevated.", opts:[
      ["Corrects hypoxemia caused by V/Q mismatch",1,"Perfusion is blocked to ventilated alveoli, so oxygenation falls."],
      ["Elevating the HOB eases the work of breathing and improves lung expansion",1,"Upright positioning lowers the diaphragm."],
      ["Supplemental oxygen dissolves the embolus",0,"Oxygen treats the hypoxemia, not the clot."],
      ["A non-rebreather is used because she retains CO₂",0,"She has a low PaCO₂; the NRB is used to deliver high FiO₂."]
    ]},
    {o:"Heparin 80 units/kg IV bolus, then 18 units/kg/hr infusion. aPTT (or anti-Xa) q6h; adjust per protocol.", med:true, opts:[
      ["Prevents the clot from growing and stops new clots from forming",1,"Heparin inactivates thrombin and factor Xa."],
      ["Breaks down (lyses) the existing embolus",0,"Heparin is an anticoagulant, not a thrombolytic. The body’s fibrinolytic system dissolves the clot over time."],
      ["The aPTT or anti-Xa level is used to keep the dose in the therapeutic range",1,"Typical aPTT goal is 1.5–2.5 times control."],
      ["Protamine sulfate is the antidote for heparin overdose or bleeding",1,"Keep the antidote in mind before any high-risk medication."],
      ["The INR is the lab used to adjust the heparin infusion",0,"INR monitors warfarin, not heparin."]
    ]},
    {o:"Warfarin 5 mg PO daily, start today. Continue heparin until INR 2–3 for 24 hours (minimum 5 days of overlap).", med:true, opts:[
      ["Warfarin takes several days to reach a full anticoagulant effect, so heparin must overlap",1,"Warfarin blocks synthesis of vitamin K–dependent factors; existing factors take days to clear."],
      ["Therapeutic INR target for PE is 2–3",1,"Standard target range for VTE."],
      ["Vitamin K is the antidote for warfarin",1,"Vitamin K restores clotting-factor synthesis."],
      ["Warfarin works immediately, so the heparin is only a backup",0,"Warfarin can briefly be prothrombotic when started; the overlap protects her."]
    ]},
    {o:"CBC with platelets daily.", opts:[
      ["Detects heparin-induced thrombocytopenia (HIT)",1,"A platelet drop of 50% or more, usually 5–10 days after starting heparin, suggests HIT."],
      ["Monitors hemoglobin for bleeding while anticoagulated",1,"Falling Hgb may signal occult bleeding."],
      ["Measures how well the heparin is working",0,"That is the aPTT or anti-Xa level."],
      ["Platelets above 150,000 mean the heparin dose can be doubled",0,"Platelet count does not set the heparin dose."]
    ]},
    {o:"Morphine 2 mg IV q2h PRN chest pain. No NSAIDs.", med:true, opts:[
      ["Relieves pleuritic pain so she can breathe more deeply",1,"Pain causes shallow breathing and worsens hypoxemia."],
      ["Reduces anxiety and myocardial oxygen demand",1,"Lowering sympathetic drive helps an already strained heart."],
      ["NSAIDs are avoided because they add bleeding risk on top of anticoagulation",1,"Combined antiplatelet and anticoagulant effects raise bleeding risk."],
      ["Monitor respiratory rate and sedation level after each dose",1,"Opioids depress respirations, which she cannot afford."],
      ["Morphine dilates the pulmonary artery and moves the clot",0,"Morphine has no effect on the embolus."]
    ]},
    {o:"If SBP < 90 mm Hg or signs of right heart failure develop, notify MD STAT. Alteplase 100 mg IV over 2 hours may be considered.", med:true, opts:[
      ["Alteplase is a thrombolytic that actively dissolves the clot",1,"It converts plasminogen to plasmin, which breaks down fibrin."],
      ["Thrombolytics are reserved for massive PE with hemodynamic instability",1,"Bleeding risk is too high to use them for stable PE."],
      ["Her surgery 4 days ago raises bleeding risk and must be weighed before giving it",1,"Recent major surgery is a contraindication that the provider must weigh against the risk of death."],
      ["It is given to every patient with a confirmed PE",0,"Most stable patients receive anticoagulation alone."]
    ]}
  ],
  teach:[
    {o:"Use a soft toothbrush and an electric razor; report black stools, nosebleeds, bleeding gums, or unusual bruising.", opts:[
      ["Anticoagulants raise the risk of bleeding from minor trauma",1,"Preventing injury prevents bleeding."],
      ["Black, tarry stools can signal GI bleeding",1,"Melena is a sign of upper GI bleeding."],
      ["These precautions are only needed while she is in the hospital",0,"They continue for the full course of anticoagulation, often 3 months or longer."],
      ["Aspirin or ibuprofen are safe for knee pain at home",0,"Both increase bleeding risk; acetaminophen is preferred unless the provider says otherwise."]
    ]},
    {o:"Keep vitamin K intake consistent from week to week; limit alcohol.", opts:[
      ["Sudden changes in vitamin K intake change the INR",1,"More vitamin K lowers the INR; less raises it."],
      ["She must avoid all leafy green vegetables",0,"Consistency matters, not avoidance."],
      ["Alcohol can increase warfarin’s effect and bleeding risk",1,"Alcohol affects warfarin metabolism and irritates the GI tract."],
      ["Many herbal supplements, such as ginkgo, interact with warfarin",1,"Ask before starting any new supplement or OTC drug."]
    ]},
    {o:"Walk regularly, do ankle pumps, avoid crossing legs or sitting for long periods, and stop to walk every 1–2 hours on long trips.", opts:[
      ["Muscle contraction pushes venous blood back to the heart and prevents stasis",1,"The calf muscle pump is a key DVT defense."],
      ["Crossing the legs compresses veins and slows blood flow",1,"Compression promotes stasis."],
      ["She should massage her sore calf to break up the clot",0,"Never massage a leg with a known or suspected DVT; it could dislodge clot."],
      ["Activity is unsafe until the clot is completely gone",0,"Early ambulation on therapeutic anticoagulation is encouraged."]
    ]},
    {o:"Discuss stopping estrogen therapy and quitting smoking with her provider.", opts:[
      ["Estrogen increases clotting-factor production and VTE risk",1,"Hormone therapy is a recognized risk factor."],
      ["Smoking damages vessel walls and increases blood viscosity",1,"Endothelial injury and hypercoagulability are part of Virchow’s triad."],
      ["Smoking only affects the lungs, not clotting",0,"Smoking promotes clot formation."],
      ["Stopping estrogen will dissolve the current clot",0,"It lowers future risk; it does not treat the existing clot."]
    ]},
    {o:"Call 911 for sudden shortness of breath, chest pain, or coughing up blood. Wear a medical alert ID and tell all providers, including the dentist, that she takes an anticoagulant.", opts:[
      ["These are signs of a recurrent PE, which can be fatal",1,"Recurrence needs emergency evaluation."],
      ["Providers need to know before procedures because of bleeding risk",1,"Dental and surgical procedures may need planning."],
      ["She should wait to see whether symptoms pass before calling",0,"Delay can be fatal."],
      ["A medical alert ID is only needed if she has an allergy",0,"It alerts responders to anticoagulation in an emergency."]
    ]}
  ]
});

/* ---------- CASE: Fat Embolism ---------- */
CASES.push({
  id:"fes", patient:"Tyler Brennan", age:22, sex:"M",
  unit:"Trauma step-down · Hospital day 2", complaint:"Suddenly confused and short of breath",
  dx:["fes"], ok:[],
  history:[
    "Motorcycle crash 36 hours ago. Closed, displaced right femoral shaft fracture in skeletal traction, awaiting ORIF.",
    "No head strike per EMS; helmeted. CT head on admission negative.",
    "Previously healthy. No medications.",
    "His girlfriend reports he “isn’t making sense” and is trying to climb out of bed."
  ],
  vitals:{T:"38.9 °C",HR:"128",RR:"32",BP:"118/70",SpO2:"86% RA",Pain:"6/10 thigh"},
  assess:[
    "Restless, confused, oriented to name only; GCS 13",
    "Pinpoint red-brown rash across chest, axillae, and conjunctivae",
    "Lungs: scattered crackles bilaterally; using accessory muscles",
    "Right foot warm, pedal pulse 2+, capillary refill < 3 seconds",
    "Traction weights hanging freely"
  ],
  diag:[
    ["ABG (room air)","pH 7.47 · PaCO₂ 32 · PaO₂ 55 · HCO₃ 23"],
    ["Chest x-ray","Diffuse bilateral fluffy infiltrates (“snowstorm” pattern)"],
    ["Platelets","98,000 (admission 250,000)"],
    ["Hemoglobin","10.9 g/dL (admission 13.8)"],

      ["The x-ray was needed before decompression",0,"Tension pneumothorax is treated on clinical findings."],
      ["Shows whether a residual pneumothorax remains",1,"Guides further management."]
    ]},
    {o:"Lactated Ringer’s 500 mL bolus. Notify if MAP < 65 after decompression.", opts:[
      ["Supports preload while venous return recovers",1,"May help blood pressure."],
      ["Persistent hypotension after decompression needs other causes ruled out",1,"Consider bleeding or a misplaced line."],

      ["Comfort promotes ventilator synchrony",1,"Fighting the vent raises airway pressures."],
      ["Fentanyl reduces the size of the pneumothorax",0,"Pain management only."],
      ["Hold or reduce if BP is low; notify the provider",1,"Opioids can lower BP."]

  ],
  teach:[
    {o:"Do not clamp a chest tube for routine care or transport.", opts:[
      ["Clamping traps air in the pleural space and can cause tension pneumothorax",1,"Especially on positive pressure."],
      ["If the system must be changed, clamp only briefly and per policy",1,"Be fast and monitor."],
      ["Clamping protects the patient during transport",0,"Keep the unit below chest level and unclamped."],
      ["A clamped tube with worsening distress must be unclamped immediately",1,"This may relieve the tension."]
    ]},
    {o:"Assess the chest tube system each hour: water-seal level, tidaling (reversed on the ventilator), air leak, drainage, and dressing.", opts:[
      ["Continuous bubbling in the water seal indicates an air leak",1,"Expected right after tension pneumo but should decrease."],
      ["On a ventilator, the water level rises on expiration and falls on inspiration",1,"Positive pressure reverses tidaling."],
      ["Missing tidaling always means the lung is fully re-expanded",0,"It may also mean an obstruction."],
      ["Check the insertion site for an intact, occlusive dressing",1,"Prevents air entry."]
    ]},
    {o:"Mark the edges of subcutaneous emphysema with a skin marker and reassess.", opts:[
      ["Spreading crepitus suggests a continuing air leak",1,"Report spread."],
      ["Crepitus spreading to the face and neck can threaten the airway",1,"Watch closely."],
      ["Subcutaneous emphysema is painful and needs immediate surgery",0,"It usually reabsorbs on its own."],
      ["Reassure the family that it usually resolves over several days",1,"It can look alarming."]
    ]},
    {o:"Explain to Rosa’s family what happened, in plain language, and what the chest tube does.", opts:[
      ["Air leaked around the lung and pressed on the heart and lung; it was released quickly",1,"Clear explanation lowers fear."],
      ["The chest tube keeps air from building up again while the lung heals",1,"Helps them understand the equipment."],
      ["Tell them the event was caused by the nurse",0,"Explain facts without assigning blame; the provider leads disclosure of complications."],
      ["Invite questions and offer updates",1,"Supports family coping."]
    ]}
  ]
});

/* ---------- CASE: Pulmonary Edema ---------- */
CASES.push({
  id:"pedema", patient:"Frank Moretti", age:76, sex:"M",

    ["Ran out of furosemide; high-sodium meals",1,"Common triggers for acute decompensation."],
    ["BNP 1,840",1,"Released from stretched ventricles; strongly supports a cardiac cause."],
    ["Butterfly infiltrates, Kerley B lines, cardiomegaly",1,"Classic x-ray findings of cardiogenic edema."],
    ["SpO₂ 82%, PaO₂ 52",1,"Fluid-filled alveoli block oxygen diffusion."],
    ["Cataract surgery 2019",0,"Unrelated."],
    ["Glucose 118",0,"Not diagnostic."],

      ["Sitting up with legs down reduces venous return to the heart (preload)",1,"Less blood returning means less fluid backing into the lungs."],
      ["Upright position improves lung expansion",1,"Lowers the diaphragm."],
      ["BiPAP raises intrathoracic pressure, pushing fluid out of the alveoli and lowering preload",1,"Also reduces the work of breathing."],

      ["IV furosemide causes venodilation within minutes, lowering preload even before diuresis",1,"Early relief of congestion."],

      ["At higher doses it also lowers afterload, helping the weak ventricle eject",1,"Arterial dilation."],

      ["Using the same conditions makes the numbers comparable",1,"Consistency matters."],

    ]},

      ["Running out of furosemide led to this episode",1,"Connect the behavior to the outcome."],

    ]},
    {o:"Rise slowly from lying or sitting. Report dizziness, muscle cramps, or a very fast or irregular heartbeat.", opts:[
      ["Diuretics and vasodilators can cause orthostatic hypotension",1,"Prevents falls."],

      ["He is at higher fall risk because of his age and medications",1,"Safety teaching."]
    ]},
    {o:"Call 911 for severe shortness of breath, pink frothy sputum, or chest pain. Call the provider for needing more pillows to sleep, new swelling, or reduced activity tolerance.", opts:[
      ["Severe symptoms mean pulmonary edema is returning and needs emergency care",1,"Do not drive himself."],
      ["Worsening orthopnea and swelling are early warning signs",1,"Early treatment can prevent admission."],
      ["He should take an extra furosemide dose and wait 2 days",0,"Follow the provider’s action plan; do not delay care."],

</script>
<script>
(function(){
const ORDER = ["htx","ards","pe","ptx","fes","arf","pedema","flail","tptx"];
const BYID = Object.fromEntries(CASES.map(c=>[c.id,c]));
const LIST = ORDER.map(id=>BYID[id]);
const STAGES = ["Diagnosis","Evidence","MD orders","Teaching","Summary"];
const KEY = "breathless-rounds-v1";
const app = document.getElementById("app");

let S = {};
try { S = JSON.parse(localStorage.getItem(KEY)||"{}") || {}; } catch(e){ S = {}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let view = {caseId:null};
let pending = new Set();

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function hash(str){ let h=2166136261; for(const ch of str){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
function shuffled(n, seed){ const a=[...Array(n).keys()]; let s=hash(seed)||1;
  for(let i=n-1;i>0;i--){ s=Math.imul(s^(s>>>15),2246822519)>>>0; s^=s<<13; s>>>=0; const j=s%(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function st(id){ if(!S[id]) S[id]={stage:0,dx:null,support:null,orders:[],teach:[],idx:0}; return S[id]; }

/* Score a multi-select: every option is one decision */
function scoreOpts(opts, sel){ let right=0; opts.forEach((o,i)=>{ if(!!o[1]===sel.includes(i)) right++; }); return {right,total:opts.length}; }
function scoreDx(c, sel){ let right=0; DX.forEach(d=>{ const req=c.dx.includes(d.id), okx=c.ok.includes(d.id), s=sel.includes(d.id);
  if(req? s : (okx || !s)) right++; }); return {right,total:DX.length}; }
function caseScore(c){ const s=st(c.id); let r=0,t=0; const parts={};
  if(s.dx){ const x=scoreDx(c,s.dx); parts.dx=x; r+=x.right; t+=x.total; }
  if(s.support){ const x=scoreOpts(c.support,s.support); parts.support=x; r+=x.right; t+=x.total; }
  for(const k of ["orders","teach"]){ let a=0,b=0; s[k].forEach((sel,i)=>{ if(sel){ const x=scoreOpts(c[k][i].opts,sel); a+=x.right; b+=x.total; }}); if(b){parts[k]={right:a,total:b};} r+=a; t+=b; }
  return {right:r,total:t,parts}; }
function pct(x){ return x.total? Math.round(100*x.right/x.total) : 0; }

/* ---------- HOME ---------- */
function home(){
  view.caseId=null;
  let done=0, r=0, t=0;
  LIST.forEach(c=>{ const s=st(c.id); if(s.stage>=4) done++; const x=caseScore(c); r+=x.right; t+=x.total; });
  app.innerHTML = `
  <header class="mast">
    <div><div class="eyebrow">Critical respiratory emergencies · Case rounds</div>
    <h1>Breath<span>less</span></h1></div>
    <svg class="trace" viewBox="0 0 220 44" aria-hidden="true"><path d="M0 30 L40 30 L50 30 L56 12 L62 38 L70 30 L110 30 L118 30 L124 8 L130 40 L138 30 L180 30 L186 22 L192 34 L198 30 L220 30"/></svg>
  </header>
  <section class="intro">
    <div>
      <p>Nine patients, nine respiratory emergencies. Each case gives you the history, vital signs, assessment, and diagnostics. Work through it the way you would at the bedside.</p>
      <p class="hint">Diagnoses covered: pulmonary embolism, fat embolism, flail chest, ARDS, acute respiratory failure, pneumothorax, hemothorax, tension pneumothorax, and pulmonary edema. Cases appear in random order, so the patient’s name won’t give it away.</p>
    </div>
    <ol class="steps">
      <li><span><b>Diagnose.</b> Select every diagnosis the case fits.</span></li>
      <li><span><b>Gather evidence.</b> Select the data that support your diagnosis.</span></li>
      <li><span><b>Work the orders.</b> For each MD order, select every correct rationale.</span></li>
      <li><span><b>Teach and intervene.</b> Select every correct rationale for each teaching point.</span></li>
    </ol>
  </section>
  <div class="tally">
    <span>Cases completed <b>${done}</b>/9</span>
    <span>Overall accuracy <b>${t?pct({right:r,total:t})+"%":"—"}</b></span>
    <button class="reset" id="resetAll">Clear all answers</button>
  </div>
  <div class="grid">
    ${LIST.map((c,i)=>{ const s=st(c.id); const x=caseScore(c);
      const pill = s.stage>=4 ? `<span class="pill done">${pct(x)}% · done</span>` : (x.total? `<span class="pill go">In progress</span>` : `<span class="pill">Not started</span>`);
      return `<button class="card" data-open="${c.id}">
        <div class="top"><span class="eyebrow">Case ${i+1}</span>${pill}</div>
        <h3>${esc(c.patient)}, ${c.age}${c.sex}</h3>
        <div class="meta">${esc(c.unit)}</div>
        <div class="cc">${esc(c.complaint)}</div>
      </button>`; }).join("")}
  </div>
  ${chestRef()}
  `;
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openCase(b.dataset.open));
  const rb=document.getElementById("resetAll"); let armed=false;
  rb.onclick=()=>{ if(!armed){ armed=true; rb.textContent="Click again to clear everything"; return;} S={}; save(); home(); };
}

function chestRef(){ return `
  <details class="ref"><summary>Chest tube field notes</summary>
  <div class="refbody">
    <div class="chambers">
      <div class="ch"><span class="eyebrow">Chamber 1</span><h4>Collection</h4><p>Drainage from the pleural space collects here. Mark the level and time each shift (hourly after trauma). Note amount, color, and consistency.</p></div>
      <div class="ch"><span class="eyebrow">Chamber 2</span><h4>Water seal</h4><div class="fluid" aria-hidden="true"></div><p>About 2 cm of water acts as a one-way valve. Expect <b>tidaling</b> (rises on inspiration, falls on expiration; reversed on a ventilator). <b>Continuous bubbling</b> means an air leak.</p></div>
      <div class="ch"><span class="eyebrow">Chamber 3</span><h4>Suction control</h4><p>Wet: water level (usually 20 cm) sets suction; gentle continuous bubbling is expected. Dry: a dial sets suction and an indicator shows it is working.</p></div>
    </div>
    <ul class="reflist">
      <li>Keep the unit upright and below chest level. Keep tubing free of kinks and dependent loops.</li>
      <li>Do not clamp for routine care or transport — clamping can cause tension pneumothorax.</li>
      <li>Tube out of the chest: occlusive dressing taped on three sides; call the provider.</li>
      <li>Tube disconnected from the unit: submerge the end 2 cm in sterile water; reconnect a new system.</li>
      <li>Do not routinely strip or milk tubing.</li>
      <li>Report drainage ≥ 1,500 mL initially or 200 mL/hr for 2–4 hours, new or increased air leak, spreading subcutaneous emphysema, or sudden respiratory distress.</li>
      <li>Removal: premedicate; patient holds breath or bears down as the tube is pulled; occlusive dressing; chest x-ray.</li>
    </ul>
  </div></details>`; }

/* ---------- CASE ---------- */
function openCase(id){ view.caseId=id; pending=new Set(); renderCase(); window.scrollTo(0,0); }

function chartHTML(c, open){
  const v=c.vitals;
  const vit=[["TEMP",v.T],["HR",v.HR],["RR",v.RR],["BP",v.BP],["SpO₂",v.SpO2],["PAIN",v.Pain]];
  return `<details class="chart" ${open?"open":""}><summary><b>Patient chart</b><span class="eyebrow">tap to ${open?"hide":"show"}</span></summary>
  <div class="cbody">
    <div><h4>History</h4><ul>${c.history.map(h=>`<li>${esc(h)}</li>`).join("")}</ul></div>
    <div><h4>Vital signs</h4><div class="vitals">${vit.map(([k,x])=>`<div><small>${k}</small><b>${esc(x)}</b></div>`).join("")}</div></div>
    <div><h4>Assessment</h4><ul>${c.assess.map(h=>`<li>${esc(h)}</li>`).join("")}</ul></div>
    <div><h4>Diagnostics</h4><table class="diag">${c.diag.map(([a,b])=>`<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join("")}</table></div>
  </div></details>`;
}

function renderCase(){
  const c=BYID[view.caseId], s=st(c.id), num=LIST.indexOf(c)+1;
  const step = STAGES.map((n,i)=>`<div class="${i===s.stage?"on":(i<s.stage?"past":"")}">${i<4?(i+1)+" ":""}${n}</div>`).join("");
  const wide = window.matchMedia("(min-width: 861px)").matches;
  app.innerHTML = `
  <div class="bar">
    <button class="back" id="back">← All cases</button>
    <div class="who"><b>Case ${num}: ${esc(c.patient)}, ${c.age}${c.sex}</b><span>${esc(c.unit)}</span></div>
    <div class="stepper">${step}</div>
  </div>
  <div class="layout">
    ${chartHTML(c, wide || s.stage===0)}
    <section class="panel" id="panel"></section>
  </div>`;
  document.getElementById("back").onclick=home;
  const ch=app.querySelector(".chart"); ch.addEventListener("toggle",()=>{ ch.querySelector("summary .eyebrow").textContent="tap to "+(ch.open?"hide":"show"); });
  const p=document.getElementById("panel");
  if(s.stage===0) stageDx(c,s,p);
  else if(s.stage===1) stageSupport(c,s,p);
  else if(s.stage===2) stageList(c,s,p,"orders");
  else if(s.stage===3) stageList(c,s,p,"teach");
  else summary(c,s,p);
}

function verdictHTML(x, extra){
  const perfect = x.right===x.total;
  return `<div class="verdict ${perfect?"good":"part"}"><b>${perfect?"All correct":`${x.right} of ${x.total} choices correct`}</b>${extra?`<p>${esc(extra)}</p>`:""}</div>`;
}
const LEG = {hit:"Correct", wrong:"Incorrect choice", miss:"Missed — this was correct", ok:"Not selected — correct to leave", acc:"Also accepted"};

/* Stage 1: diagnosis */
function stageDx(c,s,p){
  const answered = !!s.dx;
  const sel = answered ? s.dx : [...pending];
  p.innerHTML = `
    <div class="qhead"><h2>Which diagnoses fit?</h2><span class="count">Select all that apply</span></div>
    <p class="hint">Review the full chart. Some cases fit more than one diagnosis.</p>
    <div class="dxgrid">${DX.map(d=>{
      const on=sel.includes(d.id); let cls="", tag="", note="";
      if(answered){ const req=c.dx.includes(d.id), okx=c.ok.includes(d.id);
        if(req&&on){cls="r-hit";tag=LEG.hit;} else if(req){cls="r-miss";tag=LEG.miss;}
        else if(okx&&on){cls="r-hit";tag=LEG.acc;} else if(on){cls="r-wrong";tag=LEG.wrong;} }
      return `<label class="opt ${on?"sel":""} ${answered?"locked "+cls:""}"><input type="checkbox" data-dx="${d.id}" ${on?"checked":""} ${answered?"disabled":""}><span>${tag?`<span class="tag">${tag}</span><br>`:""}${esc(d.name)}</span></label>`; }).join("")}</div>
    ${answered? verdictHTML(scoreDx(c,s.dx), c.dxNote) : ""}
    <div class="actions">${answered? `<button class="btn" id="next">Next: gather the evidence →</button>` : `<button class="btn" id="submit" ${sel.length?"":"disabled"}>Check diagnosis</button>`}</div>`;
  if(!answered){
    p.querySelectorAll("[data-dx]").forEach(cb=>cb.onchange=()=>{ cb.checked?pending.add(cb.dataset.dx):pending.delete(cb.dataset.dx); cb.closest(".opt").classList.toggle("sel",cb.checked); document.getElementById("submit").disabled=!pending.size; });
    document.getElementById("submit").onclick=()=>{ s.dx=[...pending]; pending=new Set(); save(); stageDx(c,s,p); };
  } else document.getElementById("next").onclick=()=>{ s.stage=1; save(); renderCase(); window.scrollTo(0,0); };
}

/* generic option list (support / orders / teaching) */
function optsHTML(opts, sel, answered, seed){
  const order = shuffled(opts.length, seed);
  return `<div class="opts">${order.map(i=>{ const o=opts[i]; const on=sel.includes(i); let cls="", tag="";
    if(answered){ if(o[1]&&on){cls="r-hit";tag=LEG.hit;} else if(o[1]){cls="r-miss";tag=LEG.miss;} else if(on){cls="r-wrong";tag=LEG.wrong;} else {cls="r-ok";tag=LEG.ok;} }
    return `<label class="opt ${on&&!answered?"sel":""} ${answered?"locked "+cls:""}"><input type="checkbox" data-i="${i}" ${on?"checked":""} ${answered?"disabled":""}><span>${tag?`<span class="tag">${tag}</span><br>`:""}${esc(o[0])}${answered&&o[2]?`<span class="note">${esc(o[2])}</span>`:""}</span></label>`; }).join("")}</div>`;
}
function wireOpts(p){ p.querySelectorAll("[data-i]").forEach(cb=>cb.onchange=()=>{ const i=+cb.dataset.i; cb.checked?pending.add(i):pending.delete(i); cb.closest(".opt").classList.toggle("sel",cb.checked); const b=document.getElementById("submit"); if(b) b.disabled=!pending.size; }); }

/* Stage 2: supporting data */
function stageSupport(c,s,p){
  const answered=!!s.support, sel=answered?s.support:[...pending];
  const names=c.dx.map(id=>DX.find(d=>d.id===id).name).join(" + ");
  p.innerHTML = `
    <div class="qhead"><h2>What supports the diagnosis?</h2><span class="count">Select all that apply</span></div>
    <p class="hint">Diagnosis: <b>${esc(names)}</b>. Choose the findings that support it. Leave out data that are normal, unrelated, or only rule something else out.</p>
    ${optsHTML(c.support, sel, answered, c.id+"-sup")}
    ${answered? verdictHTML(scoreOpts(c.support,s.support)) : ""}
    <div class="actions">${answered? `<button class="btn" id="next">Next: MD orders →</button>` : `<button class="btn" id="submit" ${sel.length?"":"disabled"}>Check evidence</button>`}</div>`;
  if(!answered){ wireOpts(p); document.getElementById("submit").onclick=()=>{ s.support=[...pending]; pending=new Set(); save(); stageSupport(c,s,p); }; }
  else document.getElementById("next").onclick=()=>{ s.stage=2; s.idx=0; save(); renderCase(); window.scrollTo(0,0); };
}

/* Stage 3 & 4: orders / teaching, one at a time */
function stageList(c,s,p,key){
  const items=c[key], i=s.idx||0, item=items[i];
  const answered=!!s[key][i], sel=answered?s[key][i]:[...pending];
  const isOrders=key==="orders";
  const last=i===items.length-1;
  const nextLabel = !last ? (isOrders?"Next order →":"Next teaching point →") : (isOrders?"Next: interventions & teaching →":"See case summary →");
  p.innerHTML = `
    <div class="qhead"><h2>${isOrders?"MD orders":"Interventions & teaching"}</h2><span class="count">${isOrders?"Order":"Point"} ${i+1} of ${items.length}</span></div>
    <div class="order ${item.med?"med":""}">${item.med?`<span class="pill med">Medication</span><br>`:""}${esc(item.o)}</div>
    <p class="hint">Select every correct rationale for this ${isOrders?"order":"intervention or teaching point"}.</p>
    ${optsHTML(item.opts, sel, answered, c.id+key+i)}
    ${answered? verdictHTML(scoreOpts(item.opts,s[key][i])) : ""}
    <div class="actions">
      ${i>0?`<button class="btn ghost" id="prev">← Previous</button>`:""}
      ${answered? `<button class="btn" id="next">${nextLabel}</button>` : `<button class="btn" id="submit" ${sel.length?"":"disabled"}>Check rationales</button>`}
    </div>`;
  if(i>0) document.getElementById("prev").onclick=()=>{ s.idx=i-1; pending=new Set(); save(); stageList(c,s,p,key); };
  if(!answered){ wireOpts(p); document.getElementById("submit").onclick=()=>{ s[key][i]=[...pending]; pending=new Set(); save(); stageList(c,s,p,key); }; }
  else document.getElementById("next").onclick=()=>{
    pending=new Set();
    if(!last){ s.idx=i+1; save(); stageList(c,s,p,key); p.scrollIntoView({block:"start"}); }
    else { s.stage+=1; s.idx=0; save(); renderCase(); window.scrollTo(0,0); } };
}

/* Summary */
function summary(c,s,p){
  const x=caseScore(c), pr=x.parts;
  const names=c.dx.map(id=>DX.find(d=>d.id===id).name).join(" + ");
  const idx=LIST.indexOf(c); const nxt=LIST.slice(idx+1).concat(LIST.slice(0,idx)).find(k=>st(k.id).stage<4);
  const row=(label,k)=> pr[k]?`<div><span class="eyebrow">${label}</span><b>${pct(pr[k])}%</b><span class="count">${pr[k].right}/${pr[k].total}</span></div>`:"";
  p.innerHTML = `
    <span class="eyebrow">Case complete</span>
    <h2>${esc(names)}</h2>
    <div class="big">${pct(x)}%</div>
    <p class="hint">${x.right} of ${x.total} decisions correct across all four stages.</p>
    <div class="scores">${row("Diagnosis","dx")}${row("Evidence","support")}${row("MD orders","orders")}${row("Teaching","teach")}</div>
    <p>${esc(c.dxNote)}</p>
    <div class="actions">
      ${nxt?`<button class="btn" id="nextCase">Next case →</button>`:""}
      <button class="btn ghost" id="redo">Redo this case</button>
      <button class="btn ghost" id="toHome">All cases</button>
    </div>`;
  if(nxt) document.getElementById("nextCase").onclick=()=>openCase(nxt.id);
  document.getElementById("toHome").onclick=home;
  const r=document.getElementById("redo"); let armed=false;
  r.onclick=()=>{ if(!armed){armed=true; r.textContent="Click again to clear this case"; return;} delete S[c.id]; save(); openCase(c.id); };
}

home();
})();

</script>
